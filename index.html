  const i=firstAt(p,t);p.chart.timeScale().setVisibleLogicalRange({from:i-60,to:i+80});d.close()}})));
 d.showModal();
};
// 倒數與時鐘
function countdown(tf){
 const now=Math.floor(Date.now()/1000);let end;
 if(tf==='1Mutc'){const x=new Date(now*1000);end=Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,1)/1000}
 else if(tf==='1Wutc'){const d=Math.floor(now/DAY);end=(d+7-(d+3)%7)*DAY}
 else end=(Math.floor(now/TF[tf])+1)*TF[tf];
 const l=end-now,d=Math.floor(l/DAY),h=Math.floor(l%DAY/3600),z=v=>String(v).padStart(2,'0');
 return(d?d+'天 ':'')+(h||d?h+':':'')+z(Math.floor(l%3600/60))+':'+z(l%60);
}
setInterval(()=>{$('#clock').textContent=new Date(Date.now()+28800000).toISOString().slice(11,19)+' UTC+8';topSync()},500);
layoutName(store.get('layoutName',''));quickBar();setActive(0);openPanel(panel);badge();
(function loop(){panes.forEach(p=>p.paint());requestAnimationFrame(loop)})();
setInterval(()=>panes.forEach(p=>{p.el.querySelector('.cd').textContent=p.replay?'':'收K '+countdown(p.tf);p.el.querySelector('.bar').dataset.title=p.sym+' · '+TFN[p.tf]}),500);
</script></body></html>
