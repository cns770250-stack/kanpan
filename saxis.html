<style>
:root{--bg:#0b0f17;--panel:#121826;--line:#243049;--text:#d8e1f0;--mute:#8393ad;--acc:#4fd8f0}
:root[data-theme="light"]{--bg:#f3f5f9;--panel:#fff;--line:#d5dbe6;--text:#1c2433;--mute:#5d6b85;--acc:#0a8fb0}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f3f5f9;--panel:#fff;--line:#d5dbe6;--text:#1c2433;--mute:#5d6b85;--acc:#0a8fb0}}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}
body{display:flex;flex-direction:column}
nav{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
nav b{margin-right:10px;font-size:14px}
nav button{font:inherit;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer}
nav button.on{color:var(--bg);background:var(--acc);border-color:var(--acc);font-weight:600}
nav span{margin-left:auto;color:var(--mute);font-size:12px}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
@media (max-width:640px){nav{padding:5px 6px;gap:4px}nav b,nav span,nav small{display:none}nav button{flex:1;padding:8px 4px;font-size:13px;white-space:nowrap}}
</style></head><body>

<script>
const DOCS=["<!doctype html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>賽克斯分析版<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* 版面：輸入列 → 報價 → 三步驟(判勢/找位/進場)+共振面板 → 圖表(通道+QQE) → 訊號紀錄 → 紀律與倉位 */\n:root{\n  --bg:#070c14; --panel:#0c1524; --panel2:#101c30; --line:#17304d;\n  --fg:#e9f2fa; --mute:#8aa2b8; --cyan:#4fd8f0; --orange:#ffb84f; --purple:#b98cff;\n  --up:#ff6b7a; --dn:#4ade9a; --blue:#3b9cff; --pink:#ff7ab8;\n  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;\n  --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;\n  color-scheme:dark;\n}\n:root[data-up=\"green\"]{--up:#4ade9a;--dn:#ff6b7a}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);padding:20px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}\n.wrap{max-width:1240px;margin:0 auto;display:grid;gap:14px}\n.num{font-family:var(--mono);font-variant-numeric:tabular-nums}\n.up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--orange)} .mute{color:var(--mute)} .cy{color:var(--cyan)}\n.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}\n.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.12em;margin-right:auto}\n.top h1 small{display:block;font:400 11px var(--mono);letter-spacing:.2em;color:var(--mute)}\nform{display:flex;gap:8px;flex:1 1 360px;min-width:0}\ninput,select{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:10px 12px;font:600 15px var(--mono)}\n#coin{width:100%;min-width:0;text-transform:uppercase;letter-spacing:.04em}\n.sw{position:relative;flex:1;min-width:0}\n#sd{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:340px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.45)}\n#sd[hidden]{display:none}\n#sd .r{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font:600 14px var(--mono)}\n#sd .r.on,#sd .r:hover{background:var(--panel2)}\n#sd .r small{margin-left:auto;font:400 11px var(--font);color:var(--mute)}\n#sd .none{padding:10px 12px;color:var(--mute);font:400 13px var(--font)}\n.bd{display:inline-block;font:700 11px var(--font);letter-spacing:.04em;padding:2px 7px;border-radius:4px;vertical-align:middle}\n.bd.p{background:rgba(79,216,240,.16);color:var(--cyan)} .bd.s{background:rgba(255,184,79,.16);color:var(--orange)}\ninput::placeholder{text-transform:none;font-family:var(--font);font-weight:400;letter-spacing:0;color:var(--mute)}\ninput:focus,button:focus-visible,select:focus{outline:2px solid var(--cyan);outline-offset:1px}\nbutton{font:500 14px var(--font);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer}\nbutton:hover{border-color:var(--mute)}\nbutton.go{background:var(--cyan);border-color:var(--cyan);color:#04141a;font-weight:700}\n.pill{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--mute);white-space:nowrap}\n.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}\n.pill.ok .dot{background:var(--dn);box-shadow:0 0 0 3px #4ade9a33}\n.pill.busy .dot{background:var(--orange)} .pill.err .dot{background:var(--up)}\n.chips{display:flex;flex-wrap:wrap;gap:6px}\n.chips button{padding:4px 10px;font:600 12px var(--mono);border-radius:999px;color:var(--mute)}\n.chips button.on{color:var(--fg);border-color:var(--cyan)}\n#msg{display:none;background:#2a1a1c;border:1px solid #5a2a2e;color:#ffb3b6;border-radius:6px;padding:10px 12px}\n\n.quote{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}\n.quote .sym{font:700 15px var(--mono);color:var(--mute)}\n.quote .px{font:600 30px/1.1 var(--mono)}\n.quote .chg{font:600 16px var(--mono)}\n.quote dl{margin:0;display:flex;gap:6px 22px;flex-wrap:wrap}\n.quote dl div{display:flex;flex-direction:column}\n.quote dt{font-size:11px;color:var(--mute)} .quote dd{margin:0;font:500 13px var(--mono)}\n\n.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}\n.card h2{margin:0;font:500 12px var(--mono);color:var(--mute);letter-spacing:.14em;text-transform:uppercase}\n.row2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:stretch}\n@media(max-width:900px){.row2{grid-template-columns:minmax(0,1fr)}}\n\n.stab{display:flex;gap:8px}\n.stab button{padding:8px 20px;font:700 14px var(--font)}\n.stab button.on{background:var(--cyan);border-color:var(--cyan);color:#04141a}\n.tfbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}\n.tfbar button{padding:5px 12px;font:600 13px var(--mono)}\n.tfbar button.on{background:var(--cyan);border-color:var(--cyan);color:#04141a}\n\n.steps{padding:16px;display:grid;gap:12px}\n.steps .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}\n.step .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--mono);border:2px solid var(--line);color:var(--mute)}\n.step.ok .ic{border-color:var(--dn);color:var(--dn)} .step.wait .ic{border-color:var(--orange);color:var(--orange)} .step.no .ic{border-color:var(--up);color:var(--up)}\n.step b{display:block;font-size:14px} .step span{font-size:12.5px;color:var(--mute)}\n.verdict{padding:12px 14px;border-radius:6px;border:1px solid var(--line);font-weight:700;font-size:16px}\n.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:10px}\n.vbox{border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.7}\n.vbox h3{margin:0 0 4px;font:500 12px var(--mono);color:var(--mute);letter-spacing:.08em}\n.vbox .ok{color:var(--up)}.vbox .bad{color:var(--dn)}.vbox .wt{color:var(--mute)}\n.verdict small{display:block;font-weight:400;font-size:12.5px;color:var(--mute);margin-top:2px}\n\n.reso{padding:16px;display:grid;gap:12px;align-content:start}\ntable{width:100%;border-collapse:collapse}\n.reso table td,.reso table th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-size:13px}\n.reso table th{font-weight:500;font-size:11px;color:var(--mute)}\n.reso table td:first-child,.reso table th:first-child{text-align:left}\n.reso tr[data-tf]{cursor:pointer} .reso tr[data-tf]:hover td{background:var(--panel2)}\n.reso tr.on td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}\n.qb{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle}\n.banner{padding:10px 12px;border-radius:6px;font-weight:700;text-align:center}\n.banner.long{background:#ff6b7a1f;border:1px solid var(--up);color:var(--up)}\n.banner.short{background:#4ade9a1f;border:1px solid var(--dn);color:var(--dn)}\n.banner.none{background:var(--panel2);border:1px solid var(--line);color:var(--mute);font-weight:500}\n\n.chartcard{padding:10px 10px 6px}\n.legend{margin:2px 4px 8px;font-size:11px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;align-items:center}\n.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}\n.cwrap{position:relative} canvas{display:block;width:100%}\n#tip{position:absolute;pointer-events:none;display:none;background:#05090fee;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:12px/1.5 var(--mono);white-space:nowrap;z-index:2}\n\n.pad{padding:16px}\n.scroll{overflow-x:auto;margin-top:8px}\ntable.sig{min-width:760px}\n.sig th{font-weight:500;font-size:12px;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}\n.sig td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}\n.tag{display:inline-block;font:600 11px var(--mono);border-radius:3px;padding:1px 7px}\n.tag.l{background:#ff6b7a24;color:var(--up)} .tag.s{background:#4ade9a24;color:var(--dn)}\n.tag.w{background:#4ade9a24;color:var(--dn)} .tag.x{background:#ff6b7a24;color:var(--up)} .tag.o{background:#4fd8f024;color:var(--cyan)} .tag.b{background:#8aa2b822;color:var(--mute)}\n:root[data-up=\"green\"] .tag.l{background:#4ade9a24} :root[data-up=\"green\"] .tag.s{background:#ff6b7a24}\n.stat{display:flex;gap:10px 26px;flex-wrap:wrap;margin-top:10px;font-size:13px}\n.stat span b{font-family:var(--mono)}\n\n.disc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}\n@media(max-width:900px){.disc{grid-template-columns:minmax(0,1fr)}}\n.alert{padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);margin-top:10px}\n.alert.bad{border-color:var(--up);background:#ff6b7a18;color:#ffb3b9}\n.alert.good{border-color:var(--dn);background:#4ade9a14}\n.calc{display:grid;gap:8px;margin-top:10px}\n.calc label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}\n.calc input{width:130px;padding:6px 8px;font-size:13px;text-align:right}\n.calc .out td{padding:6px 0;border-top:1px solid var(--line)} .calc .out td:last-child{text-align:right;font-family:var(--mono)}\n.note{font-size:11.5px;color:var(--mute);margin-top:8px}\n\n.foot{font-size:11px;color:var(--mute);text-align:center}\n#alBtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 14px;font:600 14px var(--font);cursor:pointer;align-self:center}\n#alModal{position:fixed;inset:0;background:#0009;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}\n#alModal[hidden]{display:none}\n.alcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(460px,100%);display:grid;gap:10px}\n.alcard label{display:grid;gap:4px;font-size:13px;color:var(--mute)}\n.alcard input,.alcard select{width:100%;font:600 15px var(--mono)}\n.alhead{display:flex;justify-content:space-between;align-items:center;font-size:16px}\n.alr{display:flex;gap:8px;align-items:center}.alr select{flex:1.2}.alr input{flex:1}\n.alchk{display:flex;gap:14px;flex-wrap:wrap}.alchk label{display:flex;flex-direction:row;gap:6px;align-items:center;color:var(--fg)}.alchk input{width:auto}\n.alcard button{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 14px;font:600 14px var(--font);cursor:pointer}\n.alcard button.alpri{background:var(--cyan);border-color:var(--cyan);color:#001015}\n.alcard h3{margin:6px 0 0;font-size:14px}\n.alrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.alrow.off{opacity:.55}\n#alToasts{position:fixed;right:12px;bottom:12px;display:grid;gap:8px;z-index:70;max-width:min(360px,calc(100% - 24px))}\n.altoast{background:var(--panel);border:1px solid var(--cyan);border-radius:10px;padding:10px 12px;display:grid;gap:6px;box-shadow:0 6px 24px #0008}\n.altoast button{justify-self:end;background:var(--cyan);border:0;color:#001015;border-radius:8px;padding:4px 12px;font-weight:700;cursor:pointer}\n.alsug{display:flex;gap:8px;margin-top:-4px}\n.alsug button{flex:1;text-align:left}\n.alsug button.on{border-color:var(--cyan)!important;background:var(--cyan)!important;color:#001015!important}\n.alsug button span{opacity:.8;font-weight:500;margin-left:4px}\n#tvBtn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 14px;font:600 14px var(--font);cursor:pointer;align-self:center}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"top\">\n    <h1>賽克斯分析版<small id=\"sub\">VEGAS × QQE MOD · 15M / 1H / 4H<\/small><\/h1>\n    <form id=\"f\" autocomplete=\"off\">\n      <div class=\"sw\"><input id=\"coin\" placeholder=\"輸入幣種，例如 BTC（會列出現貨與永續合約）\" aria-label=\"幣種代號\" spellcheck=\"false\" aria-autocomplete=\"list\"><div id=\"sd\" role=\"listbox\" hidden><\/div><\/div>\n      <button class=\"go\" type=\"submit\">分析<\/button>\n    <\/form>\n    <button id=\"cm\" type=\"button\" title=\"切換漲跌顏色\">紅漲綠跌<\/button>\n    <span id=\"st\" class=\"pill\"><span class=\"dot\"><\/span><span id=\"stt\">待輸入<\/span><\/span>\n  <\/div>\n  <div class=\"chips\" id=\"chips\"><\/div>\n  <div class=\"stab\" id=\"stab\"><\/div>\n  <div id=\"msg\" role=\"alert\"><\/div>\n\n  <div class=\"quote\">\n    <span class=\"sym\" id=\"qsym\">—<\/span>\n    <span class=\"px\" id=\"qpx\">—<\/span>\n    <span class=\"chg\" id=\"qchg\"><\/span>\n    <dl>\n      <div><dt>24H 高<\/dt><dd id=\"qh\">—<\/dd><\/div>\n      <div><dt>24H 低<\/dt><dd id=\"ql\">—<\/dd><\/div>\n      <div><dt>24H 成交額<\/dt><dd id=\"qv\">—<\/dd><\/div>\n    <\/dl>\n  <\/div>\n\n  <div class=\"row2\">\n    <div class=\"card steps\">\n      <div class=\"head\"><h2>三步驟檢查（<span id=\"stf\">1H<\/span>）<\/h2><div class=\"tfbar\" id=\"tfbar\"><\/div><\/div>\n      <div id=\"verdict\" class=\"verdict\">—<\/div>\n      <div id=\"steps\"><\/div>\n    <\/div>\n    <div class=\"card reso\">\n      <h2>多週期共振<\/h2>\n      <div id=\"banner\" class=\"banner none\">—<\/div>\n      <table id=\"reso\"><\/table>\n      <div class=\"note\" id=\"resonote\">趨勢：小通道 EMA144/169 與大通道 EMA576/676 的相對位置。QQE：藍柱多頭、粉紅柱空頭、灰柱無動能。「!」代表 K 棒不足以計算 EMA676。<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"card pad\" id=\"viewcard\" hidden>\n    <h2>盤面看法（賽克斯輔助・不影響訊號）<\/h2>\n    <div id=\"view\"><\/div>\n  <\/div>\n\n  <div class=\"card pad\" id=\"harmcard\" hidden>\n    <h2>和諧型態 XABCD（獨立分析・不影響訊號）<\/h2>\n    <div id=\"harm\"><\/div>\n  <\/div>\n\n  <div class=\"card chartcard\">\n    <div class=\"legend\" id=\"legend\"><span><i style=\"background:#ffb84f\"><\/i>EMA12 過濾線<\/span><span><i style=\"background:#4fd8f0\"><\/i>小通道 144/169<\/span><span><i style=\"background:#b98cff\"><\/i>大通道 576/676<\/span><span><i style=\"background:#3b9cff\"><\/i>QQE 藍柱<\/span><span><i style=\"background:#ff7ab8\"><\/i>QQE 紅柱<\/span><span>▲▼ 進場訊號（收盤確認）<\/span><label style=\"cursor:pointer\"><input type=\"checkbox\" id=\"harmOn\" checked> ◇ 盤面畫和諧型態<\/label><\/div>\n    <div class=\"cwrap\"><canvas id=\"chart\"><\/canvas><div id=\"tip\"><\/div><\/div>\n  <\/div>\n\n  <div class=\"card pad\">\n    <h2>訊號紀錄（<span id=\"gtf\">1H<\/span>，依收盤 K 棒回放）<small style=\"font-weight:400;color:var(--warn,#f5b84b);margin-left:8px\">歷史回測，不是真實下單<\/small><\/h2>\n    <div class=\"stat\" id=\"stat\"><\/div>\n    <div class=\"scroll\"><table class=\"sig\" id=\"sig\"><\/table><\/div>\n    <div class=\"note\" id=\"signote\">進場：武裝後收盤站上/跌破 EMA12 且 QQE 同色，同一次回調只發一次。止損：最近波段高低點與小通道外緣取較保守者。1:1 到達先減倉一半並把止損移到開倉價，剩餘看 1:2。同一根 K 棒同時碰到止損與止盈時，保守算止損。<\/div>\n  <\/div>\n\n  <div class=\"disc\">\n    <div class=\"card pad\">\n      <h2>執行紀律<\/h2>\n      <div id=\"disc\"><\/div>\n      <div class=\"note\">指標無法強制你停手，這裡只做提醒。「今日」以台灣時間 00:00 為界，只計算目前選的週期。<\/div>\n    <\/div>\n    <div class=\"card pad\">\n      <h2>倉位計算（單筆風險 ≤ 5%）<\/h2>\n      <div class=\"calc\">\n        <label>帳戶資金（USDT）<input id=\"eq\" type=\"number\" min=\"0\" step=\"any\" value=\"1000\"><\/label>\n        <label>單筆風險 %<input id=\"rk\" type=\"number\" min=\"0\" step=\"any\" value=\"1\"><\/label>\n        <label>進場價<input id=\"ent\" type=\"number\" min=\"0\" step=\"any\" placeholder=\"預設用最新訊號\"><\/label>\n        <label>止損價<input id=\"slp\" type=\"number\" min=\"0\" step=\"any\" placeholder=\"預設用最新訊號\"><\/label>\n      <\/div>\n      <table class=\"calc out\" id=\"calcout\"><\/table>\n    <\/div>\n  <\/div>\n\n  <div class=\"foot\">資料：OKX 公開行情 API，每 10 秒更新。各策略皆依使用說明自行實作（賽克斯為邀請制腳本，威克特依菁英交易學院課程，海神依「海神指標 2.0」說明，TUTCI 10/5），訊號時間點可能與原版有落差。各策略分開判斷，互不影響。僅供學習與參考，不是投資建議。<\/div>\n<\/div>\n\n<script>\n/* ===== 純計算 ===== */\nfunction ema(a,p){\n  const out=new Array(a.length).fill(null), k=2/(p+1); let cnt=0,sum=0,prev=null;\n  for(let i=0;i<a.length;i++){\n    const v=a[i]; if(v==null) continue;\n    if(prev==null){ sum+=v; cnt++; if(cnt===p){ prev=sum/p; out[i]=prev; } }\n    else { prev=v*k+prev*(1-k); out[i]=prev; }\n  }\n  return out;\n}\nfunction rsi(c,p){\n  const out=new Array(c.length).fill(null);\n  if(c.length<=p) return out;\n  let g=0,l=0;\n  for(let i=1;i<=p;i++){ const d=c[i]-c[i-1]; if(d>=0) g+=d; else l-=d; }\n  g/=p; l/=p; out[p]=l===0?100:100-100/(1+g/l);\n  for(let i=p+1;i<c.length;i++){\n    const d=c[i]-c[i-1];\n    g=(g*(p-1)+Math.max(d,0))/p; l=(l*(p-1)+Math.max(-d,0))/p;\n    out[i]=l===0?100:100-100/(1+g/l);\n  }\n  return out;\n}\nfunction swingPts(cs,n=3){\n  const hs=[],ls=[];\n  for(let i=n;i<cs.length-n;i++){\n    let H=true,L=true;\n    for(let j=1;j<=n;j++){\n      if(cs[i].h<=cs[i-j].h||cs[i].h<=cs[i+j].h) H=false;\n      if(cs[i].l>=cs[i-j].l||cs[i].l>=cs[i+j].l) L=false;\n    }\n    if(H) hs.push({i,p:cs[i].h});\n    if(L) ls.push({i,p:cs[i].l});\n  }\n  return {hs,ls};\n}\n/* QQE 一組：RSI → EMA平滑 → Wilders ATR 通道 → 軌道翻轉 */\nfunction qqeSet(src,rsiP,sf,fac){\n  const n=src.length, wp=rsiP*2-1;\n  const rs=ema(rsi(src,rsiP),sf);\n  const atrR=rs.map((v,i)=>i>0&&v!=null&&rs[i-1]!=null?Math.abs(rs[i-1]-v):null);\n  const dar=ema(ema(atrR,wp),wp).map(v=>v==null?null:v*fac);\n  const lb=new Array(n).fill(null), sb=lb.slice(), fast=lb.slice(); let trend=1;\n  for(let i=0;i<n;i++){\n    if(rs[i]==null||dar[i]==null) continue;\n    const nl=rs[i]-dar[i], ns=rs[i]+dar[i];\n    const pL=i>0?lb[i-1]:null, pS=i>0?sb[i-1]:null, pR=i>0?rs[i-1]:null;\n    lb[i]=(pL!=null&&pR>pL&&rs[i]>pL)?Math.max(pL,nl):nl;\n    sb[i]=(pS!=null&&pR<pS&&rs[i]<pS)?Math.min(pS,ns):ns;\n    if(pS!=null&&pL!=null){\n      const crossS=(rs[i]>pS&&pR<=pS)||(rs[i]<pS&&pR>=pS);\n      const crossL=(rs[i]>pL&&pR<=pL)||(rs[i]<pL&&pR>=pL);\n      if(crossS&&rs[i]>pS) trend=1; else if(crossL&&rs[i]<pL) trend=-1;\n    }\n    fast[i]=trend===1?lb[i]:sb[i];\n  }\n  return {rs,fast};\n}\n/* QQE MOD：參數 (6,5,3,3 / 6,5,1.61,3 / BB 50,0.35) */\nfunction qqeMod(c,P={rsi:6,sf:5,q:3,th:3,rsi2:6,sf2:5,q2:1.61,th2:3,bl:50,bm:0.35}){\n  const A=qqeSet(c,P.rsi,P.sf,P.q), B=qqeSet(c,P.rsi2,P.sf2,P.q2), n=c.length;\n  const hist=new Array(n).fill(null), bar=new Array(n).fill(0);\n  for(let i=0;i<n;i++){\n    if(B.rs[i]==null||A.rs[i]==null||A.fast[i]==null) continue;\n    hist[i]=B.rs[i]-50;\n    if(i<P.bl-1) continue;\n    let s=0,cnt=0; const v=[];\n    for(let j=i-P.bl+1;j<=i;j++){ if(A.fast[j]==null) continue; const x=A.fast[j]-50; v.push(x); s+=x; cnt++; }\n    if(cnt<P.bl) continue;\n    const m=s/cnt; let q=0; v.forEach(x=>q+=(x-m)**2); const sd=Math.sqrt(q/cnt);\n    const up=m+P.bm*sd, lo=m-P.bm*sd, r1=A.rs[i]-50;\n    if(hist[i]>P.th2&&r1>up) bar[i]=1;\n    else if(hist[i]<-P.th2&&r1<lo) bar[i]=-1;\n  }\n  return {hist,bar};\n}\nconst NEED=676;\nfunction atrArr(cs,p){ const o=new Array(cs.length).fill(null); let a=null; for(let i=1;i<cs.length;i++){ const tr=Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c)); if(i<=p){ a=(a==null?0:a)+tr; if(i===p){ a/=p; o[i]=a; } } else { a=(a*(p-1)+tr)/p; o[i]=a; } } return o; }\n/* opt.mode：auto＝符合「大K＋放量」就改掛 0.5 限價、否則照舊市價；classic＝照舊；fib50＝只做大K掛 0.5 */\nfunction saxis(cs,opt){\n  opt=opt||{}; const mode=opt.mode||'auto', VM=opt.volMult||2, BM=opt.bigMult||1.5, WAIT=opt.wait||5;\n  const n=cs.length, c=cs.map(x=>x.c);\n  const atr14=atrArr(cs,14), vma=sma(cs.map(x=>x.v||0),20);\n  const bigOK=i=>{ const k=cs[i]; return k.v>0&&vma[i-1]!=null&&atr14[i]!=null&&k.v>=VM*vma[i-1]&&(k.h-k.l)>=BM*atr14[i]; };\n  const e12=ema(c,12), e144=ema(c,144), e169=ema(c,169), e576=ema(c,576), e676=ema(c,676);\n  const q=qqeMod(c), sw=swingPts(cs,3);\n  const sLo=i=>Math.min(e144[i],e169[i]), sHi=i=>Math.max(e144[i],e169[i]);\n  const bLo=i=>Math.min(e576[i],e676[i]), bHi=i=>Math.max(e576[i],e676[i]);\n  const trend=new Array(n).fill(null); // 1 多 -1 空 0 糾纏 null 資料不足\n  for(let i=0;i<n;i++){\n    if(e169[i]==null||e676[i]==null) continue;\n    trend[i]=sLo(i)>bHi(i)?1:sHi(i)<bLo(i)?-1:0;\n  }\n  const sigs=[]; let armed=0, brk=0;                                                   // armed＝已碰小通道且實體撐住；brk＝已收盤站上／跌破 EMA12（等下一根確認）\n  for(let i=1;i<n;i++){\n    const t=trend[i];\n    if(t==null||e12[i]==null){ armed=0; brk=0; continue; }\n    if(armed!==0&&t!==armed){ armed=0; brk=0; }\n    const bt=Math.max(cs[i].o,cs[i].c), bb=Math.min(cs[i].o,cs[i].c);\n    if(armed===1&&bb<sLo(i)){ armed=0; brk=0; }                                       // 實體跌破小通道＝支撐失敗，這輪作廢\n    if(armed===-1&&bt>sHi(i)){ armed=0; brk=0; }\n    if(t===1&&armed===0&&cs[i].l<=sHi(i)&&bb>=sLo(i)){ armed=1; brk=0; }               // 多：價格碰到小通道、實體沒跌破（獲得支撐）\n    if(t===-1&&armed===0&&cs[i].h>=sLo(i)&&bt<=sHi(i)){ armed=-1; brk=0; }\n    if(armed===1){\n      if(cs[i].c>e12[i]){\n        if(brk!==1) brk=1;                                                            // 先收盤站上 EMA12（這根不進場）\n        else if(q.bar[i]===1){                                                        // 下一根仍在 EMA12 之上＝確認沒跌回，再等 QQE 出藍 → 收盤進場\n          const fib=mode!=='classic'&&cs[i].c>cs[i].o&&bigOK(i);\n          if(fib) sigs.push(mkFib(cs,i,1,WAIT)); else if(mode!=='fib50') sigs.push(mkSig(cs,i,1,sw,sLo(i),sHi(i)));\n          if(fib||mode!=='fib50'){ armed=0; brk=0; }\n        }\n      }else brk=0;                                                                    // 跌回 EMA12 下方 → 重新等站上\n    }else if(armed===-1){\n      if(cs[i].c<e12[i]){\n        if(brk!==-1) brk=-1;\n        else if(q.bar[i]===-1){\n          const fib=mode!=='classic'&&cs[i].c<cs[i].o&&bigOK(i);\n          if(fib) sigs.push(mkFib(cs,i,-1,WAIT)); else if(mode!=='fib50') sigs.push(mkSig(cs,i,-1,sw,sLo(i),sHi(i)));\n          if(fib||mode!=='fib50'){ armed=0; brk=0; }\n        }\n      }else brk=0;\n    }\n  }\n  sigs.forEach(s=>replay(cs,s));\n  return {cs,e12,e144,e169,e576,e676,q,trend,sigs,armed,brk,sw,sLo,sHi,bLo,bHi};\n}\nfunction mkFib(cs,i,dir,wait){                                                         // 大K：以該K棒高低畫斐波，0.5 掛限價，止損放斐波 1（空＝K高、多＝K低），止盈 1R／1.5R\n  const k=cs[i], rg=k.h-k.l, e=k.l+rg/2, sl=dir===-1?k.h:k.l, r=Math.abs(e-sl);\n  return {i,t:k.t,dir,entry:e,sl,tp1:e+dir*r,tp2:e+dir*1.5*r,risk:r,riskPct:r/e*100,out:'open',r:null,exitI:null,stage:0,lim:true,fib:true,wait:wait||5,rT2:1.25};\n}\nfunction mkSig(cs,i,dir,sw,cLo,cHi){\n  const e=cs[i].c; let sl;\n  if(dir===1){\n    const lows=sw.ls.filter(x=>x.i<i).map(x=>x.p).filter(p=>p<e);\n    const swing=lows.length?lows[lows.length-1]:Math.min(...cs.slice(Math.max(0,i-20),i+1).map(x=>x.l));\n    sl=Math.min(swing,cLo);\n  }else{\n    const highs=sw.hs.filter(x=>x.i<i).map(x=>x.p).filter(p=>p>e);\n    const swing=highs.length?highs[highs.length-1]:Math.max(...cs.slice(Math.max(0,i-20),i+1).map(x=>x.h));\n    sl=Math.max(swing,cHi);\n  }\n  const r=Math.abs(e-sl);\n  return {i,t:cs[i].t,dir,entry:e,sl,tp1:e+dir*r,tp2:e+dir*2*r,risk:r,riskPct:r/e*100,out:'open',r:null,exitI:null,stage:0};\n}\n/* 回放：SL → -1R；TP1 減倉一半+保本；之後 保本→+0.5R、TP2→+1.5R */\nfunction replay(cs,s){\n  let stage=0, from=s.i+1;\n  if(s.lim){                                                                            // 限價單：先等成交；沒成交就先跑到 1R 或超過等待根數 → 撤單\n    const d=s.dir; let f=-1;\n    for(let j=s.i+1;j<cs.length&&j<=s.i+s.wait;j++){ const k=cs[j];\n      if(d===1?k.l<=s.entry:k.h>=s.entry){ f=j; break; }\n      if(d===1?k.h>=s.tp1:k.l<=s.tp1){ s.out='NF'; s.exitI=j; return; }\n    }\n    if(f<0){ if(s.i+s.wait>=cs.length-1){ s.out='pend'; } else { s.out='NF'; s.exitI=s.i+s.wait; } return; }\n    const kf=cs[f]; if(d===1?kf.l<=s.sl:kf.h>=s.sl){ s.out='SL'; s.r=-1; s.exitI=f; return; }\n    s.fillI=f; from=f+1;\n  }\n  for(let j=from;j<cs.length;j++){\n    const k=cs[j], d=s.dir;\n    const hitSL=d===1?k.l<=s.sl:k.h>=s.sl;\n    const hitTP1=d===1?k.h>=s.tp1:k.l<=s.tp1;\n    const hitTP2=d===1?k.h>=s.tp2:k.l<=s.tp2;\n    const hitBE=d===1?k.l<=s.entry:k.h>=s.entry;\n    if(stage===0){\n      if(hitSL){ s.out='SL'; s.r=-1; s.exitI=j; return; }\n      if(hitTP1){ stage=1; s.stage=1; if(hitTP2){ s.out='TP2'; s.r=s.rT2||1.5; s.exitI=j; return; } }\n    }else{\n      if(hitBE){ s.out='BE'; s.r=0.5; s.exitI=j; return; }\n      if(hitTP2){ s.out='TP2'; s.r=s.rT2||1.5; s.exitI=j; return; }\n    }\n  }\n  s.out=stage===1?'hold1':'open';\n}\n/* 該週期現況：判勢／找位／進場 */\nfunction status(A){\n  const L=A.cs.length-1, k=A.cs[L], t=A.trend[L], bar=A.q.bar[L];\n  const st={trend:t,bar,armed:A.armed};\n  if(t==null){ st.s1='no'; return Object.assign(st,{verdict:'資料不足',vsub:'K 棒不足 676 根，無法判斷大通道趨勢。',dir:0}); }\n  const dir=t, inSmall=k.l<=A.sHi(L)&&k.h>=A.sLo(L);\n  st.dir=dir; st.inSmall=inSmall;\n  if(t===0) return Object.assign(st,{verdict:'觀望',vsub:'小通道與大通道糾纏，趨勢未確立，賽克斯不進場。',s1:'no'});\n  st.s1='ok';\n  st.s2=A.armed===dir?'ok':inSmall?'ok':'wait';\n  const last=A.sigs[A.sigs.length-1], fresh=last&&last.i===L;\n  const entryOK=dir===1?(k.c>A.e12[L]&&bar===1):(k.c<A.e12[L]&&bar===-1);\n  st.s3=fresh?'ok':(A.armed===dir&&entryOK)?'ok':'wait';\n  st.fresh=fresh; st.entryOK=entryOK; st.last=last;\n  const name=dir===1?'多':'空';\n  if(fresh) return Object.assign(st,{verdict:'做'+name+'訊號成立',vsub:last&&last.fib?'本根是大K＋放量：限價掛在該K棒斐波 0.5，止損放斐波 1，止盈 1.5R，價位見下方訊號紀錄。':'本根收盤完成 判勢→找位→進場，停損與停利見下方訊號紀錄。'});\n  if(A.armed===dir) return Object.assign(st,{verdict:name+'頭待發（已找到位置）',vsub:A.brk===dir?'已收盤'+(dir===1?'站上':'跌破')+' EMA12，等下一根收盤仍沒跌回，且 QQE 出'+(dir===1?'藍':'紅')+'柱。':'價格已碰小通道、實體撐住，等收盤'+(dir===1?'站上':'跌破')+' EMA12，再確認沒跌回，最後等 QQE 出'+(dir===1?'藍':'紅')+'柱。'});\n  return Object.assign(st,{verdict:name+'頭趨勢，等回調',vsub:'還沒回測小通道（或本輪回調已發過訊號），不追單。'});\n}\nfunction mtf(All){\n  const ks=['15m','1H','4H'], rows=ks.map(k=>All[k]?{k,t:All[k].trend[All[k].cs.length-1],b:All[k].q.bar[All[k].cs.length-1]}:{k,t:null,b:0});\n  const ok=rows.every(r=>r.t!=null);\n  const allUp=ok&&rows.every(r=>r.t===1), allDn=ok&&rows.every(r=>r.t===-1);\n  const bUp=ok&&rows.every(r=>r.b===1), bDn=ok&&rows.every(r=>r.b===-1);\n  let lv='none',txt='未共振：各週期方向或動能不一致，等待。';\n  if(allUp&&bUp){ lv='long'; txt='主力進場・做多共振（三週期趨勢向上 + QQE 同步藍柱）'; }\n  else if(allDn&&bDn){ lv='short'; txt='主力進場・做空共振（三週期趨勢向下 + QQE 同步紅柱）'; }\n  else if(allUp) txt='三週期趨勢向上，但 QQE 尚未同步爆發藍柱，偏多等待。';\n  else if(allDn) txt='三週期趨勢向下，但 QQE 尚未同步爆發紅柱，偏空等待。';\n  else if(!ok) txt='部分週期 K 棒不足（!），共振無法完整判斷。';\n  return {rows,lv,txt,ok};\n}\nfunction summary(sigs){\n  sigs=sigs.filter(s=>s.out!=='NF');                                                    // 沒成交撤單的不算進勝率\n  const done=sigs.filter(s=>s.r!=null);\n  const w=done.filter(s=>s.r>0).length, l=done.filter(s=>s.r<0).length;\n  const tr=done.reduce((a,s)=>a+s.r,0);\n  return {n:sigs.length,done:done.length,w,l,rate:done.length?w/done.length*100:null,totalR:tr,open:sigs.length-done.length};\n}\nfunction tpeDay(t){ return Math.floor((t+8*3600e3)/86400e3); }\nfunction discipline(sigs,nowT){\n  const today=tpeDay(nowT), td=sigs.filter(s=>s.r!=null&&tpeDay(s.t)===today);\n  let streak=0; for(let i=td.length-1;i>=0;i--){ if(td[i].r<0) streak++; else break; }\n  return {todayN:td.length,todaySL:td.filter(s=>s.r<0).length,streak,stop:streak>=3};\n}\nfunction sizing(eq,rp,entry,sl){\n  const r=Math.abs(entry-sl); if(!(eq>0)||!(rp>0)||!(entry>0)||!(r>0)) return null;\n  const risk=eq*rp/100, qty=risk/r, notional=qty*entry;\n  return {risk,qty,notional,lev:notional/eq,slPct:r/entry*100};\n}\n/* ===== 威克特：BB(20,2) 均值回歸 + T3 MACD ===== */\nfunction sma(a,p){ const out=new Array(a.length).fill(null); let s=0; for(let i=0;i<a.length;i++){ s+=a[i]; if(i>=p) s-=a[i-p]; if(i>=p-1) out[i]=s/p; } return out; }\nfunction t3(a,p,al){\n  const gd=x=>{ const e1=ema(x,p), e2=ema(e1,p); return e1.map((v,i)=>v==null||e2[i]==null?null:v*(1+al)-e2[i]*al); };\n  return gd(gd(gd(a)));\n}\nfunction wicket(cs,P={bb:20,m:2,look:100,fast:14,slow:28,sig:9,al:0.7,test:10,xw:5,sw:10}){\n  const n=cs.length, c=cs.map(x=>x.c), mid=sma(c,P.bb);\n  const up=new Array(n).fill(null), lo=up.slice(), wd=up.slice();\n  for(let i=P.bb-1;i<n;i++){\n    let q=0; for(let j=i-P.bb+1;j<=i;j++) q+=(c[j]-mid[i])**2;\n    const sd=Math.sqrt(q/P.bb); up[i]=mid[i]+P.m*sd; lo[i]=mid[i]-P.m*sd; wd[i]=(up[i]-lo[i])/mid[i];\n  }\n  const sq=new Array(n).fill(null); // true 擠壓（帶寬分位 <50%）\n  for(let i=0;i<n;i++){\n    if(wd[i]==null) continue;\n    let m=0,less=0; for(let j=Math.max(0,i-P.look);j<i;j++){ if(wd[j]==null) continue; m++; if(wd[j]<wd[i]) less++; }\n    if(m>=P.look/2) sq[i]=less/m*100<50;\n  }\n  const f=t3(c,P.fast,P.al), s=t3(c,P.slow,P.al);\n  const macd=f.map((v,i)=>v==null||s[i]==null?null:v-s[i]), sig=ema(macd,P.sig);\n  const hist=macd.map((v,i)=>v==null||sig[i]==null?null:v-sig[i]);\n  const gc=new Array(n).fill(false), dc=gc.slice(), mU=gc.slice(), mD=gc.slice(), lT=gc.slice(), hT=gc.slice();\n  for(let i=0;i<n;i++){\n    if(lo[i]!=null){ lT[i]=cs[i].l<=lo[i]; hT[i]=cs[i].h>=up[i]; }\n    if(i<1) continue;\n    if(hist[i]!=null&&hist[i-1]!=null){ gc[i]=hist[i]>0&&hist[i-1]<=0; dc[i]=hist[i]<0&&hist[i-1]>=0; }\n    if(mid[i-1]!=null){ mU[i]=c[i]>mid[i]&&c[i-1]<=mid[i-1]; mD[i]=c[i]<mid[i]&&c[i-1]>=mid[i-1]; }\n  }\n  const any=(a,i,k)=>{ for(let j=Math.max(0,i-k);j<=i;j++) if(a[j]) return true; return false; };\n  const sigs=[];\n  for(let i=1;i<n;i++){\n    if(sq[i]!==false) continue;\n    const Lg=((mU[i]&&any(gc,i,P.xw))||(gc[i]&&any(mU,i,P.xw)))&&any(lT,i,P.test);\n    const Sh=((mD[i]&&any(dc,i,P.xw))||(dc[i]&&any(mD,i,P.xw)))&&any(hT,i,P.test);\n    const dir=Lg&&!Sh?1:Sh&&!Lg?-1:0; if(!dir) continue;\n    const ls=sigs[sigs.length-1]; if(ls&&ls.dir===dir&&i-ls.i<=P.xw) continue;\n    const sg=mkSigW(cs,i,dir,P.sw); if(sg) sigs.push(sg);\n  }\n  sigs.forEach(s=>replayW(cs,s));\n  return {cs,mid,up,lo,wd,sq,macd,sig,hist,gc,dc,mU,mD,lT,hT,sigs,P};\n}\nfunction mkSigW(cs,i,dir,k){\n  const e=cs[i].c, seg=cs.slice(Math.max(0,i-k+1),i+1);\n  const sl=dir===1?Math.min(...seg.map(x=>x.l)):Math.max(...seg.map(x=>x.h));\n  const r=Math.abs(e-sl); if(!(r>0)||(dir===1?sl>=e:sl<=e)) return null;\n  return {i,t:cs[i].t,dir,entry:e,sl,tp1:e+dir*r,tp2:null,risk:r,riskPct:r/e*100,out:'open',r:null,exitI:null,stage:0};\n}\n/* 回放：止損 −1R、止盈 +1R（盈虧比 1:1）；同根都碰到算止損 */\nfunction replayW(cs,s){\n  for(let j=s.i+1;j<cs.length;j++){ const k=cs[j], d=s.dir;\n    if(d===1?k.l<=s.sl:k.h>=s.sl){ s.out='SL'; s.r=-1; s.exitI=j; return; }\n    if(d===1?k.h>=s.tp1:k.l<=s.tp1){ s.out='TP'; s.r=1; s.exitI=j; return; }\n  }\n  s.out='open';\n}\nfunction statusW(A){\n  const L=A.cs.length-1, k=A.cs[L], sq=A.sq[L], P=A.P;\n  if(sq==null||A.macd[L]==null) return {verdict:'資料不足',vsub:'K 棒不足，無法計算布林帶寬分位或 T3 MACD。',dir:0,s1:'no',sq:null};\n  const st={sq,dir:0};\n  if(sq) return Object.assign(st,{s1:'no',verdict:'擠壓區，觀望',vsub:'布林帶寬處於低分位，威克特不在擠壓區進場。'});\n  st.s1='ok';\n  let tl=-1,th=-1; for(let j=L;j>=Math.max(0,L-P.test);j--){ if(tl<0&&A.lT[j]) tl=j; if(th<0&&A.hT[j]) th=j; }\n  const last=A.sigs[A.sigs.length-1], fresh=!!last&&last.i===L;\n  if(tl<0&&th<0&&!fresh) return Object.assign(st,{s2:'wait',s3:'wait',verdict:'等待價格測試軌道',vsub:'近 '+P.test+' 根沒有碰到上軌或下軌，均值回歸尚未啟動。'});\n  const dir=fresh?last.dir:(tl>th?1:th>tl?-1:(k.c>=k.o?1:-1));\n  const near=a=>{ for(let j=L;j>=Math.max(0,L-P.xw);j--) if(a[j]) return true; return false; };\n  const midOK=near(dir===1?A.mU:A.mD), xOK=near(dir===1?A.gc:A.dc);\n  Object.assign(st,{dir,tl,th,midOK,xOK,fresh,last,s2:'ok',s3:fresh?'ok':'wait'});\n  const nm=dir===1?'多':'空';\n  if(fresh) return Object.assign(st,{verdict:'做'+nm+'訊號成立',vsub:'本根收盤完成 測試軌道→穿越中軌→MACD 交叉，止損與止盈見下方訊號紀錄。'});\n  const need=[]; if(!midOK) need.push('收盤'+(dir===1?'突破':'跌破')+'中軌'); if(!xOK) need.push('T3 MACD '+(dir===1?'金叉':'死叉'));\n  return Object.assign(st,{verdict:nm+'頭待發（已測試'+(dir===1?'下':'上')+'軌）',vsub:need.length?'還缺：'+need.join('、')+'。':'條件已完成，但本輪訊號已發過，不追單。'});\n}\nfunction mtfW(All){\n  const rows=['15m','1H','4H'].map(k=>{\n    const A=All[k]; if(!A) return {k,none:true};\n    const L=A.cs.length-1, P=A.P; let t=0;\n    for(let j=L;j>=Math.max(0,L-P.test);j--){ if(A.lT[j]){ t=1; break; } if(A.hT[j]){ t=-1; break; } }\n    const last=A.sigs[A.sigs.length-1], fresh=last&&L-last.i<=2?last:null;\n    return {k,sq:A.sq[L],h:A.hist[L],t,fresh};\n  });\n  const hit=rows.filter(r=>r.fresh);\n  let lv='none',txt='目前沒有週期出現新的威克特訊號。';\n  if(hit.length){ const d=hit[0].fresh.dir; lv=hit.every(r=>r.fresh.dir===d)?(d===1?'long':'short'):'none'; txt='威克特訊號：'+hit.map(r=>r.k+(r.fresh.dir===1?' 做多':' 做空')).join('、')+'（近 3 根內）'; }\n  return {rows,lv,txt};\n}\n/* ===== 獵影：OBV 布林帶假突破回歸 + K 棒型態（盤整策略） ===== */\nfunction hunt(cs,P={len:14,sd:2,atrLen:14,atrMul:1,dojiPct:0.05,wait:5,rr:1.5,look:20,rmin:0.2,rmax:0.8}){\n  const n=cs.length, obv=new Array(n).fill(0);\n  for(let i=1;i<n;i++) obv[i]=obv[i-1]+(cs[i].c>cs[i-1].c?cs[i].v:cs[i].c<cs[i-1].c?-cs[i].v:0);\n  const ob=sma(obv,P.len), ou=new Array(n).fill(null), ol=ou.slice();\n  for(let i=P.len-1;i<n;i++){ let q=0; for(let j=i-P.len+1;j<=i;j++) q+=(obv[j]-ob[i])**2; const d=Math.sqrt(q/P.len); ou[i]=ob[i]+P.sd*d; ol[i]=ob[i]-P.sd*d; }\n  const atr=new Array(n).fill(null); let a=0;\n  for(let i=0;i<n;i++){\n    const k=cs[i], tr=i?Math.max(k.h-k.l,Math.abs(k.h-cs[i-1].c),Math.abs(k.l-cs[i-1].c)):k.h-k.l;\n    if(i<P.atrLen){ a+=tr; if(i===P.atrLen-1){ a/=P.atrLen; atr[i]=a; } } else { a=(a*(P.atrLen-1)+tr)/P.atrLen; atr[i]=a; }\n  }\n  const frac=new Array(n).fill(null), rg=frac.slice(); // 盤整：近 look 根 OBV 在均線上方的比例介於 rmin~rmax\n  for(let i=P.len-1+P.look-1;i<n;i++){ let u=0; for(let j=i-P.look+1;j<=i;j++) if(obv[j]>ob[j]) u++; frac[i]=u/P.look; rg[i]=frac[i]>=P.rmin&&frac[i]<=P.rmax; }\n  const sigs=[];\n  for(let i=1;i<n;i++){\n    if(ou[i-1]==null||ou[i]==null||atr[i]==null||!rg[i]) continue;\n    const dir=(obv[i-1]<ol[i-1]&&obv[i]>=ol[i]&&obv[i]<=ou[i])?1:(obv[i-1]>ou[i-1]&&obv[i]<=ou[i]&&obv[i]>=ol[i])?-1:0;\n    if(!dir) continue;\n    const k=cs[i], p=cs[i-1], bt=Math.max(k.o,k.c), bb=Math.min(k.o,k.c), pt=Math.max(p.o,p.c), pb=Math.min(p.o,p.c);\n    let pat=null, entry=null, mkt=false;\n    if(bt-bb<=k.o*P.dojiPct/100&&k.h>bt&&k.l<bb){ pat='十字星'; entry=k.c; mkt=true; }\n    else if((dir===1?(k.c>k.o&&p.c<p.o):(k.c<k.o&&p.c>p.o))&&bb<=pb&&bt>=pt){ pat='實體吞沒'; entry=(k.o+k.c)/2; }\n    else if(dir===1?(k.l<p.l&&k.c>p.l):(k.h>p.h&&k.c<p.h)){ pat='影線吞沒'; entry=dir===1?p.l:p.h; }\n    if(pat==null) continue;\n    const sl=dir===1?k.l-atr[i]*P.atrMul:k.h+atr[i]*P.atrMul, r=Math.abs(entry-sl);\n    if(!(r>0)||(dir===1?sl>=entry:sl<=entry)) continue;\n    const s={i,t:k.t,dir,pat,mkt,entry,sl,tp1:entry+dir*r*P.rr,tp2:null,risk:r,riskPct:r/entry*100,rr:P.rr,out:'open',r:null,exitI:null,fillI:null,stage:0};\n    if(mkt){ s.fillI=i; replayH(cs,s,i+1,true); }\n    else{\n      let f=-1, gone=false;\n      for(let j=i+1;j<n&&j<=i+P.wait;j++){ const b=cs[j];\n        if(dir===1?b.l<=entry:b.h>=entry){ f=j; break; }\n        if(dir===1?b.h>=s.tp1:b.l<=s.tp1){ gone=true; break; } // 沒回測就跑掉，掛單取消\n      }\n      if(f>=0){ s.fillI=f; s.t=cs[f].t; replayH(cs,s,f,false); }\n      else if(!gone&&i+P.wait>n-1) s.out='pending';\n      else continue;\n    }\n    sigs.push(s);\n  }\n  return {cs,obv,ob,ou,ol,atr,frac,rg,sigs,P};\n}\n/* 回放：止損 −1R、止盈 +rr R；限價單成交那根只檢查止損（無法得知先後，保守） */\nfunction replayH(cs,s,from,tpFirst){\n  for(let j=from;j<cs.length;j++){ const k=cs[j], d=s.dir;\n    if(d===1?k.l<=s.sl:k.h>=s.sl){ s.out='SL'; s.r=-1; s.exitI=j; return; }\n    if((j>from||tpFirst)&&(d===1?k.h>=s.tp1:k.l<=s.tp1)){ s.out='TP'; s.r=s.rr; s.exitI=j; return; }\n  }\n  s.out='open';\n}\nfunction statusH(A){\n  const L=A.cs.length-1, P=A.P, rg=A.rg[L];\n  if(rg==null||A.ou[L]==null||A.atr[L]==null) return {verdict:'資料不足',vsub:'K 棒不足，無法計算 OBV 布林帶或 ATR。',dir:0,s1:'no'};\n  const st={rg,frac:A.frac[L],dir:0};\n  const out=A.obv[L]>A.ou[L]?1:A.obv[L]<A.ol[L]?-1:0;\n  const last=A.sigs[A.sigs.length-1], rec=last&&L-last.i<=P.wait?last:null;\n  Object.assign(st,{out,rec});\n  if(!rg) return Object.assign(st,{s1:'no',verdict:'非盤整，禁止使用',vsub:'OBV 長期在均線同一側（近 '+P.look+' 根在均線上方比例 '+(A.frac[L]*100).toFixed(0)+'%），獵影不在趨勢盤使用。'});\n  st.s1='ok';\n  if(rec){\n    const nm=rec.dir===1?'多':'空', fresh=rec.i===L;\n    Object.assign(st,{dir:rec.dir,s2:'ok',s3:rec.out==='pending'?'wait':'ok'});\n    if(rec.out==='pending') return Object.assign(st,{verdict:nm+'頭掛單中（'+rec.pat+'）',vsub:'限價單價位見下方訊號紀錄，'+P.wait+' 根內沒回測就取消。'});\n    return Object.assign(st,{verdict:(fresh?'做'+nm+'訊號成立':nm+'頭訊號（'+(L-rec.i)+' 根前）')+'（'+rec.pat+'）',vsub:fresh?'本根收盤完成 OBV 回歸通道＋K 棒型態，進場與止損見下方訊號紀錄。':'訊號已發出，不追單。'});\n  }\n  if(out!==0){ const d=out===-1?1:-1; return Object.assign(st,{dir:d,s2:'wait',s3:'wait',verdict:'OBV 已突破'+(out===1?'上':'下')+'軌，等待收盤回通道',vsub:'必須下一根 K 棒收盤時 OBV 回到通道內，才開始判斷'+(d===1?'做多':'做空')+'型態。'}); }\n  return Object.assign(st,{s2:'wait',s3:'wait',verdict:'盤整中，等待 OBV 觸及布林帶',vsub:'OBV 在通道內，尚未出現突破後回歸。'});\n}\nfunction mtfH(All){\n  const rows=['15m','1H','4H'].map(k=>{\n    const A=All[k]; if(!A) return {k,none:true};\n    const L=A.cs.length-1, last=A.sigs[A.sigs.length-1];\n    return {k,rg:A.rg[L],out:A.ou[L]==null?null:A.obv[L]>A.ou[L]?1:A.obv[L]<A.ol[L]?-1:0,fresh:last&&L-last.i<=2?last:null};\n  });\n  const hit=rows.filter(r=>r.fresh);\n  let lv='none',txt='目前沒有週期出現新的獵影訊號。';\n  if(hit.length){ const d=hit[0].fresh.dir; lv=hit.every(r=>r.fresh.dir===d)?(d===1?'long':'short'):'none'; txt='獵影訊號：'+hit.map(r=>r.k+(r.fresh.dir===1?' 做多':' 做空')+'（'+r.fresh.pat+'）').join('、')+'（近 3 根內）'; }\n  return {rows,lv,txt};\n}\n/* ===== 海神 2.0：TUTCI 海龜通道(進場10/出場5) × MSS 結構 × 4H 趨勢過濾 ===== */\nfunction hai(cs,flt,P={ent:10,ex:5,sw:3,look:100}){\n  const n=cs.length, upper=new Array(n).fill(null), lower=upper.slice(), xUp=upper.slice(), xLo=upper.slice(), ts=new Array(n).fill(0);\n  for(let i=0;i<n;i++){\n    if(i>=P.ent){ let h=-Infinity,l=Infinity; for(let j=i-P.ent;j<i;j++){ if(cs[j].h>h) h=cs[j].h; if(cs[j].l<l) l=cs[j].l; } upper[i]=h; lower[i]=l; }\n    if(i>=P.ex){ let h=-Infinity,l=Infinity; for(let j=i-P.ex;j<i;j++){ if(cs[j].h>h) h=cs[j].h; if(cs[j].l<l) l=cs[j].l; } xUp[i]=h; xLo[i]=l; }\n    let s=i?ts[i-1]:0;\n    if(upper[i]!=null){\n      const c=cs[i].c;\n      if(s===1&&c<xLo[i]) s=0; else if(s===-1&&c>xUp[i]) s=0;\n      if(c>upper[i]) s=1; else if(c<lower[i]) s=-1;\n    }\n    ts[i]=s;\n  }\n  /* 結構：收盤突破最近已確認的波段高點→轉多，跌破波段低點→轉空；由空轉多/由多轉空記為 MSS */\n  const sw=swingPts(cs,P.sw), sd=new Array(n).fill(0), mss=new Array(n).fill(0);\n  let ph=0,pl=0,lH=null,lL=null,cur=0;\n  for(let i=0;i<n;i++){\n    while(ph<sw.hs.length&&sw.hs[ph].i+P.sw<=i){ lH={p:sw.hs[ph].p,used:false}; ph++; }\n    while(pl<sw.ls.length&&sw.ls[pl].i+P.sw<=i){ lL={p:sw.ls[pl].p,used:false}; pl++; }\n    const c=cs[i].c;\n    if(lH&&!lH.used&&c>lH.p){ lH.used=true; if(cur===-1) mss[i]=1; cur=1; }\n    else if(lL&&!lL.used&&c<lL.p){ lL.used=true; if(cur===1) mss[i]=-1; cur=-1; }\n    sd[i]=cur;\n  }\n  const A={cs,upper,lower,xUp,xLo,ts,sd,mss,sw,P,flt,sigs:[]};\n  const ok=(i,d)=>ts[i]===d&&sd[i]===d&&(!flt||flt(i)===d);\n  for(let i=Math.max(1,P.ent);i<n;i++) for(const d of [1,-1]) if(ok(i,d)&&!ok(i-1,d)){ const g=mkSigHai(A,i,d); if(g) A.sigs.push(g); }\n  A.sigs.sort((a,b)=>a.i-b.i);\n  A.sigs.forEach(g=>replayW(cs,g));\n  return A;\n}\nfunction mkSigHai(A,i,dir){\n  const cs=A.cs,P=A.P,e=cs[i].c; let sl=dir===1?Infinity:-Infinity;\n  for(let j=Math.max(0,i-P.ent+1);j<=i;j++) sl=dir===1?Math.min(sl,cs[j].l):Math.max(sl,cs[j].h);\n  const r=Math.abs(e-sl); if(!(r>0)||(dir===1?sl>=e:sl<=e)) return null;\n  let tp2=null;\n  (dir===1?A.sw.hs:A.sw.ls).forEach(x=>{\n    if(x.i+P.sw>i||i-x.i>P.look) return;\n    if(dir===1?(x.p>e+r&&(tp2==null||x.p>tp2)):(x.p<e-r&&(tp2==null||x.p<tp2))) tp2=x.p;\n  });\n  return {i,t:cs[i].t,dir,entry:e,sl,tp1:e+dir*r,tp2,risk:r,riskPct:r/e*100,out:'open',r:null,exitI:null,stage:0};\n}\n/* 4H 海神方向對應到低週期：只用「已收盤」的 4H K 棒 */\nfunction haiFlt(A4,cs,dur){\n  const h4=4*3600e3, out=new Array(cs.length).fill(0); let j=-1;\n  for(let i=0;i<cs.length;i++){ const tc=cs[i].t+dur; while(j+1<A4.cs.length&&A4.cs[j+1].t+h4<=tc) j++; out[i]=j>=0?A4.ts[j]:0; }\n  return i=>out[i];\n}\nfunction statusHai(A){\n  const L=A.cs.length-1, ts=A.ts[L], sd=A.sd[L];\n  if(A.upper[L]==null) return {verdict:'資料不足',vsub:'K 棒不足，無法計算海神通道。',dir:0,s1:'no'};\n  const tr=A.flt?A.flt(L):ts, st={ts,sd,tr,dir:0};\n  if(!tr) return Object.assign(st,{s1:'no',verdict:'觀望',vsub:(A.flt?'4H ':'')+'海神通道目前沒有方向（已出場或尚未突破），不進場。'});\n  const dir=tr, nm=dir===1?'多':'空', last=A.sigs[A.sigs.length-1], fresh=!!last&&last.i===L;\n  Object.assign(st,{dir,s1:'ok',fresh,last,s2:ts===dir?'ok':ts===0?'wait':'no',s3:sd===dir?'ok':'wait'});\n  if(fresh) return Object.assign(st,{verdict:'做'+nm+'訊號成立',vsub:'本根收盤完成 判勢→海神訊號→結構確認，進場與止損見下方訊號紀錄。'});\n  if(ts===-dir) return Object.assign(st,{verdict:nm+'頭趨勢，本週期海神逆勢',vsub:'本週期海神與'+(A.flt?'4H ':'')+'方向相反，逆勢訊號直接忽略。'});\n  if(ts===0) return Object.assign(st,{verdict:nm+'頭趨勢，等海神進場訊號',vsub:'本週期海神通道目前沒有方向，等待 '+(dir===1?'Long':'Short')+' Entry。'});\n  if(sd!==dir) return Object.assign(st,{verdict:nm+'頭待確認（結構未反轉）',vsub:'海神已翻'+nm+'，但收盤還沒突破前一個波段'+(dir===1?'高':'低')+'點（未出現 MSS），先不進場，避免做在盤整或回檔中段。'});\n  return Object.assign(st,{verdict:nm+'頭持續（本輪訊號已發過）',vsub:'海神與結構都同向，但這一輪進場訊號已經出現過，不追單。'});\n}\nfunction mtfHai(All){\n  const rows=['15m','1H','4H'].map(k=>{\n    const A=All[k]; if(!A) return {k,none:true};\n    const L=A.cs.length-1, last=A.sigs[A.sigs.length-1];\n    return {k,ts:A.ts[L],sd:A.sd[L],fresh:last&&L-last.i<=2?last:null};\n  });\n  const ok=rows.every(r=>!r.none);\n  const up=ok&&rows.every(r=>r.ts===1&&r.sd===1), dn=ok&&rows.every(r=>r.ts===-1&&r.sd===-1);\n  let lv='none',txt='未共振：各週期海神方向或結構不一致，等待。';\n  if(up){ lv='long'; txt='海神共振・做多（三週期海神通道向上 + 結構轉多）'; }\n  else if(dn){ lv='short'; txt='海神共振・做空（三週期海神通道向下 + 結構轉空）'; }\n  else if(ok&&rows.every(r=>r.ts===1)) txt='三週期海神通道向上，但結構尚未全部轉多（MSS 未確認），不進場。';\n  else if(ok&&rows.every(r=>r.ts===-1)) txt='三週期海神通道向下，但結構尚未全部轉空（MSS 未確認），不進場。';\n  else if(!ok) txt='部分週期 K 棒不足，共振無法完整判斷。';\n  return {rows,lv,txt};\n}\n/* ===== 13333 法則：首K突破→回測→延續（台灣時間，15 分鐘） ===== */\nconst F13_NM={1:'亞盤',2:'歐盤',3:'美盤'};\nfunction usDstDay(day){\n  const y=new Date(day*864e5).getUTCFullYear();\n  const nth=(mo,n)=>{ const dw=new Date(Date.UTC(y,mo,1)).getUTCDay(); return 1+((7-dw)%7)+(n-1)*7; };\n  return day>=Date.UTC(y,2,nth(2,2))/864e5&&day<Date.UTC(y,10,nth(10,1))/864e5;\n}\nfunction f13Def(ty,dst){ return ty===1?[420,780]:ty===2?(dst?[900,1410]:[960,1470]):(dst?[1290,1680]:[1350,1740]); }\nfunction f13Sess(day,m){\n  const r=[];\n  for(const dd of [day,day-1]){ const rel=m+(day-dd)*1440, dst=usDstDay(dd);\n    for(const ty of [1,2,3]){ const [a,b]=f13Def(ty,dst); if(rel>=a&&rel<b) r.push({ty,dd,key:ty+'_'+dd}); } }\n  return r;\n}\nfunction f13Next(day,m){\n  let best=null;\n  for(const dd of [day,day+1]){ const dst=usDstDay(dd); for(const ty of [1,2,3]){ const a=f13Def(ty,dst)[0], d=a+(dd-day)*1440-m; if(d>0&&(!best||d<best.d)) best={ty,d,at:a%1440}; } }\n  return best;\n}\nconst f13hm=x=>{ x=((x%1440)+1440)%1440; return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); };\nfunction replayF(cs,s){\n  for(let j=s.i+1;j<cs.length;j++){ const k=cs[j], d=s.dir, tm=Math.floor(k.t/6e4)+480;\n    if(!f13Sess(Math.floor(tm/1440),tm%1440).some(x=>x.key===s.key)){ s.out='T'; s.r=(cs[j-1].c-s.entry)*d/s.risk; s.exitI=j-1; return; }\n    if(d===1?k.l<=s.sl:k.h>=s.sl){ s.out='SL'; s.r=-1; s.exitI=j; return; }\n    if(d===1?k.h>=s.tp1:k.l<=s.tp1){ s.out='TP'; s.r=s.rr; s.exitI=j; return; }\n  }\n  s.out='open';\n}\nfunction f13(cs,P={atr:14,tol:.1,rr:2,wait:12,ret:3}){\n  const n=cs.length, atr=new Array(n).fill(null);\n  let av=null;\n  for(let i=0;i<n;i++){\n    const tr=i?Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c)):cs[i].h-cs[i].l;\n    if(i<P.atr){ av=(av==null?0:av)+tr; if(i===P.atr-1){ av/=P.atr; atr[i]=av; } } else { av=(av*(P.atr-1)+tr)/P.atr; atr[i]=av; }\n  }\n  const rngAt=new Array(n).fill(null), sess=new Array(n).fill(0), zone=new Array(n).fill(0), sk=new Array(n).fill(null).map(()=>[]);\n  const ranges=[], SS={}, list=[], sigs=[]; let cur=null, rng=null, busy=-1;\n  for(let i=0;i<n;i++){\n    const k=cs[i], tm=Math.floor(k.t/6e4)+480, day=Math.floor(tm/1440), m=tm%1440;\n    if(m>=360&&m<420){\n      if(!cur||cur.day!==day){ cur={day,a:i,b:i,hi:k.h,lo:k.l,done:false,ok:m===360}; ranges.push(cur); }\n      else { cur.hi=Math.max(cur.hi,k.h); cur.lo=Math.min(cur.lo,k.l); cur.b=i; }\n      if(m===405&&cur.ok){ cur.done=true; rng=cur; }\n      rngAt[i]=rng; continue;\n    }\n    rngAt[i]=rng;\n    const ss=f13Sess(day,m); sk[i]=ss.map(x=>x.key); sess[i]=ss.length?Math.max(...ss.map(x=>x.ty)):0;\n    if(rng) zone[i]=k.c>rng.hi?1:k.c<rng.lo?-1:0;\n    if(!rng||atr[i]==null) continue;\n    for(const x of ss){\n      let st=SS[x.key];\n      if(!st){ st=SS[x.key]={key:x.key,ty:x.ty,day:x.dd,rng,startI:i,phase:0,dir:0,bi:-1,ri:-1,rH:null,rL:null,reset:false,done:false,sigI:null,note:null,noteI:-1,dst:usDstDay(x.dd)}; list.push(st); }\n      st.lastI=i; if(st.done) continue;\n      const hi=st.rng.hi, lo=st.rng.lo, c=k.c, tol=P.tol*atr[i], note=t=>{ st.note=t; st.noteI=i; };\n      if(st.phase===0){\n        if(st.reset){ if(c<=hi&&c>=lo) st.reset=false; continue; }\n        if(c>hi){ st.phase=1; st.dir=1; st.bi=i; } else if(c<lo){ st.phase=1; st.dir=-1; st.bi=i; }\n        continue;\n      }\n      const d=st.dir;\n      if(c<=hi&&c>=lo){ st.phase=0; note('假突破：收盤跌回區間，重新等待'); continue; }\n      if(d===1?c<lo:c>hi){ st.dir=-d; st.phase=1; st.bi=i; note('反向突破，重新等待回測'); continue; }\n      const touch=d===1?k.l<=hi+tol:k.h>=lo-tol;\n      if(st.phase===1){\n        if(touch&&i>st.bi){ st.phase=2; st.rH=k.h; st.rL=k.l; st.ri=i; }\n        else if(i-st.bi>=P.wait){ st.phase=0; st.reset=true; note('突破後 '+P.wait+' 根內沒有回測，放棄'); }\n        continue;\n      }\n      if(d===1?c>st.rH:c<st.rL){\n        if(i<=busy) continue;\n        const sl=d===1?st.rL-tol:st.rH+tol, risk=Math.abs(c-sl);\n        if(!(risk>0)||(d===1?sl>=c:sl<=c)) continue;\n        const sg={i,t:k.t,dir:d,entry:c,sl,tp1:c+d*P.rr*risk,tp2:null,rr:P.rr,risk,riskPct:risk/c*100,out:'open',r:null,exitI:null,stage:0,sess:st.ty,key:st.key,day:st.day,hi,lo};\n        replayF(cs,sg); st.done=true; st.sigI=sigs.length; sigs.push(sg); busy=sg.out==='open'?Infinity:sg.exitI;\n        continue;\n      }\n      if(touch){ st.rH=k.h; st.rL=k.l; st.ri=i; continue; }\n      if(i-st.ri>=P.ret){ st.phase=1; st.bi=i; note('回測後 '+P.ret+' 根內沒有延續，回頭等下一次回測'); }\n    }\n  }\n  return {cs,sigs,ranges,rngAt,sess,zone,atr,list,SS,sk,P};\n}\nfunction statusF(A,fmt){\n  const P=A.P, L=A.cs.length-1, k=A.cs[L], tm=Math.floor(k.t/6e4)+480, day=Math.floor(tm/1440), m=tm%1440, rng=A.rngAt[L];\n  const act=A.sk[L].map(x=>A.SS[x]).filter(Boolean), last=A.sigs[A.sigs.length-1], fresh=!!last&&last.i===L;\n  const nm=d=>d===1?'多':'空', dstT=usDstDay(day)?'夏令':'冬令';\n  const R=(v,vs,dir,rows)=>({verdict:v,vsub:vs,dir:dir||0,rows:rows||[],used:A.sigs.filter(g=>Math.floor((Math.floor(g.t/6e4)+480)/1440)===day).length,act});\n  if(!rng) return R('資料不足','還沒有完整的首K區間（06:00–07:00，台灣時間）可用。');\n  const rg='首K區間 '+fmt(rng.lo)+' – '+fmt(rng.hi)+'（'+dstT+'）';\n  if(m>=360&&m<420) return R('首K形成中','06:00–07:00 只觀察不進場；目前參考的是上一個區間：'+rg+'。');\n  if(!act.length){ const nx=f13Next(day,m); return R('非交易時段，不進場','只在亞盤／歐盤／美盤找機會。'+(nx?'下一個：'+F13_NM[nx.ty]+' '+f13hm(nx.at)+'（台灣時間）。':'')+' '+rg+'。'); }\n  const all=(x,d1,d2,d3)=>[{n:'①',t:'突破',x,d:d1},{n:'②',t:'回測',x,d:d2},{n:'③',t:'延續',x,d:d3}];\n  if(fresh) return R('做'+nm(last.dir)+'訊號成立','收盤 '+fmt(last.entry)+' 進場；止損 '+fmt(last.sl)+'（'+last.riskPct.toFixed(2)+'%）；止盈 1:'+last.rr+' '+fmt(last.tp1)+'。時段結束強制平倉。',last.dir,all('ok','收盤已突破首K'+(last.dir===1?'高':'低')+'點。','回測K收盤沒有回到區間內。','收盤突破回測K'+(last.dir===1?'高':'低')+'點，進場。'));\n  if(last&&last.out==='open') return R('持倉中（'+nm(last.dir)+'）','止損 '+fmt(last.sl)+'，止盈 '+fmt(last.tp1)+'；其他時段訊號不加碼、不反手，本時段結束強制平倉。',last.dir,all('ok','本單已完成三步驟。','','持倉於 '+F13_NM[last.sess]+'。'));\n  const f=act.filter(g=>!g.done).sort((a,b)=>b.phase-a.phase)[0]||act[0];\n  const d=f.dir, nmT=F13_NM[f.ty], tag=f.note&&L-f.noteI<=6?'（'+f.note+'）':'';\n  const [a,b]=f13Def(f.ty,f.dst), win=nmT+' '+f13hm(a)+'–'+f13hm(b);\n  if(f.done){ const g=A.sigs[f.sigI]; return R('本時段已進場','同時段最多進場 1 次；'+win+' 不再找機會。',0,all('ok','','','已於 '+fmt(g.entry)+' 進場（'+nm(g.dir)+'）。')); }\n  const ev=d===1?f.rng.hi:f.rng.lo, edge=d===1?'高':'低';\n  if(f.phase===0){\n    return R(f.reset?'突破失敗，等回區間':'區間內不交易',win+'：'+(f.reset?'價格回到區間內才重新計算。':'等收盤站上首K高點（只做多）或跌破首K低點（只做空）。')+tag,0,\n      [{n:'①',t:'突破',x:'wait',d:rg+'；收盤還在區間內，區間內不交易。'},{n:'②',t:'回測',x:'no',d:'先完成突破。'},{n:'③',t:'延續',x:'no',d:'先完成回測。'}]);\n  }\n  const rows=[{n:'①',t:'突破',x:'ok',d:'收盤已'+(d===1?'站上':'跌破')+'首K'+edge+'點 '+fmt(ev)+'（'+rg+'）。'}];\n  if(f.phase===1){\n    rows.push({n:'②',t:'回測',x:'wait',d:'等價格回踩 '+fmt(ev)+'（容許 0.1 ATR）且收盤未回到區間內；剩 '+Math.max(0,P.wait-(L-f.bi))+' 根。'},{n:'③',t:'延續',x:'no',d:'先完成回測。'});\n    return R((d===1?'多':'空')+'頭已突破，等回測',win+'：不追突破，等回測。'+tag,d,rows);\n  }\n  rows.push({n:'②',t:'回測',x:'ok',d:'已回踩並收在區間外；回測K '+fmt(f.rL)+' – '+fmt(f.rH)+'。'},{n:'③',t:'延續',x:'wait',d:'收盤'+(d===1?'突破回測K高 '+fmt(f.rH):'跌破回測K低 '+fmt(f.rL))+' 就進場；剩 '+Math.max(0,P.ret-(L-f.ri))+' 根。'});\n  return R((d===1?'多':'空')+'頭已回測，等延續',win+'：等延續K收盤確認。'+tag,d,rows);\n}\n//#PURE_END\n\n/* ===== 介面 ===== */\n(()=>{\nconst $=id=>document.getElementById(id);\nconst TFS=['15m','1H','4H'];\nconst QUICK=['BTC','ETH','SOL','XRP','BNB','DOGE'];\n/* ===== 盤面看法（賽克斯輔助，不影響訊號）：123法則、K線型態、價格行為、交易規劃 ===== */\nfunction pivots(cs,k){ const H=[],Lw=[]; for(let i=k;i<cs.length-k;i++){ let h=true,l=true; for(let j=1;j<=k;j++){ if(cs[i].h<=cs[i-j].h||cs[i].h<cs[i+j].h) h=false; if(cs[i].l>=cs[i-j].l||cs[i].l>cs[i+j].l) l=false; } if(h) H.push({i,p:cs[i].h}); if(l) Lw.push({i,p:cs[i].l}); } return {H,L:Lw}; }\nconst MAX_ANGLE=35, OK_ANGLE=30;                                                // 趨勢線角度：30° 以內標準，30～35° 寬鬆接受，超過 35° 不當趨勢線（頸線不限角度）。角度＝atan(每根漲跌幅 ÷ (0.5×ATR))，不受圖表縮放影響\nconst angleOf=(slope,atr)=>Math.atan(Math.abs(slope)/(.5*atr))*180/Math.PI;\nfunction rule123(cs,pv,d,atr){          // d=-1：上升趨勢被破→看空；d=1：下降趨勢被破→看多\n  const L=cs.length-1, P=d===-1?pv.L:pv.H, Q=d===-1?pv.H:pv.L;\n  if(P.length<2||!Q.length) return null;\n  let a,b,ref,br=-1,line;\n  for(let m=P.length-1;m>=1&&br<0;m--){                                           // 由新往舊找「最近一組有被收盤突破的趨勢線」\n    const pa=P[m-1], pb=P[m]; if((d===-1?!(pb.p>pa.p):!(pb.p<pa.p))||pb.i-pa.i<5) continue;      // 上升看低點、下降看高點：兩個轉折要墊高／降低，而且不能靠太近（<5根）\n    if(atr&&angleOf((pb.p-pa.p)/(pb.i-pa.i),atr)>MAX_ANGLE) continue;                 // 太陡的趨勢線不採用\n    const ln=i=>pa.p+(pb.p-pa.p)*(i-pa.i)/(pb.i-pa.i);\n    for(let i=pb.i+1;i<=L;i++){ if(d===-1?cs[i].c<ln(i):cs[i].c>ln(i)){ const rq=Q.filter(x=>x.i<i); if(rq.length){ a=pa;b=pb;line=ln;br=i;ref=rq[rq.length-1]; } break; } }\n  }\n  if(br<0||L-br>60) return null;                                                  // 太久以前的不算\n  const r={d,stage:0,line:line(L),prevExt:b.p,refP:ref.p,txt:['','',''],fail:false};\n  const tc=P.filter(x=>x.i>=a.i&&x.i<br&&Math.abs(x.p-line(x.i))<=.3*(atr||Math.abs(b.p-a.p)||1)).length;     // 趨勢線觸碰次數（至少 2 個轉折點，第 3 次以上更可靠）\n  r.touches=tc; r.stage=1; r.txt[0]='第'+(L-br)+'根前收盤'+(d===-1?'跌破上升':'突破下降')+'趨勢線（約 '+Math.round(angleOf((b.p-a.p)/(b.i-a.i),atr||1))+'°'+(angleOf((b.p-a.p)/(b.i-a.i),atr||1)>OK_ANGLE?'，稍陡':'')+'，觸碰 '+tc+' 次'+(tc>=3?'・較可靠':'')+'）';\n  let ext=d===-1?-Infinity:Infinity; for(let i=br;i<=L;i++) ext=d===-1?Math.max(ext,cs[i].h):Math.min(ext,cs[i].l);\n  const noNew=d===-1?ext<ref.p:ext>ref.p;\n  if(!noNew){ r.fail=true; r.txt[1]='反彈已'+(d===-1?'創新高':'創新低')+'，123 失敗'; return r; }\n  const bounced=d===-1?ext>cs[br].c:ext<cs[br].c;\n  if(!bounced){ r.txt[1]='等待回測（目前還沒有反彈）'; return r; }\n  r.stage=2; r.txt[1]='回測'+(d===-1?'未創新高（高點 ':'未創新低（低點 ')+fmt(ext)+'，前'+(d===-1?'高 ':'低 ')+fmt(ref.p)+'）';\n  if(d===-1?cs[L].c<b.p:cs[L].c>b.p){ r.stage=3; r.txt[2]='已收盤'+(d===-1?'跌破前低 ':'突破前高 ')+fmt(b.p)+'，123 完成'; }\n  else r.txt[2]='等待收盤'+(d===-1?'跌破前低 ':'突破前高 ')+fmt(b.p);\n  r.trig=b.p; return r;\n}\nfunction neckStage(cs,e,line,d,atr){            // 頸線突破→回測不破→延續（d=-1 看空，d=1 看多）；e＝右肩／第二頂底的位置\n  const L=cs.length-1, tol=.3*atr; let br=-1;\n  for(let i=e+1;i<=L;i++){ if(d===-1?cs[i].c<line(i):cs[i].c>line(i)){ br=i; break; } }\n  if(br<0) return {stage:0,txt:'尚未收盤'+(d===-1?'跌破':'突破')+'頸線'};\n  if(L-br>60) return null;\n  let st=1, ext=d===-1?cs[br].l:cs[br].h, touched=false;\n  for(let i=br+1;i<=L;i++){\n    if(d===-1?cs[i].c>line(i)+tol:cs[i].c<line(i)-tol) return {stage:0,fail:true,txt:'收盤站回頸線另一側，型態失敗'};\n    if(d===-1?cs[i].h>=line(i)-tol:cs[i].l<=line(i)+tol) touched=true;\n    if(touched&&(d===-1?cs[i].c<ext:cs[i].c>ext)) st=3;\n    ext=d===-1?Math.min(ext,cs[i].l):Math.max(ext,cs[i].h);\n  }\n  if(st<3&&touched) st=2;\n  return {stage:st,txt:['','已'+(d===-1?'跌破':'突破')+'頸線，等回測','回測頸線不破，等延續','回測不破後續'+(d===-1?'破低':'破高')+'（延續）'][st]};\n}\nfunction neckPats(cs,pv,atr){\n  const L=cs.length-1, out=[], tolP=Math.max(.8*atr,cs[L].c*.004), dn=(d,a,b)=>d===-1?a:b;\n  for(const d of [-1,1]){\n    const P=d===-1?pv.H:pv.L, Q=d===-1?pv.L:pv.H, cand=[];                          // P：頂（底）轉折；Q：之間的反向轉折\n    const add=(name,e,line)=>{ const r=neckStage(cs,e,line,d,atr); if(r&&!r.fail&&(r.stage>0||L-e<=15)) cand.push({d,n:name+'（頸線 '+fmt(line(L))+'）'+r.txt,age:0,neck:true,stage:r.stage,e}); };\n    for(let m=P.length-1;m>=1&&m>=P.length-6;m--){                                  // 往回找最近幾組，不只看最後兩個轉折（回測反彈本身也是轉折）\n      const a=P[m-1], b=P[m];                                                       // M 頂／W 底\n      if(b.i-a.i>=5&&Math.abs(a.p-b.p)<=tolP){ const v=Q.filter(x=>x.i>a.i&&x.i<b.i);\n        if(v.length){ const n=d===-1?Math.min(...v.map(x=>x.p)):Math.max(...v.map(x=>x.p)); if(Math.abs(n-(a.p+b.p)/2)>=1.5*atr) add(dn(d,'M頂','W底')+' '+fmt(a.p)+'／'+fmt(b.p),b.i,()=>n); } }\n      if(m>=2){ const ls=P[m-2], hd=P[m-1], rs=P[m];                                // 頭肩頂／底\n        const hOK=d===-1?(hd.p>ls.p&&hd.p>rs.p):(hd.p<ls.p&&hd.p<rs.p);\n        const q1=Q.filter(x=>x.i>ls.i&&x.i<hd.i), q2=Q.filter(x=>x.i>hd.i&&x.i<rs.i);\n        if(hOK&&q1.length&&q2.length){ const pick=a2=>d===-1?a2.reduce((k,x)=>x.p<k.p?x:k):a2.reduce((k,x)=>x.p>k.p?x:k); const n1=pick(q1), n2=pick(q2);\n          const depth=Math.abs(hd.p-(n1.p+n2.p)/2), sh=Math.abs(ls.p-rs.p);\n          if(depth>=1.5*atr&&sh<=.6*depth&&Math.abs(hd.p-ls.p)>=.3*depth&&Math.abs(hd.p-rs.p)>=.3*depth&&n2.i>n1.i){\n            const ln=i=>n1.p+(n2.p-n1.p)*(i-n1.i)/(n2.i-n1.i); add(dn(d,'頭肩頂','頭肩底'),rs.i,ln); } } }\n    }\n    cand.sort((x,y)=>y.stage-x.stage||y.e-x.e); if(cand[0]) out.push(cand[0]);\n  }\n  return out;\n}\nfunction candlePats(cs,pv,atr){\n  const L=cs.length-1, out=[], bd=k=>Math.abs(k.c-k.o), bull=k=>k.c>k.o, bear=k=>k.c<k.o, c0=cs[L], c1=cs[L-1], c2=cs[L-2];\n  if(bear(c1)&&bull(c0)&&c0.o<=c1.c&&c0.c>=c1.o&&bd(c0)>bd(c1)) out.push({d:1,n:'多頭吞沒',age:0});\n  if(bull(c1)&&bear(c0)&&c0.o>=c1.c&&c0.c<=c1.o&&bd(c0)>bd(c1)) out.push({d:-1,n:'空頭吞沒',age:0});\n  const mid2=(c2.o+c2.c)/2;\n  if(bear(c2)&&bd(c2)>=.5*atr&&bd(c1)<=.35*bd(c2)&&bull(c0)&&c0.c>mid2) out.push({d:1,n:'早晨之星',age:0});\n  if(bull(c2)&&bd(c2)>=.5*atr&&bd(c1)<=.35*bd(c2)&&bear(c0)&&c0.c<mid2) out.push({d:-1,n:'黃昏之星',age:0});\n  for(let a=0;a<=2;a++){ const i=L-a; if(i<22) break; let hi=-Infinity,lo=Infinity; for(let j=i-20;j<i;j++){ hi=Math.max(hi,cs[j].h); lo=Math.min(lo,cs[j].l); }\n    if(cs[i].h>hi&&cs[i].c<hi) out.push({d:-1,n:'向上假突破（刺破前高 '+fmt(hi)+' 收回）',age:a});\n    if(cs[i].l<lo&&cs[i].c>lo) out.push({d:1,n:'向下假突破（刺破前低 '+fmt(lo)+' 收回）',age:a}); }\n  neckPats(cs,pv,atr).forEach(x=>out.push(x));\n  return out;\n}\nfunction htfSR(Ah,price,dir){                                                       // 上一層週期的支撐／壓力：前高前低（轉折點）＋通道線；空單看壓力、多單看支撐\n  if(!Ah||!Ah.cs) return null; const cs=Ah.cs, L=cs.length-1, atr=atrArr(cs,14)[L]; if(!atr) return null;\n  const pv=pivots(cs,3), lv=[]; pv.H.slice(-12).forEach(x=>lv.push({p:x.p,n:'前高'})); pv.L.slice(-12).forEach(x=>lv.push({p:x.p,n:'前低'}));\n  for(const [k,n] of [['e144','EMA144'],['e169','EMA169'],['e576','EMA576'],['e676','EMA676']]) if(Ah[k]&&Ah[k][L]!=null) lv.push({p:Ah[k][L],n});\n  const m=.3*atr, cand=lv.filter(x=>dir===-1?x.p>=price-m:x.p<=price+m).sort((a,b)=>Math.abs(a.p-price)-Math.abs(b.p-price)), near=cand[0];\n  const opp=lv.find(x=>dir===-1?(x.p<price-m&&price-x.p<=.5*atr):(x.p>price+m&&x.p-price<=.5*atr));\n  return {atr,level:near||null,dist:near?Math.abs(near.p-price)/atr:null,at:!!near&&Math.abs(near.p-price)<=.8*atr,against:!!opp};\n}\nfunction readMarket(A){\n  const cs=A.cs, L=cs.length-1; if(L<40) return null;\n  const atr=atrArr(cs,14)[L]||(cs[L].h-cs[L].l), pv=pivots(cs,3);\n  const r123=[rule123(cs,pv,-1,atr),rule123(cs,pv,1,atr)].filter(x=>x&&x.stage>0);\n  r123.sort((x,y)=>(y.fail?-1:y.stage)-(x.fail?-1:x.stage));\n  const pats=candlePats(cs,pv,atr).sort((x,y)=>x.age-y.age);\n  const H=pv.H.slice(-2), Lw=pv.L.slice(-2); let st='盤整／結構不明', sd=0;\n  if(H.length==2&&Lw.length==2){ const hh=H[1].p>H[0].p, hl=Lw[1].p>Lw[0].p;\n    if(hh&&hl){ st='HH＋HL 上升結構'; sd=1; } else if(!hh&&!hl){ st='LH＋LL 下降結構'; sd=-1; } else st=hh?'HH＋LL 擴張（震盪）':'LH＋HL 收斂（三角）'; }\n  const k=cs[L], body=Math.abs(k.c-k.o), rg=k.h-k.l||1e-9, uw=k.h-Math.max(k.o,k.c), lw=Math.min(k.o,k.c)-k.l;\n  const notes=[]; if(uw>2*body&&uw>.5*rg) notes.push('本根上影線長（上方賣壓）'); if(lw>2*body&&lw>.5*rg) notes.push('本根下影線長（下方買盤）');\n  if(rg>=1.5*atr) notes.push('本根為大振幅 K（'+(rg/atr).toFixed(1)+'×ATR）'); if(rg<.6*atr) notes.push('本根波動收斂');\n  const e=A.e12[L]; if(e!=null) notes.push('收盤在 EMA12 '+(k.c>e?'之上':'之下'));\n  return {atr,r123,pats,st,sd,notes,pv};\n}\nconst S={inst:null,tf:'1H',raw:{},A:{},W:{},H:{},P:{},F:{},strat:'s',ticker:null,tok:0,timer:null,layout:null};\nconst CUR=()=>S.strat==='f'?S.F:S.strat==='p'?S.P:S.strat==='h'?S.H:S.strat==='w'?S.W:S.A;\nconst STR={};\nfunction store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }\nfunction norm(s){\n  s=(s||'').trim().toUpperCase().replace(/[\\s\\/_]+/g,'-').replace(/[^A-Z0-9-]/g,'');\n  if(!s) return null; if(/-SWAP$/.test(s)) return s;                                  // 預設一律是 OKX 永續合約（USDT 本位）\n  s=s.replace(/-(PERP|SWAP)$/,'');\n  if(s.includes('-')) return s;                                                          // 完整代號照用：BTC-USDT＝現貨、BTC-USDT-SWAP＝永續\n  return s+'-USDT-SWAP';\n}\nconst esc=v=>String(v==null?'':v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst KIND=i=>/-SWAP$/.test(i)?'p':'s';\nconst NAMEQ=i=>{ const a=i.split('-'); return a[0]+'/'+a[1]; };\nconst BADGE=i=>'<span class=\"bd '+KIND(i)+'\">'+(KIND(i)==='p'?'永續':'現貨')+'<\/span>';\nconst dec=p=>p>=1000?2:p>=100?3:p>=1?4:p>=0.01?6:p>0?Math.min(14,Math.ceil(-Math.log10(p))+4):8;   // 極小價幣（如 1e-8）要多顯示位數\nconst fmt=p=>p==null||isNaN(p)?'—':(+p).toLocaleString('en-US',{minimumFractionDigits:dec(Math.abs(p)),maximumFractionDigits:dec(Math.abs(p))});\nconst pct=v=>(v>=0?'+':'')+v.toFixed(2)+'%';\nconst cls=v=>v>0?'up':v<0?'dn':'flat';\nfunction compact(v){ if(v>=1e9) return (v/1e9).toFixed(2)+' B'; if(v>=1e6) return (v/1e6).toFixed(2)+' M'; if(v>=1e3) return (v/1e3).toFixed(2)+' K'; return v.toFixed(0); }\nfunction setStatus(t,c){ $('stt').textContent=t; $('st').className='pill '+(c||''); }\nfunction showMsg(t){ const m=$('msg'); m.textContent=t||''; m.style.display=t?'block':'none'; }\nasync function api(path){\n  const r=await fetch('https://www.okx.com/api/v5/market/'+path,{cache:'no-store'});\n  if(!r.ok) throw new Error('連線失敗（HTTP '+r.status+'）');\n  const j=await r.json();\n  if(j.code!=='0') throw new Error(j.code==='51001'?'NOTFOUND':(j.msg||'查詢失敗'));\n  return j.data;\n}\n/* 只保留已收盤 K 棒（confirm=1），訊號不重繪 */\nasync function getBars(inst,bar,map){\n  const add=d=>d.forEach(x=>{ if(x[8]==='1') map.set(+x[0],{t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+(/-SWAP$/.test(inst)?(x[6]||x[5]):x[5])}); });   // 永續用 x[6]＝以幣為單位的成交量（x[5] 是張數）；現貨 x[5] 本來就是幣的數量\n  if(!map.size){\n    let after='';\n    for(let p=0;p<4;p++){\n      const d=await api('candles?instId='+inst+'&bar='+bar+'&limit=300'+(after?'&after='+after:''));\n      if(!d.length) break; add(d); after=d[d.length-1][0]; if(d.length<300) break;\n    }\n  }else add(await api('candles?instId='+inst+'&bar='+bar+'&limit=300'));\n  return [...map.values()].sort((a,b)=>a.t-b.t);\n}\nasync function load(manual){\n  if(!S.inst) return;\n  const tok=++S.tok, inst=S.inst;\n  if(manual||!Object.keys(S.A).length) setStatus('載入中…','busy');\n  try{\n    const [tk,...bars]=await Promise.all([api('ticker?instId='+inst),...TFS.map(k=>getBars(inst,k,S.raw[k]||(S.raw[k]=new Map()))),getBars(inst,'1D',S.raw['1D']||(S.raw['1D']=new Map())).catch(()=>[])]);   // 最後一個是日線（只用來給 1H 進場建立偏見）\n    if(tok!==S.tok) return;\n    const A={};\n    const W={},H={},PP={}; TFS.forEach((k,i)=>{ if(bars[i].length>=60){ A[k]=saxis(bars[i]); H[k]=hunt(bars[i]); if(bars[i].length>=125) W[k]=wicket(bars[i]); } });\n    const i4=TFS.indexOf('4H'), DUR={'15m':9e5,'1H':36e5};\n    if(bars[i4].length>=30) PP['4H']=hai(bars[i4]);\n    const FF={}; if(bars[0].length>=100) FF['15m']=f13(bars[0]);\n    TFS.forEach((k,i)=>{ if(k!=='4H'&&bars[i].length>=30) PP[k]=hai(bars[i],PP['4H']?haiFlt(PP['4H'],bars[i],DUR[k]):null); });\n    if(!Object.keys(A).length) throw new Error('這個幣種的歷史 K 線不足，無法分析');\n    S.ticker=tk[0]; S.D=(bars[TFS.length]&&bars[TFS.length].length>=60)?saxis(bars[TFS.length]):null; S.A=A; S.W=W; S.H=H; S.P=PP; S.F=FF; if(!A[S.tf]) S.tf=Object.keys(A)[0];\n    showMsg(''); setStatus('即時 '+new Date().toLocaleTimeString('zh-TW',{hour12:false}),'ok'); render();\n  }catch(e){\n    if(tok!==S.tok) return;\n    if(e.message==='NOTFOUND'){ S.A={}; S.W={}; S.H={}; S.P={}; S.F={}; S.ticker=null; render(); showMsg('找不到 '+inst+'。請輸入幣種，例如 BTC、ETH，再從清單選現貨或永續。'); setStatus('查無此幣種','err'); }\n    else{ showMsg(Object.keys(S.A).length?'連線中斷，顯示的是上一次的資料，10 秒後重試。':'無法連線 OKX：'+e.message+'。請確認網路，並用瀏覽器直接開啟這個檔案。'); setStatus('連線中斷','err'); }\n  }\n}\nfunction start(inst){\n  S.inst=inst; S.A={}; S.W={}; S.H={}; S.P={}; S.F={}; S.raw={}; S.ticker=null; store('coin',inst);\n  $('coin').value=inst.split('-')[0]; document.title=NAMEQ(inst)+(KIND(inst)==='p'?' 永續':' 現貨')+' 策略分析';\n  renderChips(); clearInterval(S.timer); load(true); S.timer=setInterval(()=>load(false),10000);\n}\n\n/* --- render --- */\nfunction renderChips(){ $('chips').innerHTML=QUICK.map(c=>'<button type=\"button\" data-c=\"'+c+'\" class=\"'+(S.inst===c+'-USDT-SWAP'?'on':'')+'\">'+c+'<\/button>').join(''); }\nfunction trendTxt(t){ return t==null?'<span class=\"mute\">!<\/span>':t===1?'<b class=\"up\">多頭<\/b>':t===-1?'<b class=\"dn\">空頭<\/b>':'<b class=\"flat\">糾纏<\/b>'; }\nfunction qqeSw(b){ return '<span class=\"qb\" style=\"background:'+(b===1?'var(--blue)':b===-1?'var(--pink)':'#3a4a5e')+'\"><\/span>'; }\nfunction applyStrat(){\n  const m=STR[S.strat];\n  $('sub').textContent=m.sub; $('resonote').textContent=m.reso; $('legend').innerHTML=m.legend; $('signote').textContent=m.sig;\n  $('stab').innerHTML=[['s','賽克斯'],['w','威克特'],['h','獵影'],['p','海神'],['f','13333']].map(([k,t])=>'<button type=\"button\" data-s=\"'+k+'\" class=\"'+(S.strat===k?'on':'')+'\">'+t+'<\/button>').join('');\n}\nfunction render(){\n  applyStrat();\n  if(S.strat==='f'&&!S.F[S.tf]&&S.F['15m']) S.tf='15m';\n  const A=CUR()[S.tf], T=S.ticker;\n  $('qsym').innerHTML=S.inst?NAMEQ(S.inst)+' '+BADGE(S.inst):'—';\n  if(T){\n    const last=+T.last, open=+T.open24h, chg=(last-open)/open*100;\n    $('qpx').textContent=fmt(last); $('qchg').textContent=pct(chg); $('qchg').className='chg num '+cls(chg);\n    $('qh').textContent=fmt(+T.high24h); $('ql').textContent=fmt(+T.low24h); $('qv').textContent=/-SWAP$/.test(S.inst)?compact(+T.volCcy24h*last)+' '+(S.inst.split('-')[1]||'USDT'):compact(+T.volCcy24h)+' '+(S.inst.split('-')[1]||'');\n  }else ['qpx','qchg','qh','ql','qv'].forEach(i=>$(i).textContent=i==='qpx'?'—':'');\n  $('tfbar').innerHTML=TFS.map(k=>'<button type=\"button\" data-tf=\"'+k+'\" class=\"'+(S.tf===k?'on':'')+'\"'+(CUR()[k]?'':' disabled')+'>'+k+'<\/button>').join('');\n  ['stf','gtf'].forEach(i=>$(i).textContent=S.tf);\n  renderSteps(A); renderReso(); renderSig(A); renderDisc(A); renderCalc(A); renderView(A); renderHarm(A); draw();\n}\n/* ===== 和諧型態 XABCD（獨立分析）：Gartley／Bat／Alt Bat／Butterfly／Crab／Deep Crab／Shark／Cypher，比率容差 ±0.03 ===== */\nconst HP=[\n {n:'Gartley',zh:'加特利',b:[.618,.618],c:[.382,.886],cT:'ab',d:[.786,.786],dR:'XA',bcd:[1.13,1.618]},\n {n:'Bat',zh:'蝙蝠',b:[.382,.5],c:[.382,.886],cT:'ab',d:[.886,.886],dR:'XA',bcd:[1.618,2.618]},\n {n:'Alt Bat',zh:'變形蝙蝠',b:[.382,.382],c:[.382,.886],cT:'ab',d:[1.13,1.13],dR:'XA',bcd:[2,3.618]},\n {n:'Butterfly',zh:'蝴蝶',b:[.786,.786],c:[.382,.886],cT:'ab',d:[1.272,1.618],dR:'XA',bcd:[1.618,2.24]},\n {n:'Crab',zh:'螃蟹',b:[.382,.618],c:[.382,.886],cT:'ab',d:[1.618,1.618],dR:'XA',bcd:[2.24,3.618]},\n {n:'Deep Crab',zh:'深螃蟹',b:[.886,.886],c:[.382,.886],cT:'ab',d:[1.618,1.618],dR:'XA',bcd:[2,3.618]},\n {n:'Shark',zh:'鯊魚',b:[.446,.618],c:[1.13,1.618],cT:'abx',d:[.886,1.13],dR:'XC',bcd:[1.618,2.24]},\n {n:'Cypher',zh:'賽福',b:[.382,.618],c:[1.13,1.414],cT:'xa',d:[.786,.786],dR:'XC',bcd:null}\n];\nconst HTOL=.03, inR=(v,r,t)=>v>=r[0]-t&&v<=r[1]+t;\nfunction harmSwings(cs,atr){\n  const pv=pivots(cs,3), pts=[]; pv.H.forEach(x=>pts.push({i:x.i,p:x.p,t:'H'})); pv.L.forEach(x=>pts.push({i:x.i,p:x.p,t:'L'})); pts.sort((a,b)=>a.i-b.i);\n  const out=[], minLeg=1.2*atr;\n  for(const q of pts){ const l=out[out.length-1];\n    if(!l){ out.push(q); continue; }\n    if(l.t===q.t){ if((q.t==='H'&&q.p>l.p)||(q.t==='L'&&q.p<l.p)) out[out.length-1]=q; continue; }\n    if(Math.abs(q.p-l.p)>=minLeg) out.push(q); }\n  const L=cs.length-1, last=out[out.length-1];                                       // 最後一個還沒確認的極值（即時的 D）\n  if(last){ let ex=null; for(let i=last.i+1;i<=L;i++){ const c=cs[i]; if(last.t==='H'){ if(!ex||c.l<ex.p) ex={i,p:c.l,t:'L'}; } else { if(!ex||c.h>ex.p) ex={i,p:c.h,t:'H'}; } }\n    if(ex&&Math.abs(ex.p-last.p)>=minLeg){ ex.prov=true; out.push(ex); } }\n  return out;\n}\nfunction harmDetect(A){\n  const cs=A.cs, L=cs.length-1; if(L<60) return null;\n  const atr=atrArr(cs,14)[L]||(cs[L].h-cs[L].l), sw=harmSwings(cs,atr), price=cs[L].c, res={done:[],form:[],atr,price,sw};\n  const tryWin=(X,Aa,B,C,Dp)=>{\n    const xa=Math.abs(Aa.p-X.p), ab=Math.abs(Aa.p-B.p); if(!(xa>0&&ab>0)) return;\n    const bull=X.p<Aa.p, xb=ab/xa; if(bull?!(B.p>X.p&&B.p<Aa.p):!(B.p<X.p&&B.p>Aa.p)) return;\n    for(const p of HP){\n      if(!inR(xb,p.b,HTOL)) continue;\n      let cOK;\n      if(p.cT==='ab'){ const r=Math.abs(C.p-B.p)/ab; cOK=inR(r,p.c,HTOL)&&(bull?C.p<Aa.p:C.p>Aa.p); }\n      else if(p.cT==='abx'){ const r=Math.abs(C.p-B.p)/ab; cOK=inR(r,p.c,HTOL)&&(bull?C.p>Aa.p:C.p<Aa.p); }\n      else { const r=Math.abs(C.p-X.p)/xa; cOK=inR(r,p.c,HTOL)&&(bull?C.p>Aa.p:C.p<Aa.p); }\n      if(!cOK) continue;\n      const ref=p.dR==='XA'?{from:Aa.p,to:X.p}:{from:C.p,to:X.p}, dPx=dv=>ref.from+(ref.to-ref.from)*dv;       // 由 A（或 C）往 X 方向量 dv 倍\n      const prz=[dPx(p.d[0]-HTOL*(p.d[0]===p.d[1]?1:0)),dPx(p.d[1]+HTOL*(p.d[0]===p.d[1]?1:0))].sort((a,b)=>a-b);\n      const far=bull?prz[0]:prz[1], sl=bull?Math.min(X.p,far)-.1*atr:Math.max(X.p,far)+.1*atr;\n      const rec={p,bull,X,A:Aa,B,C,xb,cR:p.cT==='xa'?Math.abs(C.p-X.p)/xa:Math.abs(C.p-B.p)/ab,prz,sl};\n      if(Dp){\n        const dr=p.dR==='XA'?Math.abs(Aa.p-Dp.p)/xa*(((bull?Dp.p<Aa.p:Dp.p>Aa.p))?1:-1):Math.abs(C.p-Dp.p)/Math.abs(C.p-X.p)*(((bull?Dp.p<C.p:Dp.p>C.p))?1:-1);\n        if(!inR(dr,p.d,HTOL)) continue;\n        const bcd=Math.abs(C.p-Dp.p)/Math.abs(C.p-B.p); rec.D=Dp; rec.dR=dr; rec.bcdR=bcd; rec.bcdOK=p.bcd?inR(bcd,p.bcd,.15):null;\n        rec.dev=Math.abs(xb-(p.b[0]+p.b[1])/2)+Math.abs(dr-(p.d[0]+p.d[1])/2); res.done.push(rec);\n      } else {\n        if(res.done.some(d=>d.C===C)) continue;                                                   // 已經走完 D 的不重複列成形成中\n        const inPrz=price>=prz[0]-.2*atr&&price<=prz[1]+.2*atr, leg=bull?C.p-prz[1]:prz[0]-C.p, prog=leg>0?(bull?C.p-price:price-C.p)/leg:0,\n          nearBy=bull?(price>prz[0]-.2*atr&&price<=C.p&&prog>=.5):(price<prz[1]+.2*atr&&price>=C.p&&prog>=.5);          // 價格要已經走完 C→PRZ 的一半以上才列「形成中」\n        if(!nearBy&&!inPrz) continue; rec.inPrz=inPrz; rec.tp1=(bull?prz[1]:prz[0])+(C.p-(bull?prz[1]:prz[0]))*.382; rec.tp2=(bull?prz[1]:prz[0])+(C.p-(bull?prz[1]:prz[0]))*.618; res.form.push(rec); }\n    }\n  };\n  const n=sw.length;\n  if(n>=5) tryWin(sw[n-5],sw[n-4],sw[n-3],sw[n-2],sw[n-1]);                            // 最後一個高低點當 D（已完成）\n  const conf=sw.filter(x=>!x.prov), m=conf.length;\n  if(m>=4) tryWin(conf[m-4],conf[m-3],conf[m-2],conf[m-1],null);                        // 最後一個「已確認」高低點當 C，D 還在路上（形成中）\n  if(n>=6) tryWin(sw[n-6],sw[n-5],sw[n-4],sw[n-3],sw[n-2]);                            // D 已過一小段（回頭走了）\n  res.done.sort((a,b)=>a.dev-b.dev);\n  return res;\n}\nfunction harmSvg(r){\n  const W=360,H=170,px=26,py=18, P=[r.X,r.A,r.B,r.C].concat(r.D?[r.D]:[{p:(r.prz[0]+r.prz[1])/2,proj:true}]);\n  const vals=P.map(x=>x.p).concat(r.prz), mn=Math.min(...vals), mx=Math.max(...vals), sy=v=>H-py-(v-mn)/((mx-mn)||1)*(H-2*py);\n  const xs=[0,1,2,3,4].map(i=>px+i*(W-2*px-34)/4), col=r.bull?'#26c281':'#ef5350', pts=P.map((x,i)=>[xs[i],sy(x.p)]);\n  const y1=sy(r.prz[0]), y2=sy(r.prz[1]), top=Math.min(y1,y2), h=Math.max(Math.abs(y1-y2),8);\n  let s='<svg viewBox=\"0 0 '+W+' '+H+'\" style=\"width:100%;max-width:420px;height:auto;background:rgba(127,127,127,.08);border-radius:8px\">';\n  s+='<rect x=\"'+(xs[3]+4)+'\" y=\"'+(top-(h-Math.abs(y1-y2))/2)+'\" width=\"'+(W-xs[3]-8)+'\" height=\"'+h+'\" fill=\"rgba(245,185,66,.25)\" stroke=\"#f5b942\" stroke-dasharray=\"3 3\"/><text x=\"'+(W-6)+'\" y=\"'+(top-4)+'\" fill=\"#f5b942\" font-size=\"10\" tex
