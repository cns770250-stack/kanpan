/div>\n      <div style=\"display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start\">\n        <div class=\"fgroup\">\n          <label>本次進場止損距離 %<\/label>\n          <input type=\"number\" id=\"sxSLpct\" value=\"5\" min=\"0.01\" step=\"0.01\" oninput=\"docCalcLev('sx')\">\n        <\/div>\n        <div class=\"rgrid\" style=\"margin-bottom:0\">\n          <div class=\"rbox\">\n            <div class=\"rl\">爆倉臨界槓桿（100 ÷ 止損%）<\/div>\n            <div class=\"rv neg\" id=\"sxLevMax\">—<\/div>\n          <\/div>\n          <div class=\"rbox\">\n            <div class=\"rl\">建議保守槓桿（50 ÷ 止損%）<\/div>\n            <div class=\"rv pos\" id=\"sxLevSafe\">—<\/div>\n          <\/div>\n          <div class=\"rbox\">\n            <div class=\"rl\">說明<\/div>\n            <div style=\"font-size:12px;color:var(--dim);line-height:1.5\">通道型策略止損距離常較寬，槓桿建議壓低，搭配分倉降低單筆風險。<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ==================== 威克特 ==================== -->\n  <div class=\"doc-section\" id=\"doc-wicket\" style=\"display:none\">\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px\">\n      <div>\n        <div style=\"font-size:15px;font-weight:500;color:var(--bright);margin-bottom:3px\">🎯 威克特策略（Bollinger Bands + MACD）<\/div>\n        <div style=\"font-size:12px;color:var(--dim)\">菁英交易學院教材・布林通道均值回歸・MACD 動能確認・適用 15分鐘～1小時<\/div>\n      <\/div>\n      <div style=\"display:flex;gap:6px\">\n        <span class=\"badge brange\">均值回歸型<\/span>\n        <span class=\"badge bbull\">風報比 1:1<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"bias-grid\" style=\"margin-bottom:14px\">\n      <div class=\"bias-card bull-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">核心邏輯<\/span><\/div>\n        <div class=\"bias-sym\">測試軌道 → 突破中軌 → MACD 確認<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">價格測試布林上/下軌後拉回並突破中軌，若 <strong>5 根K棒內<\/strong> 出現對應 MACD 金叉/死叉，代表動能反轉確認。<\/div>\n      <\/div>\n      <div class=\"bias-card range-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">適用行情<\/span><\/div>\n        <div class=\"bias-sym\">箱型整理・非趨勢暴衝盤<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">須先確認布林帶處於<strong>非擠壓<\/strong>狀態（波動足夠），過度收窄時訊號不穩定。<\/div>\n      <\/div>\n      <div class=\"bias-card neutral-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">動能指標<\/span><\/div>\n        <div class=\"bias-sym\">BBAWE + Trader SIX MACD Plus<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">結合布林帶與自訂 MACD 參數，用於捕捉短週期均值回歸的動能反轉點。<\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n      <div class=\"card\">\n        <div class=\"ctitle\">✅ 進場前檢查清單<\/div>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13px;margin-bottom:10px\">\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"wkChk1\" onchange=\"docChecklistUpdate('wk',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            布林帶處於非擠壓狀態（帶寬足夠，非窄幅盤整）\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"wkChk2\" onchange=\"docChecklistUpdate('wk',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            價格測試上軌（做空）或下軌（做多）\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"wkChk3\" onchange=\"docChecklistUpdate('wk',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            價格收盤突破布林中軌，反向確認\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"wkChk4\" onchange=\"docChecklistUpdate('wk',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            MACD 在近 5 根K棒內出現對應金叉(多)／死叉(空)\n          <\/label>\n        <\/div>\n        <div id=\"wkVerdict\" class=\"advice\"><\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <div class=\"ctitle\">🎯 止盈止損建議<\/div>\n        <div style=\"font-size:13px;line-height:1.8;color:var(--text)\">\n          <strong style=\"color:var(--bear)\">止損：<\/strong>設於剛測試過的布林軌道外側（上軌上方 / 下軌下方），作為假突破失敗的防守點。\n          <br>\n          <strong style=\"color:var(--bull)\">止盈：<\/strong>採 <strong>1:1<\/strong> 風險報酬比，價格回到對側軌道或中軌反向即可快速出場，均值回歸策略不宜戀戰。\n        <\/div>\n        <div style=\"margin-top:10px;display:flex;gap:8px\">\n          <button class=\"btn-o\" onclick=\"docGotoCalc('wk')\">🧮 前往倉位計算，代入止損%與槓桿<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"ctitle\">⚖️ 槓桿觀念速查<\/div>\n      <div style=\"display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start\">\n        <div class=\"fgroup\">\n          <label>本次進場止損距離 %<\/label>\n          <input type=\"number\" id=\"wkSLpct\" value=\"3\" min=\"0.01\" step=\"0.01\" oninput=\"docCalcLev('wk')\">\n        <\/div>\n        <div class=\"rgrid\" style=\"margin-bottom:0\">\n          <div class=\"rbox\">\n            <div class=\"rl\">爆倉臨界槓桿（100 ÷ 止損%）<\/div>\n            <div class=\"rv neg\" id=\"wkLevMax\">—<\/div>\n          <\/div>\n          <div class=\"rbox\">\n            <div class=\"rl\">建議保守槓桿（50 ÷ 止損%）<\/div>\n            <div class=\"rv pos\" id=\"wkLevSafe\">—<\/div>\n          <\/div>\n          <div class=\"rbox\">\n            <div class=\"rl\">說明<\/div>\n            <div style=\"font-size:12px;color:var(--dim);line-height:1.5\">均值回歸止損通常較窄，槓桿空間相對較大，但務必搭配 1:1 快速出場紀律。<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ==================== 獵影 ==================== -->\n  <div class=\"doc-section\" id=\"doc-hunter\" style=\"display:none\">\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px\">\n      <div>\n        <div style=\"font-size:15px;font-weight:500;color:var(--bright);margin-bottom:3px\">🏹 獵影策略（OBV + ATR Bands）<\/div>\n        <div style=\"font-size:12px;color:var(--dim)\">專為盤整行情設計・抓假突破反轉・搭配K棒型態確認<\/div>\n      <\/div>\n      <div style=\"display:flex;gap:6px\">\n        <span class=\"badge brange\">盤整行情專用<\/span>\n        <span class=\"badge bbull\">風報比 1:1.5<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"bias-grid\" style=\"margin-bottom:14px\">\n      <div class=\"bias-card bull-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">核心邏輯<\/span><\/div>\n        <div class=\"bias-sym\">OBV 突破 ATR 通道 → 下一根拉回通道內<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">OBV（能量潮）先假突破 ATR 通道邊界，緊接著下一根K棒收回通道內，代表這是一次<strong>假突破掃單<\/strong>，適合反向進場。<\/div>\n      <\/div>\n      <div class=\"bias-card range-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">適用行情<\/span><\/div>\n        <div class=\"bias-sym\">盤整行情（區間震盪）<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">須先確認目前是盤整行情，趨勢明確的單邊盤不適用，容易被巴來巴去。<\/div>\n      <\/div>\n      <div class=\"bias-card neutral-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">型態確認<\/span><\/div>\n        <div class=\"bias-sym\">十字星・實體吞沒・影線吞沒<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">OBV假突破訊號出現後，還需搭配對應K棒型態作最終確認，方向須與回歸方向一致。<\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n      <div class=\"card\">\n        <div class=\"ctitle\">✅ 進場前檢查清單<\/div>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13px;margin-bottom:10px\">\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"htChk1\" onchange=\"docChecklistUpdate('ht',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            確認目前市場處於盤整行情\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"htChk2\" onchange=\"docChecklistUpdate('ht',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            OBV 曾突破 ATR 通道後、下一根K棒已收回通道內\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"htChk3\" onchange=\"docChecklistUpdate('ht',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            出現進場型態（十字星／實體吞沒／影線吞沒）\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"htChk4\" onchange=\"docChecklistUpdate('ht',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            型態方向與 OBV 回歸方向一致\n          <\/label>\n        <\/div>\n        <div id=\"htVerdict\" class=\"advice\"><\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <div class=\"ctitle\">🎯 止盈止損建議<\/div>\n        <div style=\"font-size:13px;line-height:1.8;color:var(--text)\">\n          <strong style=\"color:var(--bear)\">止損：<\/strong>設於假突破當根K棒的極端價（高點外側／低點外側），單筆風險建議控制在總資金 <strong>1–2%<\/strong>。\n          <br>\n          <strong style=\"color:var(--bull)\">止盈：<\/strong>採 <strong>1:1.5<\/strong> 風險報酬比，目標可設於區間對側邊界。\n        <\/div>\n        <div style=\"margin-top:10px;display:flex;gap:8px\">\n          <button class=\"btn-o\" onclick=\"docGotoCalc('ht')\">🧮 前往倉位計算，代入止損%與槓桿<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"ctitle\">⚖️ 槓桿觀念速查<\/div>\n      <div style=\"display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start\">\n        <div class=\"fgroup\">\n          <label>本次進場止損距離 %<\/label>\n          <input type=\"number\" id=\"htSLpct\" value=\"2\" min=\"0.01\" step=\"0.01\" oninput=\"docCalcLev('ht')\">\n        <\/div>\n        <div class=\"rgrid\" style=\"margin-bottom:0\">\n          <div class=\"rbox\">\n            <div class=\"rl\">爆倉臨界槓桿（100 ÷ 止損%）<\/div>\n            <div class=\"rv neg\" id=\"htLevMax\">—<\/div>\n          <\/div>\n          <div class=\"rbox\">\n            <div class=\"rl\">建議保守槓桿（50 ÷ 止損%）<\/div>\n            <div class=\"rv pos\" id=\"htLevSafe\">—<\/div>\n          <\/div>\n          <div class=\"rbox\">\n            <div class=\"rl\">說明<\/div>\n            <div style=\"font-size:12px;color:var(--dim);line-height:1.5\">盤整策略止損通常很窄，槓桿空間看似大，但務必嚴守每筆風險 1–2% 的資金控管。<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ==================== 13333法則 ==================== -->\n  <div class=\"doc-section\" id=\"doc-13333\" style=\"display:none\">\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px\">\n      <div>\n        <div style=\"font-size:15px;font-weight:500;color:var(--bright);margin-bottom:3px\">🎯 13333法則（首K突破回測延續）<\/div>\n        <div style=\"font-size:12px;color:var(--dim)\">1個區間・3個時段・3個機會・3個步驟・3個方向｜先觀察市場，再跟隨市場。等機會，不追機會<\/div>\n      <\/div>\n      <div style=\"display:flex;gap:6px\">\n        <span class=\"badge bbull\">順勢突破<\/span>\n        <span class=\"badge brange\">每時段最多1次機會<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"bias-grid\" style=\"margin-bottom:14px\">\n      <div class=\"bias-card bull-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">1 首K區間<\/span><\/div>\n        <div class=\"bias-sym\">台灣時間 06:00 ~ 07:00<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">取首K的最高點／最低點為當日<strong>多空分界區間<\/strong>，夏令冬令皆為 06:00~07:00。<\/div>\n      <\/div>\n      <div class=\"bias-card range-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">3 步驟<\/span><\/div>\n        <div class=\"bias-sym\">突破 → 回測 → 延續<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\"><strong>①<\/strong> 收盤站上首K高／跌破首K低　<strong>②<\/strong> 回測首K邊緣（容許0.1 ATR誤差）且收盤未回區間內　<strong>③<\/strong> 收盤突破回測K高／低點＝收盤進場。首K之上只做多、之下只做空、區間內不交易；建議週期15分鐘。<\/div>\n      <\/div>\n      <div class=\"bias-card neutral-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">3 大時段（台灣時間）<\/span><\/div>\n        <div class=\"bias-sym\">亞盤・歐盤・美盤<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">\n          <strong>夏令：<\/strong>亞 07:00~13:00／歐 15:00~23:30／美 21:30~04:00<br>\n          <strong>冬令：<\/strong>亞 07:00~13:00／歐 16:00~00:30／美 22:30~05:00<br>\n          <span style=\"color:var(--dim)\">掃描時依美國夏令時間自動切換。<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n      <div class=\"card\">\n        <div class=\"ctitle\">✅ 進場前檢查清單<\/div>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13px;margin-bottom:10px\">\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"tkChk1\" onchange=\"docChecklistUpdate('tk',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            ① 收盤站上首K高點（多）／跌破首K低點（空），不是插針\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"tkChk2\" onchange=\"docChecklistUpdate('tk',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            ② 回測首K邊緣（容許0.1 ATR），收盤未回到區間內\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"tkChk3\" onchange=\"docChecklistUpdate('tk',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            ③ 延續確認：收盤突破回測K棒高點（多）／低點（空）\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"tkChk4\" onchange=\"docChecklistUpdate('tk',false)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            目前在亞／歐／美時段內，且該時段尚未用過機會（今日≤3次）\n          <\/label>\n        <\/div>\n        <div id=\"tkVerdict\" class=\"advice\"><\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <div class=\"ctitle\">🎯 止盈止損建議<\/div>\n        <div style=\"font-size:13px;line-height:1.8;color:var(--text)\">\n          <strong style=\"color:var(--bear)\">止損：<\/strong>回測K極值 ± 0.1 ATR（可選：區間中線／區間另一側）。\n          <br>\n          <strong style=\"color:var(--bull)\">止盈：<\/strong>RR <strong>1:2<\/strong>（可選：區間高度 × 倍數）。\n          <br>\n          <strong style=\"color:var(--range)\">時間出場：<\/strong>持倉所屬時段結束或下一個首K開始即平倉；已有持倉時其他時段訊號不加碼、不反手。每時段最多進場1次，一天最多3次。\n          <br>\n          <span style=\"color:var(--dim)\">取消規則：突破後收盤回區間內＝假突破；突破後12根內沒回測放棄；回測後3根內沒延續，等下一次回測。<\/span>\n        <\/div>\n        <div style=\"margin-top:10px;display:flex;gap:8px\">\n          <button class=\"btn-o\" onclick=\"docGotoCalc('tk')\">🧮 前往倉位計算，代入止損%與槓桿<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"ctitle\">⚖️ 槓桿觀念速查<\/div>\n      <div style=\"display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start\">\n        <div class=\"fgroup\">\n          <label>本次進場止損距離 %<\/label>\n          <input type=\"number\" id=\"tkSLpct\" value=\"1\" min=\"0.01\" step=\"0.01\" oninput=\"docCalcLev('tk')\">\n        <\/div>\n        <div class=\"rgrid\" style=\"margin-bottom:0\">\n          <div class=\"rbox\">\n            <div class=\"rl\">爆倉臨界槓桿（100 ÷ 止損%）<\/div>\n            <div class=\"rv neg\" id=\"tkLevMax\">—<\/div>\n          <\/div>\n          <div class=\"rbox\">\n            <div class=\"rl\">建議保守槓桿（50 ÷ 止損%）<\/div>\n            <div class=\"rv pos\" id=\"tkLevSafe\">—<\/div>\n          <\/div>\n          <div class=\"rbox\">\n            <div class=\"rl\">說明<\/div>\n            <div style=\"font-size:12px;color:var(--dim);line-height:1.5\">止損貼近回測K棒，距離通常很窄；務必依止損距離反推倉位，不要因槓桿空間大而加碼。<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- ==================== 海神 ==================== -->\n  <div class=\"doc-section\" id=\"doc-poseidon\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px\">\n    <div>\n      <div style=\"font-size:15px;font-weight:500;color:var(--bright);margin-bottom:3px\">🔱 海神指標 2.0 策略系統<\/div>\n      <div style=\"font-size:12px;color:var(--dim)\">單邊行情吃波段・盤整行情懂避開・搭配結構轉換（MSS）與流動性過濾假訊號<\/div>\n    <\/div>\n    <div style=\"display:flex;gap:6px\">\n      <span class=\"badge bbull\">單邊行情：核心優勢<\/span>\n      <span class=\"badge brange\">盤整行情：訊號減弱<\/span>\n    <\/div>\n  <\/div>\n\n  <!-- 策略總覽 -->\n  <div class=\"bias-grid\" style=\"margin-bottom:14px\">\n    <div class=\"bias-card bull-card\">\n      <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">單邊行情<\/span><\/div>\n      <div class=\"bias-sym\">漲跌幅 &gt; 5%（甚至 10%+）<\/div>\n      <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">\n        海神專為單邊行情設計，訊號最有效，能抓到趨勢起爆點。<strong>大賺 vs 小虧<\/strong>，吃波段不吃雜訊。\n      <\/div>\n    <\/div>\n    <div class=\"bias-card range-card\">\n      <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">盤整行情<\/span><\/div>\n      <div class=\"bias-sym\">漲跌幅 &lt; 5%・方向不明<\/div>\n      <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">\n        訊號會減弱，容易出現小幅虧損；但只要控制槓桿與倉位，<strong>小虧是成本，大賺才是結果<\/strong>，不影響長期策略獲利。\n      <\/div>\n    <\/div>\n    <div class=\"bias-card neutral-card\">\n      <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">底層指標<\/span><\/div>\n      <div class=\"bias-sym\">TuTCI（Turtle Trade Channels）<\/div>\n      <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">\n        TradingView 搜尋「TUTCI」並蒐藏，參數改為 <strong>Entry Length 10 / Exit Length 5<\/strong>，其餘維持預設。\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n\n    <!-- 時區交易法 -->\n    <div class=\"card\">\n      <div class=\"ctitle\">🧭 時區交易法｜4H 判斷趨勢・1H 精準進場<\/div>\n      <div class=\"fgroup\" style=\"margin-bottom:10px\">\n        <label>目前 4H 大趨勢判斷<\/label>\n        <select id=\"hsTrend4H\" onchange=\"hsUpdateSessionAdvice()\">\n          <option value=\"bull\">4H 多頭趨勢<\/option>\n          <option value=\"bear\">4H 空頭趨勢<\/option>\n          <option value=\"range\">4H 盤整（方向不明）<\/option>\n        <\/select>\n      <\/div>\n      <div id=\"hsSessionAdvice\" class=\"advice\"><\/div>\n    <\/div>\n\n    <!-- 進場檢查清單 -->\n    <div class=\"card\">\n      <div class=\"ctitle\">✅ 進場前檢查清單<\/div>\n      <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13px;margin-bottom:10px\">\n        <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n          <input type=\"checkbox\" id=\"hsChk1\" onchange=\"hsUpdateChecklist()\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n          海神出現 Long / Short Entry 訊號\n        <\/label>\n        <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n          <input type=\"checkbox\" id=\"hsChk2\" onchange=\"hsUpdateChecklist()\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n          市場結構已反轉（出現 MSS，收盤確認）\n        <\/label>\n        <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n          <input type=\"checkbox\" id=\"hsChk3\" onchange=\"hsUpdateChecklist()\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n          方向與高週期（4H）偏見一致，於 1H 進場，未逆勢操作\n        <\/label>\n        <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n          <input type=\"checkbox\" id=\"hsChk4\" onchange=\"hsUpdateChecklist()\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n          止損可設在海神紅線（防守點），風報比合理\n        <\/label>\n        <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n          <input type=\"checkbox\" id=\"hsChk5\" onchange=\"hsUpdateChecklist()\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n          已完成分倉規劃，本單為等分倉位之一\n        <\/label>\n      <\/div>\n      <div id=\"hsVerdict\" class=\"advice\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n\n    <!-- 流動性 & 結構轉換 -->\n    <div class=\"card\">\n      <div class=\"ctitle\">💧 流動性（Liquidity）與結構轉換（MSS）<\/div>\n      <div style=\"font-size:13px;line-height:1.8;color:var(--text)\">\n        <strong style=\"color:var(--bright)\">流動性：<\/strong>每個明顯高低點下面都藏著大量停損／停利單。主力進大單需要對手單，因此常見「先假突破高點 → 掃上方停損 → 馬上反轉」或「先跌破低點 → 掃下方流動性 → 瞬間拉回」，即 SMC 概念中的 <strong style=\"color:var(--gold2)\">掃流動性做反轉（Liquidity Grab + Shift）<\/strong>。\n        <br><br>\n        <strong style=\"color:var(--bright)\">結構轉換 MSS：<\/strong>原本一路走高（HH / HL）的多頭結構，一旦價格跌破前一個 HL 並創出新的 LH，就代表結構被破壞、方向改變；空頭轉多頭則相反。<strong style=\"color:var(--gold2)\">沒有結構反轉，就不要跟著海神訊號進場<\/strong>，避免做在盤整或回檔中段。\n      <\/div>\n    <\/div>\n\n    <!-- 止盈止損建議 -->\n    <div class=\"card\">\n      <div class=\"ctitle\">🎯 止盈止損設置<\/div>\n      <div style=\"font-size:13px;line-height:1.8;color:var(--text)\">\n        <strong style=\"color:var(--bear)\">止損：<\/strong>設於海神指標顯示的紅線位置，作為關鍵防守點。\n        <br>\n        <strong style=\"color:var(--bull)\">短線止盈：<\/strong>採 1:1 風險報酬比，快速出場。\n        <br>\n        <strong style=\"color:var(--bull)\">長線止盈：<\/strong>依圖表結構，設於上方壓力區／下方支撐區，搭配流動性概念可更精準抓到高機率反轉位置。\n      <\/div>\n      <div style=\"margin-top:10px;display:flex;gap:8px\">\n        <button class=\"btn-o\" onclick=\"hsGotoCalc()\">🧮 前往倉位計算，代入止損%與槓桿<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 槓桿與倉位管理速查 -->\n  <div class=\"card\">\n    <div class=\"ctitle\">⚖️ 槓桿觀念速查（依止損距離反推安全槓桿）<\/div>\n    <div style=\"display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start\">\n      <div class=\"fgroup\">\n        <label>本次進場止損距離 %<\/label>\n        <input type=\"number\" id=\"hsSLpct\" value=\"7.7\" min=\"0.01\" step=\"0.01\" oninput=\"hsCalcLev()\">\n      <\/div>\n      <div class=\"rgrid\" style=\"margin-bottom:0\">\n        <div class=\"rbox\">\n          <div class=\"rl\">爆倉臨界槓桿（100 ÷ 止損%）<\/div>\n          <div class=\"rv neg\" id=\"hsLevMax\">—<\/div>\n        <\/div>\n        <div class=\"rbox\">\n          <div class=\"rl\">建議保守槓桿（50 ÷ 止損%）<\/div>\n          <div class=\"rv pos\" id=\"hsLevSafe\">—<\/div>\n        <\/div>\n        <div class=\"rbox\">\n          <div class=\"rl\">說明<\/div>\n          <div style=\"font-size:12px;color:var(--dim);line-height:1.5\">槓桿別亂開，先看止損距離；虧損 = 止損% × 槓桿，控制在 100% 以內才不會被強平，再搭配分倉更穩。<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <\/div><!-- /doc-poseidon -->\n\n<\/div><!-- /panel-poseidon -->\n\n<\/div><!-- /app -->\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n// ============================================================\n// OKX API + CORS proxy\n// ============================================================\nconst OKX   = 'https://www.okx.com';\nconst PROXY = 'https://corsproxy.io/?url=';\n\n// 手動 timeout 包裝，比 AbortSignal.timeout 相容性更好\nfunction fetchWithTimeout(url, ms){\n  return Promise.race([\n    fetch(url),\n    new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')), ms))\n  ]);\n}\n\nasync function okxFetch(path, retried) {\n  const url = OKX + path;\n  try {\n    const r = await fetchWithTimeout(url, 6000);\n    if (r.status === 429 && !retried) {\n      await new Promise(res=>setTimeout(res, 800));\n      return okxFetch(path, true);\n    }\n    if (r.ok) {\n      const d = await r.json();\n      return d; // 直連成功就直接回傳，不再 fallback proxy\n    }\n    // HTTP 4xx/5xx 才考慮 proxy（例如地區限制）\n    if (r.status >= 400 && r.status < 500 && r.status !== 429) {\n      throw new Error('direct_4xx'); // 直接 4xx 通常是端點不存在，不值得走 proxy\n    }\n  } catch(e) {\n    if (e.message === 'direct_4xx') throw e; // 直接拋出不走 proxy\n  }\n  // proxy 備用（只在直連完全失敗/逾時時才用）\n  try {\n    const r2 = await fetchWithTimeout(PROXY + encodeURIComponent(url), 8000);\n    return await r2.json();\n  } catch(e) {\n    throw new Error('API無法連線: ' + path);\n  }\n}\n\n// OKX candle bar: [ts, o, h, l, c, vol, volCcy, volCcyQuote, confirm]\nconst _hist = {};   // 各幣各週期的 K 棒歷史（依時間戳合併），第一次抓滿約 900 根，之後每次只補最新 1 頁\nasync function fetchCandles(instId, bar, limit = 300, deep = false) {\n  const d = await okxFetch(`/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`);\n  if (!d.data) return [];\n  let raw = d.data;                                                  // 新 → 舊\n  if (deep) {                                                        // 賽克斯要 EMA576／676，至少需要 700 根\n    const key = instId+'|'+bar, m = _hist[key] || (_hist[key] = new Map());\n    raw.forEach(k => m.set(+k[0], k));\n    for (let pg = 0; pg < 2 && m.size < 700 && raw.length >= limit; pg++) {\n      const oldest = Math.min(...m.keys());\n      try { const r2 = await okxFetch(`/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=300&after=${oldest}`); const more = r2.data || []; if (!more.length) break; more.forEach(k => m.set(+k[0], k)); if (more.length < 300) break; } catch(e) { break; }\n    }\n    raw = [...m.entries()].sort((x,y)=>y[0]-x[0]).slice(0,1000).map(x=>x[1]);\n    if (m.size > 1200) { for (const t of [...m.keys()].sort((x,y)=>x-y).slice(0, m.size-1000)) m.delete(t); }\n  }\n  const rows = raw.slice().reverse();\n  const cl = rows.map(k => parseFloat(k[4])); // close prices, oldest first\n  cl.k = rows.slice(-90).map(k => ({o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+(k[6]||k[5]),conf:k[8]==='1'})); // 供斐波0.5大K判斷\n  return cl;\n}\nconst MV3=(function(){\nconst atrArr=(cs,p)=>{ const o=new Array(cs.length).fill(null); let a=null; for(let i=1;i<cs.length;i++){ const tr=Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c)); if(i<=p){ a=(a==null?0:a)+tr; if(i===p){ a/=p; o[i]=a; } } else { a=(a*(p-1)+tr)/p; o[i]=a; } } return o; };\nconst fmt=x=>x==null||isNaN(x)?'—':String(+(+x).toPrecision(6));\nfunction pivots(cs,k){ const H=[],Lw=[]; for(let i=k;i<cs.length-k;i++){ let h=true,l=true; for(let j=1;j<=k;j++){ if(cs[i].h<=cs[i-j].h||cs[i].h<cs[i+j].h) h=false; if(cs[i].l>=cs[i-j].l||cs[i].l>cs[i+j].l) l=false; } if(h) H.push({i,p:cs[i].h}); if(l) Lw.push({i,p:cs[i].l}); } return {H,L:Lw}; }\nconst MAX_ANGLE=35, OK_ANGLE=30;                                                // 趨勢線角度：30° 以內標準，30～35° 寬鬆接受，超過 35° 不當趨勢線（頸線不限角度）。角度＝atan(每根漲跌幅 ÷ (0.5×ATR))，不受圖表縮放影響\nconst angleOf=(slope,atr)=>Math.atan(Math.abs(slope)/(.5*atr))*180/Math.PI;\nfunction rule123(cs,pv,d,atr){          // d=-1：上升趨勢被破→看空；d=1：下降趨勢被破→看多\n  const L=cs.length-1, P=d===-1?pv.L:pv.H, Q=d===-1?pv.H:pv.L;\n  if(P.length<2||!Q.length) return null;\n  let a,b,ref,br=-1,line;\n  for(let m=P.length-1;m>=1&&br<0;m--){                                           // 由新往舊找「最近一組有被收盤突破的趨勢線」\n    const pa=P[m-1], pb=P[m]; if((d===-1?!(pb.p>pa.p):!(pb.p<pa.p))||pb.i-pa.i<5) continue;      // 上升看低點、下降看高點：兩個轉折要墊高／降低，而且不能靠太近（<5根）\n    if(atr&&angleOf((pb.p-pa.p)/(pb.i-pa.i),atr)>MAX_ANGLE) continue;                 // 太陡的趨勢線不採用\n    const ln=i=>pa.p+(pb.p-pa.p)*(i-pa.i)/(pb.i-pa.i);\n    for(let i=pb.i+1;i<=L;i++){ if(d===-1?cs[i].c<ln(i):cs[i].c>ln(i)){ const rq=Q.filter(x=>x.i<i); if(rq.length){ a=pa;b=pb;line=ln;br=i;ref=rq[rq.length-1]; } break; } }\n  }\n  if(br<0||L-br>60) return null;                                                  // 太久以前的不算\n  const r={d,stage:0,line:line(L),prevExt:b.p,refP:ref.p,txt:['','',''],fail:false};\n  const tc=P.filter(x=>x.i>=a.i&&x.i<br&&Math.abs(x.p-line(x.i))<=.3*(atr||Math.abs(b.p-a.p)||1)).length;     // 趨勢線觸碰次數（至少 2 個轉折點，第 3 次以上更可靠）\n  r.touches=tc; r.stage=1; r.txt[0]='第'+(L-br)+'根前收盤'+(d===-1?'跌破上升':'突破下降')+'趨勢線（約 '+Math.round(angleOf((b.p-a.p)/(b.i-a.i),atr||1))+'°'+(angleOf((b.p-a.p)/(b.i-a.i),atr||1)>OK_ANGLE?'，稍陡':'')+'，觸碰 '+tc+' 次'+(tc>=3?'・較可靠':'')+'）';\n  let ext=d===-1?-Infinity:Infinity; for(let i=br;i<=L;i++) ext=d===-1?Math.max(ext,cs[i].h):Math.min(ext,cs[i].l);\n  const noNew=d===-1?ext<ref.p:ext>ref.p;\n  if(!noNew){ r.fail=true; r.txt[1]='反彈已'+(d===-1?'創新高':'創新低')+'，123 失敗'; return r; }\n  const bounced=d===-1?ext>cs[br].c:ext<cs[br].c;\n  if(!bounced){ r.txt[1]='等待回測（目前還沒有反彈）'; return r; }\n  r.stage=2; r.txt[1]='回測'+(d===-1?'未創新高（高點 ':'未創新低（低點 ')+fmt(ext)+'，前'+(d===-1?'高 ':'低 ')+fmt(ref.p)+'）';\n  if(d===-1?cs[L].c<b.p:cs[L].c>b.p){ r.stage=3; r.txt[2]='已收盤'+(d===-1?'跌破前低 ':'突破前高 ')+fmt(b.p)+'，123 完成'; }\n  else r.txt[2]='等待收盤'+(d===-1?'跌破前低 ':'突破前高 ')+fmt(b.p);\n  r.trig=b.p; return r;\n}\nfunction neckStage(cs,e,line,d,atr){            // 頸線突破→回測不破→延續（d=-1 看空，d=1 看多）；e＝右肩／第二頂底的位置\n  const L=cs.length-1, tol=.3*atr; let br=-1;\n  for(let i=e+1;i<=L;i++){ if(d===-1?cs[i].c<line(i):cs[i].c>line(i)){ br=i; break; } }\n  if(br<0) return {stage:0,txt:'尚未收盤'+(d===-1?'跌破':'突破')+'頸線'};\n  if(L-br>60) return null;\n  let st=1, ext=d===-1?cs[br].l:cs[br].h, touched=false;\n  for(let i=br+1;i<=L;i++){\n    if(d===-1?cs[i].c>line(i)+tol:cs[i].c<line(i)-tol) return {stage:0,fail:true,txt:'收盤站回頸線另一側，型態失敗'};\n    if(d===-1?cs[i].h>=line(i)-tol:cs[i].l<=line(i)+tol) touched=true;\n    if(touched&&(d===-1?cs[i].c<ext:cs[i].c>ext)) st=3;\n    ext=d===-1?Math.min(ext,cs[i].l):Math.max(ext,cs[i].h);\n  }\n  if(st<3&&touched) st=2;\n  return {stage:st,txt:['','已'+(d===-1?'跌破':'突破')+'頸線，等回測','回測頸線不破，等延續','回測不破後續'+(d===-1?'破低':'破高')+'（延續）'][st]};\n}\nfunction neckPats(cs,pv,atr){\n  const L=cs.length-1, out=[], tolP=Math.max(.8*atr,cs[L].c*.004), dn=(d,a,b)=>d===-1?a:b;\n  for(const d of [-1,1]){\n    const P=d===-1?pv.H:pv.L, Q=d===-1?pv.L:pv.H, cand=[];                          // P：頂（底）轉折；Q：之間的反向轉折\n    const add=(name,e,line)=>{ const r=neckStage(cs,e,line,d,atr); if(r&&!r.fail&&(r.stage>0||L-e<=15)) cand.push({d,n:name+'（頸線 '+fmt(line(L))+'）'+r.txt,age:0,neck:true,stage:r.stage,e}); };\n    for(let m=P.length-1;m>=1&&m>=P.length-6;m--){                                  // 往回找最近幾組，不只看最後兩個轉折（回測反彈本身也是轉折）\n      const a=P[m-1], b=P[m];                                                       // M 頂／W 底\n      if(b.i-a.i>=5&&Math.abs(a.p-b.p)<=tolP){ const v=Q.filter(x=>x.i>a.i&&x.i<b.i);\n        if(v.length){ const n=d===-1?Math.min(...v.map(x=>x.p)):Math.max(...v.map(x=>x.p)); if(Math.abs(n-(a.p+b.p)/2)>=1.5*atr) add(dn(d,'M頂','W底')+' '+fmt(a.p)+'／'+fmt(b.p),b.i,()=>n); } }\n      if(m>=2){ const ls=P[m-2], hd=P[m-1], rs=P[m];                                // 頭肩頂／底\n        const hOK=d===-1?(hd.p>ls.p&&hd.p>rs.p):(hd.p<ls.p&&hd.p<rs.p);\n        const q1=Q.filter(x=>x.i>ls.i&&x.i<hd.i), q2=Q.filter(x=>x.i>hd.i&&x.i<rs.i);\n        if(hOK&&q1.length&&q2.length){ const pick=a2=>d===-1?a2.reduce((k,x)=>x.p<k.p?x:k):a2.reduce((k,x)=>x.p>k.p?x:k); const n1=pick(q1), n2=pick(q2);\n          const depth=Math.abs(hd.p-(n1.p+n2.p)/2), sh=Math.abs(ls.p-rs.p);\n          if(depth>=1.5*atr&&sh<=.6*depth&&Math.abs(hd.p-ls.p)>=.3*depth&&Math.abs(hd.p-rs.p)>=.3*depth&&n2.i>n1.i){\n            const ln=i=>n1.p+(n2.p-n1.p)*(i-n1.i)/(n2.i-n1.i); add(dn(d,'頭肩頂','頭肩底'),rs.i,ln); } } }\n    }\n    cand.sort((x,y)=>y.stage-x.stage||y.e-x.e); if(cand[0]) out.push(cand[0]);\n  }\n  return out;\n}\nfunction candlePats(cs,pv,atr){\n  const L=cs.length-1, out=[], bd=k=>Math.abs(k.c-k.o), bull=k=>k.c>k.o, bear=k=>k.c<k.o, c0=cs[L], c1=cs[L-1], c2=cs[L-2];\n  if(bear(c1)&&bull(c0)&&c0.o<=c1.c&&c0.c>=c1.o&&bd(c0)>bd(c1)) out.push({d:1,n:'多頭吞沒',age:0});\n  if(bull(c1)&&bear(c0)&&c0.o>=c1.c&&c0.c<=c1.o&&bd(c0)>bd(c1)) out.push({d:-1,n:'空頭吞沒',age:0});\n  const mid2=(c2.o+c2.c)/2;\n  if(bear(c2)&&bd(c2)>=.5*atr&&bd(c1)<=.35*bd(c2)&&bull(c0)&&c0.c>mid2) out.push({d:1,n:'早晨之星',age:0});\n  if(bull(c2)&&bd(c2)>=.5*atr&&bd(c1)<=.35*bd(c2)&&bear(c0)&&c0.c<mid2) out.push({d:-1,n:'黃昏之星',age:0});\n  for(let a=0;a<=2;a++){ const i=L-a; if(i<22) break; let hi=-Infinity,lo=Infinity; for(let j=i-20;j<i;j++){ hi=Math.max(hi,cs[j].h); lo=Math.min(lo,cs[j].l); }\n    if(cs[i].h>hi&&cs[i].c<hi) out.push({d:-1,n:'向上假突破（刺破前高 '+fmt(hi)+' 收回）',age:a});\n    if(cs[i].l<lo&&cs[i].c>lo) out.push({d:1,n:'向下假突破（刺破前低 '+fmt(lo)+' 收回）',age:a}); }\n  neckPats(cs,pv,atr).forEach(x=>out.push(x));\n  return out;\n}\nfunction readMarket(A){\n  const cs=A.cs, L=cs.length-1; if(L<40) return null;\n  const atr=atrArr(cs,14)[L]||(cs[L].h-cs[L].l), pv=pivots(cs,3);\n  const r123=[rule123(cs,pv,-1,atr),rule123(cs,pv,1,atr)].filter(x=>x&&x.stage>0);\n  r123.sort((x,y)=>(y.fail?-1:y.stage)-(x.fail?-1:x.stage));\n  const pats=candlePats(cs,pv,atr).sort((x,y)=>x.age-y.age);\n  const H=pv.H.slice(-2), Lw=pv.L.slice(-2); let st='盤整／結構不明', sd=0;\n  if(H.length==2&&Lw.length==2){ const hh=H[1].p>H[0].p, hl=Lw[1].p>Lw[0].p;\n    if(hh&&hl){ st='HH＋HL 上升結構'; sd=1; } else if(!hh&&!hl){ st='LH＋LL 下降結構'; sd=-1; } else st=hh?'HH＋LL 擴張（震盪）':'LH＋HL 收斂（三角）'; }\n  const k=cs[L], body=Math.abs(k.c-k.o), rg=k.h-k.l||1e-9, uw=k.h-Math.max(k.o,k.c), lw=Math.min(k.o,k.c)-k.l;\n  const notes=[]; if(uw>2*body&&uw>.5*rg) notes.push('本根上影線長（上方賣壓）'); if(lw>2*body&&lw>.5*rg) notes.push('本根下影線長（下方買盤）');\n  if(rg>=1.5*atr) notes.push('本根為大振幅 K（'+(rg/atr).toFixed(1)+'×ATR）'); if(rg<.6*atr) notes.push('本根波動收斂');\n  const e=A.e12[L]; if(e!=null) notes.push('收盤在 EMA12 '+(k.c>e?'之上':'之下'));\n  return {atr,r123,pats,st,sd,notes,pv};\n}\n\n// 供掃描列使用：回傳 {score,items}（同向+1／逆向−1）\nfunction brief(closes,dir){\n  const k=closes&&closes.k; if(!k||k.length<60) return null;\n  const M=readMarket({cs:k,e12:[]}); if(!M) return null; const d=dir==='long'?1:-1, dn=x=>x===1?'多':'空'; let score=0; const items=[];\n  const g=M.r123[0]; if(g&&!g.fail&&g.stage>=2){ const ok=g.d===d; score+=ok?1:-1; items.push('123'+(g.stage===3?'完成':'回測')+dn(g.d)); }\n  M.pats.filter(p=>p.age<=2&&(!p.neck||p.stage>=2)).forEach(p=>{ const ok=p.d===d; score+=ok?1:-1; items.push(p.n.split('（')[0]); });\n  if(M.sd){ score+=M.sd===d?1:-1; items.push(M.st.split('＋')[0]+(M.sd===d?'':'逆')); }\n  return {score,items};\n}\nreturn {brief};\n})();\n// 賽克斯「大K斐波0.5限價」：最近一根已收盤K棒 = 同方向大K（量≥2×20均量、振幅≥1.5×ATR14）→ 回傳掛單價位\nfunction fibEntry(closes, dir){\n  const k = closes && closes.k; if(!k || k.length<22) return null;\n  let i = k.length-1; if(!k[i].conf) i--; if(i<21) return null;\n  const x = k[i];\n  if(dir==='short' ? !(x.c<x.o) : !(x.c>x.o)) return null;\n  const vma = k.slice(i-20,i).reduce((a,b)=>a+b.v,0)/20;\n  let a=0; for(let j=i-13;j<=i;j++){ const pc=k[j-1].c; a+=Math.max(k[j].h-k[j].l,Math.abs(k[j].h-pc),Math.abs(k[j].l-pc)); } a/=14;\n  if(!(x.v>=2*vma && (x.h-x.l)>=1.5*a)) return null;\n  const e=x.l+(x.h-x.l)/2, sl=dir==='short'?x.h:x.l, r=Math.abs(e-sl);\n  return {entry:e, sl, tp1:e+(dir==='short'?-r:r), tp2:e+(dir==='short'?-1.5*r:1.5*r), slPct:r/e*100};\n}\n\n// 成交量門檻（USDT等值），低於此值自動排除\nconst VOL_MIN_USDT = 1_000_000; // 100萬 USDT（門檻降低，主要靠排名前80過濾）\nconst SCAN_TOP_N = 80; // 只掃成交量前80名\n\nasync function fetchAllSwapSymbols() {\n  const d = await okxFetch('/api/v5/public/instruments?instType=SWAP');\n  if (!d.data) return [];\n  return d.data\n    .filter(s => s.state === 'live')\n    .map(s => s.instId);\n}\n\nasync function filterByVolume(syms) {\n  document.getElementById('ptext').textContent = '取得成交量數據（單次批量查詢）...';\n  // OKX 支援一次拉全部 SWAP 的 ticker，不需要逐一請求\n  try {\n    const d = await okxFetch('/api/v5/market/tickers?instType=SWAP');\n    if (!d.data) throw new Error('no ticker data');\n    const symSet = new Set(syms);\n    const withVol = d.data\n      .filter(t => symSet.has(t.instId))\n      .map(t => {\n        let vol24h = parseFloat(t.volCcy24h || 0);\n        if (!vol24h || vol24h < 1000) {\n          vol24h = parseFloat(t.vol24h || 0) * parseFloat(t.last || 0);\n        }\n        return { sym: t.instId, vol: vol24h };\n      })\n      .filter(x => x.vol >= VOL_MIN_USDT)\n      .sort((a, b) => b.vol - a.vol)\n      .slice(0, SCAN_TOP_N); // 只取前 80 名\n    return withVol.map(x => x.sym);\n  } catch(e) {\n    // 備用：單次請求失敗才逐一查詢（極少發生）\n    document.getElementById('ptext').textContent = '批量查詢失敗，改用逐一查詢...';\n    const CHUNK = 50;\n    const result = [];\n    for (let i = 0; i < syms.length; i += CHUNK) {\n      const chunk = syms.slice(i, i + CHUNK);\n      await Promise.all(chunk.map(async sym => {\n        try {\n          const d = await okxFetch(`/api/v5/market/ticker?instId=${sym}`);\n          const t = d.data?.[0];\n          if (!t) return;\n          let vol24h = parseFloat(t.volCcyQuote || 0);\n          if (!vol24h || vol24h < 1000) vol24h = parseFloat(t.vol24h || 0) * parseFloat(t.last || 0);\n          if (vol24h >= VOL_MIN_USDT) result.push({ sym, vol: vol24h });\n        } catch(e) {}\n      }));\n      await new Promise(r => setTimeout(r, 60));\n    }\n    result.sort((a, b) => b.vol - a.vol);\n    return result.slice(0, SCAN_TOP_N).map(x => x.sym);\n  }\n}\n\n// ============================================================\n// INDICATORS\n// ============================================================\nfunction calcEMA(data, p) {\n  if (data.length < p) return null;\n  const k = 2/(p+1);\n  let e = data.slice(0,p).reduce((a,b)=>a+b,0)/p;\n  for (let i=p; i<data.length; i++) e = data[i]*k + e*(1-k);\n  return e;\n}\nfunction calcEMASeries(data, p) {\n  const r = new Array(data.length).fill(null);\n  if (data.length < p) return r;\n  const k = 2/(p+1);\n  let e = data.slice(0,p).reduce((a,b)=>a+b,0)/p;\n  r[p-1] = e;\n  for (let i=p; i<data.length; i++) { e = data[i]*k+e*(1-k); r[i]=e; }\n  return r;\n}\nfunction calcRSISeries(c, p=14) {\n  const r = new Array(c.length).fill(null);\n  if (c.length < p+1) return r;\n  let g=0, l=0;\n  for (let i=1; i<=p; i++) { const d=c[i]-c[i-1]; if(d>0)g+=d; else l-=d; }\n  let ag=g/p, al=l/p;\n  r[p] = al===0?100:100-100/(1+ag/al);\n  for (let i=p+1; i<c.length; i++) {\n    const d=c[i]-c[i-1];\n    ag=(ag*(p-1)+Math.max(d,0))/p; al=(al*(p-1)+Math.max(-d,0))/p;\n    r[i]=al===0?100:100-100/(1+ag/al);\n  }\n  return r;\n}\nfunction getQQE(closes) {\n  const raw = calcRSISeries(closes,6).filter(v=>v!==null);\n  if (raw.length < 8) return 'none';\n  const sm = calcEMASeries(raw,5);\n  const last=sm[sm.length-1], prev=sm[sm.length-2], prev2=sm[sm.length-3];\n  if (!last||!prev) return 'none';\n  // 藍柱：最近3根都在50上方，或剛從50下方穿越上方\n  if (last>50 && prev>50) return 'blue';\n  // 紅柱：最近3根都在50下方，或剛從50上方穿越下方\n  if (last<50 && prev<50) return 'red';\n  // 剛交叉\n  if (last>50 && prev<=50) return 'blue';\n  if (last<50 && prev>=50) return 'red';\n  return 'none';\n}\nfunction analyze(closes, minLen=175) {\n  if (closes.length < minLen) return null;\n  const p    = closes[closes.length-1];\n  const e144 = calcEMA(closes,144), e169 = calcEMA(closes,169);\n  const e576 = calcEMA(closes,576), e676 = calcEMA(closes,676);\n  const e12  = calcEMA(closes,12);\n  if (!e144||!e169||!e12) return null;\n\n  // ── 趨勢判斷（賽克斯核心，與分析版同一套）──\n  // 多頭：小通道(144/169)整個在大通道(576/676)上方；空頭：整個在下方。\n  // 兩個通道有重疊＝纏繞，不看；資料不足 676 根＝無法判斷，不猜方向。\n  let trend = 'neutral';\n  if(e576 && e676){\n    const sLo=Math.min(e144,e169), sHi=Math.max(e144,e169), bLo=Math.min(e576,e676), bHi=Math.max(e576,e676);\n    if(sLo > bHi) trend = 'bull';\n    else if(sHi < bLo) trend = 'bear';\n  }\n  const ranging = trend === 'neutral';\n\n  // ── 回踩判斷（賽克斯第一條件）──\n  // 【空頭】：\n  //   一般：價格上漲測試小通道（接觸e144附近），收盤未突破e144（收在e144下方）\n  //   備用：小通道被突破（p > e144）→ 改看大通道，收盤未突破e576\n  //   不進場：大通道也被突破（p > e576）\n  // 【多頭】：\n  //   一般：價格下跌測試小通道（接觸e169附近），收盤未跌破e169（收在e169上方）\n  //   備用：小通道被跌破（p < e169）→ 改看大通道，收盤未跌破e676\n  //   不進場：大通道也被跌破（p < e676）\n\n  let near = false;\n  let usingLargeChannel = false;\n\n  const touchRange = 0.05; // 5% 容差，代表「測試通道附近」\n\n  if(trend === 'bear'){\n    const touchedSmall = p >= e144 * (1-touchRange); // 接觸小通道附近\n    const notBreakSmall = p < e144;                  // 未突破e144（空頭條件一）\n    const touchedLarge  = e576 && p >= e576 * (1-touchRange);\n    const notBreakLarge = e576 && p < e576;\n\n    if(touchedSmall && notBreakSmall){\n      near = true; // 測試小通道，未突破 → 標準空頭進場條件\n    } else if(e576 && p >= e144 && touchedLarge && notBreakLarge){\n      near = true; // 小通道被突破，但未突破大通道 → 備用方案\n      usingLargeChannel = true;\n    }\n    // p > e576 → 大通道也被突破，不進場（near = false）\n\n  } else if(trend === 'bull'){\n    const touchedSmall  = p <= e169 * (1+touchRange);\n    const notBreakSmall = p > e169;\n    const touchedLarge  = e676 && p <= e676 * (1+touchRange);\n    const notBreakLarge = e676 && p > e676;\n\n    if(touchedSmall && notBreakSmall){\n      near = true;\n    } else if(e676 && p <= e169 && touchedLarge && notBreakLarge){\n      near = true;\n      usingLargeChannel = true;\n    }\n    // p < e676 → 大通道也被跌破，不進場\n  }\n\n  const qqe = getQQE(closes);\n  const mid = (e144+e169)/2;\n  const distPct = (Math.abs(p-mid)/p*100).toFixed(2);\n\n  // 建議止損：空頭止損放e144上方，多頭止損放e169下方\n  const slForLong  = e169 ? Math.abs(p-e169)/p*100 : 0;\n  const slForShort = e144 ? Math.abs(e144-p)/p*100 : 0;\n  const suggestedSLpct = trend==='bull' ? slForLong.toFixed(2) : slForShort.toFixed(2);\n\n  const e12p = closes.length>13 ? calcEMA(closes.slice(0,-1),12) : null, pp = closes[closes.length-2];   // 上一根收盤與當時的 EMA12：用來確認「站上後沒有跌回」\n  return { p, e144, e169, e576:e576||null, e676:e676||null, e12,\n    trend, ranging, near, usingLargeChannel, qqe,\n    distPct, aboveFilter:p>e12, belowFilter:p<e12, abovePrev:e12p!=null&&pp>e12p, belowPrev:e12p!=null&&pp<e12p, suggestedSLpct };\n}\n\n// ============================================================\n// 威克特策略（BBAWE + Trader SIX MACD Plus）\n// ============================================================\n\n// 標準差計算\nfunction calcStdDev(data, period){\n  const r = new Array(data.length).fill(null);\n  for(let i=period-1; i<data.length; i++){\n    const slice = data.slice(i-period+1, i+1);\n    const mean = slice.reduce((a,b)=>a+b,0)/period;\n    const variance = slice.reduce((a,b)=>a+(b-mean)**2,0)/period;\n    r[i] = Math.sqrt(variance);\n  }\n  return r;\n}\n\n// 布林帶：中軌(SMA20) ± 2倍標準差\nfunction calcBollinger(closes, period=20, mult=2){\n  const n = closes.length;\n  const sma = new Array(n).fill(null);\n  for(let i=period-1; i<n; i++){\n    sma[i] = closes.slice(i-period+1,i+1).reduce((a,b)=>a+b,0)/period;\n  }\n  const std = calcStdDev(closes, period);\n  const upper = sma.map((m,i)=> m!==null && std[i]!==null ? m+mult*std[i] : null);\n  const lower = sma.map((m,i)=> m!==null && std[i]!==null ? m-mult*std[i] : null);\n  return { mid: sma, upper, lower };\n}\n\n// 判斷布林帶是否處於擠壓區（寬度相對窄）\nfunction isBBSqueeze(upper, lower, mid, idx, lookback=100, threshold=50){\n  if(upper[idx]===null||lower[idx]===null||mid[idx]===null) return true;\n  const width = (upper[idx]-lower[idx])/mid[idx];\n  // 計算過去 lookback 根的寬度分布，取百分位\n  const widths=[];\n  for(let i=Math.max(0,idx-lookback); i<=idx; i++){\n    if(upper[i]!==null&&lower[i]!==null&&mid[i]!==null){\n      widths.push((upper[i]-lower[i])/mid[i]);\n    }\n  }\n  if(widths.length<10) return false;\n  widths.sort((a,b)=>a-b);\n  const rank = widths.filter(w=>w<=width).length / widths.length * 100;\n  return rank < (100-threshold); // 寬度在後 50% (threshold=50) 視為擠壓\n}\n\n// T3 移動平均（MACD Plus 使用 T3 平滑）\nfunction calcT3(data, period, vfactor=0.7){\n  const ema1 = calcEMASeries(data, period);\n  const e1f = ema1.map(v=>v===null?0:v);\n  const ema2 = calcEMASeries(e1f, period);\n  const ema3 = calcEMASeries(ema2.map(v=>v===null?0:v), period);\n  const ema4 = calcEMASeries(ema3.map(v=>v===null?0:v), period);\n  const ema5 = calcEMASeries(ema4.map(v=>v===null?0:v), period);\n  const ema6 = calcEMASeries(ema5.map(v=>v===null?0:v), period);\n  const c1 = -(vfactor**3);\n  const c2 = 3*(vfactor**2) + 3*(vfactor**3);\n  const c3 = -6*(vfactor**2) - 3*vfactor - 3*(vfactor**3);\n  const c4 = 1 + 3*vfactor + (vfactor**3) + 3*(vfactor**2);\n  return ema6.map((v,i)=>{\n    if(ema3[i]===null||ema4[i]===null||ema5[i]===null||v===null) return null;\n    return c1*v + c2*ema5[i] + c3*ema4[i] + c4*ema3[i];\n  });\n}\n\n// Trader SIX MACD Plus：Fast14/Slow28/Signal9, T3平滑\nfunction calcMACDPlus(closes){\n  const fastEMA = calcEMASeries(closes, 14);\n  const slowEMA = calcEMASeries(closes, 28);\n  const macdLine = fastEMA.map((v,i)=> (v!==null&&slowEMA[i]!==null) ? v-slowEMA[i] : null);\n  const macdFilled = macdLine.map(v=>v===null?0:v);\n  const signalLine = calcT3(macdFilled, 9, 0.7);\n  const histogram = macdLine.map((v,i)=> (v!==null&&signalLine[i]!==null) ? v-signalLine[i] : null);\n  return { macdLine, signalLine, histogram };\n}\n\n// 找最近金叉/死叉的位置（回傳距離現在幾根K棒）\nfunction findLastCross(macdLine, signalLine, type){\n  // type: 'golden' 金叉(macd上穿signal) 或 'death' 死叉(macd下穿signal)\n  for(let i=macdLine.length-1; i>0; i--){\n    const cur = macdLine[i], prev = macdLine[i-1];\n    const curS = signalLine[i], prevS = signalLine[i-1];\n    if(cur===null||prev===null||curS===null||prevS===null) continue;\n    if(type==='golden' && prev<=prevS && cur>curS) return macdLine.length-1-i;\n    if(type==='death'  && prev>=prevS && cur<curS) return macdLine.length-1-i;\n  }\n  return null; // 找不到\n}\n\n// 威克特策略主分析函式\nfunction analyzeWicket(candles){\n  // candles 需要 OHLC 格式 {o,h,l,c}\n  if(!candles || candles.length < 50) return null;\n  const closes = candles.map(c=>c.c ?? c);\n  const n = closes.length;\n  const idx = n-1;\n  const p = closes[idx];\n\n  const bb = calcBollinger(closes, 20, 2);\n  if(bb.mid[idx]===null || bb.upper[idx]===null || bb.lower[idx]===null) return null;\n\n  const squeeze = isBBSqueeze(bb.upper, bb.lower, bb.mid, idx);\n\n  const { macdLine, signalLine } = calcMACDPlus(closes);\n\n  // 測試上下軌：前幾根K棒（lookback 10根）有沒有觸及上軌/下軌\n  const lookback = 10;\n  let touchedLower = false, touchedUpper = false;\n  for(let i=Math.max(0,idx-lookback); i<=idx; i++){\n    if(bb.lower[i]!==null && candles[i].l <= bb.lower[i]) touchedLower = true;\n    if(bb.upper[i]!==null && candles[i].h >= bb.upper[i]) touchedUpper = true;\n  }\n\n  // 收盤突破/跌破中軌\n  const aboveMid = p > bb.mid[idx];\n  const belowMid = p < bb.mid[idx];\n  // 前一根是否還在中軌另一側（代表剛突破/跌破，不是已經突破很久）\n  const prevP = closes[idx-1];\n  const justCrossedUp   = prevP <= bb.mid[idx-1] && aboveMid;\n  const justCrossedDown = prevP >= bb.mid[idx-1] && belowMid;\n\n  // 金叉/死叉位置\n  const goldenDist = findLastCross(macdLine, signalLine, 'golden');\n  const deathDist  = findLastCross(macdLine, signalLine, 'death');\n\n  // 多單條件：測試下軌 + 收盤突破中軌 + 金叉在前後5根內 + 非擠壓\n  const longCond = [\n    !squeeze,                                    // ① 非擠壓區\n    touchedLower,                                 // ② 測試下軌\n    aboveMid,                                     // ③ 收盤突破中軌\n    goldenDist!==null && goldenDist<=5            // ④ 金叉在5根K棒內\n  ];\n  // 空單條件：測試上軌 + 收盤跌破中軌 + 死叉在前後5根內 + 非擠壓\n  const shortCond = [\n    !squeeze,\n    touchedUpper,\n    belowMid,\n    deathDist!==null && deathDist<=5\n  ];\n\n  const ls = longCond.filter(Boolean).length;\n  const ss = shortCond.filter(Boolean).length;\n\n  // 止損參考：近期波段高/低點\n  const swingLookback = 15;\n  const recentLows  = candles.slice(Math.max(0,idx-swingLookback), idx+1).map(c=>c.l);\n  const recentHighs = candles.slice(Math.max(0,idx-swingLookback), idx+1).map(c=>c.h);\n  const swingLow  = Math.min(...recentLows);\n  const swingHigh = Math.max(...recentHighs);\n  const slForLong  = Math.abs(p-swingLow)/p*100;\n  const slForShort = Math.abs(swingHigh-p)/p*100;\n\n  return {\n    p, mid: bb.mid[idx], upper: bb.upper[idx], lower: bb.lower[idx],\n    squeeze, touchedLower, touchedUpper, aboveMid, belowMid,\n    goldenDist, deathDist, longCond, shortCond, ls, ss,\n    suggestedSLpct: ls>=ss ? slForLong.toFixed(2) : slForShort.toFixed(2)\n  };\n}\n\n// ============================================================\n// 獵影策略（OBV + 布林帶 + ATR + K棒型態）\n// ============================================================\n\n// OBV 計算\nfunction calcOBV(candles){\n  const n = candles.length;\n  const obv = new Array(n).fill(0);\n  for(let i=1; i<n; i++){\n    const c = candles[i].c, prevC = candles[i-1].c;\n    const v = candles[i].v ?? 0;\n    if(c > prevC) obv[i] = obv[i-1] + v;\n    else if(c < prevC) obv[i] = obv[i-1] - v;\n    else obv[i] = obv[i-1];\n  }\n  return obv;\n}\n\n// OBV 布林帶（用 SMA14 + 2倍標準差，依照講義設定）\nfunction calcOBVBollinger(obv, period=14, mult=2){\n  const sma = new Array(obv.length).fill(null);\n  for(let i=period-1; i<obv.length; i++){\n    sma[i] = obv.slice(i-period+1,i+1).reduce((a,b)=>a+b,0)/period;\n  }\n  const std = calcStdDev(obv, period);\n  const upper = sma.map((m,i)=> m!==null && std[i]!==null ? m+mult*std[i] : null);\n  const lower = sma.map((m,i)=> m!==null && std[i]!==null ? m-mult*std[i] : null);\n  return { mid: sma, upper, lower };\n}\n\n// ATR 計算\nfunction calcATR(candles, period=14){\n  const n = candles.length;\n  const tr = new Array(n).fill(null);\n  for(let i=1; i<n; i++){\n    const h=candles[i].h, l=candles[i].l, pc=candles[i-1].c;\n    tr[i] = Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc));\n  }\n  const atr = new Array(n).fill(null);\n  // Wilder's smoothing\n  let sum=0, cnt=0;\n  for(let i=1; i<=period && i<n; i++){ sum+=tr[i]; cnt++; }\n  if(cnt>0) atr[period] = sum/cnt;\n  for(let i=period+1; i<n; i++){\n    if(atr[i-1]===null||tr[i]===null) continue;\n    atr[i] = (atr[i-1]*(period-1) + tr[i]) / period;\n  }\n  return atr;\n}\n\n// K棒型態判斷：十字星 / 實體吞沒 / 影線吞沒\nfunction detectCandlePattern(candles, idx){\n  if(idx < 1) return null;\n  const cur = candles[idx], prev = candles[idx-1];\n  const body = Math.abs(cur.c - cur.o);\n  const range = cur.h - cur.l;\n  const bodyPct = range>0 ? body/cur.o*100 : 0; // 實體佔開盤價的百分比\n\n  // ① 十字星：上下都有影線，實體在0.05%以內\n  const hasUpperShadow = (cur.h - Math.max(cur.o,cur.c)) > 0;\n  const hasLowerShadow = (Math.min(cur.o,cur.c) - cur.l) > 0;\n  if(hasUpperShadow && hasLowerShadow && bodyPct <= 0.05){\n    return { type:'doji', name:'十字星' };\n  }\n\n  // ② 實體吞沒：當前K棒實體完全包覆前一根實體\n  const curBodyTop = Math.max(cur.o,cur.c), curBodyBot = Math.min(cur.o,cur.c);\n  const prevBodyTop = Math.max(prev.o,prev.c), prevBodyBot = Math.min(prev.o,prev.c);\n  if(curBodyTop > prevBodyTop && curBodyBot < prevBodyBot){\n    return { type:'engulf', name:'實體吞沒', bullish: cur.c>cur.o };\n  }\n\n  // ③ 影線吞沒：當前K棒影線範圍(高低點)超出前一根的影線範圍\n  if(cur.h > prev.h && cur.l < prev.l){\n    return { type:'wick_engulf', name:'影線吞沒' };\n  }\n\n  return null;\n}\n\n// 獵影策略主分析函式\nfunction analyzeHunter(candles){\n  if(!candles || candles.length < 30) return null;\n  const n = candles.length;\n  const idx = n-1;\n  const p = candles[idx].c;\n\n  const obv = calcOBV(candles);\n  const obvBB = calcOBVBollinger(obv, 14, 2);\n  const atr = calcATR(candles, 14);\n\n  if(obvBB.upper[idx]===null || obvBB.lower[idx]===null) return null;\n\n  // ── 判斷是否為盤整行情（OBV在MA上下來回觸碰布林帶）──\n  // 用過去20根檢查OBV是否曾經觸碰上下軌（代表來回震盪而非單邊持續超出）\n  const lookback = 20;\n  let touchedUpperRecent = false, touchedLowerRecent = false, staysOutside = 0;\n  for(let i=Math.max(0,idx-lookback); i<=idx; i++){\n    if(obvBB.upper[i]===null) continue;\n    if(obv[i] >= obvBB.upper[i]) touchedUpperRecent = true;\n    if(obv[i] <= obvBB.lower[i]) touchedLowerRecent = true;\n  }\n  const isRangingMarket = touchedUpperRecent && touchedLowerRecent; // 上下都觸碰過 = 盤整\n\n  // ── 必要條件：OBV突破布林帶，之後（1~3根內）OBV回到通道內 ──\n  // 放寬到前3根內有突破訊號，當前這根已回到通道內\n  let triggeredLong = false, triggeredShort = false;\n  const curInsideChannel = obvBB.upper[idx]!==null\n    && obv[idx] <= obvBB.upper[idx]\n    && obv[idx] >= obvBB.lower[idx];\n\n  if(curInsideChannel){\n    // 往前3根內找有沒有突破訊號\n    for(let back=1; back<=3; back++){\n      const bi = idx-back;\n      if(bi<0 || obvBB.upper[bi]===null) continue;\n      if(obv[bi] < obvBB.lower[bi]) { triggeredLong = true; break; }  // 突破下軌後回通道 = 做多\n      if(obv[bi] > obvBB.upper[bi]) { triggeredShort = true; break; } // 突破上軌後回通道 = 做空\n    }\n  }\n\n  // ── 次要條件：K棒型態（三選一，也可以看前2根）──\n  // 型態可以在觸發當根或前一根出現\n  let pattern = detectCandlePattern(candles, idx);\n  if(!pattern && idx>=1) pattern = detectCandlePattern(candles, idx-1);\n\n  const longCond = [\n    isRangingMarket,           // ① 盤整行情（OBV上下觸碰布林帶）\n    triggeredLong,             // ② OBV突破下軌後回到通道內（必要條件）\n    pattern !== null,          // ③ 出現三種型態之一\n    pattern?.type!=='engulf' || pattern?.bullish===true // ④ 若是吞沒型態，方向需正確（看漲）\n  ];\n  const shortCond = [\n    isRangingMarket,\n    triggeredShort,\n    pattern !== null,\n    pattern?.type!=='engulf' || pattern?.bullish===false\n  ];\n\n  const ls = longCond.filter(Boolean).length;\n  const ss = shortCond.filter(Boolean).length;\n\n  // 止損：用 ATR 帶\n  const atrVal = atr[idx] || (p*0.01); // 沒有ATR時用1%價格備用\n  const slForLong  = atrVal/p*100;\n  const slForShort = atrVal/p*100;\n\n  return {\n    p, obv: obv[idx], obvUpper: obvBB.upper[idx], obvLower: obvBB.lower[idx],\n    isRangingMarket, triggeredLong, triggeredShort, pattern,\n    longCond, shortCond, ls, ss, atr: atrVal,\n    suggestedSLpct: ls>=ss ? slForLong.toFixed(2) : slForShort.toFixed(2)\n  };\n}\n\n// ============================================================\n// 13333法則（首K突破回測延續）\n// 1個首K區間 / 3大時段 / 3次機會 / 3步驟(突破→回測→延續) / 3方向\n// 首K = 台灣時間 06:00~07:00；時段依美國夏令/冬令自動切換\n// ============================================================\nfunction tkIsUSDST(ms){\n  const y=new Date(ms).getUTCFullYear();\n  const nthSun=(m,n)=>{ let c=0; for(let d=1;d<=31;d++){ const x=new Date(Date.UTC(y,m,d,7)); if(x.getUTCMonth()!==m)break; if(x.getUTCDay()===0 && ++c===n) return x.getTime(); } return 0; };\n  return ms>=nthSun(2,2) && ms<nthSun(10,1);\n}\nfunction tkInWin(min,s,e){ return s<=e ? (min>=s && min<e) : (min>=s || min<e); }\nfunction tkSession(min, summer){\n  if(tkInWin(min,420,780)) return '亞盤';                                   // 07:00~13:00\n  if(tkInWin(min, summer?1290:1350, summer?240:300)) return '美盤';          // 夏 21:30~04:00 / 冬 22:30~05:00\n  if(tkInWin(min, summer?900:960, summer?1410:30)) return '歐盤';            // 夏 15:00~23:30 / 冬 16:00~00:30\n  return null;\n}\nfunction analyze13333(candles, tfMin){\n  if(!candles || candles.length<20) return null;\n  const n=candles.length, last=candles[n-1], p=last.c;\n  const H=3600000, DAY=86400000;\n  const sh=t=>t+2*H;                       // 台灣時間 -6h：06:00 變成當日 00:00\n  const refDay=Math.floor(sh(last.t)/DAY); // 目前所屬的「13333交易日」\n  const need=Math.round(60/tfMin);\n  const fk=[], post=[];\n  candles.forEach((c,i)=>{\n    const s=sh(c.t);\n    if(Math.floor(s/DAY)!==refDay) return;\n    const mf=(s%DAY)/60000;\n    if(mf<60) fk.push(c); else post.push({c,i});\n  });\n  if(fk.length<need || !post.length) return null; // 首K尚未完成\n  const rH=Math.max(...fk.map(c=>c.h)), rL=Math.min(...fk.map(c=>c.l));\n  const rangeSize=rH-rL;\n  const summer=tkIsUSDST(last.t);\n  const twMin=Math.floor(((last.t+8*H)%DAY)/60000);\n  const session=tkSession(twMin,summer);\n\n  // 狀態機：0等突破 1已突破等回測 2已回測等延續 3延續確認（依13333 PDF規則）\n  const atrArr=calcATR(candles,14);\n  const atr=(atrArr && atrArr[n-1]) || p*0.002;\n  const tol=0.1*atr;                       // 回測容許誤差 0.1 ATR\n  const run=(dir)=>{\n    const level = dir==='long' ? rH : rL;\n    let st=0, ext=null, sigIdx=-1, sigSess=null, opps=0, cnt=0, dead=false;\n    const used=new Set();                  // 每時段最多進場1次\n    for(const {c,i} of post){\n      const sess=tkSession(Math.floor(((c.t+8*H)%DAY)/60000), summer);\n      const brk    = dir==='long' ? c.c>level : c.c<level;\n      const failed = dir==='long' ? c.c<level : c.c>level;   // 收盤回到區間內 = 假突破\n      const touch  = dir==='long' ? c.l<=level+tol : c.h>=level-tol;\n      if(failed){ st=0; ext=null; dead=false; cnt=0; continue; }\n      if(st===3){ if(sess && sess!==sigSess){ st=1; cnt=0; ext=null; } else continue; }\n      if(st===0){ if(brk && !dead){ st=1; cnt=0; } continue; }\n      if(st===1){\n        cnt++;\n        if(touch){ st=2; ext={h:c.h,l:c.l}; cnt=0; }\n        else if(cnt>=12){ st=0; dead=true; }            // 突破後12根內沒回測 → 放棄\n      } else if(st===2){\n        cnt++;\n        const cont = dir==='long' ? c.c>ext.h : c.c<ext.l;\n        if(cont && sess && !used.has(sess)){\n          st=3; sigIdx=i; sigSess=sess; used.add(sess); opps++;\n        } else if(touch){ ext={h:c.h,l:c.l}; cnt=0; }   // 重新回測，更新回測K\n        else if(cnt>=3){ st=1; cnt=0; ext=null; }        // 回測後3根內沒延續 → 等下一次回測\n      }\n    }\n    if(st===3 && n-1-sigIdx>2) st=-1;  // 訊號已過時\n    return {st,ext,opps};\n  };\n  const L=run('long'), S=run('short');\n  const inSess = session!==null;\n  const longCond  = [L.st>=1, L.st>=2, L.st>=3, inSess];\n  const shortCond = [S.st>=1, S.st>=2, S.st>=3, inSess];\n  const slL = L.ext ? Math.max((p-(L.ext.l-tol))/p*100,0.05) : Math.max(Math.abs(p-rL)/p*100,0.05);  // 回測K低點 - 0.1ATR\n  const slS = S.ext ? Math.max(((S.ext.h+tol)-p)/p*100,0.05) : Math.max(Math.abs(rH-p)/p*100,0.05);  // 回測K高點 + 0.1ATR\n  const ls=longCond.filter(Boolean).length, ss=shortCond.filter(Boolean).length;\n  return {p, rangeHigh:rH, rangeLow:rL, summer, session, longCond, shortCond, ls, ss,\n          opps:Math.min(3,L.opps+S.opps), slL, slS,\n          suggestedSLpct:(ls>=ss?slL:slS).toFixed(2)};\n}\n\n// 找近期波段高低點（ZigZag 簡化版）\nfunction findSwings(candles, lookback=5){\n  const highs=[], lows=[];\n  for(let i=lookback; i<candles.length-lookback; i++){\n    const h=candles[i].h ?? candles[i]; // 支援 OHLC 或只有收盤\n    const l=candles[i].l ?? candles[i];\n    const isHigh = [...Array(lookback)].every((_,j)=>(candles[i-j-1].h??candles[i-j-1])<=h && (candles[i+j+1].h??candles[i+j+1])<=h);\n    const isLow  = [...Array(lookback)].every((_,j)=>(candles[i-j-1].l??candles[i-j-1])>=l && (candles[i+j+1].l??candles[i+j+1])>=l);\n    if(isHigh) highs.push({i, v:h});\n    if(isLow)  lows.push({i, v:l});\n  }\n  return {highs, lows};\n}\n\n// ============================================================\n// 海神指標 2.0 策略（TuTCI 通道突破 + 市場結構轉換 MSS）\n// ============================================================\n\n// TuTCI（Turtle Trade Channel）：Entry Length 10 / Exit Length 5\n// upperEntry/lowerEntry：過去 entryLen 根（不含當根）最高/最低 → 突破通道視為進場訊號\n// upperExit/lowerExit：過去 exitLen 根（不含當根）最高/最低 → 作為停損／出場參考線\nfunction calcTuTCI(candles, entryLen=10, exitLen=5){\n  const n = candles.length;\n  const upperEntry=new Array(n).fill(null), lowerEntry=new Array(n).fill(null);\n  const upperExit=new Array(n).fill(null), lowerExit=new Array(n).fill(null);\n  for(let i=entryLen; i<n; i++){\n    const slice = candles.slice(i-entryLen, i); // 不含當根 i\n    upperEntry[i] = Math.max(...slice.map(c=>c.h));\n    lowerEntry[i] = Math.min(...slice.map(c=>c.l));\n  }\n  for(let i=exitLen; i<n; i++){\n    const slice = candles.slice(i-exitLen, i);\n    upperExit[i] = Math.max(...slice.map(c=>c.h));\n    lowerExit[i] = Math.min(...slice.map(c=>c.l));\n  }\n  return { upperEntry, lowerEntry, upperExit, lowerExit };\n}\n\n// 市場結構轉換（MSS）：比較最近兩個高點(HH/LH)與最近兩個低點(HL/LL)\n// structureBearish：LH + LL（空頭結構）→ 若價格收盤突破最近一個 LH，視為 MSS 轉多\n// structureBullish：HH + HL（多頭結構）→ 若價格收盤跌破最近一個 HL，視為 MSS 轉空\nfunction analyzeMSS(candles, idx){\n  const { highs, lows } = findSwings(candles.slice(0, Math.max(idx-1,1)), 3); // 只用已確認（收盤已知）的擺盪點\n  if(highs.length<2 || lows.length<2) return { mssLong:false, mssShort:false, structure:'unknown' };\n\n  const h2 = highs[highs.length-1], h1 = highs[highs.length-2];\n  const l2 = lows[lows.length-1],  l1 = lows[lows.length-2];\n  const close = candles[idx].c;\n\n  const structureBearish = h2.v < h1.v && l2.v < l1.v; // LH + LL\n  const structureBullish = h2.v > h1.v && l2.v > l1.v; // HH + HL\n\n  const mssLong  = structureBearish && close > h2.v;   // 空頭結構被突破 → 轉多\n  const mssShort = structureBullish && close < l2.v;   // 多頭結構被跌破 → 轉空\n\n  return {\n    mssLong, mssShort,\n    structure: structureBullish?'bullish':structureBearish?'bearish':'transition',\n    lastSwingHigh:h2.v, lastSwingLow:l2.v\n  };\n}\n\n// 海神策略主分析函式\nfunction analyzeHaishen(candles, entryLen=10, exitLen=5){\n  if(!candles || candles.length < entryLen+20) return null;\n  const n = candles.length;\n  const idx = n-1;\n  const p = candles[idx].c;\n\n  const { upperEntry, lowerEntry, upperExit, lowerExit } = calcTuTCI(candles, entryLen, exitLen);\n  if(upperEntry[idx]===null || lowerEntry[idx]===null) return null;\n\n  // ── 單邊 vs 盤整判斷（依海神觀點：近30根振幅 ≥5% 視為單邊行情）──\n  const lookback = Math.min(30, idx);\n  const recent = candles.slice(idx-lookback, idx+1);\n  const hi = Math.max(...recent.map(c=>c.h)), lo = Math.min(...recent.map(c=>c.l));\n  const rangePct = (hi-lo)/lo*100;\n  const singleSided = rangePct >= 5;\n\n  // ── TuTCI 通道突破（Long Entry / Short Entry）──\n  const longBreak  = candles[idx].h > upperEntry[idx];\n  const shortBreak = candles[idx].l < lowerEntry[idx];\n\n  // ── 通道中心作為簡易趨勢方向（供 4H 大趨勢判斷用）──\n  const mid = (upperEntry[idx]+lowerEntry[idx])/2;\n  const trend = p > mid ? 'bull' : p < mid ? 'bear' : 'neutral';\n\n  // ── 結構轉換 MSS ──\n  const mss = analyzeMSS(candles, idx);\n\n  // ── 止損：對應 TuTCI 出場通道（5根）反向邊界，即教材所述之「紅線」防守點 ──\n  const slForLong  = lowerExit[idx]!==null ? Math.abs(p-lowerExit[idx])/p*100 : 1;\n  const slForShort = upperExit[idx]!==null ? Math.abs(upperExit[idx]-p)/p*100 : 1;\n\n  return {\n    p, upperEntry:upperEntry[idx], lowerEntry:lowerEntry[idx],\n    upperExit:upperExit[idx], lowerExit:lowerExit[idx],\n    rangePct:rangePct.toFixed(2), singleSided, longBreak, shortBreak, trend,\n    mssLong:mss.mssLong, mssShort:mss.mssShort, structure:mss.structure,\n    slForLong:slForLong.toFixed(2), slForShort:slForShort.toFixed(2)\n  };\n}\n\n// 只用收盤價陣列做簡化型態偵測\nfunction detectPatterns(closes, dir){\n  const n = closes.length;\n  if(n < 20) return [];\n  const patterns = [];\n  const recent = closes.slice(-30); // 只看最近30根\n  const rn = recent.length;\n\n  // ── K棒型態 ── (最後3根)\n  const c0=recent[rn-1], c1=recent[rn-2], c2=recent[rn-3]; // c0最新\n\n  // 早晨之星（看多）\n  if(dir==='long'){\n    const body1=Math.abs(c2-recent[rn-4]); // 第一根大陰線\n    const body2=Math.abs(c1-recent[rn-2]); // 中間小實體\n    const body3=Math.abs(c0-c1);           // 第三根大陽線\n    if(c2<recent[rn-4] && body2<body1*0.3 && c0>recent[rn-4]+(body1*0.5)){\n      patterns.push({name:'早晨之星', type:'bull', strength:2});\n    }\n    // 錘子線\n    const bodyLen=Math.abs(c0-recent[rn-2]);\n    const low=Math.min(c0,recent[rn-2]);\n    const high=Math.max(c0,recent[rn-2]);\n    const lowerShadow=low-Math.min(...recent.slice(-5));\n    if(lowerShadow>bodyLen*2 && c0>recent[rn-2]) patterns.push({name:'錘子線',type:'bull',strength:1});\n  }\n\n  // 黃昏之星（看空）\n  if(dir==='short'){\n    const body1=Math.abs(c2-recent[rn-4]);\n    const body2=Math.abs(c1-recent[rn-2]);\n    if(c2>recent[rn-4] && body2<body1*0.3 && c0<recent[rn-4]-(body1*0.5)){\n      patterns.push({name:'黃昏之星', type:'bear', strength:2});\n    }\n    // 射擊之星\n    const bodyLen=Math.abs(c0-recent[rn-2]);\n    const upperShadow=Math.max(...recent.slice(-5))-Math.max(c0,recent[rn-2]);\n    if(upperShadow>bodyLen*2 && c0<recent[rn-2]) patterns.push({name:'射擊之星',type:'bear',strength:1});\n  }\n\n  // ── 價格結構型態 ──\n  const highs=[], lows=[];\n  for(let i=2; i<recent.length-2; i++){\n    if(recent[i]>=recent[i-1]&&recent[i]>=recent[i-2]&&recent[i]>=recent[i+1]&&recent[i]>=recent[i+2]) highs.push({i,v:recent[i]});\n    if(recent[i]<=recent[i-1]&&recent[i]<=recent[i-2]&&recent[i]<=recent[i+1]&&recent[i]<=recent[i+2]) lows.push({i,v:recent[i]});\n  }\n\n  if(lows.length>=2 && dir==='long'){\n    const l1=lows[lows.length-2], l2=lows[lows.length-1];\n    const priceTol=l1.v*0.012; // 1.2% 容差\n    // W底\n    if(Math.abs(l1.v-l2.v)<priceTol && l2.i>l1.i+3){\n      patterns.push({name:'W底', type:'bull', strength:3});\n    }\n    // 平頭底\n    if(Math.abs(l1.v-l2.v)<priceTol*0.5){\n      patterns.push({name:'平頭底', type:'bull', strength:2});\n    }\n    // 123法則（低點擡高）\n    if(lows.length>=3){\n      const l0=lows[lows.length-3];\n      if(l1.v<l0.v && l2.v>l1.v*1.005) patterns.push({name:'123多頭', type:'bull', strength:2});\n    }\n    // 頭肩底\n    if(lows.length>=3){\n      const ls=lows[lows.length-3], lh=lows[lows.length-2], lr=lows[lows.length-1];\n      if(lh.v<ls.v && lh.v<lr.v && Math.abs(ls.v-lr.v)<ls.v*0.025)\n        patterns.push({name:'頭肩底', type:'bull', strength:3});\n    }\n  }\n\n  if(highs.length>=2 && dir==='short'){\n    const h1=highs[highs.length-2], h2=highs[highs.length-1];\n    const priceTol=h1.v*0.012;\n    // M頂\n    if(Math.abs(h1.v-h2.v)<priceTol && h2.i>h1.i+3){\n      patterns.push({name:'M頂', type:'bear', strength:3});\n    }\n    // 平頭頂\n    if(Math.abs(h1.v-h2.v)<priceTol*0.5){\n      patterns.push({name:'平頭頂', type:'bear', strength:2});\n    }\n    // 123法則（高點降低）\n    if(highs.length>=3){\n      const h0=highs[highs.length-3];\n      if(h1.v>h0.v && h2.v<h1.v*0.995) patterns.push({name:'123空頭', type:'bear', strength:2});\n    }\n    // 頭肩頂\n    if(highs.length>=3){\n      const hs=highs[highs.length-3], hh=highs[highs.length-2], hr=highs[highs.length-1];\n      if(hh.v>hs.v && hh.v>hr.v && Math.abs(hs.v-hr.v)<hs.v*0.025)\n        patterns.push({name:'頭肩頂', type:'bear', strength:3});\n    }\n  }\n\n  // ── 整理型態 ──\n  if(highs.length>=3 && lows.length>=3){\n    const recentHighs=highs.slice(-3), recentLows=lows.slice(-3);\n    const highTrend=(recentHighs[2].v-recentHighs[0].v)/recentHighs[0].v;\n    const lowTrend=(recentLows[2].v-recentLows[0].v)/recentLows[0].v;\n    // 對稱三角形\n    if(highTrend<-0.01 && lowTrend>0.01)\n      patterns.push({name:'對稱三角', type:'neutral', strength:1});\n    // 牛旗（下降通道後）\n    if(dir==='long' && highTrend<-0.005 && lowTrend<-0.005 && Math.abs(highTrend-lowTrend)<0.01)\n      patterns.push({name:'牛旗', type:'bull', strength:2});\n    // 熊旗\n    if(dir==='short' && highTrend>0.005 && lowTrend>0.005 && Math.abs(highTrend-lowTrend)<0.01)\n      patterns.push({name:'熊旗', type:'bear', strength:2});\n  }\n\n  // ── 支撐壓力 ──\n  const currentPrice=closes[n-1];\n  const sr=findSupportResistance(closes.slice(-60));\n  sr.supports.forEach(s=>{\n    if(Math.abs(currentPrice-s)/currentPrice<0.015 && dir==='long')\n      patterns.push({name:'靠近支撐', type:'bull', strength:1});\n  });\n  sr.resistances.forEach(r=>{\n    if(Math.abs(r-currentPrice)/currentPrice<0.015 && dir==='short')\n      patterns.push({name:'靠近壓力', type:'bear', strength:1});\n  });\n\n  // 去重，保留最高分\n  const seen={};\n  return patterns.filter(p=>{ if(seen[p.name]) return false; seen[p.name]=true; return true; })\n    .sort((a,b)=>b.strength-a.strength);\n}\n\nfunction findSupportResistance(closes){\n  const supports=[], resistances=[];\n  for(let i=2; i<closes.length-2; i++){\n    if(closes[i]<=closes[i-1]&&closes[i]<=closes[i-2]&&closes[i]<=closes[i+1]&&closes[i]<=closes[i+2])\n      supports.push(closes[i]);\n    if(closes[i]>=closes[i-1]&&closes[i]>=closes[i-2]&&closes[i]>=closes[i+1]&&closes[i]>=closes[i+2])\n      resistances.push(closes[i]);\n  }\n  return {supports, resistances};\n}\n\nfunction patternBadge(p){\n  const col = p.type==='bull'?'var(--bull)':p.type==='bear'?'var(--bear)':'var(--range)';\n  const bg  = p.type==='bull'?'rgba(0,229,160,.12)':p.type==='bear'?'rgba(255,77,109,.12)':'rgba(245,158,11,.12)';\n  const stars='★'.repeat(p.strength)+'☆'.repeat(3-Math.min(p.strength,3));\n  return `<span style=\"display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;background:${bg};color:${col};border:1px solid ${col};white-space:nowrap\">${p.name} ${stars}<\/span>`;\n}\nfunction getBias(a) {\n  if (!a) return 'neutral';\n  if (a.ranging) return 'range';     // 纏繞或資料不足：不表態\n  return a.trend === 'bull' ? 'bull' : 'bear';\n}\n\nfunction biasLabel(b) {\n  if (b==='bull')    return '<span class=\"badge bbull\">偏多 ▲<\/span>';\n  if (b==='bear')    return '<span class=\"badge bbear\">偏空 ▼<\/span>';\n  if (b==='range')   return '<span class=\"badge brange\">盤整 ↔<\/span>';\n  return '<span class=\"badge\" style=\"background:rgba(90,122,144,.15);color:var(--dim)\">無訊號<\/span>';\n}\n\nfunction verdictClass(b) {\n  if (b==='bull') return 'verdict-bull';\n  if (b==='bear') return 'verdict-bear';\n  if (b==='range') return 'verdict-range';\n  return 'verdict-neutral';\n}\n\n// ============================================================\n// UI HELPERS\n// ============================================================\nlet filterMode='all', tfFilter='both', biasFilter='any', slCapOn=true;\nlet scanData=[], scanning=false;\nlet activeStrategy='saxis'; // 'saxis' 或 'wicket'\n\nfunction setStrategy(s){\n  activeStrategy = s;\n  const sb = document.getElementById('stratSaxis');\n  const wb = document.getElementById('stratWicket');\n  const hb = document.getElementById('stratHunter');\n  const pb = document.getElementById('stratPoseidon');\n  const tb = document.getElementById('strat13333');\n  const desc = document.getElementById('strategyDesc');\n  [sb,wb,hb,pb,tb].forEach(b=>b.className='btn-o');\n  if(s==='saxis'){\n    sb.className='btn-o on';\n    desc.textContent='日線+4H偏見→15M~1H 回踩→過濾線→QQE 紅/藍柱';\n  } else if(s==='wicket'){\n    wb.className='btn-o on';\n    desc.textContent='布林帶測試上下軌→突破中軌→MACD金叉/死叉(5根內)';\n  } else if(s==='hunter'){\n    hb.className='btn-o on';\n    desc.textContent='OBV突破布林帶→下根K回到通道內→十字星/實體吞沒/影線吞沒';\n  } else if(s==='poseidon'){\n    pb.className='btn-o on';\n    desc.textContent='4H單邊行情定方向→15M~1H TuTCI(10/5)通道突破→與大趨勢同向→結構轉換(MSS)確認';\n  } else if(s==='13333'){\n    tb.className='btn-o on';\n    desc.textContent='15M｜首K(台灣06:00~07:00)區間→收盤突破→回測(±0.1ATR)不破→延續確認，限亞/歐/美三大時段、每時段1次';\n  }\n\n  // 切換策略時清空所有掃描結果和計數器\n  scanData = [];\n  document.getElementById('scanList').innerHTML=\n    `<div class=\"empty\"><div class=\"empty-icon\">📡<\/div><p>已切換策略，請重新掃描<\/p><\/div>`;\n  ['mTotal','mFiltered','m15L','m15S','m30L','m30S','m1hL','m1hS','mRange'].forEach(id=>{\n    const el=document.getElementById(id); if(el) el.textContent='—';\n  });\n  document.getElementById('pfill').style.width='0%';\n  document.getElementById('ptext').textContent='';\n  toast(`已切換至 ${s==='saxis'?'賽克斯':s==='wicket'?'威克特':s==='hunter'?'獵影':s==='13333'?'13333法則':'海神'} 策略，請重新掃描`);\n}\nlet chatHistory=[];\nlet biasCacheMap = {};  // sym -> {W,D,H4}\n\nfunction switchTab(t,btn){\n  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));\n  document.getElementById('panel-'+t).classList.add('active');\n  btn.classList.add('active');\n  if(t==='data') loadData();\n  if(t==='macro') macRender();\n  if(t==='poseidon'){ hsUpdateSessionAdvice(); hsUpdateChecklist(); hsCalcLev(); }\n}\n\n// ── 海神指標 2.0 策略面板 ──\nfunction hsUpdateSessionAdvice(){\n  const el=document.getElementById('hsSessionAdvice');\n  if(!el) return;\n  const v=document.getElementById('hsTrend4H').value;\n  if(v==='bull'){\n    el.innerHTML='4H 為<strong style=\"color:var(--bull)\">多頭趨勢<\/strong> → 切回 1H，只找「多頭訊號（Long Entry）」進場；出現空頭訊號直接忽略，不逆勢操作。';\n  } else if(v==='bear'){\n    el.innerHTML='4H 為<strong style=\"color:var(--bear)\">空頭趨勢<\/strong> → 切回 1H，專注尋找「空頭訊號（Short Entry）」；即使 1H 出現多頭訊號，也選擇不進場。';\n  } else {\n    el.innerHTML='4H <strong style=\"color:var(--range)\">方向不明（盤整）<\/strong> → 海神訊號減弱，建議降低倉位或暫時觀望，等待漲跌幅突破 5% 形成明確單邊行情再進場。';\n  }\n}\n\nfunction hsUpdateChecklist(){\n  const el=document.getElementById('hsVerdict');\n  if(!el) return;\n  const c1=document.getElementById('hsChk1').checked;\n  const c2=document.getElementById('hsChk2').checked;\n  const c3=document.getElementById('hsChk3').checked;\n  const c4=document.getElementById('hsChk4').checked;\n  const c5=document.getElementById('hsChk5').checked;\n  const total=[c1,c2,c3,c4,c5].filter(Boolean).length;\n\n  if(!c2){\n    el.innerHTML='<span style=\"color:var(--bear);font-weight:700\">❌ 不建議進場<\/span> — 結構尚未反轉（無 MSS 確認），依海神教材原則，沒有結構反轉就不要跟訊號進場，避免做在盤整或回檔中段。';\n  } else if(total===5){\n    el.innerHTML='<span style=\"color:var(--bull);font-weight:700\">✅ 可考慮進場<\/span> — 五項條件皆已確認，可依規劃的分倉與止損紅線市價進場。';\n  } else {\n    el.innerHTML=`<span style=\"color:var(--range);font-weight:700\">⚠️ 條件未齊（${total}/5）<\/span> — 建議先補齊其餘檢查項目，尤其確認風報比與分倉規劃後再進場。`;\n  }\n}\n\nfunction hsCalcLev(){\n  const pct=parseFloat(document.getElementById('hsSLpct').value)||0;\n  const maxEl=document.getElementById('hsLevMax');\n  const safeEl=document.getElementById('hsLevSafe');\n  if(!pct){ maxEl.textContent='—'; safeEl.textContent='—'; return; }\n  maxEl.textContent=(100/pct).toFixed(1)+' 倍';\n  safeEl.textContent=(50/pct).toFixed(1)+' 倍';\n}\n\nfunction hsGotoCalc(){\n  const pct=document.getElementById('hsSLpct').value;\n  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));\n  document.getElementById('panel-calc').classList.add('active');\n  document.querySelectorAll('.nb').forEach(b=>{ if(b.textContent.includes('倉位計算')) b.classList.add('active'); });\n  const slInput=document.getElementById('cSLpct');\n  if(slInput && pct){ slInput.value=pct; if(typeof calcRisk==='function') calcRisk(); }\n}\n\n// ── 策略手冊：分頁切換 ──\nfunction setDocStrategy(s, btn){\n  document.querySelectorAll('.doc-strat-btn').forEach(b=>b.classList.remove('on'));\n  btn.classList.add('on');\n  document.querySelectorAll('.doc-section').forEach(d=>d.style.display='none');\n  const target=document.getElementById('doc-'+s);\n  if(target) target.style.display='block';\n\n  if(s==='poseidon'){ hsUpdateSessionAdvice(); hsUpdateChecklist(); hsCalcLev(); }\n  else if(s==='saxis'){ docChecklistUpdate('sx',true); docCalcLev('sx'); }\n  else if(s==='wicket'){ docChecklistUpdate('wk',false); docCalcLev('wk'); }\n  else if(s==='hunter'){ docChecklistUpdate('ht',false); docCalcLev('ht'); }\n  else if(s==='13333'){ docChecklistUpdate('tk',false); docCalcLev('tk'); }\n}\n\n// ── 賽克斯/威克特/獵影 共用：進場檢查清單判定 ──\n// bonusLast=true：第4項為加分項（前3項必要，比照賽克斯掃描邏輯）\n// bonusLast=false：4項皆為必要條件（比照威克特/獵影掃描邏輯）\nfunction docChecklistUpdate(prefix, bonusLast){\n  const boxes=[1,2,3,4].map(i=>document.getElementById(prefix+'Chk'+i));\n  if(boxes.some(x=>!x)) return;\n  const vals=boxes.map(x=>x.checked);\n  const el=document.getElementById(prefix+'Verdict');\n  if(!el) return;\n  const total=vals.filter(Boolean).length;\n\n  if(bonusLast){\n    const requiredOk = vals[0] && vals[1] && vals[2];\n    if(requiredOk && vals[3]){\n      el.innerHTML='<span style=\"color:var(--bull);font-weight:700\">✅ 可進場（含加分項確認，訊號更強）<\/span>';\n    } else if(requiredOk){\n      el.innerHTML='<span style=\"color:var(--bull);font-weight:700\">✅ 可進場<\/span> — 必要條件已滿足，加分項未出現訊號強度略低。';\n    } else {\n      el.innerHTML=`<span style=\"color:var(--range);font-weight:700\">⚠️ 必要條件未齊（${total}/4）<\/span> — 建議先觀望。`;\n    }\n  } else {\n    if(total===4){\n      el.innerHTML='<span style=\"color:var(--bull);font-weight:700\">✅ 可考慮進場<\/span> — 四項條件皆已確認。';\n    } else {\n      el.innerHTML=`<span style=\"color:var(--range);font-weight:700\">⚠️ 條件未齊（${total}/4）<\/span> — 建議先補齊其餘檢查項目再進場。`;\n    }\n  }\n}\n\n// ── 賽克斯/威克特/獵影 共用：槓桿速查 ──\nfunction docCalcLev(prefix){\n  const pct=parseFloat(document.getElementById(prefix+'SLpct').value)||0;\n  const maxEl=document.getElementById(prefix+'LevMax');\n  const safeEl=document.getElementById(prefix+'LevSafe');\n  if(!maxEl || !safeEl) return;\n  if(!pct){ maxEl.textContent='—'; safeEl.textContent='—'; return; }\n  maxEl.textContent=(100/pct).toFixed(1)+' 倍';\n  safeEl.textContent=(50/pct).toFixed(1)+' 倍';\n}\n\n// ── 賽克斯/威克特/獵影 共用：前往倉位計算 ──\nfunction docGotoCalc(prefix){\n  const pctInput=document.getElementById(prefix+'SLpct');\n  const pct=pctInput?pctInput.value:null;\n  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));\n  document.getElementById('panel-calc').classList.add('active');\n  document.querySelectorAll('.nb').forEach(b=>{ if(b.textContent.includes('倉位計算')) b.classList.add('active'); });\n  const slInput=document.getElementById('cSLpct');\n  if(slInput && pct){ slInput.value=pct; if(typeof calcRisk==='function') calcRisk(); }\n}\n\nfunction toast(msg,dur=3000){\n  const el=document.getElementById('toast');\n  el.textContent=msg; el.classList.add('show');\n  setTimeout(()=>el.classList.remove('show'),dur);\n}\nfunction fmtP(p){\n  if(p>=10000)return p.toFixed(0);\n  if(p>=100)return p.toFixed(1);\n  if(p>=1)return p.toFixed(3);\n  if(p>=0.01)return p.toFixed(4);\n  return p.toFixed(6);\n}\nfunction fmtV(v){\n  if(v>=1e9)return(v/1e9).toFixed(1)+'B';\n  if(v>=1e6)return(v/1e6).toFixed(1)+'M';\n  return(v/1e3).toFixed(0)+'K';\n}\nfunction setFilter(f){\n  filterMode=f;\n  document.getElementById('fAll').className='btn-o'+(f==='all'?' on':'');\n  document.getElementById('fLong').className='btn-o'+(f==='long'?' lon':'');\n  document.getElementById('fShort').className='btn-o'+(f==='short'?' son':'');\n  renderScan(scanData);\n}\nfunction setTFFilter(f,btn){\n  tfFilter=f;\n  document.querySelectorAll('[id^=\"tf\"]').forEach(b=>b.classList.remove('on'));\n  btn.classList.add('on');\n  renderScan(scanData);\n}\nlet fibMode='ote'; try{ fibMode=localStorage.getItem('saxis_fibMode')==='classic'?'classic':'ote'; }catch(e){}\nconst fibSetNow=()=>fibMode==='classic'?[0.5,0.618,0.786]:[0.62,0.705,0.79];\nfunction setFibMode(m){ fibMode=m; try{ localStorage.setItem('saxis_fibMode',m); }catch(e){}\n  document.getElementById('fibOte').className='btn-o'+(m==='ote'?' on':''); document.getElementById('fibCls').className='btn-o'+(m==='classic'?' on':''); toast('已切換斐波：'+(m==='ote'?'SMC-OTE':'傳統')+'（按「🎯 進場建議」會用這組）'); }\nsetTimeout(()=>{ const o=document.getElementById('fibOte'),c=document.getElementById('fibCls'); if(o&&c){ o.className='btn-o'+(fibMode==='ote'?' on':''); c.className='btn-o'+(fibMode==='classic'?' on':''); } },0);\nfunction setSlFilter(on){\n  slCapOn=on; document.getElementById('slCap').className='btn-o'+(on?' on':''); document.getElementById('slAll').className='btn-o'+(on?'':' on'); renderScan(scanData);\n}\nfunction setBiasFilter(f){\n  biasFilter=f;\n  document.getElementById('biasAny').className='btn-o'+(f==='any'?' on':'');\n  document.getElementById('biasBull').className='btn-o'+(f==='bull'?' lon':'');\n  document.getElementById('biasBear').className='btn-o'+(f==='bear'?' son':'');\n  renderScan(scanData);\n}\n\n// ============================================================\n// BIAS SYSTEM\n// ============================================================\nconst OKX_TF = { W:'1W', D:'1D', H4:'4H', H1:'1H', M15:'15m' };\n\nasync function analyzeTF(sym, bar, lim=300) {\n  try {\n    // 週線最多只有幾百根，降低門檻到 50 根，並拉最大量\n    const fetchLim = bar==='1W' ? 300 : lim;\n    const minLen   = bar==='1W' ? 50  : bar==='1D' ? 100 : 175;\n    const closes = await fetchCandles(sym, bar, fetchLim, bar!=='1W');   // 大通道 EMA576／676 要 700 根以上，所以日線／4H 也要抓深\n    return analyze(closes, minLen);\n  } catch(e) { return null; }\n}\n\nfunction renderBiasCard(prefix, sym, analysis, tfLabel) {\n  const bias = getBias(analysis);\n  const cardClass = bias==='bull'?'bull-card':bias==='bear'?'bear-card':bias==='range'?'range-card':'neutral-card';\n  c
