ch(e){ return []; } };\n  const sv=a=>{ try{ localStorage.setItem(KEY,JSON.stringify(a)); }catch(e){} };\n  const TYPES={cross:'交叉',up:'向上突破',down:'向下跌破',ge:'大於等於',le:'小於等於'};\n  const SN={saxis:'賽克斯',wicket:'威克特',hunt:'獵影',hai:'海神',f13:'13333'};\n  const nm=i=>i.replace('-USDT-SWAP',' 永續').replace('-USDT',' 現貨');\n  const dtl=ms=>{ const d=new Date(ms-new Date().getTimezoneOffset()*6e4); return d.toISOString().slice(0,16); };\n  const esc=v=>String(v==null?'':v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  let ac=null, px={}, kind='p';                                            // px：各幣最新價；kind：目前選的 永續(p)／現貨(s)\n  function tone(f,at){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(ac.destination); const t=ac.currentTime+at; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.6); o.start(t); o.stop(t+.65); }\n  function beep(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); tone(880,0); tone(1175,.3); }catch(e){} }\n  function toast(t){ let box=document.getElementById('alToasts'); if(!box){ box=document.createElement('div'); box.id='alToasts'; document.body.appendChild(box); } const d=document.createElement('div'); d.className='altoast'; d.innerHTML='<b>🔔 警報<\/b><span><\/span><button type=\"button\">知道了<\/button>'; d.querySelector('span').textContent=t; d.querySelector('button').onclick=()=>d.remove(); box.appendChild(d); }\n  let flash=null; function titleFlash(t){ const o=document.title.replace(/^🔔 /,''); let n=0; clearInterval(flash); flash=setInterval(()=>{ document.title=(n++%2?o:'🔔 '+t); if(n>12){ clearInterval(flash); document.title=o; } },800); }\n  function describe(a){ return a.kind==='strat'?(nm(a.inst)+' '+a.tf+' '+(a.strat==='any'?'任一策略':SN[a.strat])+' '+(a.dir==='long'?'做多':a.dir==='short'?'做空':'多空')+'訊號'):(nm(a.inst)+' 價格'+TYPES[a.type]+' '+a.price); }\n  function fire(a,detail){\n    const t=((a.msg&&a.msg.trim())||describe(a))+(detail?'（'+detail+'）':'');\n    if(a.pop!==false) toast(t); if(a.sound!==false) beep();\n    if(a.notify&&'Notification' in window&&Notification.permission==='granted'){ try{ new Notification('警報',{body:t}); }catch(e){} }\n    titleFlash(nm(a.inst)); a.lastFire=Date.now();\n    try{ const L=JSON.parse(localStorage.getItem(LOGKEY)||'[]'); L.unshift({t:Date.now(),m:t}); localStorage.setItem(LOGKEY,JSON.stringify(L.slice(0,30))); }catch(e){}\n  }\n  function hit(a,prev,p){\n    const v=+a.price; if(a.type==='ge') return p>=v; if(a.type==='le') return p<=v; if(prev==null) return false;\n    if(a.type==='up') return prev<v&&p>=v; if(a.type==='down') return prev>v&&p<=v; return (prev<v&&p>=v)||(prev>v&&p<=v);\n  }\n  /* ---- 策略訊號：抓 K 線 → 跑同一套策略函式 → 看「剛收盤那根」有沒有新訊號（不套用上層偏見過濾，是策略本身的訊號） ---- */\n  const bars={};                                                            // inst|tf → Map（增量更新）\n  async function barsOf(inst,tf){ const k=inst+'|'+tf; const m=bars[k]||(bars[k]=new Map()); return getBars(inst,tf,m); }\n  async function freshSigs(inst,tf){\n    const cs=await barsOf(inst,tf); const out=[]; if(cs.length<60) return out; const L=cs.length-1;\n    const add=(key,A)=>{ if(!A||!A.sigs||!A.sigs.length) return; const s=A.sigs[A.sigs.length-1]; if(s&&s.i===L) out.push({strat:key,dir:s.dir===1?'long':'short',t:s.t,entry:s.entry,sl:s.sl}); };\n    try{ add('saxis',saxis(cs)); }catch(e){}\n    try{ add('hunt',hunt(cs)); }catch(e){}\n    try{ if(cs.length>=125) add('wicket',wicket(cs)); }catch(e){}\n    try{ let flt=null; if(tf!=='4H'){ const c4=await barsOf(inst,'4H'); if(c4.length>=30){ const A4=hai(c4); flt=haiFlt(A4,cs,tf==='15m'?9e5:36e5); } } add('hai',hai(cs,flt)); }catch(e){}\n    try{ if(tf==='15m'&&cs.length>=100) add('f13',f13(cs)); }catch(e){}\n    return out;\n  }\n  if(window.__ALTEST) window.__alFresh=freshSigs;   // 測試用掛鉤（平常不存在）\n  let busy=false, lastStrat=0;\n  async function poll(){\n    if(busy) return; busy=true;\n    try{\n      const L=ld(), now=Date.now(); let ch=false;\n      for(const a of L){ if(!a.done&&a.exp&&now>a.exp){ a.done='expired'; ch=true; } }\n      const act=L.filter(a=>!a.done);\n      const pinst=[...new Set(act.filter(a=>a.kind!=='strat').map(a=>a.inst))];\n      await Promise.all(pinst.map(async i=>{ try{ const r=await fetch('https://www.okx.com/api/v5/market/ticker?instId='+encodeURIComponent(i),{cache:'no-store'}); const j=await r.json(); if(j.code==='0'&&j.data&&j.data[0]) px[i]=+j.data[0].last; }catch(e){} }));\n      for(const a of act.filter(a=>a.kind!=='strat')){ const p=px[a.inst]; if(p==null||isNaN(p)) continue;\n        if(hit(a,a.prev,p)){ const cool=a.once!==false?0:300000; if(!a.lastFire||now-a.lastFire>=cool){ fire(a,'現價 '+p); if(a.once!==false) a.done='fired'; ch=true; } }\n        if(a.prev!==p){ a.prev=p; ch=true; } }\n      if(now-lastStrat>=30000){                                              // 策略訊號每 30 秒檢查一次（K 棒收盤才會有新訊號）\n        lastStrat=now; const sa=act.filter(a=>a.kind==='strat'&&!a.done); const grp={};\n        sa.forEach(a=>{ (grp[a.inst+'|'+a.tf]=grp[a.inst+'|'+a.tf]||[]).push(a); });\n        for(const k in grp){ const [inst,tf]=k.split('|'); let fs=[]; try{ fs=await freshSigs(inst,tf); }catch(e){ continue; }\n          for(const a of grp[k]){ a.seen=a.seen||{};\n            for(const s of fs){ if(a.strat!=='any'&&a.strat!==s.strat) continue; if(a.dir!=='both'&&a.dir!==s.dir) continue; if(a.seen[s.strat]===s.t) continue;\n              a.seen[s.strat]=s.t; ch=true; fire(a,SN[s.strat]+' '+(s.dir==='long'?'做多':'做空')+'，進場 '+fmtN(s.entry)+'，止損 '+fmtN(s.sl)); if(a.once!==false){ a.done='fired'; break; } } } }\n      }\n      if(ch){ sv(L); render(); }\n    }catch(e){} busy=false;\n  }\n  const fmtN=v=>typeof fmt==='function'?fmt(v):v;\n  const fmtT=ms=>ms?new Date(ms).toLocaleString('zh-TW',{hour12:false,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—';\n  function render(){\n    const el=document.getElementById('alList'); const L=ld();\n    const n=L.filter(a=>!a.done).length; const bt=document.getElementById('alBtn'); if(bt) bt.textContent='🔔 警報'+(n?'（'+n+'）':'');\n    if(!el) return;\n    el.innerHTML=L.length?L.map(a=>'<div class=\"alrow'+(a.done?' off':'')+'\"><div><b>'+esc(describe(a))+'<\/b>'+(a.msg?' ・'+esc(a.msg):'')+'<div class=\"mute\" style=\"font-size:12px\">'+(a.once===false?'每次觸發':'僅限一次')+'・到期 '+fmtT(a.exp)+'・'+(a.done==='fired'?'已觸發':a.done==='expired'?'已到期':'監控中')+(a.kind!=='strat'&&a.prev!=null&&!a.done?'・最新價 '+a.prev:'')+'<\/div><\/div><button type=\"button\" data-d=\"'+a.id+'\">刪除<\/button><\/div>').join(''):'<div class=\"mute\" style=\"padding:8px 0\">還沒有警報<\/div>';\n    el.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{ sv(ld().filter(x=>String(x.id)!==b.dataset.d)); render(); });\n  }\n  const coinOf=v=>String(v||'').trim().toUpperCase().replace(/-(USDT|PERP|SWAP).*$/,'').replace(/[^A-Z0-9]/g,'');\n  const instNow=()=>{ const c=coinOf(document.getElementById('alCoin').value); return c?(c+'-USDT'+(kind==='p'?'-SWAP':'')):''; };\n  function sug(){ const c=coinOf(document.getElementById('alCoin').value), box=document.getElementById('alSug'); if(!c){ box.innerHTML=''; return; } box.innerHTML=[['p','永續'],['s','現貨']].map(([k,t])=>'<button type=\"button\" data-k=\"'+k+'\" class=\"'+(kind===k?'on':'')+'\">'+c+' <span>'+t+'<\/span><\/button>').join(''); box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ kind=b.dataset.k; sug(); }); }\n  function openModal(){\n    let m=document.getElementById('alModal'); if(m){ m.hidden=false; fill(); render(); return; }\n    m=document.createElement('div'); m.id='alModal';\n    m.innerHTML='<div class=\"alcard\"><div class=\"alhead\"><b>建立警報<\/b><button type=\"button\" id=\"alX\">✕<\/button><\/div>'+\n    '<label>幣種（打 BTC，下面選永續或現貨）<input id=\"alCoin\" placeholder=\"例如 BTC\" autocomplete=\"off\"><\/label><div id=\"alSug\" class=\"alsug\"><\/div>'+\n    '<label>條件類型<select id=\"alKind\"><option value=\"price\">價格<\/option><option value=\"strat\">策略訊號<\/option><\/select><\/label>'+\n    '<div id=\"alPrice\"><label>價格條件<div class=\"alr\"><select id=\"alType\">'+Object.entries(TYPES).map(([k,v])=>'<option value=\"'+k+'\">價格 '+v+'<\/option>').join('')+'<\/select><input id=\"alPx\" type=\"number\" step=\"any\" placeholder=\"價格\"><\/div><\/label><div class=\"alr\" style=\"margin-top:6px\"><button type=\"button\" id=\"alNow\">帶入現價<\/button><\/div><\/div>'+\n    '<div id=\"alStrat\" hidden><label>策略<select id=\"alS\"><option value=\"any\">任一策略（賽克斯／威克特／獵影／海神／13333）<\/option>'+Object.entries(SN).map(([k,v])=>'<option value=\"'+k+'\">'+v+'<\/option>').join('')+'<\/select><\/label>'+\n    '<div class=\"alr\"><label style=\"flex:1\">週期<select id=\"alTf\"><option>15m<\/option><option selected>1H<\/option><option>4H<\/option><\/select><\/label><label style=\"flex:1\">方向<select id=\"alDir\"><option value=\"both\">多空都要<\/option><option value=\"long\">只要做多<\/option><option value=\"short\">只要做空<\/option><\/select><\/label><\/div>'+\n    '<div class=\"mute\" style=\"font-size:12px\">策略在「剛收盤的那根 K 棒」出現新訊號時觸發；用的是策略本身的訊號，沒有套用日線／4H 偏見過濾（13333 只有 15m）。<\/div><\/div>'+\n    '<label>觸發<select id=\"alOnce\"><option value=\"1\">僅限一次<\/option><option value=\"0\">每次<\/option><\/select><\/label>'+\n    '<label>到期<input id=\"alExp\" type=\"datetime-local\"><\/label>'+\n    '<label>訊息（空白＝自動）<input id=\"alMsg\"><\/label>'+\n    '<div class=\"alchk\"><label><input type=\"checkbox\" id=\"alPop\" checked> 彈出提示<\/label><label><input type=\"checkbox\" id=\"alSnd\" checked> 聲音<\/label><label><input type=\"checkbox\" id=\"alNot\"> 瀏覽器通知<\/label><\/div>'+\n    '<div class=\"mute\" id=\"alNowTx\" style=\"font-size:12px;min-height:16px\"><\/div>'+\n    '<div class=\"mute\" style=\"font-size:12px\">注意：網頁要開著（手機要保持在前景）才會偵測；不能像 TradingView 那樣寄電子郵件或 App 推播。<\/div>'+\n    '<div class=\"alr\" style=\"justify-content:flex-end\"><button type=\"button\" id=\"alCancel\">取消<\/button><button type=\"button\" id=\"alOk\" class=\"alpri\">建立<\/button><\/div>'+\n    '<h3>目前的警報<\/h3><div id=\"alList\"><\/div><\/div>';\n    document.body.appendChild(m);\n    const $a=id=>document.getElementById(id);\n    $a('alX').onclick=$a('alCancel').onclick=()=>{ m.hidden=true; };\n    m.addEventListener('click',e=>{ if(e.target===m) m.hidden=true; });\n    $a('alCoin').addEventListener('input',sug);\n    $a('alKind').onchange=()=>{ const s=$a('alKind').value==='strat'; $a('alStrat').hidden=!s; $a('alPrice').hidden=s; };\n    $a('alNow').onclick=async()=>{ const i=instNow(); if(!i){ $a('alNowTx').textContent='請先填幣種'; return; } try{ const r=await fetch('https://www.okx.com/api/v5/market/ticker?instId='+encodeURIComponent(i),{cache:'no-store'}); const j=await r.json(); if(j.code==='0'&&j.data[0]){ $a('alPx').value=j.data[0].last; $a('alNowTx').textContent=nm(i)+' 現價 '+j.data[0].last; } else $a('alNowTx').textContent='找不到 '+nm(i); }catch(e){ $a('alNowTx').textContent='抓不到價格'; } };\n    $a('alOk').onclick=async()=>{\n      const inst=instNow(); if(!inst){ $a('alNowTx').textContent='請先填幣種'; return; }\n      let last=null; try{ const r=await fetch('https://www.okx.com/api/v5/market/ticker?instId='+encodeURIComponent(inst),{cache:'no-store'}); const j=await r.json(); if(j.code==='0'&&j.data[0]) last=+j.data[0].last; else { $a('alNowTx').textContent='找不到 '+nm(inst)+'（這個幣沒有'+(kind==='p'?'永續':'現貨')+'？）'; return; } }catch(e){ $a('alNowTx').textContent='抓不到價格，無法建立'; return; }\n      const exp=$a('alExp').value?new Date($a('alExp').value).getTime():null;\n      const base={id:Date.now(),inst,once:$a('alOnce').value==='1',exp,msg:$a('alMsg').value.trim(),pop:$a('alPop').checked,sound:$a('alSnd').checked,notify:$a('alNot').checked,created:Date.now()};\n      let rec;\n      if($a('alKind').value==='strat'){ rec={...base,kind:'strat',strat:$a('alS').value,tf:$a('alTf').value,dir:$a('alDir').value,seen:{}};\n        try{ const fs=await freshSigs(inst,rec.tf); fs.forEach(s=>{ rec.seen[s.strat]=s.t; }); }catch(e){ $a('alNowTx').textContent='抓不到 K 線，無法建立'; return; } }          // 建立當下已經有的訊號不算，只抓之後新出現的\n      else { const price=+$a('alPx').value; if(!(price>0)){ $a('alNowTx').textContent='請填價格'; return; } rec={...base,kind:'price',type:$a('alType').value,price,prev:last}; }\n      if(rec.notify&&'Notification' in window&&Notification.permission==='default'){ try{ await Notification.requestPermission(); }catch(e){} }\n      const L=ld(); L.unshift(rec); sv(L);\n      if(rec.sound) beep();\n      $a('alNowTx').textContent='已建立 ✓'; render(); lastStrat=0; poll();\n    };\n    fill(); render();\n  }\n  function fill(){ const $a=id=>document.getElementById(id); const cur=(typeof S!=='undefined'&&S.inst)||''; if(!$a('alCoin').value&&cur){ $a('alCoin').value=cur.split('-')[0]; kind=/-SWAP$/.test(cur)?'p':'s'; } sug(); $a('alExp').value=dtl(Date.now()+30*864e5); }\n  const q0=document.querySelector('.quote'); if(q0){ const t=document.createElement('button'); t.type='button'; t.id='tvBtn'; t.textContent='📊 TradingView'; t.style.marginLeft='auto'; t.onclick=()=>{ const i=(typeof S!=='undefined'&&S.inst)||''; if(!i) return; const sym=/-SWAP$/.test(i)?'OKX:'+i.split('-')[0]+i.split('-')[1]+'.P':'OKX:'+i.replace('-',''); window.open('https://www.tradingview.com/chart/?symbol='+encodeURIComponent(sym),'_blank','noopener'); }; q0.appendChild(t); }\n  const q=document.querySelector('.quote'); if(q){ const b=document.createElement('button'); b.type='button'; b.id='alBtn'; b.textContent='🔔 警報'; b.style.marginLeft=document.getElementById('tvBtn')?'0':'auto'; b.onclick=openModal; q.appendChild(b); }\n  render(); setInterval(poll,5000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); }); poll();\n})();\n})();\n<\/script>\n<\/body>\n<\/html>\n","<!DOCTYPE html>\n<html lang=\"zh-TW\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>賽克斯策略平台 v3 · OKX 全合約<\/title>\n<link rel=\"icon\" href=\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡<\/text><\/svg>\">\n<link href=\"https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --bg:#080a0e;--surface:#0d1117;--surface2:#131920;--border:#1e2a35;\n  --gold:#c9a84c;--gold2:#f0c96a;\n  --bull:#00e5a0;--bear:#ff4d6d;--range:#f59e0b;\n  --text:#cdd9e5;--dim:#5a7a90;--bright:#eaf2ff;--info:#3b9eff;\n  --mgreen:#a855f7;--mgreen2:#c084fc;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh}\nbody::before{content:'';position:fixed;inset:0;\n  background-image:linear-gradient(rgba(201,168,76,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.025) 1px,transparent 1px);\n  background-size:44px 44px;pointer-events:none;z-index:0}\n.app{position:relative;z-index:1;max-width:1500px;margin:0 auto}\n\n/* header */\nheader{padding:18px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:var(--surface)}\n.logo{display:flex;align-items:center;gap:12px}\n.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--gold),#7a5010);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}\n.logo h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--gold2);line-height:1}\n.logo p{font-size:10px;color:var(--dim);letter-spacing:1.5px;margin-top:2px}\n.hright{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace}\n.ldot{width:7px;height:7px;border-radius:50%;background:var(--bull);box-shadow:0 0 7px var(--bull);animation:blink 2s infinite}\n@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}\n\n/* nav */\nnav{display:flex;gap:3px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}\n.nb{padding:7px 16px;border:1px solid transparent;background:transparent;color:var(--dim);border-radius:7px;cursor:pointer;font-size:13px;font-family:'Noto Sans TC',sans-serif;display:flex;align-items:center;gap:5px;transition:all .15s}\n.nb:hover{color:var(--text);background:var(--surface2)}\n.nb.active{border-color:var(--border);background:var(--surface2);color:var(--bright)}\n\n/* panel */\n.panel{display:none;padding:18px 24px}\n.panel.active{display:block}\n\n/* metrics */\n.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:14px}\n.metric{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px}\n.mlabel{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}\n.mval{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:600;color:var(--bright)}\n.mval.bull{color:var(--bull)}.mval.bear{color:var(--bear)}.mval.gold{color:var(--gold2)}.mval.range{color:var(--range)}.mval.info{color:var(--info)}\n\n/* card */\n.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px;margin-bottom:12px}\n.ctitle{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:11px}\n\n/* buttons */\n.btn-gold{padding:8px 20px;background:linear-gradient(135deg,var(--gold),#8a5f10);color:#000;border:none;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.8px;transition:all .2s;white-space:nowrap}\n.btn-gold:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(201,168,76,.3)}\n.btn-gold:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}\n.btn-o{padding:6px 13px;border:1px solid var(--border);background:transparent;color:var(--dim);border-radius:6px;cursor:pointer;font-size:12px;font-family:'Noto Sans TC',sans-serif;transition:all .15s}\n.btn-o:hover{border-color:var(--gold);color:var(--gold)}\n.btn-o.on{border-color:var(--info);color:var(--info);background:rgba(59,158,255,.08)}\n.btn-o.lon{border-color:var(--bull);color:var(--bull);background:rgba(0,229,160,.08)}\n.btn-o.son{border-color:var(--bear);color:var(--bear);background:rgba(255,77,109,.08)}\n\n/* progress */\n.prog-bg{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:5px}\n.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0%;transition:width .3s}\n.prog-txt{font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-bottom:10px;min-height:16px}\n\n/* badges */\n.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}\n.bbull{background:rgba(0,229,160,.15);color:var(--bull);border:1px solid rgba(0,229,160,.3)}\n.bbear{background:rgba(255,77,109,.15);color:var(--bear);border:1px solid rgba(255,77,109,.3)}\n.brange{background:rgba(245,158,11,.15);color:var(--range);border:1px solid rgba(245,158,11,.3)}\n.binfo{background:rgba(59,158,255,.15);color:var(--info);border:1px solid rgba(59,158,255,.3)}\n\n/* ── BIAS PANEL ── */\n.bias-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}\n.bias-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:15px;position:relative;overflow:hidden}\n.bias-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:2px 0 0 2px}\n.bias-card.bull-card::before{background:var(--bull)}\n.bias-card.bear-card::before{background:var(--bear)}\n.bias-card.range-card::before{background:var(--range)}\n.bias-card.neutral-card::before{background:var(--border)}\n.tf-badge{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:6px}\n.bias-sym{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--bright);margin-bottom:8px}\n.bias-rows{display:flex;flex-direction:column;gap:5px}\n.bias-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}\n.bk{color:var(--dim)}\n.bias-summary{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--text);line-height:1.6}\n.bias-summary strong{color:var(--bright)}\n\n.bias-sym-select{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:8px;font-size:13px;font-family:'Noto Sans TC',sans-serif;margin-bottom:14px;cursor:pointer}\n\n/* bias overview table */\n.btable{width:100%;border-collapse:collapse;font-size:13px}\n.btable th{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;padding:7px 10px;border-bottom:1px solid var(--border);text-align:left}\n.btable td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}\n.btable tr:last-child td{border-bottom:none}\n.btable tr:hover td{background:var(--surface2)}\n.btable td:first-child{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--bright)}\n.bias-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}\n.verdict-bull{color:var(--bull);font-weight:600}\n.verdict-bear{color:var(--bear);font-weight:600}\n.verdict-range{color:var(--range);font-weight:600}\n.verdict-neutral{color:var(--dim)}\n\n/* ── SCANNER ── */\n.scon{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}\n.tfl{font-size:11px;color:var(--dim);min-width:42px}\n.scan-head{display:grid;grid-template-columns:1fr 70px 75px 100px 80px 80px 90px 120px;gap:8px;padding:7px 12px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border)}\n.scan-row{display:grid;grid-template-columns:1fr 70px 75px 100px 80px 80px 90px 120px;gap:8px;padding:10px 12px;align-items:center;font-size:13px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}\n.scan-row:hover{background:var(--surface2)}\n.scan-row:last-child{border-bottom:none}\n.sname{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;color:var(--bright)}\n.ssub{font-size:10px;color:var(--dim)}\n.dots{display:flex;gap:4px;align-items:center}\n.d{width:8px;height:8px;border-radius:50%;background:var(--border)}\n.d.ok{background:var(--bull);box-shadow:0 0 5px rgba(0,229,160,.4)}\n.d.warn{background:var(--range)}\n.slist{max-height:440px;overflow-y:auto}\n.empty{text-align:center;padding:50px;color:var(--dim);font-size:13px}\n.empty-icon{font-size:38px;margin-bottom:10px;opacity:.3}\n\n/* ── CALC ── */\n.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}\n.fgroup{display:flex;flex-direction:column;gap:4px}\n.fgroup label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}\n.fgroup input,.fgroup select{padding:9px 11px;background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:7px;font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .2s;width:100%}\n.fgroup input:focus,.fgroup select:focus{border-color:var(--gold)}\n.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:12px}\n.rbox{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px}\n.rl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}\n.rv{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;color:var(--bright)}\n.rv.pos{color:var(--bull)}.rv.neg{color:var(--bear)}.rv.warn{color:var(--gold2)}\n.rr-track{height:13px;background:var(--border);border-radius:7px;overflow:hidden;display:flex;margin-bottom:4px}\n.rrl{height:100%;background:var(--bear)}.rrp{height:100%;background:var(--bull)}\n.advice{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:14px;font-size:13px;line-height:1.8;color:var(--text)}\n.advice strong{color:var(--bright)}\n\n/* ── AI CHAT ── */\n.upload-zone{border:1.5px dashed var(--border);border-radius:11px;padding:22px;text-align:center;cursor:pointer;margin-bottom:12px;transition:all .2s}\n.upload-zone:hover{border-color:var(--gold);background:rgba(201,168,76,.04)}\n.upload-zone p{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.6}\n.img-prev{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin-bottom:10px;border:1px solid var(--border);display:none}\n.quick-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}\n.qb{padding:5px 11px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--dim);font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;transition:all .15s}\n.qb:hover{border-color:var(--gold2);color:var(--gold2)}\n.chatbox{border:1px solid var(--border);border-radius:11px;overflow:hidden}\n.chathead{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface)}\n.chatmsgs{min-height:200px;max-height:340px;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}\n.msg{padding:10px 14px;border-radius:9px;font-size:13px;line-height:1.7;max-width:92%}\n.msg.ai{background:var(--surface);border:1px solid var(--border);align-self:flex-start}\n.msg.user{background:rgba(59,158,255,.12);border:1px solid rgba(59,158,255,.2);align-self:flex-end;color:#90c8ff}\n.msg.loading{color:var(--dim);font-style:italic}\n.chatinputrow{display:flex;gap:7px;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface)}\n.chatinput{flex:1;padding:8px 11px;background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:7px;font-size:13px;font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color .2s}\n.chatinput:focus{border-color:var(--gold)}\n.sendbtn{padding:8px 16px;background:var(--gold);color:#000;border:none;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}\n.sendbtn:hover{background:var(--gold2)}.sendbtn:disabled{opacity:.4;cursor:not-allowed}\n\n/* scrollbar */\n::-webkit-scrollbar{width:4px;height:4px}\n::-webkit-scrollbar-track{background:var(--bg)}\n::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}\n\n/* toast */\n.toast{position:fixed;bottom:22px;right:22px;z-index:999;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 18px;font-size:13px;color:var(--text);opacity:0;transform:translateY(16px);transition:all .3s;pointer-events:none}\n.toast.show{opacity:1;transform:none}\n\n@keyframes spin{to{transform:rotate(360deg)}}\n.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:5px}\n\n/* data panel */\n.sym-select{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:8px;font-size:13px;font-family:'Noto Sans TC',sans-serif;margin-bottom:13px;cursor:pointer}\n.drow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}\n.drow:last-child{border-bottom:none}\n.dk{color:var(--dim)}\n.gauge-bar{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}\n.gauge-fill{height:100%;border-radius:4px;background:var(--bull);transition:width .5s}\n\n@media(max-width:900px){\n  .scan-head,.scan-row{grid-template-columns:1fr 54px 64px 70px 70px 96px}\n  .scan-head span:nth-child(5),.scan-head span:nth-child(6),\n  .scan-row>*:nth-child(5),.scan-row>*:nth-child(6){display:none}\n  .cgrid{grid-template-columns:1fr}\n  .bias-grid{grid-template-columns:1fr}\n}\n\n#saxisSplash{position svg class=\"crown\" width=\"130\" height=\"90\" viewBox=\"0 0 200 140\">\n      <path d=\"M20,110 L20,55 L55,80 L100,20 L145,80 L180,55 L180,110 Z\" fill=\"none\" stroke=\"#e8c766\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"filter:drop-shadow(0 0 12px rgba(168,85,247,.9))\"/>\n      <circle cx=\"20\" cy=\"55\" r=\"7\" fill=\"#f5e8ff\"/>\n      <circle cx=\"100\" cy=\"20\" r=\"8\" fill=\"#f5e8ff\"/>\n      <circle cx=\"180\" cy=\"55\" r=\"7\" fill=\"#f5e8ff\"/>\n      <rect x=\"18\" y=\"106\" width=\"164\" height=\"12\" rx=\"2\" fill=\"#e8c766\" style=\"filter:drop-shadow(0 0 8px rgba(168,85,247,.8))\"/>\n    <\/svg>\n    <div class=\"logo-wrap\">\n      <span class=\"splash-title\">王者交易<\/span>\n      <span class=\"splash-badge\">PRO<\/span>\n    <\/div>\n    <div class=\"splash-en\">SAXIS · VEGAS CHANNEL STRATEGY<\/div>\n    <div class=\"splash-tagline\"><div class=\"dia\"><\/div><span>順勢而為 · 智者為王<\/span><div class=\"dia\"><\/div><\/div>\n    <div class=\"splash-tags\">SNR ｜ SMC ｜ ICT ｜ 價格行為 ｜ 市場結構 ｜ 流動性<\/div>\n    <svg class=\"v-divider\" width=\"46\" height=\"24\" viewBox=\"0 0 46 24\"><path d=\"M2,2 L23,20 L44,2\" fill=\"none\" stroke=\"#a855f7\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"filter:drop-shadow(0 0 6px rgba(168,85,247,.8))\"/><\/svg>\n    <div class=\"splash-motto\">以 策 略 致 勝 · 以 執 行 登 頂<\/div>\n    <div class=\"splash-eng-motto\">T R A D E &nbsp; L I K E &nbsp; A &nbsp; K I N G<\/div>\n    <div class=\"splash-boot\" id=\"splashBoot\"><\/div>\n    <div class=\"splash-bar-wrap\"><div class=\"splash-bar\"><div class=\"splash-bar-fill\" id=\"splashBarFill\"><\/div><\/div><span class=\"splash-pct\" id=\"splashPct\">0%<\/span><\/div>\n  <\/div>\n  <div class=\"splash-hint\">點擊任意處跳過<\/div>\n<\/div>\n<script>\n(function(){\nvar splash=document.getElementById('saxisSplash');\nvar boot=document.getElementById('splashBoot');\nvar pct=document.getElementById('splashPct');\nvar clock=document.getElementById('hudClock');\nvar mrain=document.getElementById('mrain');\nvar zzLeft=document.getElementById('zzLeft');\nvar zzRight=document.getElementById('zzRight');\nvar embers=document.getElementById('embers');\nfunction buildEmbers(){\n  var html='';\n  var n=22;\n  for(var i=0;i<n;i++){\n    var left=Math.random()*100;\n    var dur=(3+Math.random()*3).toFixed(1);\n    var delay=(Math.random()*2.6).toFixed(2);\n    var ex=(Math.random()*60-30).toFixed(0)+'px';\n    var size=(2+Math.random()*3).toFixed(0);\n    html+='<div class=\"ember\" style=\"left:'+left+'%;width:'+size+'px;height:'+size+'px;--ex:'+ex+';animation-duration:'+dur+'s;animation-delay:'+delay+'s\"><\/div>';\n  }\n  embers.innerHTML=html;\n}\nbuildEmbers();\nvar mchars='アイウエオカキクケコサシスセソ0123456789ABCDEFｱｲｳｴｵ$#%&';\nfunction buildRain(){\n  var html='';\n  var cols=Math.floor(window.innerWidth/24);\n  for(var i=0;i<cols;i++){\n    var len=16+Math.floor(Math.random()*12);\n    var str='';\n    for(var j=0;j<len;j++){ str+=mchars[Math.floor(Math.random()*mchars.length)]+'\\n'; }\n    var dur=(4+Math.random()*5).toFixed(1);\n    var delay=(-Math.random()*8).toFixed(1);\n    var left=(i*24)+Math.random()*8;\n    html+='<div class=\"mcol\" style=\"left:'+left+'px;animation-duration:'+dur+'s;animation-delay:'+delay+'s\">'+str+'<\/div>';\n  }\n  mrain.innerHTML=html;\n}\nfunction buildZZ(){\n  var n=Math.ceil(window.innerHeight/56)+2;\n  var html='';\n  for(var i=0;i<n;i++){ html+='<div class=\"zz\"><\/div>'; }\n  zzLeft.innerHTML=html;\n  zzRight.innerHTML=html;\n}\nbuildRain();\nbuildZZ();\nfunction tick(){\n  var d=new Date();\n  var p=function(n){return (n<10?'0':'')+n;};\n  clock.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());\n}\ntick(); setInterval(tick,1000);\nvar lines=['> 掃描全市場交易對...','> 策略共振比對完成'];\nfunction nextLine(li){\n  if(li>=lines.length) return;\n  boot.textContent=lines[li];\n  setTimeout(function(){nextLine(li+1)}, 420);\n}\nfunction countPct(){\n  var start=null, dur=1400;\n  function step(ts){\n    if(!start)start=ts;\n    var t=Math.min(1,(ts-start)/dur);\n    pct.textContent=Math.round(t*100)+'%';\n    if(t<1) requestAnimationFrame(step);\n  }\n  requestAnimationFrame(step);\n}\nrequestAnimationFrame(function(){ splash.classList.add('play'); });\nsetTimeout(function(){nextLine(0)}, 1650);\nsetTimeout(countPct, 1650);\nfunction dismiss(){\n  splash.classList.add('hide');\n  setTimeout(function(){ splash.remove(); }, 460);\n}\nsplash.addEventListener('click', dismiss);\nsetTimeout(dismiss, 3600);\n})();\n<\/script>\n<div class=\"app\">\n\n<header>\n  <div class=\"logo\">\n    <div class=\"logo-icon\">⚡<\/div>\n    <div>\n      <h1>SAXIS PRO · OKX<\/h1>\n      <p>Vegas · QQE MOD · 日線+4H偏見 · 15M~1H進場 · USDT/USDC/幣本全合約 · 成交量過濾<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"hright\">\n    <div class=\"ldot\"><\/div>\n    <span id=\"lastScan\">尚未掃描<\/span>\n    <span>OKX Swap<\/span>\n  <\/div>\n<\/header>\n\n<nav>\n  <button class=\"nb active\" onclick=\"switchTab('bias',this)\">🧭 偏見系統<\/button>\n  <button class=\"nb\" onclick=\"switchTab('scanner',this)\">📡 策略掃描<\/button>\n  <button class=\"nb\" onclick=\"switchTab('data',this)\">📊 數據分析<\/button>\n  <button class=\"nb\" onclick=\"switchTab('review',this)\">🤖 AI 復盤<\/button>\n  <button class=\"nb\" onclick=\"switchTab('calc',this)\">🧮 倉位計算<\/button>\n  <button class=\"nb\" id=\"logNavBtn\" onclick=\"switchTab('log',this)\" style=\"position:relative\">\n    📋 訊號記錄\n    <span id=\"logNavBadge\" style=\"display:none;position:absolute;top:4px;right:4px;background:var(--short);color:#fff;border-radius:8px;font-size:9px;padding:1px 4px\">0<\/span>\n  <\/button>\n  <button class=\"nb\" onclick=\"switchTab('track',this)\">📊 勝率統計<\/button>\n  <button class=\"nb\" id=\"alertNavBtn\" onclick=\"switchTab('alert',this)\" style=\"position:relative\">\n    🔔 價格監控\n    <span id=\"alertBadge\" style=\"display:none;position:absolute;top:4px;right:4px;background:var(--bull);color:#000;border-radius:8px;font-size:9px;padding:1px 4px;font-weight:700\">●<\/span>\n  <\/button>\n  <button class=\"nb\" onclick=\"switchTab('poseidon',this)\">📖 策略手冊<\/button>\n  <button class=\"nb\" onclick=\"switchTab('macro',this)\">🌐 宏觀<\/button>\n<\/nav>\n\n<!-- ==================== BIAS ==================== -->\n<div class=\"panel active\" id=\"panel-bias\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px\">\n    <div>\n      <div style=\"font-size:15px;font-weight:500;color:var(--bright);margin-bottom:3px\">兩層偏見系統（日線 + 4H）<\/div>\n      <div style=\"font-size:12px;color:var(--dim)\">日圖 → 4H　由日線與 4H 建立方向偏見，再在 15M ~ 1H 找進場點<\/div>\n    <\/div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n      <div style=\"position:relative\">\n        <input id=\"biasSymInput\" placeholder=\"輸入幣種，如 BTC、ETH...\" \n          style=\"padding:8px 12px;background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:8px;font-size:13px;width:200px;outline:none\"\n          oninput=\"filterBiasSyms(this.value)\" onfocus=\"showBiasDropdown()\" onblur=\"setTimeout(hideBiasDropdown,200)\">\n        <div id=\"biasDropdown\" style=\"display:none;position:absolute;top:100%;left:0;width:220px;background:var(--surface);border:1px solid var(--border);border-radius:8px;z-index:99;max-height:200px;overflow-y:auto;margin-top:4px\"><\/div>\n      <\/div>\n      <button class=\"btn-gold\" onclick=\"loadBias()\">🔄 分析偏見<\/button>\n      <button class=\"btn-gold\" style=\"background:linear-gradient(135deg,#3b9eff,#1a5fa0);color:#fff\" onclick=\"scanAllBias()\">📋 批量掃描偏見<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- 兩層偏見卡片 -->\n  <div class=\"bias-grid\" id=\"biasCards\">\n    <div class=\"bias-card neutral-card\">\n      <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">日圖 1D<\/span><\/div>\n      <div class=\"bias-sym\" id=\"bD-sym\">—<\/div>\n      <div class=\"bias-rows\" id=\"bD-rows\"><div style=\"font-size:12px;color:var(--dim)\">點擊「分析偏見」載入<\/div><\/div>\n      <div class=\"bias-summary\" id=\"bD-sum\"><\/div>\n    <\/div>\n    <div class=\"bias-card neutral-card\">\n      <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">4小時 4H<\/span><\/div>\n      <div class=\"bias-sym\" id=\"b4-sym\">—<\/div>\n      <div class=\"bias-rows\" id=\"b4-rows\"><div style=\"font-size:12px;color:var(--dim)\">點擊「分析偏見」載入<\/div><\/div>\n      <div class=\"bias-summary\" id=\"b4-sum\"><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 綜合偏見結論 -->\n  <div class=\"card\" id=\"biasVerdict\" style=\"display:none\">\n    <div class=\"ctitle\">綜合偏見結論<\/div>\n    <div id=\"biasVerdictContent\"><\/div>\n  <\/div>\n\n  <!-- 批量偏見表格 -->\n  <div class=\"card\" id=\"batchBiasCard\" style=\"display:none\">\n    <div class=\"ctitle\">主流幣種偏見總覽<\/div>\n    <div style=\"overflow-x:auto\">\n      <table class=\"btable\" id=\"batchBiasTable\">\n        <thead>\n          <tr>\n            <th>幣種<\/th>\n            <th>日圖<\/th>\n            <th>4H<\/th>\n            <th>綜合偏見<\/th>\n            <th>操作建議<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"batchBiasBody\"><\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ==================== SCANNER ==================== -->\n<div class=\"panel\" id=\"panel-scanner\">\n  <div class=\"metrics\">\n    <div class=\"metric\"><div class=\"mlabel\">全部合約<\/div><div class=\"mval gold\" id=\"mTotal\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">成交量過濾後<\/div><div class=\"mval info\" id=\"mFiltered\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">15M 多單<\/div><div class=\"mval bull\" id=\"m15L\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">15M 空單<\/div><div class=\"mval bear\" id=\"m15S\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">30M 多單<\/div><div class=\"mval bull\" id=\"m30L\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">30M 空單<\/div><div class=\"mval bear\" id=\"m30S\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">1H 多單<\/div><div class=\"mval bull\" id=\"m1hL\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">1H 空單<\/div><div class=\"mval bear\" id=\"m1hS\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">過濾盤整<\/div><div class=\"mval\" style=\"color:var(--dim)\" id=\"mRange\">—<\/div><\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <!-- 策略切換 -->\n    <div style=\"display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--border)\">\n      <span style=\"font-size:12px;color:var(--dim);white-space:nowrap\">📐 策略<\/span>\n      <button class=\"btn-o on\" id=\"stratSaxis\" onclick=\"setStrategy('saxis')\" style=\"padding:7px 16px\">賽克斯（Vegas+QQE）<\/button>\n      <button class=\"btn-o\" id=\"stratWicket\" onclick=\"setStrategy('wicket')\" style=\"padding:7px 16px\">威克特（BB+MACD）<\/button>\n      <button class=\"btn-o\" id=\"stratHunter\" onclick=\"setStrategy('hunter')\" style=\"padding:7px 16px\">獵影（OBV+ATR）<\/button>\n      <button class=\"btn-o\" id=\"stratPoseidon\" onclick=\"setStrategy('poseidon')\" style=\"padding:7px 16px\">🔱 海神（TuTCI+MSS）<\/button>\n      <button class=\"btn-o\" id=\"strat13333\" onclick=\"setStrategy('13333')\" style=\"padding:7px 16px\">🎯 13333法則（首K突破回測）<\/button>\n      <span id=\"strategyDesc\" style=\"font-size:11px;color:var(--dim);margin-left:6px\">日線+4H偏見→15M~1H 回踩→過濾線→QQE 紅/藍柱<\/span>\n    <\/div>\n\n    <div class=\"scon\">\n      <div style=\"display:flex;align-items:center;gap:6px\">\n        <span class=\"tfl\">時區篩選<\/span>\n        <button class=\"btn-o on\" id=\"tf15\" onclick=\"setTFFilter('15',this)\">15M<\/button>\n        <button class=\"btn-o on\" id=\"tf30\" onclick=\"setTFFilter('30',this)\">30M<\/button>\n        <button class=\"btn-o on\" id=\"tf1h\" onclick=\"setTFFilter('1h',this)\">1H<\/button>\n        <button class=\"btn-o on\" id=\"tfboth\" onclick=\"setTFFilter('all',this)\">全部（15M~1H）<\/button>\n      <\/div>\n      <div style=\"display:flex;gap:6px;margin-left:auto\">\n        <button class=\"btn-o on\" id=\"fAll\" onclick=\"setFilter('all')\">全部<\/button>\n        <button class=\"btn-o\" id=\"fLong\" onclick=\"setFilter('long')\">多單<\/button>\n        <button class=\"btn-o\" id=\"fShort\" onclick=\"setFilter('short')\">空單<\/button>\n      <\/div>\n      <button class=\"btn-gold\" id=\"scanBtn\" onclick=\"startScan()\">🔍 開始掃描<\/button>\n    <\/div>\n\n    <!-- 進度條（之前遺漏，補回） -->\n    <div class=\"prog-bg\"><div class=\"prog-fill\" id=\"pfill\"><\/div><\/div>\n    <div class=\"prog-txt\" id=\"ptext\"><\/div>\n\n    <!-- 自動掃描 + 通知列 -->\n    <div style=\"display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:10px;flex-wrap:wrap\">\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <span style=\"font-size:12px;color:var(--dim)\">⏰ 自動掃描<\/span>\n        <button class=\"btn-o\" id=\"autoBtn\" onclick=\"toggleAutoScan()\">已關閉<\/button>\n        <select id=\"autoInterval\" style=\"background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:12px\">\n          <option value=\"15\">每 15 分鐘<\/option>\n          <option value=\"30\" selected>每 30 分鐘<\/option>\n          <option value=\"60\">每 60 分鐘<\/option>\n        <\/select>\n        <span id=\"nextScanTxt\" style=\"font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace\"><\/span>\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:8px;margin-left:auto\">\n        <button class=\"btn-o\" id=\"notifyBtn\" onclick=\"toggleNotify()\" title=\"開啟瀏覽器推播通知\">🔔 通知已關<\/button>\n        <button class=\"btn-o\" onclick=\"switchTab('log',document.getElementById('logNavBtn'))\" style=\"position:relative\">\n          📋 訊號記錄\n          <span id=\"logBadge\" style=\"display:none;position:absolute;top:-4px;right:-4px;background:var(--short);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px\">0<\/span>\n        <\/button>\n      <\/div>\n    <\/div>\n\n    <div style=\"display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap\">\n      <span style=\"font-size:11px;color:var(--dim)\">偏見篩選：<\/span>\n      <button class=\"btn-o on\" id=\"biasAny\" onclick=\"setBiasFilter('any')\">不限<\/button>\n      <button class=\"btn-o\" id=\"biasBull\" onclick=\"setBiasFilter('bull')\">僅偏多幣種<\/button>\n      <button class=\"btn-o\" id=\"biasBear\" onclick=\"setBiasFilter('bear')\">僅偏空幣種<\/button>\n    <\/div>\n    <div style=\"display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center\">\n      <span style=\"font-size:11px;color:var(--dim)\">止損距離：<\/span>\n      <button class=\"btn-o on\" id=\"slCap\" onclick=\"setSlFilter(true)\" title=\"只看止損距離 3% 以內的訊號\">僅 ≤3%<\/button>\n      <button class=\"btn-o\" id=\"slAll\" onclick=\"setSlFilter(false)\">不限<\/button>\n      <span id=\"slHidden\" style=\"font-size:11px;color:var(--dim)\"><\/span>\n      <span style=\"font-size:11px;color:var(--dim);margin-left:10px\">斐波：<\/span>\n      <button class=\"btn-o on\" id=\"fibOte\" onclick=\"setFibMode('ote')\" title=\"SMC 最佳入場區 OTE\">SMC-OTE 0.62／0.705／0.79<\/button>\n      <button class=\"btn-o\" id=\"fibCls\" onclick=\"setFibMode('classic')\">傳統 0.5／0.618／0.786<\/button>\n    <\/div>\n\n    <div class=\"scan-head\">\n      <span>幣種<\/span><span title=\"0~100：策略條件、多時區共振、偏見、型態、盤面看法、止損距離綜合打分（滑鼠移上去看明細）\">綜合評分<\/span><span>時區<\/span><span>方向<\/span><span>止損%<\/span><span>QQE<\/span><span>偏見<\/span><span>型態加分<\/span>\n    <\/div>\n    <div class=\"slist\" id=\"scanList\">\n      <div class=\"empty\"><div class=\"empty-icon\">📡<\/div><p>點擊「開始掃描」或開啟自動掃描<br>自動抓取 OKX 全部合約（USDT + USDC + 幣本）<br>成交量 &lt; 500萬 USDT 自動排除<\/p><\/div>\n    <\/div>\n  <\/div>\n  <div style=\"font-size:11px;color:var(--dim);line-height:1.8;padding:2px 0\">\n    💡 條件：● 趨勢（4H通道方向）　● 回踩（靠近小通道）　● 過濾線（EMA12）　● QQE（藍柱多/紅柱空）　點擊幣種直接開啟 OKX\n  <\/div>\n<\/div>\n\n<!-- ==================== DATA ==================== -->\n<div class=\"panel\" id=\"panel-data\">\n  <div style=\"display:flex;gap:8px;margin-bottom:13px;align-items:center\">\n    <div style=\"position:relative;flex:1;max-width:320px\">\n      <input id=\"dataSymInput\" placeholder=\"輸入幣種，如 BTC、ETH、SOL...\"\n        style=\"width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:8px;font-size:13px;outline:none\"\n        oninput=\"filterDataSyms(this.value)\" onfocus=\"showDataDropdown()\" onblur=\"setTimeout(hideDataDropdown,200)\">\n      <div id=\"dataDropdown\" style=\"display:none;position:absolute;top:100%;left:0;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;z-index:99;max-height:200px;overflow-y:auto;margin-top:4px\"><\/div>\n    <\/div>\n    <button class=\"btn-gold\" onclick=\"loadDataFromInput()\">📊 載入分析<\/button>\n  <\/div>\n\n  <!-- 四個核心指標 -->\n  <div class=\"metrics\">\n    <div class=\"metric\"><div class=\"mlabel\">現價<\/div><div class=\"mval gold\" id=\"dPrice\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">24H 漲跌<\/div><div class=\"mval\" id=\"dChange\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">24H 成交量<\/div><div class=\"mval info\" id=\"dVol\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">資金費率<\/div><div class=\"mval\" id=\"dFund\">—<\/div><\/div>\n  <\/div>\n\n  <!-- TradingView 內嵌圖表 -->\n  <div class=\"card\" style=\"padding:0;overflow:hidden;margin-bottom:12px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)\">\n      <span style=\"font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px\">TradingView 圖表<\/span>\n      <div style=\"display:flex;gap:6px\">\n        <button onclick=\"setTVInterval('15')\" id=\"tvBtn15\" class=\"btn-o\" style=\"font-size:11px;padding:3px 9px\">15M<\/button>\n        <button onclick=\"setTVInterval('30')\" id=\"tvBtn30\" class=\"btn-o\" style=\"font-size:11px;padding:3px 9px\">30M<\/button>\n        <button onclick=\"setTVInterval('60')\" id=\"tvBtn60\" class=\"btn-o on\" style=\"font-size:11px;padding:3px 9px\">1H<\/button>\n        <button onclick=\"setTVInterval('240')\" id=\"tvBtn240\" class=\"btn-o\" style=\"font-size:11px;padding:3px 9px\">4H<\/button>\n        <button onclick=\"setTVInterval('D')\" id=\"tvBtnD\" class=\"btn-o\" style=\"font-size:11px;padding:3px 9px\">1D<\/button>\n      <\/div>\n    <\/div>\n    <div id=\"tvWidgetContainer\" style=\"height:420px\">\n      <div style=\"height:100%;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px\">載入幣種後顯示圖表<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 三欄：市場情緒 + CVD + Vegas -->\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px\">\n    <div class=\"card\">\n      <div class=\"ctitle\">市場情緒<\/div>\n      <div id=\"lsData\"><div style=\"font-size:13px;color:var(--dim)\">—<\/div><\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"ctitle\">CVD 累積成交量差<\/div>\n      <div id=\"cvdData\"><div style=\"font-size:13px;color:var(--dim)\">—<\/div><\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"ctitle\">Binance 多空人數比<\/div>\n      <div id=\"bnLsData\"><div style=\"font-size:13px;color:var(--dim)\">—<\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Vegas 指標 -->\n  <div class=\"card\">\n    <div class=\"ctitle\">Vegas 指標狀態（多時區）<\/div>\n    <div id=\"vegasData\"><div style=\"font-size:13px;color:var(--dim)\">—<\/div><\/div>\n  <\/div>\n<\/div>\n\n<!-- ==================== AI REVIEW ==================== -->\n<div class=\"panel\" id=\"panel-review\">\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n    <div>\n      <!-- 截圖上傳 -->\n      <div class=\"card\">\n        <div class=\"ctitle\">上傳 K 線截圖<\/div>\n        <input type=\"file\" id=\"imgFile\" accept=\"image/*\" style=\"display:none\" onchange=\"previewImg(event)\">\n        <div class=\"upload-zone\" onclick=\"document.getElementById('imgFile').click()\">\n          <div style=\"font-size:30px\">📸<\/div>\n          <p>點擊上傳 K 線截圖<br>JPG / PNG<\/p>\n        <\/div>\n        <img id=\"imgPrev\" class=\"img-prev\">\n        <div id=\"imgStatus\" style=\"font-size:12px;color:var(--bull);display:none\">✅ 圖片已上傳<\/div>\n      <\/div>\n      <!-- 快速提問 -->\n      <div class=\"card\">\n        <div class=\"ctitle\">快速提問模板<\/div>\n        <div class=\"quick-btns\">\n          <button class=\"qb\" onclick=\"quickAsk('為什麼這單盈利？請根據賽克斯策略幫我復盤')\">📈 盈利復盤<\/button>\n          <button class=\"qb\" onclick=\"quickAsk('為什麼這單虧損？請分析違反了哪些條件')\">📉 虧損分析<\/button>\n          <button class=\"qb\" onclick=\"quickAsk('目前盤面是否符合賽克斯進場條件？')\">✅ 策略檢查<\/button>\n          <button class=\"qb\" onclick=\"quickAsk('給我具體進場建議、止損位和目標價')\">🎯 進場建議<\/button>\n          <button class=\"qb\" onclick=\"quickAsk('日圖與4H偏見方向如何？建議做多還是做空？')\">🧭 偏見分析<\/button>\n          <button class=\"qb\" onclick=\"quickAsk('通道是盤整還是趨勢？現在適合交易嗎？')\">🔄 趨勢判斷<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div>\n      <div class=\"chatbox\">\n        <div class=\"chathead\" style=\"display:flex;justify-content:space-between;align-items:center\">\n          <div>\n            <span style=\"font-size:13px;font-weight:500;color:var(--bright)\">🤖 賽克斯策略 AI 分析師<\/span>\n            <span style=\"font-size:11px;color:var(--dim);margin-left:8px\">由 Claude 提供支援<\/span>\n          <\/div>\n          <button onclick=\"openClaude()\" style=\"padding:5px 12px;background:linear-gradient(135deg,var(--gold),#8a5f10);color:#000;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer\">在 Claude 開啟 ↗<\/button>\n        <\/div>\n        <div class=\"chatmsgs\" id=\"chatMsgs\">\n          <div class=\"msg ai\">你好！我是賽克斯策略 AI 分析師。<br><br>\n使用方式：<br>\n① 在左側上傳 K 線截圖<br>\n② 點擊快速提問或直接輸入問題<br>\n③ 點「複製到 Claude」→ 貼到 claude.ai 對話<br><br>\n或直接點右上角「在 Claude 開啟」，截圖和問題一起帶過去，我在那邊等你。<\/div>\n        <\/div>\n        <div class=\"chatinputrow\">\n          <input class=\"chatinput\" id=\"chatInput\" placeholder=\"輸入問題，或點快速提問後複製...\" onkeydown=\"if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();copyToClipboard()}\">\n          <button class=\"sendbtn\" onclick=\"copyToClipboard()\" style=\"white-space:nowrap\">複製 →<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"card\" style=\"margin-top:12px;padding:12px 14px\">\n        <div style=\"font-size:12px;color:var(--dim);line-height:1.8\">\n          💡 <strong style=\"color:var(--bright)\">使用流程：<\/strong><br>\n          1. 截圖你的 K 線圖（含 Vegas 通道和 QQE 指標）<br>\n          2. 上傳截圖 + 選快速提問<br>\n          3. 點「複製 →」複製問題文字<br>\n          4. 前往 <a href=\"https://claude.ai\" target=\"_blank\" style=\"color:var(--info)\">claude.ai<\/a> → 貼上文字 + 上傳截圖 → 送出<br>\n          5. Claude 熟悉賽克斯策略，會直接分析\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ==================== LOG ==================== -->\n<div class=\"panel\" id=\"panel-log\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px\">\n    <div>\n      <div style=\"font-size:15px;font-weight:500;color:var(--bright)\">📋 訊號記錄<\/div>\n      <div style=\"font-size:12px;color:var(--dim);margin-top:2px\">自動儲存每次掃描到的訊號，最多保留 200 筆<\/div>\n    <\/div>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"btn-o\" onclick=\"exportLog()\">📥 匯出 CSV<\/button>\n      <button class=\"btn-o\" onclick=\"clearLog()\" style=\"color:var(--short);border-color:var(--short)\">🗑️ 清除記錄<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- 統計列 -->\n  <div class=\"metrics\" style=\"margin-bottom:14px\">\n    <div class=\"metric\"><div class=\"mlabel\">總訊號數<\/div><div class=\"mval gold\" id=\"logTotal\">0<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">多單訊號<\/div><div class=\"mval bull\" id=\"logLong\">0<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">空單訊號<\/div><div class=\"mval bear\" id=\"logShort\">0<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">有型態加分<\/div><div class=\"mval\" style=\"color:#a855f7\" id=\"logPattern\">0<\/div><\/div>\n  <\/div>\n\n  <!-- 記錄表 -->\n  <div class=\"card\" style=\"padding:0\">\n    <div style=\"display:grid;grid-template-columns:130px 60px 70px 60px 80px 80px 1fr;gap:8px;padding:8px 14px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)\">\n      <span>時間<\/span><span>幣種<\/span><span>時區<\/span><span>方向<\/span><span>止損%<\/span><span>偏見<\/span><span>型態<\/span>\n    <\/div>\n    <div id=\"logList\" style=\"max-height:500px;overflow-y:auto\">\n      <div class=\"empty\"><div class=\"empty-icon\">📋<\/div><p>尚無訊號記錄<br>開始掃描後自動記錄<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ==================== TRACK ==================== -->\n<div class=\"panel\" id=\"panel-track\">\n  <!-- 統計卡 -->\n  <div class=\"metrics\" style=\"margin-bottom:14px\">\n    <div class=\"metric\"><div class=\"mlabel\">總交易筆數<\/div><div class=\"mval gold\" id=\"tkTotal\">0<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">勝場<\/div><div class=\"mval bull\" id=\"tkWin\">0<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">敗場<\/div><div class=\"mval bear\" id=\"tkLoss\">0<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">勝率<\/div><div class=\"mval gold\" id=\"tkWinRate\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">總盈虧<\/div><div class=\"mval\" id=\"tkPnL\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">平均盈虧比<\/div><div class=\"mval\" id=\"tkAvgRR\">—<\/div><\/div>\n    <div class=\"metric\"><div class=\"mlabel\">待追蹤<\/div><div class=\"mval range\" id=\"tkPending\">0<\/div><\/div>\n  <\/div>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n    <!-- 左：待追蹤清單（從訊號記錄自動建立） -->\n    <div class=\"card\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n        <div class=\"ctitle\" style=\"margin:0\">待追蹤訊號<\/div>\n        <button class=\"btn-o\" onclick=\"syncTrackFromLog()\" style=\"font-size:11px\">🔄 從記錄同步<\/button>\n      <\/div>\n      <div id=\"trackPendingList\" style=\"max-height:420px;overflow-y:auto\">\n        <div class=\"empty\"><div class=\"empty-icon\">📡<\/div><p>點「從記錄同步」<br>自動建立待追蹤清單<\/p><\/div>\n      <\/div>\n    <\/div>\n\n    <!-- 右：已完成交易記錄 -->\n    <div class=\"card\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n        <div class=\"ctitle\" style=\"margin:0\">已完成交易<\/div>\n        <div style=\"display:flex;gap:6px\">\n          <button class=\"btn-o\" onclick=\"exportTrack()\" style=\"font-size:11px\">📥 匯出<\/button>\n          <button class=\"btn-o\" onclick=\"clearTrack()\" style=\"font-size:11px;color:var(--bear);border-color:var(--bear)\">🗑️ 清除<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"trackDoneList\" style=\"max-height:420px;overflow-y:auto\">\n        <div class=\"empty\"><div class=\"empty-icon\">📊<\/div><p>尚無完成的交易記錄<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- 結算 Modal -->\n<div id=\"settleModal\" style=\"display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:center;justify-content:center\">\n  <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;width:360px;max-width:90vw\">\n    <div style=\"font-size:15px;font-weight:500;color:var(--bright);margin-bottom:16px\">📝 結算交易<\/div>\n    <div id=\"settleInfo\" style=\"font-size:13px;color:var(--dim);margin-bottom:14px;line-height:1.8\"><\/div>\n    <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:16px\">\n      <div class=\"fgroup\"><label>結果<\/label>\n        <select id=\"settleResult\" style=\"background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:7px;padding:8px;font-size:13px;width:100%\">\n          <option value=\"win\">✅ 盈利<\/option>\n          <option value=\"loss\">❌ 虧損<\/option>\n          <option value=\"be\">➡️ 保本<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"fgroup\"><label>盈虧金額 (USDT)<\/label>\n        <input type=\"number\" id=\"settlePnL\" placeholder=\"盈利填正數，虧損填負數\" style=\"background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:7px;padding:8px;font-size:13px;width:100%;outline:none\">\n      <\/div>\n      <div class=\"fgroup\"><label>備註（選填）<\/label>\n        <input type=\"text\" id=\"settleNote\" placeholder=\"例：按策略進場，QQE確認\" style=\"background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:7px;padding:8px;font-size:13px;width:100%;outline:none\">\n      <\/div>\n    <\/div>\n    <div style=\"display:flex;gap:8px\">\n      <button onclick=\"confirmSettle()\" style=\"flex:1;padding:10px;background:var(--gold);color:#000;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer\">確認結算<\/button>\n      <button onclick=\"closeModal()\" style=\"flex:1;padding:10px;background:var(--surface2);color:var(--dim);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer\">取消<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ==================== ALERT ==================== -->\n<div class=\"panel\" id=\"panel-alert\">\n\n  <!-- 狀態列 -->\n  <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px\">\n    <div>\n      <div style=\"font-size:15px;font-weight:500;color:var(--bright);margin-bottom:3px\">🔔 即時價格監控<\/div>\n      <div style=\"font-size:12px;color:var(--dim)\">OKX WebSocket 即時推播 · 觸及進場價或止損價自動通知<\/div>\n    <\/div>\n    <div style=\"display:flex;gap:8px;align-items:center\">\n      <div id=\"wsStatusDot\" style=\"width:9px;height:9px;border-radius:50%;background:var(--border)\"><\/div>\n      <span id=\"wsStatusTxt\" style=\"font-size:12px;color:var(--dim);font-family:'JetBrains Mono',monospace\">未連線<\/span>\n      <button class=\"btn-gold\" id=\"wsConnBtn\" onclick=\"toggleWS()\" style=\"padding:7px 18px;font-size:12px\">▶ 啟動監控<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- 手動新增 -->\n  <div class=\"card\" style=\"margin-bottom:14px\">\n    <div class=\"ctitle\">手動新增監控<\/div>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;align-items:end\">\n      <div class=\"fgroup\">\n        <label>幣種<\/label>\n        <div style=\"position:relative\">\n          <input id=\"alertSymInput\" placeholder=\"搜尋，如 BTC...\" oninput=\"filterAlertSyms(this.value)\" onfocus=\"showAlertDropdown()\" onblur=\"setTimeout(hideAlertDropdown,200)\"\n            style=\"width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:7px;font-size:13px;outline:none\">\n          <div id=\"alertDropdown\" style=\"display:none;position:absolute;top:100%;left:0;width:220px;background:var(--surface);border:1px solid var(--border);border-radius:8px;z-index:99;max-height:180px;overflow-y:auto;margin-top:3px\"><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"fgroup\">\n        <label>方向<\/label>\n        <select id=\"alertDir\" style=\"width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:7px;font-size:13px\">\n          <option value=\"long\">做多 ▲<\/option>\n          <option value=\"short\">做空 ▼<\/option>\n        <\/select>\n      <\/div>\n      <div class=\"fgroup\">\n        <label>進場價<\/label>\n        <input type=\"number\" id=\"alertEntry\" placeholder=\"觸及時通知進場\" style=\"width:100%;padding:8px 10px;background:var(--surface2);border:1px solid rgba(0,229,160,.4);color:var(--bright);border-radius:7px;font-size:13px;outline:none\">\n      <\/div>\n      <div class=\"fgroup\">\n        <label>止損價<\/label>\n        <input type=\"number\" id=\"alertSL\" placeholder=\"觸及時通知止損\" style=\"width:100%;padding:8px 10px;background:var(--surface2);border:1px solid rgba(255,77,109,.4);color:var(--bright);border-radius:7px;font-size:13px;outline:none\">\n      <\/div>\n      <button class=\"btn-gold\" onclick=\"addAlertManual()\" style=\"padding:9px 18px;font-size:13px;white-space:nowrap\">+ 新增<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- 監控清單 -->\n  <div style=\"display:grid;grid-template-columns:1fr 320px;gap:14px\">\n    <div class=\"card\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n        <div class=\"ctitle\" style=\"margin:0\">監控清單 <span id=\"alertCount\" style=\"color:var(--gold2);font-family:'JetBrains Mono',monospace\">0<\/span> 個<\/div>\n        <div style=\"display:flex;gap:6px\">\n          <button class=\"btn-o\" onclick=\"syncAlertsFromLog()\" style=\"font-size:11px\">🔄 從訊號記錄同步<\/button>\n          <button class=\"btn-o\" onclick=\"clearAllAlerts()\" style=\"font-size:11px;color:var(--bear);border-color:var(--bear)\">🗑️ 清除全部<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"alertList\" style=\"max-height:420px;overflow-y:auto\">\n        <div class=\"empty\"><div class=\"empty-icon\">🔔<\/div><p>新增幣種開始監控<br>或從訊號記錄同步<\/p><\/div>\n      <\/div>\n    <\/div>\n\n    <!-- 觸發記錄 -->\n    <div class=\"card\">\n      <div class=\"ctitle\">觸發記錄<\/div>\n      <div id=\"alertFireLog\" style=\"max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:6px\">\n        <div style=\"text-align:center;padding:30px;color:var(--dim);font-size:13px;opacity:.5\">尚無觸發記錄<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ==================== CALC ==================== -->\n<div class=\"panel\" id=\"panel-calc\">\n\n  <!-- 上方：RISK 公式計算 -->\n  <div class=\"card\" style=\"margin-bottom:14px\">\n    <div class=\"ctitle\">RISK 公式計算<\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr) 2fr;gap:12px;align-items:end;margin-bottom:14px\">\n      <div class=\"fgroup\">\n        <label>總資金 (USDT)<\/label>\n        <input type=\"number\" id=\"cCap\" value=\"1000\" min=\"1\" oninput=\"calcRisk()\">\n      <\/div>\n      <div class=\"fgroup\">\n        <label>風險 %<\/label>\n        <input type=\"number\" id=\"cRisk\" value=\"2\" min=\"0.1\" max=\"100\" step=\"0.5\" oninput=\"calcRisk()\">\n      <\/div>\n      <div class=\"fgroup\">\n        <label>止損距離 %<\/label>\n        <input type=\"number\" id=\"cSLpct\" value=\"2\" min=\"0.01\" step=\"0.01\" oninput=\"calcRisk()\">\n      <\/div>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\">\n        <div class=\"fgroup\">\n          <label>槓桿倍數<\/label>\n          <input type=\"number\" id=\"cLev\" value=\"25\" min=\"1\" max=\"125\" oninput=\"calcRisk()\">\n        <\/div>\n        <div style=\"display:flex;align-items:flex-end;padding-bottom:2px\">\n          <div id=\"levWarning\" style=\"font-size:11px;line-height:1.4;padding:5px 8px;border-radius:6px;width:100%\"><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <!-- 四步公式結果 -->\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\">\n      <div style=\"background:var(--surface2);border-radius:9px;padding:12px;border-top:3px solid var(--bear)\">\n        <div style=\"font-size:10px;color:var(--dim);margin-bottom:4px\">① 止損金額<\/div>\n        <div style=\"font-size:10px;color:var(--dim);margin-bottom:6px\">總資金 × 風險%<\/div>\n        <div id=\"fStep1\" style=\"font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--bear)\">—<\/div>\n      <\/div>\n      <div style=\"background:var(--surface2);border-radius:9px;padding:12px;border-top:3px solid var(--bull)\">\n        <div style=\"font-size:10px;color:var(--dim);margin-bottom:4px\">② 安全槓桿上限<\/div>\n        <div style=\"font-size:10px;color:var(--dim);margin-bottom:6px\">50 ÷ 止損%<\/div>\n        <div id=\"fStep2\" style=\"font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--bull)\">—<\/div>\n      <\/div>\n      <div style=\"background:var(--surface2);border-radius:9px;padding:12px;border-top:3px solid var(--info)\">\n        <div style=\"font-size:10px;color:var(--dim);margin-bottom:4px\">③ 倉位總價值<\/div>\n        <div style=\"font-size:10px;color:var(--dim);margin-bottom:6px\">止損金額 ÷ 止損%<\/div>\n        <div id=\"fStep3\" style=\"font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--info)\">—<\/div>\n      <\/div>\n      <div style=\"background:var(--surface2);border-radius:9px;padding:12px;border-top:3px solid var(--gold)\">\n        <div style=\"font-size:10px;color:var(--dim);margin-bottom:4px\">④ 保證金<\/div>\n        <div style=\"font-size:10px;color:var(--dim);margin-bottom:6px\">倉位總價值 ÷ 槓桿<\/div>\n        <div id=\"fStep4\" style=\"font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;color:var(--gold2)\">—<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 下方：進場計算器 -->\n  <div style=\"display:grid;grid-template-columns:340px 1fr;gap:14px\">\n\n    <!-- 左：Order Panel -->\n    <div class=\"card\">\n      <!-- 方向 -->\n      <div style=\"display:flex;gap:4px;margin-bottom:12px\">\n        <button id=\"btnLong\" onclick=\"setDir('long')\" style=\"flex:1;padding:9px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;background:rgba(0,229,160,.2);color:var(--bull);border:1px solid var(--bull)\">做多 ▲<\/button>\n        <button id=\"btnShort\" onclick=\"setDir('short')\" style=\"flex:1;padding:9px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border)\">做空 ▼<\/button>\n      <\/div>\n\n      <!-- 逐倉/全倉 -->\n      <div style=\"display:flex;gap:4px;margin-bottom:12px\">\n        <button id=\"btnIsolated\" onclick=\"setMargin('isolated')\" style=\"flex:1;padding:6px;border-radius:6px;font-size:12px;cursor:pointer;background:rgba(201,168,76,.15);color:var(--gold2);border:1px solid var(--gold);font-family:'Noto Sans TC',sans-serif\">逐倉<\/button>\n        <button id=\"btnCross\" onclick=\"setMargin('cross')\" style=\"flex:1;padding:6px;border-radius:6px;font-size:12px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:'Noto Sans TC',sans-serif\">全倉<\/button>\n        <div id=\"marginModeNote\" style=\"flex:1;font-size:10px;color:var(--dim);display:flex;align-items:center;padding:0 6px;line-height:1.4\">逐倉：虧損上限=保證金<\/div>\n      <\/div>\n\n      <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:12px\">\n        <!-- 進場價 -->\n        <div class=\"fgroup\">\n          <label>進場價 Entry<\/label>\n          <input type=\"number\" id=\"tvEntry\" placeholder=\"進場價格\" oninput=\"calcTV()\">\n        <\/div>\n        <!-- 止損 -->\n        <div class=\"fgroup\">\n          <label>止損價 Stop Loss<\/label>\n          <input type=\"number\" id=\"tvSL\" placeholder=\"止損價格\" oninput=\"calcTV()\" style=\"border-color:rgba(255,77,109,.5)\">\n        <\/div>\n        <!-- USDT成本 -->\n        <div class=\"fgroup\">\n          <label style=\"display:flex;justify-content:space-between\">\n            <span>下單成本 (USDT)<\/span>\n            <span id=\"tvQtyDisplay\" style=\"color:var(--info);font-family:'JetBrains Mono',monospace;font-size:11px\"><\/span>\n          <\/label>\n          <input type=\"number\" id=\"tvCostInput\" placeholder=\"輸入 USDT 金額\" oninput=\"calcTV()\" style=\"border-color:rgba(201,168,76,.4)\">\n        <\/div>\n        <!-- 槓桿同步 -->\n        <div class=\"fgroup\">\n          <label style=\"display:flex;justify-content:space-between\">\n            <span>槓桿<\/span>\n            <span id=\"tvLevSync\" style=\"color:var(--dim);font-size:11px\">同步上方槓桿<\/span>\n          <\/label>\n          <input type=\"number\" id=\"tvLev\" value=\"25\" min=\"1\" max=\"125\" oninput=\"calcTV()\">\n        <\/div>\n      <\/div>\n\n      <!-- 分批止盈設定 -->\n      <div style=\"border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">\n          <span style=\"font-size:12px;color:var(--bright);font-weight:500\">分批止盈<\/span>\n          <div style=\"display:flex;gap:5px\">\n            <button onclick=\"setTPMode('single')\" id=\"tpSingle\" style=\"padding:3px 9px;font-size:11px;border-radius:5px;cursor:pointer;background:rgba(0,229,160,.15);color:var(--bull);border:1px solid var(--bull);font-family:'Noto Sans TC',sans-serif\">單一<\/button>\n            <button onclick=\"setTPMode('batch')\" id=\"tpBatch\" style=\"padding:3px 9px;font-size:11px;border-radius:5px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:'Noto Sans TC',sans-serif\">分批<\/button>\n          <\/div>\n        <\/div>\n        <!-- 單一止盈 -->\n        <div id=\"tpSingleArea\">\n          <div class=\"fgroup\">\n            <label>止盈價 Take Profit<\/label>\n            <input type=\"number\" id=\"tvTP\" placeholder=\"止盈價格\" oninput=\"calcTV()\" style=\"border-color:rgba(0,229,160,.5)\">\n          <\/div>\n        <\/div>\n        <!-- 分批止盈 -->\n        <div id=\"tpBatchArea\" style=\"display:none\">\n          <div id=\"tpBatchRows\" style=\"display:flex;flex-direction:column;gap:6px\"><\/div>\n          <button onclick=\"addTPRow()\" style=\"width:100%;margin-top:7px;padding:6px;background:var(--surface2);border:1px dashed var(--border);color:var(--dim);border-radius:6px;cursor:pointer;font-size:12px;font-family:'Noto Sans TC',sans-serif\">+ 新增止盈點<\/button>\n        <\/div>\n      <\/div>\n\n      <!-- 摘要 -->\n      <div style=\"background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:12px\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:4px\"><span style=\"color:var(--dim)\">買入數量<\/span><span id=\"tvQtyShow\" style=\"font-family:'JetBrains Mono',monospace;color:var(--info)\">—<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:4px\"><span style=\"color:var(--dim)\">爆倉價<\/span><span id=\"tvLiq\" style=\"font-family:'JetBrains Mono',monospace;color:var(--bear)\">—<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:4px\"><span style=\"color:var(--dim)\">最大虧損<\/span><span id=\"tvLoss\" style=\"font-family:'JetBrains Mono',monospace;color:var(--bear)\">—<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:4px\"><span style=\"color:var(--dim)\">預期盈利<\/span><span id=\"tvProfit\" style=\"font-family:'JetBrains Mono',monospace;color:var(--bull)\">—<\/span><\/div>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--dim)\">盈虧比<\/span><span id=\"tvRR\" style=\"font-family:'JetBrains Mono',monospace;color:var(--gold2)\">—<\/span><\/div>\n      <\/div>\n    <\/div>\n\n    <!-- 右：K線圖視覺化 -->\n    <div class=\"card\" style=\"display:flex;flex-direction:column\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px\">\n        <div style=\"display:flex;gap:6px;align-items:center\">\n          <div style=\"position:relative\">\n            <input id=\"chartSymInput\" placeholder=\"搜尋幣種...\" \n              style=\"padding:4px 10px;background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:6px;font-size:12px;width:140px;outline:none\"\n              oninput=\"filterChartSyms(this.value)\" onfocus=\"showChartDropdown()\" onblur=\"setTimeout(hideChartDropdown,200)\">\n            <div id=\"chartDropdown\" style=\"display:none;position:absolute;top:100%;left:0;width:200px;background:var(--surface);border:1px solid var(--border);border-radius:8px;z-index:99;max-height:200px;overflow-y:auto;margin-top:4px\"><\/div>\n          <\/div>\n          <select id=\"chartTF\" style=\"background:var(--surface2);border:1px solid var(--border);color:var(--bright);border-radius:6px;padding:4px 8px;font-size:12px\" onchange=\"loadChart()\">\n            <option value=\"15m\">15M<\/option>\n            <option value=\"30m\">30M<\/option>\n            <option value=\"1H\" selected>1H<\/option>\n            <option value=\"4H\">4H<\/option>\n            <option value=\"1D\">1D<\/option>\n          <\/select>\n        <\/div>\n        <div style=\"display:flex;gap:5px\">\n          <button onclick=\"setChartType('candle')\" id=\"ctCandle\" style=\"padding:4px 10px;font-size:11px;border-radius:5px;cursor:pointer;background:rgba(201,168,76,.15);color:var(--gold2);border:1px solid var(--gold);font-family:'Noto Sans TC',sans-serif\">K線<\/button>\n          <button onclick=\"setChartType('line')\" id=\"ctLine\" style=\"padding:4px 10px;font-size:11px;border-radius:5px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:'Noto Sans TC',sans-serif\">線形<\/button>\n          <button onclick=\"loadChart()\" style=\"padding:4px 10px;font-size:11px;border-radius:5px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:'Noto Sans TC',sans-serif\">重整<\/button>\n        <\/div>\n      <\/div>\n      <canvas id=\"klineCanvas\" style=\"flex:1;width:100%;min-height:320px;border-radius:6px\"><\/canvas>\n      <!-- 盈虧條 -->\n      <div style=\"margin-top:10px\">\n        <div class=\"rr-track\" id=\"rrTrack\" style=\"display:none\">\n          <div class=\"rrl\" id=\"rrL\"><\/div>\n          <div class=\"rrp\" id=\"rrP\"><\/div>\n        <\/div>\n        <div style=\"display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:3px\">\n          <span id=\"rrLL\"><\/span><span id=\"rrPL\"><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"panel\" id=\"panel-macro\">\n  <div style=\"font-size:12px;color:var(--dim);margin-bottom:10px\">事件行事曆為內建靜態資料（更新於 2026-10-20，官方日期可能調整），僅供提醒。<\/div>\n  <div id=\"macStatus\" style=\"padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px\"><\/div>\n  <div style=\"font-weight:600;margin-bottom:6px\">📅 即將到來的事件（台灣時間）<\/div>\n  <div id=\"macCal\"><\/div>\n<\/div>\n\n<!-- ==================== POSEIDON (海神策略) ==================== -->\n<div class=\"panel\" id=\"panel-poseidon\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px\">\n    <div>\n      <div style=\"font-size:15px;font-weight:500;color:var(--bright);margin-bottom:3px\">📖 策略手冊<\/div>\n      <div style=\"font-size:12px;color:var(--dim)\">五套策略的核心邏輯、進場檢查清單與槓桿速查，切換下方分頁查看<\/div>\n    <\/div>\n  <\/div>\n\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)\">\n    <button class=\"btn-o doc-strat-btn\" onclick=\"setDocStrategy('saxis',this)\">🎲 賽克斯（Vegas+QQE）<\/button>\n    <button class=\"btn-o doc-strat-btn\" onclick=\"setDocStrategy('wicket',this)\">🎯 威克特（BB+MACD）<\/button>\n    <button class=\"btn-o doc-strat-btn\" onclick=\"setDocStrategy('hunter',this)\">🏹 獵影（OBV+ATR）<\/button>\n    <button class=\"btn-o doc-strat-btn on\" onclick=\"setDocStrategy('poseidon',this)\">🔱 海神（TuTCI+MSS）<\/button>\n    <button class=\"btn-o doc-strat-btn\" onclick=\"setDocStrategy('13333',this)\">🎯 13333法則（首K突破回測）<\/button>\n  <\/div>\n\n  <!-- ==================== 賽克斯 ==================== -->\n  <div class=\"doc-section\" id=\"doc-saxis\" style=\"display:none\">\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px\">\n      <div>\n        <div style=\"font-size:15px;font-weight:500;color:var(--bright);margin-bottom:3px\">🎲 賽克斯策略（Vegas Channel + QQE）<\/div>\n        <div style=\"font-size:12px;color:var(--dim)\">雙 EMA 通道判斷大趨勢・回踩確認・過濾線+QQE 抓進場時機<\/div>\n      <\/div>\n      <div style=\"display:flex;gap:6px\">\n        <span class=\"badge bbull\">趨勢跟隨型<\/span>\n        <span class=\"badge brange\">4H 定方向<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"bias-grid\" style=\"margin-bottom:14px\">\n      <div class=\"bias-card bull-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">多頭排列<\/span><\/div>\n        <div class=\"bias-sym\">小通道(EMA144/169) 在大通道(EMA576/676) 上方<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">大趨勢偏多，只找多單機會，逆勢空單訊號直接忽略。<\/div>\n      <\/div>\n      <div class=\"bias-card range-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">空頭排列<\/span><\/div>\n        <div class=\"bias-sym\">小通道 在大通道 下方<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">大趨勢偏空，只找空單機會，逆勢多單訊號直接忽略。<\/div>\n      <\/div>\n      <div class=\"bias-card neutral-card\">\n        <div class=\"tf-badge\"><span style=\"background:var(--border);padding:2px 8px;border-radius:4px;font-size:10px\">核心流程<\/span><\/div>\n        <div class=\"bias-sym\">趨勢 → 回踩 → 過濾線 → QQE<\/div>\n        <div class=\"bias-summary\" style=\"margin-top:0;padding-top:0;border-top:none\">4H 判斷趨勢與回踩，進場時區用 <strong>EMA12 過濾線<\/strong> 定方向，<strong>QQE 紅/藍柱<\/strong>確認動能出手。<\/div>\n      <\/div>\n    <\/div>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n      <div class=\"card\">\n        <div class=\"ctitle\">✅ 進場前檢查清單<\/div>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13px;margin-bottom:10px\">\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"sxChk1\" onchange=\"docChecklistUpdate('sx',true)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            4H 小通道與大通道方向一致（多頭排列 / 空頭排列）\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"sxChk2\" onchange=\"docChecklistUpdate('sx',true)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            4H 價格回踩小通道但未跌破/突破關鍵 EMA（144或169）\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"sxChk3\" onchange=\"docChecklistUpdate('sx',true)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            進場時區（15M/30M/1H，非 4H）收盤站上/跌破 EMA12 過濾線\n          <\/label>\n          <label style=\"display:flex;gap:8px;align-items:center;cursor:pointer\">\n            <input type=\"checkbox\" id=\"sxChk4\" onchange=\"docChecklistUpdate('sx',true)\" style=\"accent-color:var(--gold);width:15px;height:15px\">\n            <span>QQE 出現藍柱(多)／紅柱(空) <span style=\"color:var(--dim)\">— 加分項<\/span><\/span>\n          <\/label>\n        <\/div>\n        <div id=\"sxVerdict\" class=\"advice\"><\/div>\n      <\/div>\n\n      <div class=\"card\">\n        <div class=\"ctitle\">🎯 止盈止損建議<\/div>\n        <div style=\"font-size:13px;line-height:1.8;color:var(--text)\">\n          <strong style=\"color:var(--bear)\">止損：<\/strong>設於 4H 小通道邊界（EMA144 或 EMA169），若使用備用大通道則設在大通道邊界。\n          <br>\n          <strong style=\"color:var(--bull)\">出場／止盈：<\/strong>觀察 QQE 出現反向柱體（多單轉紅、空單轉藍）作為動能減弱訊號，或以大通道邊界作為長線目標。\n        <\/div>\n        <div style=\"margin-top:10px;display:flex;gap:8px\">\n          <button class=\"btn-o\" onclick=\"docGotoCalc('sx')\">🧮 前往倉位計算，代入止損%與槓桿<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"ctitle\">⚖️ 槓桿觀念速查<\
