onst symEl = document.getElementById(prefix+'-sym');\n  const rowsEl = document.getElementById(prefix+'-rows');\n  const sumEl  = document.getElementById(prefix+'-sum');\n  const card   = symEl.closest('.bias-card');\n\n  card.className = 'bias-card ' + cardClass;\n  symEl.textContent = symLabel(sym);\n\n  if (!analysis) {\n    rowsEl.innerHTML = '<div style=\"font-size:12px;color:var(--dim)\">數據不足<\/div>';\n    return;\n  }\n\n  const e576txt = analysis.e576 ? '$'+fmtP(analysis.e576) : '—';\n  const e676txt = analysis.e676 ? '$'+fmtP(analysis.e676) : '—';\n  const smallMid = (analysis.e144+analysis.e169)/2;\n  const largeMid = analysis.e576 && analysis.e676 ? (analysis.e576+analysis.e676)/2 : null;\n  const channelPos = largeMid\n    ? (smallMid > largeMid\n        ? '<span style=\"color:var(--bull);font-size:12px\">小通道在大通道上方 ▲<\/span>'\n        : '<span style=\"color:var(--bear);font-size:12px\">小通道在大通道下方 ▼<\/span>')\n    : '<span style=\"color:var(--dim);font-size:12px\">大通道數據不足<\/span>';\n\n  const nearTxt = analysis.near\n    ? (analysis.usingLargeChannel\n        ? '<span style=\"color:var(--range);font-size:12px\">⚠️ 測試大通道（備用）<\/span>'\n        : '<span style=\"color:var(--bull);font-size:12px\">✅ 回踩小通道<\/span>')\n    : '<span style=\"color:var(--dim);font-size:12px\">未回踩<\/span>';\n\n  rowsEl.innerHTML = `\n    <div class=\"bias-row\"><span class=\"bk\">${tfLabel} 趨勢<\/span>${biasLabel(bias)}<\/div>\n    <div class=\"bias-row\"><span class=\"bk\">通道位置<\/span>${channelPos}<\/div>\n    <div class=\"bias-row\"><span class=\"bk\">回踩狀態<\/span>${nearTxt}<\/div>\n    <div class=\"bias-row\"><span class=\"bk\">EMA144（小通道上）<\/span><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--info)\">$${fmtP(analysis.e144)}<\/span><\/div>\n    <div class=\"bias-row\"><span class=\"bk\">EMA169（小通道下）<\/span><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--info)\">$${fmtP(analysis.e169)}<\/span><\/div>\n    <div class=\"bias-row\"><span class=\"bk\">EMA576（大通道上）<\/span><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,77,109,.8)\">${e576txt}<\/span><\/div>\n    <div class=\"bias-row\"><span class=\"bk\">EMA676（大通道下）<\/span><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,77,109,.8)\">${e676txt}<\/span><\/div>\n    <div class=\"bias-row\"><span class=\"bk\">EMA12 過濾線<\/span><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold2)\">$${fmtP(analysis.e12)}<\/span><\/div>\n    <div class=\"bias-row\"><span class=\"bk\">現價 vs 過濾線<\/span><span>${analysis.aboveFilter?'<span style=\"color:var(--bull);font-size:12px\">↑ 過濾線上方<\/span>':'<span style=\"color:var(--bear);font-size:12px\">↓ 過濾線下方<\/span>'}<\/span><\/div>\n    <div class=\"bias-row\"><span class=\"bk\">通道纏繞<\/span><span style=\"font-size:12px;color:${analysis.ranging?'var(--range)':'var(--dim)'}\">${analysis.ranging?'⚠️ 纏繞，不宜交易':'否'}<\/span><\/div>`;\n\n  let summary = '';\n  if (bias==='bull') summary = `<strong>${tfLabel} 偏多：<\/strong>小通道在上，趨勢結構向上，建議此時區只找做多機會。`;\n  else if (bias==='bear') summary = `<strong>${tfLabel} 偏空：<\/strong>小通道在下，趨勢結構向下，建議此時區只找做空機會。`;\n  else if (bias==='range' && !analysis.e576) summary = `<strong>${tfLabel} 資料不足：<\/strong>大通道（EMA576／676）需要 700 根以上 K 棒，這個幣歷史不夠，不判斷方向。`;\n  else if (bias==='range') summary = `<strong>${tfLabel} 盤整：<\/strong>通道纏繞，方向不明，此時區不建議交易。`;\n  else summary = `<strong>${tfLabel} 訊號不足：<\/strong>K線數量不夠，無法判斷偏見。`;\n  sumEl.innerHTML = summary;\n}\n\nasync function loadBias() {\n  const inputVal = document.getElementById('biasSymInput').value.trim().toUpperCase()\n    .replace(/\\s+/g,'').replace(/\\//g,'').replace(/-/g,'').replace('USDT','').replace('USDC','').replace('SWAP','');\n\n  // 先確保幣種清單已載入\n  if(!allSwapSyms.length) await getAllSymsList();\n\n  // 從清單找最匹配的幣種\n  if(inputVal && document.getElementById('biasSymInput').value!==symLabel(currentBiasSym)){\n    const match =\n      allSwapSyms.find(s=>s===inputVal+'-USDT-SWAP') ||\n      allSwapSyms.find(s=>s.startsWith(inputVal+'-USDT-')) ||\n      allSwapSyms.find(s=>s.startsWith(inputVal+'-'));\n    if(match) currentBiasSym = match;\n  }\n\n  const sym = currentBiasSym;\n  ['bD','b4'].forEach(p => {\n    document.getElementById(p+'-rows').innerHTML = '<div class=\"spinner\"><\/div> 載入中...';\n    document.getElementById(p+'-sum').innerHTML = '';\n  });\n  document.getElementById('biasVerdict').style.display = 'none';\n\n  const [dA, h4A] = await Promise.all([\n    analyzeTF(sym, OKX_TF.D, 300),\n    analyzeTF(sym, OKX_TF.H4, 300),\n  ]);\n\n  renderBiasCard('bD', sym, dA, '日圖');\n  renderBiasCard('b4', sym, h4A, '4H');\n\n  const bD = getBias(dA), b4 = getBias(h4A);\n  biasCacheMap[sym] = { D:bD, H4:b4 };\n\n  // Verdict\n  let verdict='', vClass='';\n  if (bD==='bull' && b4==='bull') { verdict='🟢 強烈偏多！日圖與 4H 同步偏多，優先尋找做多機會，等待 15M~1H 出現多單進場訊號。'; vClass='bull'; }\n  else if (bD==='bear' && b4==='bear') { verdict='🔴 強烈偏空！日圖與 4H 同步偏空，優先尋找做空機會，等待 15M~1H 出現空單進場訊號。'; vClass='bear'; }\n  else if (bD==='range' && b4==='range') { verdict='⚠️ 日圖與 4H 皆盤整，通道纏繞，不建議方向性交易，等待方向明確。'; vClass='range'; }\n  else if (bD==='bull' && b4==='range') { verdict='🟡 日圖偏多、4H 盤整。等 4H 走出多頭方向再找 15M~1H 多單。'; vClass='bull'; }\n  else if (bD==='bear' && b4==='range') { verdict='🟡 日圖偏空、4H 盤整。等 4H 走出空頭方向再找 15M~1H 空單。'; vClass='bear'; }\n  else if (bD==='range') { verdict='⚠️ 日圖盤整、4H 有方向，僅屬短線行情，謹慎操作、縮小倉位。'; vClass='range'; }\n  else { verdict='⚠️ 日圖與 4H 方向相反，建議等待 4H 與日線重新同向後再進場。'; vClass='range'; }\n\n  document.getElementById('biasVerdict').style.display = 'block';\n  document.getElementById('biasVerdictContent').innerHTML = `\n    <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n      <div style=\"font-size:14px;color:var(--${vClass==='bull'?'bull':vClass==='bear'?'bear':'range'});flex:1;line-height:1.7\">${verdict}<\/div>\n      <div style=\"display:flex;gap:8px\">${['日圖:'+bD,'4H:'+b4].map(t=>{const[l,v]=t.split(':');return`<div style=\"text-align:center\"><div style=\"font-size:10px;color:var(--dim);margin-bottom:3px\">${l}<\/div>${biasLabel(v)}<\/div>`}).join('')}<\/div>\n    <\/div>`;\n}\n\n// 動態批量偏見：從 OKX 抓前 30 大成交量幣種\nlet dynamicTopSyms = [];\nasync function getTopSyms() {\n  if(dynamicTopSyms.length) return dynamicTopSyms;\n  try{\n    const d = await okxFetch('/api/v5/market/tickers?instType=SWAP');\n    if(!d.data) return [];\n    dynamicTopSyms = d.data\n      .filter(t=>t.instId.endsWith('-USDT-SWAP'))\n      .sort((a,b)=>parseFloat(b.volCcy24h||0)-parseFloat(a.volCcy24h||0))\n      .slice(0,30)\n      .map(t=>t.instId);\n    return dynamicTopSyms;\n  }catch(e){ return []; }\n}\n\n// 搜尋幣種 helpers（偏見 + 數據分析共用）\nlet allSwapSyms = [];\nasync function getAllSymsList() {\n  if(allSwapSyms.length) return allSwapSyms;\n  try{\n    const d = await okxFetch('/api/v5/market/tickers?instType=SWAP');\n    if(!d.data) return [];\n    allSwapSyms = d.data\n      .filter(t=>t.instId.endsWith('-USDT-SWAP')||t.instId.endsWith('-USDC-SWAP')||t.instId.endsWith('-USD-SWAP'))\n      .sort((a,b)=>parseFloat(b.volCcy24h||0)-parseFloat(a.volCcy24h||0))\n      .map(t=>t.instId);\n    return allSwapSyms;\n  }catch(e){ return []; }\n}\n\n// ── 現貨／永續 清楚標示的搜尋（仿 OKX：輸入 BTC 會同時列出現貨與永續） ──\nlet allSpotSyms=[], _spotP=null;\nfunction loadSpotSyms(){\n  if(_spotP) return _spotP;\n  _spotP=okxFetch('/api/v5/public/instruments?instType=SPOT').then(d=>{ allSpotSyms=(d.data||[]).filter(x=>x.state==='live'&&/^(USDT|USDC)$/.test(x.quoteCcy)).map(x=>x.instId); return allSpotSyms; }).catch(()=>{ _spotP=null; return []; });\n  return _spotP;\n}\nconst symIsPerp=id=>/-SWAP$/.test(id);\nconst symBase=id=>String(id).replace(/-(USDT|USDC|USD)(-SWAP)?$/,'');\nconst symQuote=id=>id.includes('-USDC')?'USDC':(/-USD-SWAP$/.test(id)?'USD':'USDT');\nconst symLabel=id=>symBase(id)+'/'+symQuote(id)+(symIsPerp(id)?' 永續':' 現貨');\nconst symBadge=id=>symIsPerp(id)\n  ?'<span style=\"font:700 10px sans-serif;padding:2px 6px;border-radius:4px;background:rgba(59,158,255,.18);color:#6ab8ff;margin-left:6px\">永續<\/span>'\n  :'<span style=\"font:700 10px sans-serif;padding:2px 6px;border-radius:4px;background:rgba(255,184,79,.18);color:#ffb84f;margin-left:6px\">現貨<\/span>';\nfunction searchSyms(q,limit){\n  q=(q||'').toUpperCase().replace(/[\\s\\/_\\-]+/g,'').replace(/(永續|現貨)/g,'');\n  const all=allSwapSyms.concat(allSpotSyms);\n  const ord=id=>(symQuote(id)==='USDT'?0:2)+(symIsPerp(id)?0:1);\n  if(!q) return allSwapSyms.slice(0,limit||14);\n  const hit=id=>{ const b=symBase(id).toUpperCase(); return b.startsWith(q)||id.replace(/-/g,'').toUpperCase().startsWith(q); };\n  return all.filter(hit).sort((a,b)=>((symBase(a)===q?0:1)-(symBase(b)===q?0:1))||(symBase(a).length-symBase(b).length)||(symBase(a)<symBase(b)?-1:symBase(a)>symBase(b)?1:0)||(ord(a)-ord(b))).slice(0,limit||14);\n}\nfunction renderSymDD(ddId,q,fn,fs){\n  const dd=document.getElementById(ddId), list=searchSyms(q,16);\n  dd.innerHTML=list.length?list.map(id=>`<div onclick=\"${fn}('${id}','${symLabel(id)}')\" style=\"padding:8px 12px;font-size:${fs||13}px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:center\" onmouseover=\"this.style.background='var(--surface2)'\" onmouseout=\"this.style.background=''\"><span>${symBase(id)}/${symQuote(id)}<\/span>${symBadge(id)}<span style=\"margin-left:auto;font-size:10px;color:var(--dim)\">${id}<\/span><\/div>`).join(''):'<div style=\"padding:8px 12px;font-size:12px;color:var(--dim)\">無結果<\/div>';\n  if(!allSwapSyms.length) getAllSymsList().then(()=>{ if(dd.style.display!=='none') renderSymDD(ddId,q,fn,fs); });\n  if(!_spotP) loadSpotSyms().then(()=>{ if(dd.style.display!=='none') renderSymDD(ddId,q,fn,fs); });\n}\n\n// ── 偏見搜尋框 ──\nlet currentBiasSym = 'BTC-USDT-SWAP';\nfunction showBiasDropdown(){ renderBiasDropdown(document.getElementById('biasSymInput').value); document.getElementById('biasDropdown').style.display='block'; }\nfunction hideBiasDropdown(){ document.getElementById('biasDropdown').style.display='none'; }\nasync function filterBiasSyms(q){\n  const syms = await getAllSymsList();\n  renderBiasDropdown(q, syms);\n}\nfunction renderBiasDropdown(q, syms){ renderSymDD('biasDropdown',q,'selectBiasSym'); }\nfunction selectBiasSym(sym, label){\n  currentBiasSym=sym;\n  document.getElementById('biasSymInput').value=label;\n  document.getElementById('biasDropdown').style.display='none';\n  // 選完立即分析，不需要再按按鈕\n  loadBias();\n}\nfunction getBiasSym(){ return currentBiasSym; }\n\n// ── 數據分析搜尋框 ──\nlet currentDataSym = 'BTC-USDT-SWAP';\nfunction showDataDropdown(){ renderDataDropdown(document.getElementById('dataSymInput').value); document.getElementById('dataDropdown').style.display='block'; }\nfunction hideDataDropdown(){ document.getElementById('dataDropdown').style.display='none'; }\nasync function filterDataSyms(q){\n  const syms = await getAllSymsList();\n  renderDataDropdown(q, syms);\n}\nfunction renderDataDropdown(q, syms){ renderSymDD('dataDropdown',q,'selectDataSym'); }\nfunction selectDataSym(sym, label){\n  currentDataSym=sym;\n  document.getElementById('dataSymInput').value=label;\n  document.getElementById('dataDropdown').style.display='none';\n  loadData(currentDataSym);\n}\nasync function loadDataFromInput(){\n  const inputVal = document.getElementById('dataSymInput').value.trim().toUpperCase()\n    .replace(/\\s+/g,'').replace(/\\//g,'').replace(/-/g,'').replace('USDT','').replace('USDC','').replace('SWAP','');\n  if(!allSwapSyms.length) await getAllSymsList();\n  if(inputVal && document.getElementById('dataSymInput').value!==symLabel(currentDataSym)){\n    const match =\n      allSwapSyms.find(s=>s===inputVal+'-USDT-SWAP') ||\n      allSwapSyms.find(s=>s.startsWith(inputVal+'-USDT-')) ||\n      allSwapSyms.find(s=>s.startsWith(inputVal+'-'));\n    if(match) currentDataSym=match;\n  }\n  loadData(currentDataSym);\n}\n\n// ── AI 復盤：複製到剪貼簿 + 開啟 Claude ──\nfunction quickAsk(q){ document.getElementById('chatInput').value=q; }\nfunction openClaude(){\n  const msg=document.getElementById('chatInput').value||'請幫我根據賽克斯策略分析這個盤面';\n  const encoded=encodeURIComponent(msg);\n  window.open(`https://claude.ai/new?q=${encoded}`,'_blank');\n}\nfunction copyToClipboard(){\n  const msg=document.getElementById('chatInput').value;\n  if(!msg){ toast('請先輸入問題或點快速提問'); return; }\n  navigator.clipboard.writeText(msg).then(()=>{\n    toast('✅ 已複製！去 claude.ai 貼上並上傳截圖');\n    appendReviewMsg('已複製問題：'+msg,'user');\n    appendReviewMsg('請前往 <a href=\"https://claude.ai\" target=\"_blank\" style=\"color:var(--info)\">claude.ai<\/a> 貼上問題並上傳截圖，Claude 熟悉賽克斯策略會直接分析。','ai');\n    document.getElementById('chatInput').value='';\n  }).catch(()=>{\n    // fallback\n    const ta=document.createElement('textarea');\n    ta.value=msg; document.body.appendChild(ta); ta.select(); document.execCommand('copy');\n    document.body.removeChild(ta);\n    toast('✅ 已複製！');\n  });\n}\nfunction appendReviewMsg(text,cls){\n  const box=document.getElementById('chatMsgs');\n  const div=document.createElement('div');\n  div.className='msg '+cls; div.innerHTML=text;\n  box.appendChild(div); box.scrollTop=box.scrollHeight;\n}\n\nasync function scanAllBias() {\n  const tbody = document.getElementById('batchBiasBody');\n  document.getElementById('batchBiasCard').style.display = 'block';\n  tbody.innerHTML = '<tr><td colspan=\"5\" style=\"text-align:center;color:var(--dim);padding:20px\"><span class=\"spinner\"><\/span> 載入前30大成交量幣種...<\/td><\/tr>';\n\n  const topSyms = await getTopSyms();\n  if(!topSyms.length){ tbody.innerHTML='<tr><td colspan=\"5\" style=\"text-align:center;color:var(--dim);padding:20px\">無法載入幣種列表<\/td><\/tr>'; return; }\n  tbody.innerHTML = '<tr><td colspan=\"5\" style=\"text-align:center;color:var(--dim);padding:20px\"><span class=\"spinner\"><\/span> 批量分析中...<\/td><\/tr>';\n\n  const results = [];\n  for (const sym of topSyms) {\n    const [dA,h4A] = await Promise.all([\n      analyzeTF(sym,OKX_TF.D,300),\n      analyzeTF(sym,OKX_TF.H4,300),\n    ]);\n    const bD=getBias(dA), b4=getBias(h4A);\n    biasCacheMap[sym] = {D:bD,H4:b4};\n    let overall='neutral', advice='觀望';\n    if(bD==='bull'&&b4==='bull'){overall='bull';advice='積極做多'}\n    else if(bD==='bear'&&b4==='bear'){overall='bear';advice='積極做空'}\n    else if(bD==='bull'&&b4==='range'){overall='bull';advice='等4H轉多'}\n    else if(bD==='bear'&&b4==='range'){overall='bear';advice='等4H轉空'}\n    else if(bD==='range'&&b4==='range'){overall='range';advice='等待方向'}\n    else if(bD==='range'){advice='短線謹慎'}\n    else {advice='等4H與日線同向'}\n    results.push({sym,bD,b4,overall,advice});\n    await new Promise(r=>setTimeout(r,80));\n  }\n\n  tbody.innerHTML = results.map(r => {\n    const baseName=symBase(r.sym);\n    const settle=r.sym.includes('-USDC-')?'USDC':r.sym.includes('-USD-SWAP')&&!r.sym.includes('-USDT-')?'USD':'USDT';\n    const contractLabel=settle==='USD'?`${baseName}/USD CM`:settle==='USDC'?`${baseName}/USDC`:`${baseName}/USDT`;\n    const vc = r.overall==='bull'?'verdict-bull':r.overall==='bear'?'verdict-bear':r.overall==='range'?'verdict-range':'verdict-neutral';\n    return `<tr>\n      <td style=\"font-weight:500\">${contractLabel}<br><span style=\"font-size:10px;color:var(--dim)\">${settle==='USD'?'幣本合約':'永續合約'}<\/span><\/td>\n      <td>${biasLabel(r.bD)}<\/td>\n      <td>${biasLabel(r.b4)}<\/td>\n      <td class=\"${vc}\">${r.overall==='bull'?'偏多 ▲':r.overall==='bear'?'偏空 ▼':r.overall==='range'?'盤整 ↔':'方向分歧'}<\/td>\n      <td style=\"color:var(--dim);font-size:12px\">${r.advice}<\/td>\n    <\/tr>`;\n  }).join('');\n  toast('✅ 批量偏見分析完成');\n}\n\n// ============================================================\n// SCANNER\n// ============================================================\nasync function startScan() {\n  if (scanning) return;\n  scanning = true;\n  const btn=document.getElementById('scanBtn');\n  btn.disabled=true; btn.innerHTML='<span class=\"spinner\"><\/span>掃描中...';\n  scanData=[];\n  document.getElementById('scanList').innerHTML='';\n  document.getElementById('pfill').style.width='0%';\n\n  let syms;\n  try {\n    console.log('[掃描] 步驟1：取得合約列表...');\n    document.getElementById('ptext').textContent='取得全部合約列表（USDT + USDC + 幣本）...';\n    const allSyms = await fetchAllSwapSymbols();\n    console.log('[掃描] 步驟1完成，共', allSyms.length, '個合約');\n    document.getElementById('mTotal').textContent = allSyms.length;\n\n    console.log('[掃描] 步驟2：過濾成交量...');\n    // 成交量過濾\n    syms = await filterByVolume(allSyms);\n    console.log('[掃描] 步驟2完成，剩', syms.length, '個合約', syms.slice(0,5));\n    document.getElementById('mFiltered').textContent = syms.length;\n    document.getElementById('ptext').textContent = `共 ${allSyms.length} 個合約，成交量過濾後剩 ${syms.length} 個，開始策略掃描...`;\n  } catch(e) {\n    console.error('[掃描] 步驟1/2失敗：', e);\n    document.getElementById('ptext').textContent='❌ 無法連接 OKX API，請確認網路';\n    toast('❌ 連線失敗');\n    scanning=false; btn.disabled=false; btn.innerHTML='🔍 重新掃描'; return;\n  }\n\n  let done=0,l15=0,s15=0,l30=0,s30=0,l1h=0,s1h=0,l4h=0,s4h=0,ranged=0;\n\n  for (let i=0; i<syms.length; i+=2) {\n    const batch=syms.slice(i,i+2);\n    await Promise.all(batch.map(async sym => {\n      try {\n        if(activeStrategy==='wicket'){\n          // ═══ 威克特策略掃描路徑 ═══\n          // 需要 OHLC 完整資料，不能只用收盤價\n          const oc15 = await fetchOHLC(sym,'15m',300);\n          const oc30 = await fetchOHLC(sym,'30m',300);\n          const oc1h = await fetchOHLC(sym,'1H',300);\n\n          const addWicketResult = (oc, tf) => {\n            if(!oc || oc.length<50) return;\n            const w = analyzeWicket(oc);\n            if(!w) return;\n            const closes = oc.map(c=>c.c);\n\n            // 多單需全部4條件成立；空單同理\n            const longOk  = w.longCond.every(Boolean);\n            const shortOk = w.shortCond.every(Boolean);\n\n            if(longOk){\n              if(tf==='15M')l15++;else if(tf==='30M')l30++;else if(tf==='1H')l1h++;else l4h++;\n              const patterns = detectPatterns(closes,'long');\n              const patternScore = patterns.reduce((s,p)=>s+p.strength,0);\n              scanData.push({sym,tf,dir:'long',score:w.ls,patternScore,patterns,\n                conds:w.longCond, p:w.p, dist:'—', slPct:w.suggestedSLpct,\n                qqe:'—', dailyBias:'—', channelNote:'wicket',\n                wicketInfo:{squeeze:w.squeeze, goldenDist:w.goldenDist, mid:w.mid, upper:w.upper, lower:w.lower}});\n            } else if(shortOk){\n              if(tf==='15M')s15++;else if(tf==='30M')s30++;else if(tf==='1H')s1h++;else s4h++;\n              const patterns = detectPatterns(closes,'short');\n              const patternScore = patterns.reduce((s,p)=>s+p.strength,0);\n              scanData.push({sym,tf,dir:'short',score:w.ss,patternScore,patterns,\n                conds:w.shortCond, p:w.p, dist:'—', slPct:w.suggestedSLpct,\n                qqe:'—', dailyBias:'—', channelNote:'wicket',\n                wicketInfo:{squeeze:w.squeeze, deathDist:w.deathDist, mid:w.mid, upper:w.upper, lower:w.lower}});\n            }\n          };\n\n          addWicketResult(oc15,'15M');\n          addWicketResult(oc30,'30M');\n          addWicketResult(oc1h,'1H');\n\n          document.getElementById('m15L').textContent=l15;\n          document.getElementById('m15S').textContent=s15;\n          document.getElementById('m30L').textContent=l30;\n          document.getElementById('m30S').textContent=s30;\n          document.getElementById('m1hL').textContent=l1h;\n          document.getElementById('m1hS').textContent=s1h;\n          renderScan(scanData);\n          done++;\n          return;\n        }\n\n        if(activeStrategy==='hunter'){\n          // ═══ 獵影策略掃描路徑 ═══\n          // 需要 OHLC + 成交量資料\n          const oc15 = await fetchOHLC(sym,'15m',300);\n          const oc30 = await fetchOHLC(sym,'30m',300);\n          const oc1h = await fetchOHLC(sym,'1H',300);\n\n          const addHunterResult = (oc, tf) => {\n            if(!oc || oc.length<30) return;\n            const h = analyzeHunter(oc);\n            if(!h) return;\n            const closes = oc.map(c=>c.c);\n\n            const longOk  = h.longCond.every(Boolean);\n            const shortOk = h.shortCond.every(Boolean);\n\n            if(longOk){\n              if(tf==='15M')l15++;else if(tf==='30M')l30++;else if(tf==='1H')l1h++;else l4h++;\n              const patterns = detectPatterns(closes,'long');\n              const patternScore = patterns.reduce((s,p)=>s+p.strength,0);\n              scanData.push({sym,tf,dir:'long',score:h.ls,patternScore,patterns,\n                conds:h.longCond, p:h.p, dist:'—', slPct:h.suggestedSLpct,\n                qqe:'—', dailyBias:'—', channelNote:'hunter',\n                hunterInfo:{isRanging:h.isRangingMarket, pattern:h.pattern, atr:h.atr}});\n            } else if(shortOk){\n              if(tf==='15M')s15++;else if(tf==='30M')s30++;else if(tf==='1H')s1h++;else s4h++;\n              const patterns = detectPatterns(closes,'short');\n              const patternScore = patterns.reduce((s,p)=>s+p.strength,0);\n              scanData.push({sym,tf,dir:'short',score:h.ss,patternScore,patterns,\n                conds:h.shortCond, p:h.p, dist:'—', slPct:h.suggestedSLpct,\n                qqe:'—', dailyBias:'—', channelNote:'hunter',\n                hunterInfo:{isRanging:h.isRangingMarket, pattern:h.pattern, atr:h.atr}});\n            }\n          };\n\n          addHunterResult(oc15,'15M');\n          addHunterResult(oc30,'30M');\n          addHunterResult(oc1h,'1H');\n\n          document.getElementById('m15L').textContent=l15;\n          document.getElementById('m15S').textContent=s15;\n          document.getElementById('m30L').textContent=l30;\n          document.getElementById('m30S').textContent=s30;\n          document.getElementById('m1hL').textContent=l1h;\n          document.getElementById('m1hS').textContent=s1h;\n          renderScan(scanData);\n          done++;\n          return;\n        }\n\n        if(activeStrategy==='13333'){\n          // ═══ 13333法則掃描路徑（首K突破回測延續）═══\n          // PDF 建議週期：15分鐘\n          const oc15 = await fetchOHLC(sym,'15m',300);\n\n          const addTKResult = (oc, tf, tfMin) => {\n            if(!oc || oc.length<20) return;\n            const k = analyze13333(oc, tfMin);\n            if(!k) return;\n            const closes = oc.map(c=>c.c);\n            const longOk  = k.longCond.every(Boolean);\n            const shortOk = k.shortCond.every(Boolean);\n            const info = {session:k.session, rangeHigh:k.rangeHigh, rangeLow:k.rangeLow, opps:k.opps, summer:k.summer};\n            if(longOk){\n              if(tf==='15M')l15++;else if(tf==='30M')l30++;else l1h++;\n              const patterns = detectPatterns(closes,'long');\n              scanData.push({sym,tf,dir:'long',score:k.ls,patternScore:patterns.reduce((s,p)=>s+p.strength,0),patterns,\n                conds:k.longCond, p:k.p, dist:'—', slPct:k.slL.toFixed(2),\n                qqe:'—', dailyBias:'—', channelNote:'13333', tkInfo:info});\n            } else if(shortOk){\n              if(tf==='15M')s15++;else if(tf==='30M')s30++;else s1h++;\n              const patterns = detectPatterns(closes,'short');\n              scanData.push({sym,tf,dir:'short',score:k.ss,patternScore:patterns.reduce((s,p)=>s+p.strength,0),patterns,\n                conds:k.shortCond, p:k.p, dist:'—', slPct:k.slS.toFixed(2),\n                qqe:'—', dailyBias:'—', channelNote:'13333', tkInfo:info});\n            }\n          };\n          addTKResult(oc15,'15M',15);\n\n          document.getElementById('m15L').textContent=l15;\n          document.getElementById('m15S').textContent=s15;\n          document.getElementById('m30L').textContent=l30;\n          document.getElementById('m30S').textContent=s30;\n          document.getElementById('m1hL').textContent=l1h;\n          document.getElementById('m1hS').textContent=s1h;\n          renderScan(scanData);\n          done++;\n          return;\n        }\n\n        if(activeStrategy==='poseidon'){\n          // ═══ 海神策略掃描路徑（TuTCI 通道突破 + MSS 結構轉換）═══\n          // 4H 先判斷是否為單邊行情 + 大趨勢方向（海神時區交易法：4H定方向）\n          const h4oc = await fetchOHLC(sym,'4H',300);\n          const h4h = analyzeHaishen(h4oc);\n          if(!h4h){ done++; return; }\n          if(!h4h.singleSided){ ranged++; done++; return; } // 盤整行情 → 跳過（訊號減弱）\n\n          const oc15 = await fetchOHLC(sym,'15m',300);\n          const oc30 = await fetchOHLC(sym,'30m',300);\n          const oc1h = await fetchOHLC(sym,'1H',300);\n\n          const addHaishenResult = (oc, tf) => {\n            if(!oc || oc.length<30) return;\n            const hs = analyzeHaishen(oc);\n            if(!hs) return;\n            const closes = oc.map(c=>c.c);\n\n            // ═══ 海神策略四條件 ═══\n            // ① 單邊行情確立（4H振幅≥5%，非盤整）\n            // ② TuTCI 通道突破（多：突破 upperEntry／空：跌破 lowerEntry）\n            // ③ 方向與 4H 大趨勢一致（時區交易法：只做順勢方向）\n            // ④ 結構轉換 MSS 確認（前段結構被打破，非追高殺低）\n            const longC = [\n              h4h.singleSided,\n              hs.longBreak,\n              h4h.trend==='bull',\n              hs.mssLong\n            ];\n            const shortC = [\n              h4h.singleSided,\n              hs.shortBreak,\n              h4h.trend==='bear',\n              hs.mssShort\n            ];\n\n            const longOk  = longC.every(Boolean);\n            const shortOk = shortC.every(Boolean);\n            const ls = longC.filter(Boolean).length;\n            const ss = shortC.filter(Boolean).length;\n\n            if(longOk){\n              if(tf==='15M')l15++;else if(tf==='30M')l30++;else if(tf==='1H')l1h++;else l4h++;\n              const patterns = detectPatterns(closes,'long');\n              const patternScore = patterns.reduce((s,p)=>s+p.strength,0);\n              scanData.push({sym,tf,dir:'long',score:ls,patternScore,patterns,\n                conds:longC, p:hs.p, dist:hs.rangePct, slPct:hs.slForLong,\n                qqe:'—', dailyBias:h4h.trend, channelNote:'poseidon',\n                poseidonInfo:{structure:hs.structure, mss:hs.mssLong, rangePct:hs.rangePct, upperEntry:hs.upperEntry, lowerExit:hs.lowerExit}});\n            } else if(shortOk){\n              if(tf==='15M')s15++;else if(tf==='30M')s30++;else if(tf==='1H')s1h++;else s4h++;\n              const patterns = detectPatterns(closes,'short');\n              const patternScore = patterns.reduce((s,p)=>s+p.strength,0);\n              scanData.push({sym,tf,dir:'short',score:ss,patternScore,patterns,\n                conds:shortC, p:hs.p, dist:hs.rangePct, slPct:hs.slForShort,\n                qqe:'—', dailyBias:h4h.trend, channelNote:'poseidon',\n                poseidonInfo:{structure:hs.structure, mss:hs.mssShort, rangePct:hs.rangePct, lowerEntry:hs.lowerEntry, upperExit:hs.upperExit}});\n            }\n          };\n\n          addHaishenResult(oc15,'15M');\n          addHaishenResult(oc30,'30M');\n          addHaishenResult(oc1h,'1H');\n\n          document.getElementById('m15L').textContent=l15;\n          document.getElementById('m15S').textContent=s15;\n          document.getElementById('m30L').textContent=l30;\n          document.getElementById('m30S').textContent=s30;\n          document.getElementById('m1hL').textContent=l1h;\n          document.getElementById('m1hS').textContent=s1h;\n          document.getElementById('mRange').textContent=ranged;\n          renderScan(scanData);\n          done++;\n          return;\n        }\n\n        // ═══ 賽克斯策略掃描路徑（原本邏輯）═══\n        // 4H for trend bias\n        const h4c = await fetchCandles(sym,'4H',300,true); // 300根足夠EMA169，加速掃描\n        const h4a = analyze(h4c);\n        if(!h4a){done++;return;}\n        if(h4a.ranging){ranged++;done++;return;}\n\n        // 15M\n        const c15 = await fetchCandles(sym,'15m',300,true);\n        const a15 = analyze(c15);\n\n        // 30M\n        const c30 = await fetchCandles(sym,'30m',300,true);\n        const a30 = analyze(c30);\n\n        // 1H\n        const c1h = await fetchCandles(sym,'1H',300,true);\n        const a1h = analyze(c1h);\n\n        const biasCache = biasCacheMap[sym];\n        let dailyBias = biasCache?.D;\n        if(!dailyBias){\n          try{\n            const dc = await fetchCandles(sym,'1D',300,true);\n            dailyBias = getBias(analyze(dc,175));\n          }catch(e){ dailyBias = null; }\n          if(dailyBias) biasCacheMap[sym] = {...(biasCacheMap[sym]||{}), D:dailyBias};\n          else dailyBias = null;   // 日線資料不足就不表態（1H 進場需要日線偏見，沒有就不做）\n        }\n\n        const addResult = (a, closes, tf) => {\n          if (!a) return;\n\n          // ═══ 賽克斯策略完整條件（依序判斷）═══\n          //\n          // 空頭條件：\n          //   ① 趨勢：小通道(144/169)中心 < 大通道(576/676)中心（小通道在大通道下方）\n          //   ② 回踩：價格測試小通道但收盤未突破EMA144（備用：小通道突破時看大通道）\n          //   ③ 過濾線：收盤在EMA12下方\n          //   ④ QQE：出現紅柱\n          //\n          // 多頭條件（對稱）：\n          //   ① 趨勢：小通道中心 > 大通道中心\n          //   ② 回踩：測試小通道但收盤未跌破EMA169（備用：看大通道）\n          //   ③ 過濾線：收盤在EMA12上方\n          //   ④ QQE：出現藍柱\n\n          // 日線+4H 建立偏見（日線不可相反、4H 判斷趨勢和回踩）\n          // 用當前TF(15M~1H)判斷過濾線和QQE找進場\n          // 趨勢共振：上面每一層都要同方向（15M/30M：1H＋4H；1H：4H）。找進場位置看「上一層」：15M/30M 看 1H，1H 看 4H\n          const hu = tf==='1H' ? h4a : a1h;\n          // 15M/30M：4H 建立偏見 → 1H 確認 → 15M/30M 找進場；1H：日線建立偏見 → 4H 確認 → 1H 找進場\n          const upBull = tf==='1H' ? (dailyBias==='bull' && h4a.trend==='bull') : (h4a.trend==='bull' && !!a1h && a1h.trend==='bull');\n          const upBear = tf==='1H' ? (dailyBias==='bear' && h4a.trend==='bear') : (h4a.trend==='bear' && !!a1h && a1h.trend==='bear');\n          const longC = [\n            upBull,                // ① 上面每一層都是多頭（趨勢共振）\n            !!(hu && hu.near),     // ② 上一層回踩小通道未跌破（或備用大通道）\n            a.aboveFilter&&a.abovePrev,   // ③ 當前TF收盤在EMA12上方，且上一根也在上方（確認沒跌回）\n            a.qqe==='blue'         // ④ 當前TF QQE藍柱\n          ];\n          const shortC = [\n            upBear,                // ① 上面每一層都是空頭（趨勢共振 ｜止損距離 '+F+'/15'};\n  };\n  Object.values(merged).forEach(r=>{ r.sc=scoreOf(r); });\n  // 排序：綜合評分高→低；同分再看多時區共振、賽克斯分數、型態加分\n  const spOf=r=>r.rescue?3:parseFloat((r.fib&&r.fib.slPct!=null)?r.fib.slPct:(r.slPct||r.dist||0));\n  const sorted=Object.values(merged).sort((a,b)=>\n    b.sc.t-a.sc.t || b.tfs.length-a.tfs.length || b.maxScore-a.maxScore || b.maxPatternScore-a.maxPatternScore\n  );\n  const deduped=slCapOn?sorted.filter(r=>{ const s=spOf(r); return !(s>3); }):sorted;      // 止損距離超過 3% 的先藏起來（距離未知的保留）\n  { const el=document.getElementById('slHidden'); if(el) el.textContent=slCapOn&&sorted.length>deduped.length?'已隱藏 '+(sorted.length-deduped.length)+' 筆止損超過 3% 的':''; }\n\n  const labels = activeStrategy==='wicket'\n    ? ['非擠壓','測試軌道','突破中軌','金死叉5根內']\n    : activeStrategy==='hunter'\n    ? ['盤整行情','OBV回通道','型態出現','型態方向符合']\n    : activeStrategy==='poseidon'\n    ? ['單邊行情','TuTCI突破','4H同向','MSS結構反轉']\n    : activeStrategy==='13333'\n    ? ['首K突破','回測不破','延續確認','三大時段內']\n    : ['趨勢','回踩','過濾線','QQE'];\n  window.__scanCoins=[...new Set(deduped.map(r=>symBase(r.sym)))];\n  const list=document.getElementById('scanList');\n  if(!deduped.length){list.innerHTML='<div class=\"empty\"><div class=\"empty-icon\">🔍<\/div><p>'+(sorted.length?'符合條件的 '+sorted.length+' 筆止損都超過 3%，可切到「不限」查看':'目前無符合條件的訊號')+'<\/p><\/div>';return;}\n\n  window.__scanRows=deduped;\n  list.innerHTML=deduped.map((r,ix)=>{\n    // 完整幣種名稱（移除所有合約後綴）\n    const baseName=symBase(r.sym);\n    const settle=r.sym.includes('-USDC-')?'USDC':r.sym.includes('-USD-SWAP')&&!r.sym.includes('-USDT-')?'USD':'USDT';\n    const contractType=settle==='USD'?'CM 永續（幣本）':settle==='USDC'?'USDC 永續':'USDT 永續';\n    const okxUrl=`https://www.okx.com/trade-swap/${baseName.toLowerCase()}-${settle.toLowerCase()}-swap`;\n\n    const tfColor = r.tfs.length>=2 ? 'var(--gold2)' : 'var(--info)';\n    const tfBadges=r.tfs.sort().map(tf=>`<span class=\"badge binfo\" style=\"font-size:10px;padding:2px 7px;color:${tfColor}\">${tf}<\/span>`).join(' ');\n\n    const isWicket = r.channelNote==='wicket';\n    const isHunter = r.channelNote==='hunter';\n    const isPoseidon = r.channelNote==='poseidon';\n    const isTK = r.channelNote==='13333';\n    const qqeHtml = isTK\n      ? `<span class=\"badge ${r.dir==='long'?'bbull':'bbear'}\" style=\"font-size:10px\">🎯 ${r.dir==='long'?'突破回測延續':'跌破回測延續'}<\/span>`\n      : isWicket\n      ? (r.wicketInfo?.goldenDist!==undefined && r.wicketInfo?.goldenDist!==null\n          ? `<span class=\"badge bbull\" style=\"font-size:10px\">🟢 金叉${r.wicketInfo.goldenDist}根前<\/span>`\n          : r.wicketInfo?.deathDist!==undefined && r.wicketInfo?.deathDist!==null\n          ? `<span class=\"badge bbear\" style=\"font-size:10px\">🔴 死叉${r.wicketInfo.deathDist}根前<\/span>`\n          : '<span class=\"badge brange\" style=\"font-size:10px\">—<\/span>')\n      : isHunter\n      ? (r.hunterInfo?.pattern\n          ? `<span class=\"badge ${r.dir==='long'?'bbull':'bbear'}\" style=\"font-size:10px\">${r.hunterInfo.pattern.name}<\/span>`\n          : '<span class=\"badge brange\" style=\"font-size:10px\">—<\/span>')\n      : isPoseidon\n      ? `<span class=\"badge ${r.dir==='long'?'bbull':'bbear'}\" style=\"font-size:10px\">${r.dir==='long'?'🔱 Long Entry':'🔱 Short Entry'}<\/span>`\n      : (r.qqe==='blue'?'<span class=\"badge bbull\" style=\"font-size:10px\">🔵 藍<\/span>':r.qqe==='red'?'<span class=\"badge bbear\" style=\"font-size:10px\">🔴 紅<\/span>':'<span class=\"badge brange\" style=\"font-size:10px\">待確認<\/span>');\n    const dbHtml = isTK\n      ? `<span class=\"badge binfo\" style=\"font-size:10px\">${r.tkInfo?.session||'—'}<\/span>`\n      : isWicket\n      ? (r.wicketInfo?.squeeze ? '<span class=\"badge brange\" style=\"font-size:10px\">擠壓區<\/span>' : '<span class=\"badge bbull\" style=\"font-size:10px\">擴張區<\/span>')\n      : isHunter\n      ? (r.hunterInfo?.isRanging ? '<span class=\"badge bbull\" style=\"font-size:10px\">盤整適用<\/span>' : '<span class=\"badge brange\" style=\"font-size:10px\">非盤整<\/span>')\n      : isPoseidon\n      ? (r.dailyBias==='bull'?'<span class=\"badge bbull\" style=\"font-size:10px\">4H偏多<\/span>':r.dailyBias==='bear'?'<span class=\"badge bbear\" style=\"font-size:10px\">4H偏空<\/span>':'<span class=\"badge brange\" style=\"font-size:10px\">4H盤整<\/span>')\n      : (r.dailyBias==='bull'?'<span class=\"badge bbull\" style=\"font-size:10px\">偏多<\/span>':r.dailyBias==='bear'?'<span class=\"badge bbear\" style=\"font-size:10px\">偏空<\/span>':'<span class=\"badge brange\" style=\"font-size:10px\">盤整<\/span>');\n    const multiTF = r.tfs.length>=2 ? `<span style=\"font-size:10px;color:var(--gold2);margin-left:3px\">⚡共振<\/span>` : '';\n    const slPct=parseFloat(r.slPct||r.dist||0);\n    const slColor=slPct<1?'var(--bull)':slPct<3?'var(--gold2)':'var(--bear)';\n\n    // 型態欄：顯示最多2個最強型態，無型態顯示賽克斯條件點\n    const patterns=r.allPatterns||[];\n    let patternHtml='';\n    if(patterns.length>0){\n      patternHtml=patterns.slice(0,2).map(p=>patternBadge(p)).join('<br>');\n    } else {\n      const dots=r.conds.map((ok,i)=>`<div class=\"d${ok?' ok':''}\" title=\"${labels[i]}:${ok?'✓':'✗'}\"><\/div>`).join('');\n      patternHtml=`<div class=\"dots\">${dots}<span style=\"font-size:10px;color:var(--dim);margin-left:2px\">${r.maxScore}/4<\/span><\/div>`;\n    }\n\n    // 邊框：有強型態=紫金色，多時區共振=金色\n    const borderStyle=patterns.length>0&&r.maxPatternScore>=3?'border-left:3px solid #a855f7':r.tfs.length>=2?'border-left:3px solid var(--gold)':'';\n\n    return `<div class=\"scan-row\" onclick=\"window.open('${okxUrl}','_blank')\" title=\"開啟 OKX：${baseName}/${settle}\" style=\"${borderStyle}\">\n      <div>\n        <div class=\"sname\">${baseName} / ${settle}<\/div>\n        <div class=\"ssub\">${contractType} <a href=\"https://www.tradingview.com/chart/?symbol=${encodeURIComponent(okxSymToTV(r.sym))}\" target=\"_blank\" rel=\"noopener\" onclick=\"event.stopPropagation()\" style=\"color:var(--gold2);margin-left:6px;text-decoration:none\" title=\"在 TradingView 開啟這個幣（OKX 圖表）\">📊TV<\/a><a href=\"index.html#sym=${r.sym}\" target=\"_blank\" rel=\"noopener\" onclick=\"event.stopPropagation()\" style=\"color:var(--gold2);margin-left:6px;text-decoration:none\" title=\"在看盤台開啟這個幣\">📉看盤<\/a>${window.parent!==window?` <a href=\"#\" onclick=\"event.preventDefault();event.stopPropagation();window.parent.postMessage({saxisAnalyze:'${r.sym}'},'*')\" style=\"color:var(--gold2);margin-left:6px;text-decoration:none\" title=\"在「單幣分析」分頁開啟這個幣\">📈分析<\/a>`:''}<\/div>\n      <\/div>\n      <div title=\"${r.sc.tip}\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:${r.sc.t>=75?'var(--bull)':r.sc.t>=55?'var(--gold2)':'var(--dim)'}\">${r.sc.t}<\/div><div style=\"height:4px;border-radius:2px;background:var(--surface2);margin-top:3px\"><div style=\"height:4px;border-radius:2px;width:${r.sc.t}%;background:${r.sc.t>=75?'var(--bull)':r.sc.t>=55?'var(--gold2)':'var(--dim)'}\"><\/div><\/div><div style=\"font-size:10px;color:var(--dim);margin-top:2px\">${r.sc.t>=75?'強':r.sc.t>=55?'中':'弱'}<\/div><\/div>\n      <div style=\"display:flex;flex-wrap:wrap;gap:3px;align-items:center\">${tfBadges}${multiTF}<\/div>\n      <div><span class=\"badge\" style=\"background:${r.dir==='long'?'rgba(0,229,160,.15)':'rgba(255,77,109,.15)'};color:${r.dir==='long'?'var(--bull)':'var(--bear)'};border:1px solid ${r.dir==='long'?'rgba(0,229,160,.3)':'rgba(255,77,109,.3)'};padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700\">${r.dir==='long'?'多 ▲':'空 ▼'}<\/span><\/div>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:${slColor}\">${r.rescue?'3.00':(r.fib?r.fib.slPct.toFixed(2):slPct)}%${r.rescue?'<div style=\"font-size:9px;color:var(--gold2);font-weight:700\" title=\"原訊號止損 '+r.rescue.orig.toFixed(2)+'%。等價格回測到 '+fmtP(r.rescue.entry)+(r.dir==='long'?' 以下':' 以上')+' 再進，止損就縮到 3%；按「🎯 進場建議」會對齊最近的斐波回撤位\">↩回測 '+fmtP(r.rescue.entry)+(r.dir==='long'?' 以下':' 以上')+'進<\/div>':''}${(!r.rescue&&(r.fib?r.fib.slPct:slPct)>3)?'<div style=\"font-size:9px;color:var(--bear);font-weight:700\" title=\"止損距離超過 3%，機器人預設不進場\">⛔超過3%<\/div>':''}${r.mv&&r.mv.items.length?`<div style=\"font-size:10px;line-height:1.3;color:${r.mv.score>0?'var(--bull)':r.mv.score<0?'var(--bear)':'var(--dim)'}\" title=\"盤面看法：123法則／型態／結構，同向加分、逆向扣分\">盤面 ${r.mv.score>0?'+':''}${r.mv.score}・${r.mv.items.slice(0,2).join('、')}<\/div>`:''}${r.fib?`<div style=\"font-size:10px;color:var(--gold2);line-height:1.3\" title=\"大K放量：限價掛斐波0.5，止損放K棒另一端，TP1=1R／TP2=1.5R\">📌限價0.5 ${+r.fib.entry.toPrecision(6)}<br>SL ${+r.fib.sl.toPrecision(6)}・TP ${+r.fib.tp2.toPrecision(6)}<\/div>`:''}<\/div>\n      <div>${qqeHtml}<\/div>\n      <div>${dbHtml}<\/div>\n      <div style=\"line-height:1.6\">${patternHtml}<div><button class=\"btn-o\" style=\"padding:2px 8px;font-size:11px;margin-top:3px\" onclick=\"event.stopPropagation();entryPlan(${ix})\">🎯 進場建議<\/button><\/div><\/div>\n    <\/div><div class=\"entry-plan\" id=\"ep${ix}\" style=\"display:none\"><\/div>`;\n  }).join('');\n}\n\n// ============================================================\n// DATA\n// ============================================================\n// ============================================================\n// TradingView Widget + CVD + Binance 多空比\n// ============================================================\n\nlet tvCurrentSym = 'BTCUSDT';\nlet tvCurrentInterval = '60';\n\nfunction okxSymToTV(instId){\n  if(!/-SWAP$/.test(instId)) return 'OKX:'+instId.replace('-','');   // 現貨\n  // OKX 格式 BTC-USDT-SWAP → TradingView 格式 OKX:BTCUSDT.P\n  const base = symBase(instId);\n  const settle = instId.includes('-USDC-')?'USDC': instId.includes('-USD-SWAP')&&!instId.includes('-USDT-')?'USD':'USDT';\n  if(settle==='USD') return `OKX:${base}USD`; // 幣本\n  return `OKX:${base}${settle}.P`; // 永續\n}\n\nfunction setTVInterval(interval){\n  tvCurrentInterval = interval;\n  ['15','30','60','240','D'].forEach(v=>{\n    const el=document.getElementById('tvBtn'+v);\n    if(el) el.className=v===interval?'btn-o on':'btn-o';\n    if(el) el.style.fontSize='11px'; if(el) el.style.padding='3px 9px';\n  });\n  loadTVWidget(null); // 重新載入同一個幣種\n}\n\nfunction loadTVWidget(sym){\n  if(sym){\n    tvCurrentSym = okxSymToTV(sym);\n  }\n  const container = document.getElementById('tvWidgetContainer');\n  if(!container) return;\n  // 移除舊 iframe\n  container.innerHTML='';\n  const iframe = document.createElement('iframe');\n  const params = new URLSearchParams({\n    symbol: tvCurrentSym,\n    interval: tvCurrentInterval,\n    theme: 'dark',\n    style: '1',\n    locale: 'zh_TW',\n    toolbar_bg: '#0d1117',\n    enable_publishing: 'false',\n    hide_top_toolbar: 'false',\n    hide_legend: 'false',\n    save_image: 'false',\n    autosize: 'true',\n  });\n  iframe.src = `https://www.tradingview.com/widgetembed/?${params.toString()}`;\n  iframe.style.cssText = 'width:100%;height:100%;border:none;border-radius:6px';\n  iframe.allowFullscreen = true;\n  container.appendChild(iframe);\n}\n\n// CVD 計算：最近 200 筆 OKX 逐筆成交，主動買 - 主動賣\nasync function calcCVD(sym){\n  const el = document.getElementById('cvdData');\n  if(!el) return;\n  try {\n    // OKX trades API：side=buy/sell\n    const d = await okxFetch(`/api/v5/market/trades?instId=${sym}&limit=200`);\n    if(!d?.data?.length) throw new Error('no trades');\n    let buyVol=0, sellVol=0, buyAmt=0, sellAmt=0;\n    d.data.forEach(t=>{\n      const sz = parseFloat(t.sz||0);\n      const px = parseFloat(t.px||0);\n      const amt = sz*px;\n      if(t.side==='buy'){ buyVol+=sz; buyAmt+=amt; }\n      else { sellVol+=sz; sellAmt+=amt; }\n    });\n    const cvd = buyAmt - sellAmt;\n    const cvdStr = cvd>=0?'+$'+fmtV(cvd):'-$'+fmtV(Math.abs(cvd));\n    const cvdCol = cvd>=0?'var(--bull)':'var(--bear)';\n    const buyPct = (buyAmt/(buyAmt+sellAmt)*100).toFixed(1);\n    const sellPct = (100-parseFloat(buyPct)).toFixed(1);\n    const cvdBias = parseFloat(buyPct)>55?'<span class=\"badge bbull\">主動買壓強<\/span>':\n      parseFloat(buyPct)<45?'<span class=\"badge bbear\">主動賣壓強<\/span>':\n      '<span class=\"badge brange\">買賣均衡<\/span>';\n    el.innerHTML=`\n      <div class=\"drow\"><span class=\"dk\">CVD（近200筆）<\/span><span style=\"font-family:'JetBrains Mono',monospace;color:${cvdCol};font-size:15px;font-weight:600\">${cvdStr}<\/span><\/div>\n      <div class=\"drow\"><span class=\"dk\">主動買方<\/span><span style=\"color:var(--bull)\">${buyPct}% &nbsp;$${fmtV(buyAmt)}<\/span><\/div>\n      <div class=\"drow\"><span class=\"dk\">主動賣方<\/span><span style=\"color:var(--bear)\">${sellPct}% &nbsp;$${fmtV(sellAmt)}<\/span><\/div>\n      <div class=\"drow\"><span class=\"dk\">買賣偏向<\/span>${cvdBias}<\/div>\n      <div style=\"height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px\">\n        <div style=\"height:100%;width:${buyPct}%;background:var(--bull);border-radius:3px;transition:width .4s\"><\/div>\n      <\/div>`;\n  } catch(e){\n    el.innerHTML='<div style=\"font-size:13px;color:var(--dim)\">CVD 暫無（逐筆成交限制）<\/div>';\n  }\n}\n\n// Binance 多空人數比（比 OKX 那個 CORS 限制更穩定）\nasync function loadBinanceLongShort(sym){\n  const el = document.getElementById('bnLsData');\n  if(!el) return;\n  // 轉換幣種格式：BTC-USDT-SWAP → BTCUSDT\n  const bnSym = sym.replace(/-USDT-SWAP$/,'USDT').replace(/-USDC-SWAP$/,'USDC').replace(/-USD-SWAP$/,'USD').replace(/-/g,'');\n  try {\n    const url = `https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=${bnSym}&period=1h&limit=1`;\n    const r = await fetchWithTimeout(url, 6000);\n    if(!r.ok) throw new Error('binance_error');\n    const data = await r.json();\n    const row = Array.isArray(data)?data[0]:data;\n    if(!row) throw new Error('no data');\n    const lp = (parseFloat(row.longAccount)*100).toFixed(1);\n    const sp = (parseFloat(row.shortAccount)*100).toFixed(1);\n    const ratio = parseFloat(row.longShortRatio).toFixed(2);\n    const lsBadge = parseFloat(lp)>55?'<span class=\"badge bbull\">多頭主導<\/span>':\n      parseFloat(lp)<45?'<span class=\"badge bbear\">空頭主導<\/span>':\n      '<span class=\"badge brange\">多空均衡<\/span>';\n    el.innerHTML=`\n      <div class=\"drow\"><span class=\"dk\">多空比（人數）<\/span><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--gold2)\">${ratio}<\/span><\/div>\n      <div style=\"display:flex;align-items:center;gap:8px;margin:8px 0 4px\">\n        <span style=\"font-size:12px;color:var(--bull);white-space:nowrap\">多 ${lp}%<\/span>\n        <div class=\"gauge-bar\"><div class=\"gauge-fill\" style=\"width:${lp}%\"><\/div><\/div>\n        <span style=\"font-size:12px;color:var(--bear);white-space:nowrap\">${sp}% 空<\/span>\n      <\/div>\n      <div class=\"drow\"><span class=\"dk\">市場偏向<\/span>${lsBadge}<\/div>\n      <div class=\"drow\"><span class=\"dk\">來源<\/span><span style=\"font-size:11px;color:var(--dim)\">Binance 全局帳戶多空比<\/span><\/div>`;\n  } catch(e){\n    // Binance 失敗時顯示說明\n    el.innerHTML='<div style=\"font-size:12px;color:var(--dim);line-height:1.6\">Binance 多空比暫無<br><span style=\"font-size:11px\">（此幣種可能僅在 OKX 上市）<\/span><\/div>';\n  }\n}\n\nfunction tfSignalHtml(a, tfLabel) {\n  if (!a) return `<div class=\"drow\"><span class=\"dk\">${tfLabel}<\/span><span style=\"color:var(--dim);font-size:12px\">數據不足<\/span><\/div>`;\n\n  // ── 趨勢：小通道 vs 大通道位置 ──\n  const smallMid = (a.e144+a.e169)/2;\n  const largeMid = a.e576&&a.e676 ? (a.e576+a.e676)/2 : null;\n  const trendBadge = a.ranging\n    ? '<span class=\"badge brange\">盤整 ↔<\/span>'\n    : a.trend==='bull'\n      ? '<span class=\"badge bbull\">多頭 ▲<\/span>'\n      : '<span class=\"badge bbear\">空頭 ▼<\/span>';\n\n  const channelBadge = largeMid\n    ? (smallMid>largeMid\n      ? '<span style=\"font-size:11px;color:var(--bull)\">小通道↑大通道<\/span>'\n      : '<span style=\"font-size:11px;color:var(--bear)\">小通道↓大通道<\/span>')\n    : '<span style=\"font-size:11px;color:var(--dim)\">大通道不足<\/span>';\n\n  // ── 回踩狀態 ──\n  const nearBadge = a.near\n    ? (a.usingLargeChannel\n      ? '<span class=\"badge brange\" style=\"font-size:10px\">⚠️ 備用大通道<\/span>'\n      : '<span class=\"badge bbull\" style=\"font-size:10px\">✅ 回踩小通道<\/span>')\n    : '<span style=\"font-size:11px;color:var(--dim)\">未回踩<\/span>';\n\n  const qqeBadge = a.qqe==='blue'\n    ? '<span class=\"badge bbull\">🔵 藍柱<\/span>'\n    : a.qqe==='red' ? '<span class=\"badge bbear\">🔴 紅柱<\/span>'\n    : '<span class=\"badge brange\" style=\"font-size:10px\">無訊號<\/span>';\n\n  const filterBadge = a.aboveFilter\n    ? '<span style=\"color:var(--bull);font-size:11px\">↑ EMA12上方<\/span>'\n    : '<span style=\"color:var(--bear);font-size:11px\">↓ EMA12下方<\/span>';\n\n  // ── 賽克斯四條件逐一判斷 ──\n  // 多單：①趨勢多頭 ②回踩 ③EMA12上方 ④QQE藍（必要條件①②③，④加分）\n  // 空單：①趨勢空頭 ②回踩 ③EMA12下方 ④QQE紅\n  const longRequired  = !a.ranging && a.trend==='bull' && a.near && a.aboveFilter;\n  const shortRequired = !a.ranging && a.trend==='bear' && a.near && a.belowFilter;\n  const longFull  = longRequired  && a.qqe==='blue';\n  const shortFull = shortRequired && a.qqe==='red';\n\n  const signalBadge = longFull\n    ? '<span class=\"badge bbull\" style=\"font-size:11px;padding:3px 10px\">✅ 多單完整訊號<\/span>'\n    : shortFull\n    ? '<span class=\"badge bbear\" style=\"font-size:11px;padding:3px 10px\">✅ 空單完整訊號<\/span>'\n    : longRequired\n    ? '<span class=\"badge brange\" style=\"font-size:11px;padding:3px 10px\">🟡 多單等待QQE<\/span>'\n    : shortRequired\n    ? '<span class=\"badge brange\" style=\"font-size:11px;padding:3px 10px\">🟡 空單等待QQE<\/span>'\n    : a.ranging\n    ? '<span class=\"badge brange\" style=\"font-size:11px\">⚠️ 盤整勿進<\/span>'\n    : '<span style=\"font-size:11px;color:var(--dim)\">條件未達<\/span>';\n\n  // 條件步驟顯示\n  const cond1 = !a.ranging && (a.trend==='bull'||a.trend==='bear');\n  const cond2 = a.near;\n  const cond3 = a.trend==='bull' ? a.aboveFilter : a.belowFilter;\n  const cond4 = a.trend==='bull' ? a.qqe==='blue' : a.qqe==='red';\n  const dot = (ok)=>`<span style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:${ok?'var(--bull)':'var(--border)'}\"><\/span>`;\n\n  return `\n    <div style=\"background:var(--surface2);border-radius:8px;padding:12px;margin-bottom:8px;border:1px solid var(--border)${(longFull||shortFull)?';border-left:3px solid '+(longFull?'var(--bull)':'var(--bear)'):''}\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px\">\n        <span style=\"font-size:12px;font-weight:600;color:var(--bright)\">${tfLabel}<\/span>\n        ${signalBadge}\n      <\/div>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;margin-bottom:8px\">\n        <div><span style=\"color:var(--dim)\">① 趨勢<\/span> ${dot(cond1)} ${trendBadge}<\/div>\n        <div><span style=\"color:var(--dim)\">通道位置<\/span> ${channelBadge}<\/div>\n        <div><span style=\"color:var(--dim)\">② 回踩<\/span> ${dot(cond2)} ${nearBadge}<\/div>\n        <div><span style=\"color:var(--dim)\">③ 過濾線<\/span> ${dot(cond3)} ${filterBadge}<\/div>\n        <div><span style=\"color:var(--dim)\">④ QQE<\/span> ${dot(cond4)} ${qqeBadge}<\/div>\n        <div><span style=\"color:var(--dim)\">止損%<\/span> <span style=\"color:var(--gold2);font-family:'JetBrains Mono',monospace\">${a.suggestedSLpct}%<\/span><\/div>\n      <\/div>\n      <div style=\"font-size:11px;color:var(--dim)\">\n        EMA144: <span style=\"font-family:'JetBrains Mono',monospace;color:var(--info)\">$${fmtP(a.e144)}<\/span>　\n        EMA169: <span style=\"font-family:'JetBrains Mono',monospace;color:var(--info)\">$${fmtP(a.e169)}<\/span>　\n        EMA12: <span style=\"font-family:'JetBrains Mono',monospace;color:var(--gold2)\">$${fmtP(a.e12)}<\/span>\n      <\/div>\n    <\/div>`;\n}\n\nasync function loadData(sym) {\n  sym = sym || currentDataSym;\n  ['dPrice','dChange','dVol','dFund'].forEach(id=>document.getElementById(id).textContent='...');\n  document.getElementById('lsData').innerHTML='<div style=\"font-size:13px;color:var(--dim)\"><span class=\"spinner\"><\/span> 載入...<\/div>';\n  document.getElementById('cvdData').innerHTML='<div style=\"font-size:13px;color:var(--dim)\"><span class=\"spinner\"><\/span> 計算...<\/div>';\n  document.getElementById('bnLsData').innerHTML='<div style=\"font-size:13px;color:var(--dim)\"><span class=\"spinner\"><\/span> 載入...<\/div>';\n  document.getElementById('vegasData').innerHTML='<div style=\"font-size:13px;color:var(--dim)\"><span class=\"spinner\"><\/span> 分析 15M / 30M / 1H / 4H 中...<\/div>';\n\n  // 更新 TradingView Widget\n  loadTVWidget(sym);\n\n  try {\n    const [tick, fund] = await Promise.all([\n      okxFetch(`/api/v5/market/ticker?instId=${sym}`),\n      symIsPerp(sym)?okxFetch(`/api/v5/public/funding-rate?instId=${sym}`):Promise.resolve({data:[]})\n    ]);\n    const t=tick.data?.[0], f=fund.data?.[0];\n    if(!t) return;\n    const price=parseFloat(t.last);\n    const chg=parseFloat(t.sodUtc8)?((price-parseFloat(t.sodUtc8))/parseFloat(t.sodUtc8)*100):0;\n    const vol=parseFloat(t.volCcy24h||t.vol24h||0);\n    const fr=f?parseFloat(f.fundingRate)*100:0;\n    document.getElementById('dPrice').textContent='$'+fmtP(price);\n    const cel=document.getElementById('dChange');\n    cel.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';\n    cel.className='mval '+(chg>=0?'bull':'bear');\n    document.getElementById('dVol').textContent='$'+fmtV(vol);\n    const fcel=document.getElementById('dFund');\n    fcel.textContent=(fr>=0?'+':'')+fr.toFixed(4)+'%';\n    fcel.className='mval '+(fr>0.05?'range':fr<0?'bull':'');\n\n    // 市場情緒（OKX 支援 CORS 的端點）\n    try {\n      const oi = await okxFetch(`/api/v5/public/open-interest?instType=SWAP&instId=${sym}`).catch(()=>null);\n      const oiVal = parseFloat(oi?.data?.[0]?.oiCcy || oi?.data?.[0]?.oi || 0);\n      const oiStr = oiVal>1e6?(oiVal/1e6).toFixed(2)+'M':oiVal>1e3?(oiVal/1e3).toFixed(1)+'K':oiVal>0?oiVal.toFixed(0):'—';\n      const frSign = fr>0.02?'bull':fr<-0.02?'bear':'neutral';\n      let sentiment='neutral', sentimentLabel='多空均衡';\n      if(frSign==='bull'&&chg>0){sentiment='bull';sentimentLabel='偏多（費率正+價格上漲）';}\n      else if(frSign==='bear'&&chg<0){sentiment='bear';sentimentLabel='偏空（費率負+價格下跌）';}\n      else if(frSign==='bull'){sentiment='bull';sentimentLabel='偏多（資金費率偏正）';}\n      else if(frSign==='bear'){sentiment='bear';sentimentLabel='偏空（資金費率偏負）';}\n      else if(chg>2){sentiment='bull';sentimentLabel='偏多（24H漲幅較大）';}\n      else if(chg<-2){sentiment='bear';sentimentLabel='偏空（24H跌幅較大）';}\n      const sentBadge = sentiment==='bull'?'<span class=\"badge bbull\">多頭主導<\/span>':sentiment==='bear'?'<span class=\"badge bbear\">空頭主導<\/span>':'<span class=\"badge brange\">多空均衡<\/span>';\n      document.getElementById('lsData').innerHTML=`\n        <div class=\"drow\"><span class=\"dk\">市場情緒<\/span>${sentBadge}<\/div>\n        <div class=\"drow\"><span class=\"dk\">資金費率<\/span><span style=\"color:${frSign==='bull'?'var(--bull)':frSign==='bear'?'var(--bear)':'var(--dim)'}\">\n          ${frSign==='bull'?'🔵 多單付費（偏多）':frSign==='bear'?'🔴 空單付費（偏空）':'⚪ 中性'}<\/span><\/div>\n        <div class=\"drow\"><span class=\"dk\">未平倉量<\/span><span style=\"font-family:'JetBrains Mono',monospace;color:var(--info)\">${oiStr}<\/span><\/div>\n        <div class=\"drow\"><span class=\"dk\">依據<\/span><span style=\"font-size:11px;color:var(--dim)\">${sentimentLabel}<\/span><\/div>`;\n    } catch(e){ document.getElementById('lsData').innerHTML='<div style=\"font-size:13px;color:var(--dim)\">數據暫無<\/div>'; }\n\n    if(!symIsPerp(sym)){ fcel.textContent='現貨無'; fcel.className='mval'; document.getElementById('lsData').innerHTML='<div style=\"font-size:13px;color:var(--dim);line-height:1.7\">這是<b>現貨<\/b>，沒有資金費率與未平倉量；要看這兩項請改選同幣種的「永續」。<\/div>'; }\n    // CVD 計算（OKX 逐筆成交）\n    calcCVD(sym);\n\n    // Binance 多空人數比\n    loadBinanceLongShort(sym);\n\n    // 四個時區 Vegas 分析\n    const [a15, a30, a1h, a4h] = await Promise.all([\n      fetchCandles(sym,'15m',300,true).then(c=>analyze(c)).catch(()=>null),\n      fetchCandles(sym,'30m',300,true).then(c=>analyze(c)).catch(()=>null),\n      fetchCandles(sym,'1H',300,true).then(c=>analyze(c)).catch(()=>null),\n      fetchCandles(sym,'4H',300,true).then(c=>analyze(c)).catch(()=>null),\n    ]);\n    const signals=[{a:a15,label:'15M'},{a:a30,label:'30M'},{a:a1h,label:'1H'},{a:a4h,label:'4H'}];\n    const longCount=signals.filter(s=>s.a&&!s.a.ranging&&s.a.trend==='bull'&&s.a.near&&s.a.aboveFilter&&s.a.qqe==='blue').length;\n    const shortCount=signals.filter(s=>s.a&&!s.a.ranging&&s.a.trend==='bear'&&s.a.near&&s.a.belowFilter&&s.a.qqe==='red').length;\n    const rangeCount=signals.filter(s=>s.a&&s.a.ranging).length;\n    let overallHtml='';\n    if(longCount>=2) overallHtml=`<div class=\"badge bbull\" style=\"font-size:13px;padding:6px 14px\">🟢 多個時區出現多單訊號（${longCount}/4）<\/div>`;\n    else if(shortCount>=2) overallHtml=`<div class=\"badge bbear\" style=\"font-size:13px;padding:6px 14px\">🔴 多個時區出現空單訊號（${shortCount}/4）<\/div>`;\n    else if(rangeCount>=3) overallHtml=`<div class=\"badge brange\" style=\"font-size:13px;padding:6px 14px\">⚠️ 大部分時區盤整，暫勿進場<\/div>`;\n    else overallHtml=`<div style=\"font-size:13px;color:var(--dim)\">訊號分散，等待多時區共振<\/div>`;\n    document.getElementById('vegasData').innerHTML=`\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px\">\n        <span style=\"font-size:12px;color:var(--dim)\">多時區 Vegas + QQE 分析<\/span>${overallHtml}\n      <\/div>\n      ${tfSignalHtml(a15,'15M')}${tfSignalHtml(a30,'30M')}${tfSignalHtml(a1h,'1H')}${tfSignalHtml(a4h,'4H')}`;\n\n  } catch(e){\n    console.error('[數據分析] 載入失敗:', e);\n    document.getElementById('dPrice').textContent='錯誤';\n    document.getElementById('vegasData').innerHTML='<div style=\"font-size:13px;color:var(--bear)\">⚠️ 載入失敗<\/div>';\n    document.getElementById('lsData').innerHTML='<div style=\"font-size:13px;color:var(--dim)\">數據暫無<\/div>';\n    toast('❌ 數據載入失敗');\n  }\n}\n\n// ============================================================\n// AI REVIEW — Gemini (免費)\n// ============================================================\nconst STRATEGY_PROMPT=`你是賽克斯策略（Vegas通道+QQE MOD）的專業交易分析師，只用繁體中文回覆，語氣專業但易懂。\n\n賽克斯策略完整規則：\n【指標設定】Vegas通道(7EMA_5MA)：EMA144/169藍線=小通道、EMA576/676紅線=大通道、EMA12=過濾線；QQE MOD：Primary RSI=6,Smooth=5,Factor=3\n【兩層偏見系統】日圖→4H 建立方向偏見，兩層一致最強；偏多=找做多機會；偏空=找做空機會；盤整=不交易\n【趨勢判斷】小通道在上=多頭；在下=空頭；通道纏繞=盤整禁止進場\n【多單進場】日圖+4H偏多(日線不可偏空)+15M~1H價格回踩小通道未跌破+收EMA12上方+QQE藍柱\n【空單進場】日圖+4H偏空(日線不可偏多)+15M~1H價格回踩小通道未突破+收EMA12下方+QQE紅柱\n【倉位管理】止損放近期波段高/低點；盈虧比1:1起建議推至1:2；15M/1H進場；連續止損3單暫停\n\n分析時請：1.逐一說明條件符合或不符合 2.判斷是趨勢還是盤整 3.如有圖表從Vegas和QQE角度分析 4.給明確結論 5.說明盈虧原因`;\n\nlet imgBase64=null, imgMimeType='image/jpeg';\n\nfunction previewImg(e){\n  const f=e.target.files[0]; if(!f) return;\n  imgMimeType = f.type||'image/jpeg';\n  const r=new FileReader();\n  r.onload=ev=>{\n    imgBase64=ev.target.result.split(',')[1];\n    const prev=document.getElementById('imgPrev');\n    prev.src=ev.target.result; prev.style.display='block';\n    document.getElementById('imgStatus').style.display='block';\n    toast('✅ 圖片已上傳');\n  };\n  r.readAsDataURL(f);\n}\n\n// ============================================================\n// CALC — 完整版\n// ============================================================\nlet tvDir='long', marginMode='isolated', tpMode='single', chartType='candle';\nlet klineData=[], tpRows=[];\n\nfunction setDir(d){\n  tvDir=d;\n  const bl=document.getElementById('btnLong'), bs=document.getElementById('btnShort');\n  if(d==='long'){\n    bl.style.cssText='flex:1;padding:9px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;background:rgba(0,229,160,.2);color:var(--bull);border:1px solid var(--bull)';\n    bs.style.cssText='flex:1;padding:9px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border)';\n  } else {\n    bs.style.cssText='flex:1;padding:9px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;background:rgba(255,77,109,.2);color:var(--bear);border:1px solid var(--bear)';\n    bl.style.cssText='flex:1;padding:9px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border)';\n  }\n  calcTV();\n}\n\nfunction setMargin(m){\n  marginMode=m;\n  const bi=document.getElementById('btnIsolated'), bc=document.getElementById('btnCross');\n  const note=document.getElementById('marginModeNote');\n  if(m==='isolated'){\n    bi.style.cssText='flex:1;padding:6px;border-radius:6px;font-size:12px;cursor:pointer;background:rgba(201,168,76,.15);color:var(--gold2);border:1px solid var(--gold);font-family:\"Noto Sans TC\",sans-serif';\n    bc.style.cssText='flex:1;padding:6px;border-radius:6px;font-size:12px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:\"Noto Sans TC\",sans-serif';\n    note.textContent='逐倉：虧損上限=保證金';\n  } else {\n    bc.style.cssText='flex:1;padding:6px;border-radius:6px;font-size:12px;cursor:pointer;background:rgba(201,168,76,.15);color:var(--gold2);border:1px solid var(--gold);font-family:\"Noto Sans TC\",sans-serif';\n    bi.style.cssText='flex:1;padding:6px;border-radius:6px;font-size:12px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:\"Noto Sans TC\",sans-serif';\n    note.textContent='全倉：共享帳戶餘額';\n  }\n  calcTV();\n}\n\nfunction setTPMode(m){\n  tpMode=m;\n  const ts=document.getElementById('tpSingle'), tb=document.getElementById('tpBatch');\n  const sa=document.getElementById('tpSingleArea'), ba=document.getElementById('tpBatchArea');\n  if(m==='single'){\n    ts.style.cssText='padding:3px 9px;font-size:11px;border-radius:5px;cursor:pointer;background:rgba(0,229,160,.15);color:var(--bull);border:1px solid var(--bull);font-family:\"Noto Sans TC\",sans-serif';\n    tb.style.cssText='padding:3px 9px;font-size:11px;border-radius:5px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:\"Noto Sans TC\",sans-serif';\n    sa.style.display='block'; ba.style.display='none';\n  } else {\n    tb.style.cssText='padding:3px 9px;font-size:11px;border-radius:5px;cursor:pointer;background:rgba(0,229,160,.15);color:var(--bull);border:1px solid var(--bull);font-family:\"Noto Sans TC\",sans-serif';\n    ts.style.cssText='padding:3px 9px;font-size:11px;border-radius:5px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:\"Noto Sans TC\",sans-serif';\n    sa.style.display='none'; ba.style.display='block';\n    if(tpRows.length===0) addTPRow();\n  }\n  calcTV();\n}\n\nfunction addTPRow(){\n  const id = Date.now();\n  tpRows.push(id);\n  const container = document.getElementById('tpBatchRows');\n  const div = document.createElement('div');\n  div.id='tpr'+id;\n  div.style.cssText='display:grid;grid-template-columns:1fr 1fr 28px;gap:6px;align-items:end';\n  div.innerHTML=`\n    <div class=\"fgroup\"><label style=\"font-size:10px\">止盈價<\/label>\n      <input type=\"number\" id=\"tpPrice${id}\" placeholder=\"價格\" oninput=\"calcTV()\" style=\"border-color:rgba(0,229,160,.4)\"><\/div>\n    <div class=\"fgroup\"><label style=\"font-size:10px\">平倉比例 %<\/label>\n      <input type=\"number\" id=\"tpPct${id}\" value=\"50\" min=\"1\" max=\"100\" placeholder=\"%\" oninput=\"calcTV()\" style=\"border-color:rgba(0,229,160,.3)\"><\/div>\n    <button onclick=\"removeTPRow(${id})\" style=\"padding:8px;background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);color:var(--bear);border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:1px\">✕<\/button>`;\n  container.appendChild(div);\n  calcTV();\n}\n\nfunction removeTPRow(id){\n  tpRows = tpRows.filter(r=>r!==id);\n  document.getElementById('tpr'+id)?.remove();\n  calcTV();\n}\n\n// ── RISK 公式 ──\nfunction calcRisk(){\n  const cap=parseFloat(document.getElementById('cCap').value)||0;\n  const risk=parseFloat(document.getElementById('cRisk').value)||0;\n  const slPct=parseFloat(document.getElementById('cSLpct').value)||0;\n  const lev=parseFloat(document.getElementById('cLev').value)||1;\n  if(!cap||!risk||!slPct) return;\n  const slAmt=cap*(risk/100);\n  const safeMaxLev=Math.floor(50/slPct);\n  const posVal=slAmt/(slPct/100);\n  const margin=posVal/lev;\n  document.getElementById('fStep1').textContent=`${cap.toFixed(0)} × ${risk}% = ${slAmt.toFixed(2)} U`;\n  document.getElementById('fStep2').textContent=`50 ÷ ${slPct}% = 最高 ${Math.max(1,safeMaxLev)} 倍`;\n  document.getElementById('fStep3').textContent=`${slAmt.toFixed(2)} ÷ ${slPct}% = ${posVal.toFixed(0)} U`;\n  document.getElementById('fStep4').textContent=`${posVal.toFixed(0)} ÷ ${lev}x = ${margin.toFixed(2)} U`;\n  // 槓桿警告\n  const levOk=Math.max(1,safeMaxLev), levWarn=Math.max(1,Math.floor(33/slPct));\n  const w=document.getElementById('levWarning');\n  if(lev<=levOk){ w.style.cssText='background:rgba(0,229,160,.1);border:1px solid rgba(0,229,160,.3);color:var(--bull);font-size:11px;padding:5px 8px;border-radius:6px;width:100%'; w.innerHTML=`✅ ${lev}x 安全`; }\n  else if(lev<=levWarn){ w.style.cssText='background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--range);font-size:11px;padding:5px 8px;border-radius:6px;width:100%'; w.innerHTML=`⚠️ ${lev}x 偏激進<br>建議 ≤ ${levOk}x`; }\n  else { w.style.cssText='background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);color:var(--bear);font-size:11px;padding:5px 8px;border-radius:6px;width:100%'; w.innerHTML=`🚨 ${lev}x 過高！<br>建議 ≤ ${levOk}x`; }\n  // 同步槓桿\n  document.getElementById('tvLev').value=lev;\n  document.getElementById('tvLevSync').textContent=`已同步: ${lev}x`;\n  calcTV();\n}\n\n// ── 進場計算器 ──\nfunction calcTV(){\n  const entry=parseFloat(document.getElementById('tvEntry').value)||0;\n  const sl=parseFloat(document.getElementById('tvSL').value)||0;\n  const cost=parseFloat(document.getElementById('tvCostInput').value)||0;\n  const lev=parseFloat(document.getElementById('tvLev').value)||1;\n  if(!entry) return;\n\n  // 幣數 = 成本 × 槓桿 ÷ 進場價\n  const posVal = cost*lev;\n  const qty = posVal/entry;\n  const qtyStr = qty>=1000?qty.toFixed(1):qty>=1?qty.toFixed(3):qty.toFixed(5);\n  document.getElementById('tvQtyShow').textContent = cost ? qtyStr+' 幣' : '—';\n  document.getElementById('tvQtyDisplay').textContent = cost ? `≈ ${qtyStr} 幣` : '';\n\n  // 爆倉價（逐倉 vs 全倉近似）\n  const liqPct = marginMode==='isolated' ? 1/lev*0.9 : 1/lev*0.95;\n  const liq = tvDir==='long' ? entry*(1-liqPct) : entry*(1+liqPct);\n  document.getElementById('tvLiq').textContent = '$'+fmtP(liq);\n\n  // 最大虧損\n  const lossAmt = sl&&qty ? Math.abs(entry-sl)*qty : cost||0;\n  document.getElementById('tvLoss').textContent = lossAmt ? '-$'+lossAmt.toFixed(2) : '—';\n\n  // 止盈計算\n  let totalProfit=0, tpPrices=[];\n  if(tpMode==='single'){\n    const tp=parseFloat(document.getElementById('tvTP').value)||0;\n    if(tp&&qty){ totalProfit=Math.abs(tp-entry)*qty; tpPrices=[{price:tp,pct:100}]; }\n  } else {\n    let totalPct=0;\n    tpRows.forEach(id=>{\n      const p=parseFloat(document.getElementById('tpPrice'+id)?.value)||0;\n      const pct=parseFloat(document.getElementById('tpPct'+id)?.value)||0;\n      if(p&&pct&&qty){ totalProfit+=Math.abs(p-entry)*(qty*pct/100); totalPct+=pct; tpPrices.push({price:p,pct}); }\n    });\n  }\n  document.getElementById('tvProfit').textContent = totalProfit ? '+$'+totalProfit.toFixed(2) : '—';\n\n  // 盈虧比\n  const rr = lossAmt&&totalProfit ? (totalProfit/lossAmt).toFixed(2) : '—';\n  document.getElementById('tvRR').textContent = rr!=='—' ? `1 : ${rr}` : '—';\n\n  // RR 條\n  if(lossAmt&&totalProfit){\n    const total=lossAmt+totalProfit;\n    document.getElementById('rrTrack').style.display='flex';\n    document.getElementById('rrL').style.width=(lossAmt/total*100).toFixed(1)+'%';\n    document.getElementById('rrP').style.width=(totalProfit/total*100).toFixed(1)+'%';\n    document.getElementById('rrLL').textContent=`-$${lossAmt.toFixed(0)}`;\n    document.getElementById('rrPL').textContent=`+$${totalProfit.toFixed(0)}`;\n  }\n\n  // 重繪 K 線上的標記\n  if(klineData.length) drawKline(entry, sl||null, tpPrices, liq);\n}\n\n// ── K 線圖 ──\nfunction setChartType(t){\n  chartType=t;\n  const cc=document.getElementById('ctCandle'), cl=document.getElementById('ctLine');\n  if(t==='candle'){\n    cc.style.cssText='padding:4px 10px;font-size:11px;border-radius:5px;cursor:pointer;background:rgba(201,168,76,.15);color:var(--gold2);border:1px solid var(--gold);font-family:\"Noto Sans TC\",sans-serif';\n    cl.style.cssText='padding:4px 10px;font-size:11px;border-radius:5px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:\"Noto Sans TC\",sans-serif';\n  } else {\n    cl.style.cssText='padding:4px 10px;font-size:11px;border-radius:5px;cursor:pointer;background:rgba(201,168,76,.15);color:var(--gold2);border:1px solid var(--gold);font-family:\"Noto Sans TC\",sans-serif';\n    cc.style.cssText='padding:4px 10px;font-size:11px;border-radius:5px;cursor:pointer;background:var(--surface2);color:var(--dim);border:1px solid var(--border);font-family:\"Noto Sans TC\",sans-serif';\n  }\n  if(klineData.length) drawKline(\n    parseFloat(document.getElementById('tvEntry').value)||0,\n    parseFloat(document.getElementById('tvSL').value)||0,\n    [], 0\n  );\n}\n\nlet chartSymValue = 'BTC-USDT-SWAP';\n\nfunction filterChartSyms(q){\n  renderChartDropdown(q);\n  document.getElementById('chartDropdown').style.display='block';\n}\nfunction showChartDropdown(){ renderChartDropdown(document.getElementById('chartSymInput').value); document.getElementById('chartDropdown').style.display='block'; }\nfunction hideChartDropdown(){ document.getElementById('chartDropdown').style.display='none'; }\nfunction renderChartDropdown(q){ renderSymDD('chartDropdown',q,'selectChartSym',12); }\nfunction selectChartSym(sym, label){\n  chartSymValue=sym;\n  document.getElementById('chartSymInput').value=label;\n  hideChartDropdown();\n  loadChart();\n}\n\nasync function loadChart(){\n  const sym=chartSymValue || 'BTC-USDT-SWAP';\n  const tf=document.getElementById('chartTF').value;\n  const canvas=document.getElementById('klineCanvas');\n  const dpr=window.devicePixelRatio||1;\n  canvas.width=canvas.offsetWidth*dpr;\n  canvas.height=canvas.offsetHeight*dpr;\n  const ctx=canvas.getContext('2d');\n  ctx.scale(dpr,dpr);\n  ctx.fillStyle='#080a0e'; ctx.fillRect(0,0,canvas.offsetWidth,canvas.offsetHeight);\n  ctx.fillStyle='#5a7a90'; ctx.font='13px Noto Sans TC'; ctx.textAlign='center';\n  ctx.fillText('載入中...', canvas.offsetWidth/2, canvas.offsetHeight/2);\n  try{\n    // 拉 700 根讓 EMA576 能正確計算\n    klineData = await fetchOHLC(sym, tf, 700);\n    const entry=parseFloat(document.getElementById('tvEntry').value)||0;\n    const sl=parseFloat(document.getElementById('tvSL').value)||0;\n    drawKline(entry, sl||null, [], 0);\n  }catch(e){\n    ctx.fillStyle='#5a7a90'; ctx.fillText('載入失敗，請重試', canvas.offsetWidth/2, canvas.offsetHeight/2);\n  }\n}\n\n// 抓 OHLC K線數據（不同於 fetchCandles 只抓收盤）\nasync function fetchOHLC(instId, bar, limit=100){\n  const d=await okxFetch(`/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`);\n  if(!d.data) return [];\n  return d.data.map(k=>({\n    t:parseInt(k[0]), o:parseFloat(k[1]), h:parseFloat(k[2]),\n    l:parseFloat(k[3]), c:parseFloat(k[4]), v:parseFloat(k[5]||0)\n  })).reverse();\n}\n\n// EMA 序列（用於 K 線圖繪製）\nfunction calcEMAArr(data, p){\n  const r=new Array(data.length).fill(null);\n  if(data.length<p) return r;\n  const k=2/(p+1);\n  let e=data.slice(0,p).reduce((a,b)=>a+b,0)/p;\n  r[p-1]=e;\n  for(let i=p;i<data.length;i++){e=data[i]*k+e*(1-k);r[i]=e;}\n  return r;\n}\n\n// QQE 序列（用於副圖顯示）\nfunction calcQQEArr(closes){\n  const rsiRaw=calcRSISeries(closes,6).filter(v=>v!==null);\n  if(rsiRaw.length<8) return {hist:[]};\n  const sm=calcEMASeries(rsiRaw,5);\n  // 直接用相對50的值做柱狀\n  return {hist: sm.map(v=>v===null?0:v-50)};\n}\n\nfunction drawKline(entry, sl, tpPrices, liq){\n  const canvas=document.getElementById('klineCanvas');\n  const dpr=window.devicePixelRatio||1;\n  canvas.width=canvas.offsetWidth*dpr;\n  canvas.height=canvas.offsetHeight*dpr;\n  const ctx=canvas.getContext('2d');\n  ctx.scale(dpr,dpr);\n  const w=canvas.offsetWidth, h=canvas.offsetHeight;\n  ctx.fillStyle='#080a0e'; ctx.fillRect(0,0,w,h);\n\n  if(!klineData.length){\n    ctx.fillStyle='#5a7a90'; ctx.font='13px sans-serif'; ctx.textAlign='center';\n    ctx.fillText('請先點「重整」載入K線', w/2, h/2); return;\n  }\n\n  const closes=klineData.map(k=>k.c);\n\n  // ── 計算指標 ──\n  const ema12  = calcEMAArr(closes,12);\n  const ema144 = calcEMAArr(closes,144);\n  const ema169 = calcEMAArr(closes,169);\n  const ema576 = calcEMAArr(closes,576);\n  const ema676 = calcEMAArr(closes,676);\n  const {hist:qqeHist} = calcQQEArr(closes);\n\n  // ── 佈局：主圖 70% + 副圖(QQE) 30% ──\n  const PAD={l:62,r:14,t:14,b:14};\n  const SPLIT=0.72; // 主圖佔比\n  const SEP=6;       // 主副圖間距\n  const mainH=Math.floor((h-PAD.t-PAD.b-SEP)*SPLIT);\n  const subH =h-PAD.t-PAD.b-SEP-mainH;\n  const mainTop=PAD.t, subTop=PAD.t+mainH+SEP;\n  const cw=w-PAD.l-PAD.r;\n\n  // 價格範圍（主圖）\n  let minP=Math.min(...klineData.map(k=>k.l));\n  let maxP=Math.max(...klineData.map(k=>k.h));\n  // 加入 EMA 和標記線\n  [ema144,ema169,ema576,ema676,ema12].forEach(arr=>{\n    arr.forEach(v=>{if(v){minP=Math.min(minP,v*0.999);maxP=Math.max(maxP,v*1.001);}});\n  });\n  [entry,sl,liq,...tpPrices.map(t=>t.price)].filter(p=>p>0).forEach(p=>{\n    minP=Math.min(minP,p*0.998); maxP=Math.max(maxP,p*1.002);\n  });\n  const pRange=maxP-minP;\n  const toY=p=>mainTop+mainH*(1-(p-minP)/pRange);\n\n  // QQE 範圍（副圖）\n  const validHist=qqeHist.filter(v=>v!==0);\n  const maxQ=Math.max(20,...validHist.map(v=>Math.abs(v)));\n  const toQY=v=>subTop+subH/2-(v/maxQ)*(subH/2)*0.9;\n\n  const barW=Math.max(1.5, Math.floor(cw/klineData.length*0.7));\n  const step=cw/klineData.length;\n\n  // ── 背景格線（主圖）──\n  ctx.strokeStyle='rgba(30,42,53,.6)'; ctx.lineWidth=0.5;\n  for(let i=0;i<=5;i++){\n    const y=mainTop+mainH*i/5;\n    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(PAD.l+cw,y); ctx.stroke();\n    ctx.fillStyle='#5a7a90'; ctx.font='9px JetBrains Mono'; ctx.textAlign='right';\n    ctx.fillText('$'+fmtP(maxP-pRange*i/5), PAD.l-3, y+4);\n  }\n\n  // 副圖背景\n  ctx.fillStyle='rgba(13,17,23,.6)';\n  ctx.fillRect(PAD.l, subTop, cw, subH);\n  ctx.strokeStyle='rgba(30,42,53,.6)'; ctx.lineWidth=0.5;\n  ctx.beginPath(); ctx.moveTo(PAD.l,subTop+subH/2); ctx.lineTo(PAD.l+cw,subTop+subH/2); ctx.stroke();\n  ctx.fillStyle='#5a7a90'; ctx.font='8px JetBrains Mono'; ctx.textAlign='right';\n  ctx.fillText('QQE', PAD.l-3, subTop+subH/2+4);\n\n  // ── Vegas 通道填色 ──\n  const drawChannelFill=(arr1,arr2,col)=>{\n    ctx.save(); ctx.globalAlpha=0.06; ctx.fillStyle=col; ctx.beginPath();\n    let started=false;\n    klineData.forEach((_,i)=>{\n      const y1=arr1[i]!=null?toY(arr1[i]):null;\n      if(y1===null){started=false;return;}\n      if(!started){ctx.moveTo(PAD.l+i*step+step/2,y1);started=true;}\n      else ctx.lineTo(PAD.l+i*step+step/2,y1);\n    });\n    for(let i=klineData.length-1;i>=0;i--){\n      const y2=arr2[i]!=null?toY(arr2[i]):null;\n      if(y2===null) break;\n      ctx.lineTo(PAD.l+i*step+step/2,y2);\n    }\n    ctx.closePath(); ctx.fill(); ctx.restore();\n  };\n  drawChannelFill(ema144,ema169,'#3b9eff');  // 小通道（藍）\n  drawChannelFill(ema576,ema676,'#ff4d6d');  // 大通道（紅）\n\n  // ── K線 / 線形 ──\n  if(chartType==='candle'){\n    klineData.forEach((k,i)=>{\n      const x=PAD.l+i*step+step/2;\n      const col=k.c>=k.o?'#00e5a0':'#ff4d6d';\n      ctx.strokeStyle=col; ctx.lineWidth=0.8;\n      ctx.beginPath(); ctx.moveTo(x,toY(k.h)); ctx.lineTo(x,toY(k.l)); ctx.stroke();\n      const top=toY(Math.max(k.o,k.c)), bot=toY(Math.min(k.o,k.c));\n      ctx.fillStyle=col; ctx.fillRect(x-barW/2,top,barW,Math.max(1,bot-top));\n    });\n  } else {\n    ctx.strokeStyle='#c9a84c'; ctx.lineWidth=1.5; ctx.beginPath();\n    klineData.forEach((k,i)=>{\n      const x=PAD.l+i*step+step/2;\n      i===0?ctx.moveTo(x,toY(k.c)):ctx.lineTo(x,toY(k.c));\n    });\n    ctx.stroke();\n    ctx.fillStyle='rgba(201,168,76,.05)';\n    ctx.lineTo(PAD.l+cw,mainTop+mainH); ctx.lineTo(PAD.l,mainTop+mainH); ctx.closePath(); ctx.fill();\n  }\n\n  // ── Vegas EMA 線 ──\n  const drawEMA=(arr,col,lw=1,dash=[])=>{\n    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.setLineDash(dash);\n    ctx.beginPath(); let s=false;\n    arr.forEach((v,i)=>{\n      if(v===null){s=false;return;}\n      const x=PAD.l+i*step+step/2, y=toY(v);\n      if(!s){ctx.moveTo(x,y);s=true;} else ctx.lineTo(x,y);\n    });\n    ctx.stroke(); ctx.restore();\n  };\n  drawEMA(ema576,'rgba(255,77,109,.6)',1.2);   // 大通道上\n  drawEMA(ema676,'rgba(255,77,109,.6)',1.2);   // 大通道下\n  drawEMA(ema144,'rgba(59,158,255,.9)',1.5);   // 小通道上（藍）\n  drawEMA(ema169,'rgba(59,158,255,.9)',1.5);   // 小通道下（藍）\n  drawEMA(ema12, '#c9a84c',1.2,[3,2]);         // 過濾線（金色虛線）\n\n  // ── 圖例（主圖右上）──\n  const legends=[\n    {col:'#3b9eff',label:'EMA144/169 小通道'},\n    {col:'#ff4d6d',label:'EMA576/676 大通道'},\n    {col:'#c9a84c',label:'EMA12 過濾線'},\n  ];\n  ctx.font='9px JetBrains Mono'; ctx.textAlign='left';\n  legends.forEach((l,i)=>{\n    const lx=PAD.l+8, ly=mainTop+12+i*13;\n    ctx.fillStyle=l.col; ctx.fillRect(lx,ly-6,14,2);\n    ctx.fillStyle='#5a7a90'; ctx.fillText(l.label,lx+18,ly);\n  });\n\n  // ── 標記線 ──\n  const drawHLine=(price,color,label,dash=[])=>{\n    if(!price||price<=0) return;\n    const y=toY(price);\n    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=1.2; ctx.setLineDash(dash);\n    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(PAD.l+cw,y); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.globalAlpha=0.15; ctx.fillStyle=color; ctx.fillRect(PAD.l,y-11,100,13); ctx.globalAlpha=1;\n    ctx.fillStyle=color; ctx.font='bold 10px JetBrains Mono'; ctx.textAlign='left';\n    ctx.fillText(`${label} $${fmtP(price)}`, PAD.l+4, y-1); ctx.restore();\n  };\n  if(entry) drawHLine(entry,'#c9a84c','Entry');\n  if(sl)    drawHLine(sl,'#ff4d6d','SL',[4,3]);\n  if(liq>0) drawHLine(liq,'rgba(255,77,109,.4)','Liq',[2,4]);\n  tpPrices.forEach((t,i)=>drawHLine(t.price,'#00e5a0',`TP${i+1}(${t.pct}%)`));\n\n  // ── QQE 副圖柱狀 ──\n  const visibleHist=qqeHist.slice(qqeHist.length-klineData.length);\n  visibleHist.forEach((v,i)=>{\n    if(!v) return;\n    const x=PAD.l+i*step+step/2;\n    const col=v>0?'rgba(59,158,255,.7)':'rgba(255,77,109,.7)';\n    const cy=toQY(0), ty=toQY(v);\n    const bh=Math.abs(cy-ty);\n    ctx.fillStyle=col;\n    ctx.fillRect(x-Math.max(1,barW/2), Math.min(cy,ty), Math.max(2,barW), Math.max(1,bh));\n  });\n  ctx.fillStyle='#5a7a90'; ctx.font='8px JetBrains Mono'; ctx.textAlign='left';\n  ctx.fillText('🔵多  🔴空', PAD.l+4, subTop+10);\n\n  // ── 時間軸 ──\n  ctx.fillStyle='#5a7a90'; ctx.font='9px JetBrains Mono'; ctx.textAlign='center';\n  const step2=Math.max(1,Math.floor(klineData.length/6));\n  for(let i=0;i<klineData.length;i+=step2){\n    const x=PAD.l+i*step+step/2;\n    const d=new Date(klineData[i].t);\n    ctx.fillText(`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:00`, x, h-3);\n  }\n}\n\n// ============================================================\n// 自動掃描\n// ============================================================\nlet autoTimer=null, notifyEnabled=false, nextScanTime=null;\n\nfunction toggleAutoScan(){\n  const btn=document.getElementById('autoBtn');\n  if(autoTimer){\n    clearInterval(autoTimer); clearTimeout(autoTimer);\n    autoTimer=null; nextScanTime=null;\n    btn.textContent='已關閉'; btn.classList.remove('on');\n    document.getElementById('nextScanTxt').textContent='';\n    toast('⏰ 自動掃描已關閉');\n  } else {\n    const mins=parseInt(document.getElementById('autoInterval').value)||30;\n    btn.textContent='運行中 ✓'; btn.classList.add('on');\n    toast(`⏰ 自動掃描已開啟，每 ${mins} 分鐘掃描一次`);\n    // 立即掃一次\n    startScan();\n    // 設定定時\n    scheduleNext(mins);\n  }\n}\n\nfunction scheduleNext(mins){\n  nextScanTime = Date.now() + mins*60*1000;\n  updateCountdown();\n  autoTimer = setTimeout(()=>{\n    startScan();\n    scheduleNext(mins);\n  }, mins*60*1000);\n}\n\nfunction updateCountdown(){\n  if(!nextScanTime){ document.getElementById('nextScanTxt').textContent=''; return; }\n  const left = Math.max(0, nextScanTime - Date.now());\n  const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);\n  document.getElementById('nextScanTxt').textContent=`下次：${m}:${s.toString().padStart(2,'0')}`;\n  if(left>0) setTimeout(updateCountdown, 1000);\n}\n\n// ============================================================\n// 瀏覽器推播通知\n// ============================================================\nasync function toggleNotify(){\n  const btn=document.getElementById('notifyBtn');\n  if(notifyEnabled){\n    notifyEnabled=false;\n    btn.textContent='🔔 通知已關'; btn.classList.remove('on');\n    toast('🔕 通知已關閉');\n    return;\n  }\n  if(!('Notification' in window)){ toast('❌ 此瀏覽器不支援通知'); return; }\n  const perm = await Notification.requestPermission();\n  if(perm==='granted'){\n    notifyEnabled=true;\n    btn.textContent='🔔 通知已開'; btn.classList.add('on');\n    toast('🔔 通知已開啟！有新訊號時會彈出提醒');\n    new Notification('賽克斯策略平台', { body:'推播通知測試成功 ✅', icon:'data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><text y=\".9em\" font-size=\"90\">⚡<\/text><\/svg>' });\n  } else {\n    toast('❌ 請在瀏覽器設定允許通知');\n  }\n}\n\nfunction sendNotification(title, body){\n  if(!notifyEnabled || Notification.permission!=='granted') return;\n  new Notification(title, { body, icon:'data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><text y=\".9em\" font-size=\"90\">⚡<\/text><\/svg>' });\n}\n\n// ============================================================\n// 訊號記錄\n// ============================================================\nlet s
