ignalLog = [];\n\nfunction loadLog(){\n  try{ signalLog = JSON.parse(localStorage.getItem('saxis_log')||'[]'); }\n  catch(e){ signalLog=[]; }\n}\n\nfunction saveLog(){\n  try{ localStorage.setItem('saxis_log', JSON.stringify(signalLog.slice(0,200))); }\n  catch(e){}\n}\n\nfunction addToLog(signals){\n  if(!signals.length) return;\n  const now = new Date();\n  const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;\n\n  // 找出新訊號（過去30分鐘沒有記錄過的）\n  const cutoff = Date.now() - 30*60*1000;\n  const existing = new Set(signalLog.filter(l=>l.ts>cutoff).map(l=>l.sym+'_'+l.dir+'_'+l.tf));\n\n  const newSigs = signals.filter(s=>!existing.has(s.sym+'_'+s.dir+'_'+s.tfs.join('')));\n\n  newSigs.forEach(s=>{\n    const baseName=symBase(s.sym);\n    const settle=s.sym.includes('-USDC-')?'USDC':s.sym.includes('-USD-SWAP')&&!s.sym.includes('-USDT-')?'USD':'USDT';\n    signalLog.unshift({\n      ts: Date.now(), time: timeStr,\n      sym: baseName, settle,\n      tf: s.tfs.join('+'), dir: s.dir,\n      slPct: s.slPct||s.dist,\n      bias: s.dailyBias,\n      patterns: (s.allPatterns||[]).slice(0,2).map(p=>p.name).join('、'),\n      score: s.maxScore, patternScore: s.maxPatternScore||0\n    });\n  });\n\n  if(signalLog.length>200) signalLog=signalLog.slice(0,200);\n  saveLog();\n  renderLog();\n\n  // 更新 badge\n  const total=signalLog.length;\n  const badge=document.getElementById('logNavBadge');\n  if(total>0){ badge.textContent=total>99?'99+':total; badge.style.display='inline-block'; }\n\n  // 推播通知\n  if(newSigs.length>0){\n    const longSigs=newSigs.filter(s=>s.dir==='long');\n    const shortSigs=newSigs.filter(s=>s.dir==='short');\n    let notifyBody=`發現 ${newSigs.length} 個新訊號！`;\n    if(longSigs.length) notifyBody+=`\\n多單：${longSigs.map(s=>s.sym.replace(/-USDT-SWAP$/,'')).join('、')}`;\n    if(shortSigs.length) notifyBody+=`\\n空單：${shortSigs.map(s=>s.sym.replace(/-USDT-SWAP$/,'')).join('、')}`;\n    sendNotification('⚡ 賽克斯策略 — 新訊號！', notifyBody);\n  }\n}\n\nfunction renderLog(){\n  const list=document.getElementById('logList');\n  if(!signalLog.length){\n    list.innerHTML='<div class=\"empty\"><div class=\"empty-icon\">📋<\/div><p>尚無訊號記錄<br>開始掃描後自動記錄<\/p><\/div>';\n    document.getElementById('logTotal').textContent='0';\n    document.getElementById('logLong').textContent='0';\n    document.getElementById('logShort').textContent='0';\n    document.getElementById('logPattern').textContent='0';\n    return;\n  }\n  document.getElementById('logTotal').textContent=signalLog.length;\n  document.getElementById('logLong').textContent=signalLog.filter(l=>l.dir==='long').length;\n  document.getElementById('logShort').textContent=signalLog.filter(l=>l.dir==='short').length;\n  document.getElementById('logPattern').textContent=signalLog.filter(l=>l.patternScore>0).length;\n\n  list.innerHTML=signalLog.map((l,i)=>{\n    const dirBadge=l.dir==='long'\n      ?'<span class=\"badge bbull\" style=\"font-size:10px\">多 ▲<\/span>'\n      :'<span class=\"badge bbear\" style=\"font-size:10px\">空 ▼<\/span>';\n    const biasBadge=l.bias==='bull'?'<span class=\"badge bbull\" style=\"font-size:10px\">偏多<\/span>'\n      :l.bias==='bear'?'<span class=\"badge bbear\" style=\"font-size:10px\">偏空<\/span>'\n      :'<span class=\"badge brange\" style=\"font-size:10px\">盤整<\/span>';\n    const slPct=parseFloat(l.slPct||0);\n    const slColor=slPct<1?'var(--bull)':slPct<3?'var(--gold2)':'var(--bear)';\n    const patternHtml=l.patterns?`<span style=\"font-size:10px;color:#a855f7\">${l.patterns}<\/span>`:'<span style=\"color:var(--dim);font-size:10px\">—<\/span>';\n    const rowBg=i%2===0?'':'background:rgba(255,255,255,.01)';\n    return `<div style=\"display:grid;grid-template-columns:130px 60px 70px 60px 80px 80px 1fr;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;align-items:center;${rowBg}\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)\">${l.time}<\/span>\n      <span style=\"font-weight:600;color:var(--bright)\">${l.sym}<\/span>\n      <span><span class=\"badge binfo\" style=\"font-size:10px\">${l.tf}<\/span><\/span>\n      <span>${dirBadge}<\/span>\n      <span style=\"font-family:'JetBrains Mono',monospace;color:${slColor}\">${slPct}%<\/span>\n      <span>${biasBadge}<\/span>\n      <span>${patternHtml}<\/span>\n    <\/div>`;\n  }).join('');\n}\n\nfunction clearLog(){\n  if(!confirm('確定清除所有訊號記錄？')) return;\n  signalLog=[];\n  try{ localStorage.removeItem('saxis_log'); }catch(e){}\n  renderLog();\n  document.getElementById('logNavBadge').style.display='none';\n  toast('🗑️ 記錄已清除');\n}\n\nfunction exportLog(){\n  if(!signalLog.length){ toast('⚠️ 沒有記錄可匯出'); return; }\n  const header='時間,幣種,結算,時區,方向,止損%,偏見,型態\\n';\n  const rows=signalLog.map(l=>`${l.time},${l.sym},${l.settle},${l.tf},${l.dir},${l.slPct||''},${l.bias||''},${l.patterns||''}`).join('\\n');\n  const blob=new Blob(['\\uFEFF'+header+rows],{type:'text/csv;charset=utf-8'});\n  const a=document.createElement('a');\n  a.href=URL.createObjectURL(blob);\n  a.download=`saxis_log_${new Date().toISOString().slice(0,10)}.csv`;\n  a.click();\n  toast('📥 CSV 已匯出');\n}\n\n// ============================================================\n// 勝率追蹤系統\n// ============================================================\nlet trackData = { pending:[], done:[] };\nlet settlingId = null;\n\nfunction loadTrack(){ try{ const s=localStorage.getItem('saxis_track'); if(s) trackData=JSON.parse(s); }catch(e){} }\nfunction saveTrack(){ try{ localStorage.setItem('saxis_track',JSON.stringify(trackData)); }catch(e){} }\n\nfunction syncTrackFromLog(){\n  loadLog(); loadTrack();\n  let added=0;\n  signalLog.slice(-50).forEach(sig=>{\n    const id=sig.sym+'_'+sig.dir+'_'+sig.time;\n    if(!trackData.pending.find(p=>p.id===id) && !trackData.done.find(d=>d.id===id)){\n      trackData.pending.push({ id, sym:sig.sym, dir:sig.dir, tf:sig.tf,\n        slPct:sig.slPct||'—', bias:sig.bias||'—',\n        pattern:(Array.isArray(sig.patterns)?sig.patterns.map(p=>p.name||p).join(', '):(sig.pattern||'—'))||'—',\n        time:sig.time, addedAt:Date.now() });\n      added++;\n    }\n  });\n  saveTrack(); renderTrack();\n  toast(added>0?`✅ 同步了 ${added} 筆新訊號`:'已是最新，沒有新訊號');\n}\n\nfunction settleTrack(id){\n  const item=trackData.pending.find(p=>p.id===id); if(!item) return;\n  settlingId=id;\n  const base=symBase(item.sym);\n  document.getElementById('settleInfo').innerHTML=\n    `<strong>${base}<\/strong> ${item.dir==='long'?'做多 ▲':'做空 ▼'}<br>時區：${item.tf}　止損：${item.slPct}%<br>時間：${new Date(item.time).toLocaleString('zh-TW')}${item.pattern!=='—'?`<br>型態：${item.pattern}`:''}`;\n  document.getElementById('settleResult').value='win';\n  document.getElementById('settlePnL').value='';\n  document.getElementById('settleNote').value='';\n  document.getElementById('settleModal').style.display='flex';\n}\n\nfunction confirmSettle(){\n  const item=trackData.pending.find(p=>p.id===settlingId); if(!item) return;\n  const result=document.getElementById('settleResult').value;\n  const pnl=parseFloat(document.getElementById('settlePnL').value)||0;\n  const note=document.getElementById('settleNote').value;\n  trackData.done.unshift({...item,result,pnl,note,settledAt:Date.now()});\n  trackData.pending=trackData.pending.filter(p=>p.id!==settlingId);\n  saveTrack(); closeModal(); renderTrack();\n  toast(result==='win'?'✅ 記錄盈利':result==='loss'?'📉 記錄虧損':'➡️ 記錄保本');\n}\n\nfunction closeModal(){ document.getElementById('settleModal').style.display='none'; settlingId=null; }\nfunction skipTrack(id){ trackData.pending=trackData.pending.filter(p=>p.id!==id); saveTrack(); renderTrack(); }\n\nfunction renderTrack(){\n  loadTrack();\n  const done=trackData.done, pending=trackData.pending;\n  const wins=done.filter(d=>d.result==='win').length;\n  const losses=done.filter(d=>d.result==='loss').length;\n  const total=done.length;\n  const totalPnL=done.reduce((s,d)=>s+(d.pnl||0),0);\n  document.getElementById('tkTotal').textContent=total;\n  document.getElementById('tkWin').textContent=wins;\n  document.getElementById('tkLoss').textContent=losses;\n  document.getElementById('tkWinRate').textContent=total?(wins/total*100).toFixed(1)+'%':'—';\n  const pe=document.getElementById('tkPnL');\n  pe.textContent=(totalPnL>=0?'+':'')+totalPnL.toFixed(2)+' U';\n  pe.className='mval '+(totalPnL>=0?'bull':'bear');\n  document.getElementById('tkAvgRR').textContent=total&&wins?\n    (done.filter(d=>d.result==='win').reduce((s,d)=>s+Math.abs(d.pnl||0),0)/\n     Math.max(done.filter(d=>d.result==='loss').reduce((s,d)=>s+Math.abs(d.pnl||0),0),0.01)).toFixed(2):'—';\n  document.getElementById('tkPending').textContent=pending.length;\n\n  const pl=document.getElementById('trackPendingList');\n  pl.innerHTML=pending.length?pending.map(p=>{\n    const base=symBase(p.sym);\n    return `<div style=\"display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)\">\n      <div>\n        <div style=\"font-weight:500;font-size:13px;color:var(--bright)\">${base} <span style=\"color:${p.dir==='long'?'var(--bull)':'var(--bear)'};font-size:12px\">${p.dir==='long'?'多 ▲':'空 ▼'}<\/span><\/div>\n        <div style=\"font-size:11px;color:var(--dim);margin-top:2px\">${p.tf} · 止損 ${p.slPct}% · ${new Date(p.time).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}<\/div>\n        ${p.pattern!=='—'?`<div style=\"font-size:10px;color:#a855f7;margin-top:2px\">${p.pattern}<\/div>`:''}\n      <\/div>\n      <div style=\"display:flex;gap:5px\">\n        <button onclick=\"settleTrack('${p.id}')\" style=\"padding:5px 10px;background:rgba(201,168,76,.15);color:var(--gold2);border:1px solid var(--gold);border-radius:6px;cursor:pointer;font-size:11px;font-family:'Noto Sans TC',sans-serif\">結算<\/button>\n        <button onclick=\"skipTrack('${p.id}')\" style=\"padding:5px 8px;background:var(--surface2);color:var(--dim);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:11px\">✕<\/button>\n      <\/div>\n    <\/div>`;\n  }).join(''):'<div class=\"empty\"><div class=\"empty-icon\">📡<\/div><p>點「從記錄同步」建立追蹤清單<\/p><\/div>';\n\n  const dl=document.getElementById('trackDoneList');\n  dl.innerHTML=done.length?done.map(d=>{\n    const base=symBase(d.sym);\n    const rc=d.result==='win'?'var(--bull)':d.result==='loss'?'var(--bear)':'var(--dim)';\n    return `<div style=\"padding:10px 12px;border-bottom:1px solid var(--border)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center\">\n        <div style=\"font-weight:500;font-size:13px;color:var(--bright)\">${base} <span style=\"color:${d.dir==='long'?'var(--bull)':'var(--bear)'};font-size:12px\">${d.dir==='long'?'多':'空'}<\/span><\/div>\n        <div style=\"font-size:13px;font-weight:600;color:${rc}\">${d.result==='win'?'✅':d.result==='loss'?'❌':'➡️'} ${d.pnl?(d.pnl>0?'+':'')+d.pnl.toFixed(2)+' U':''}<\/div>\n      <\/div>\n      <div style=\"font-size:11px;color:var(--dim);margin-top:3px\">${d.tf} · ${new Date(d.settledAt).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}${d.note?' · '+d.note:''}<\/div>\n    <\/div>`;\n  }).join(''):'<div class=\"empty\"><div class=\"empty-icon\">📊<\/div><p>尚無完成的交易記錄<\/p><\/div>';\n}\n\nfunction clearTrack(){\n  if(!confirm('確定清除所有交易記錄？')) return;\n  trackData={pending:[],done:[]}; saveTrack(); renderTrack(); toast('已清除');\n}\nfunction exportTrack(){\n  if(!trackData.done.length){ toast('沒有可匯出的記錄'); return; }\n  const rows=[['結算時間','幣種','方向','時區','止損%','結果','盈虧(U)','備註']];\n  trackData.done.forEach(d=>{\n    const base=symBase(d.sym);\n    rows.push([new Date(d.settledAt).toLocaleString('zh-TW'),base,d.dir==='long'?'多':'空',d.tf,d.slPct,\n      d.result==='win'?'盈利':d.result==='loss'?'虧損':'保本',d.pnl||0,d.note||'']);\n  });\n  const a=document.createElement('a');\n  a.href='data:text/csv;charset=utf-8,\\uFEFF'+encodeURIComponent(rows.map(r=>r.join(',')).join('\\n'));\n  a.download='saxis_trades_'+Date.now()+'.csv'; a.click();\n  toast('📥 交易記錄已匯出');\n}\n\n// ============================================================\n// Vegas+QQE K 線副圖繪製\n// ============================================================\nfunction calcEMAArr(arr, p){\n  const r=new Array(arr.length).fill(null);\n  if(arr.length<p) return r;\n  const k=2/(p+1);\n  let e=arr.slice(0,p).reduce((a,b)=>a+b,0)/p;\n  r[p-1]=e;\n  for(let i=p;i<arr.length;i++){e=arr[i]*k+e*(1-k);r[i]=e;}\n  return r;\n}\nfunction calcQQEArr(closes){\n  const rsiRaw=calcRSISeries(closes,6).filter(v=>v!==null);\n  if(rsiRaw.length<8) return new Array(closes.length).fill(0);\n  const sm=calcEMASeries(rsiRaw,5);\n  // 以 50 為基準，轉換成 histogram 值（正=藍，負=紅）\n  return sm.map(v=>v===null?0:v-50);\n}\n\n// 覆寫 drawKline，加入 Vegas 和 QQE 副圖\nconst _origDrawKline = drawKline;\nfunction drawKline(entry, sl, tpPrices, liq){\n  const canvas=document.getElementById('klineCanvas');\n  canvas.width=canvas.offsetWidth*(window.devicePixelRatio||1);\n  canvas.height=canvas.offsetHeight*(window.devicePixelRatio||1);\n  const W=canvas.offsetWidth, H=canvas.offsetHeight;\n  const ctx=canvas.getContext('2d');\n  ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);\n  ctx.fillStyle='#080a0e'; ctx.fillRect(0,0,W,H);\n\n  if(!klineData.length){\n    ctx.fillStyle='#5a7a90'; ctx.font='13px sans-serif'; ctx.textAlign='center';\n    ctx.fillText('請先點「重整」載入K線', W/2, H/2); return;\n  }\n\n  const closes=klineData.map(k=>k.c);\n\n  // Vegas EMA 計算\n  const ema12 =calcEMAArr(closes,12);\n  const ema144=calcEMAArr(closes,144);\n  const ema169=calcEMAArr(closes,169);\n  const ema576=calcEMAArr(closes,576);\n  const ema676=calcEMAArr(closes,676);\n\n  // QQE histogram\n  const qqeHist=calcQQEArr(closes);\n\n  // 版面分割：主圖 75%，QQE 副圖 25%\n  const QQE_H=Math.floor(H*0.22);\n  const MAIN_H=H-QQE_H-6;\n  const PAD={l:62,r:14,t:14,b:20};\n\n  // ── 主圖 ──\n  const cw=W-PAD.l-PAD.r, ch=MAIN_H-PAD.t-PAD.b;\n  let minP=Math.min(...klineData.map(k=>k.l));\n  let maxP=Math.max(...klineData.map(k=>k.h));\n  [entry,sl,liq,...tpPrices.map(t=>t.price)].filter(p=>p>0).forEach(p=>{minP=Math.min(minP,p*0.998);maxP=Math.max(maxP,p*1.002);});\n  // 加入 EMA 範圍\n  [ema144,ema169,ema576,ema676,ema12].forEach(arr=>{\n    arr.slice(-klineData.length).filter(v=>v).forEach(v=>{minP=Math.min(minP,v*0.999);maxP=Math.max(maxP,v*1.001);});\n  });\n  const range=maxP-minP||1;\n  const toY=p=>PAD.t+ch*(1-(p-minP)/range);\n  const step=cw/klineData.length;\n\n  // 格線\n  ctx.strokeStyle='rgba(30,42,53,.7)'; ctx.lineWidth=0.5;\n  for(let i=0;i<=5;i++){\n    const y=PAD.t+ch*i/5;\n    ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+cw,y);ctx.stroke();\n    ctx.fillStyle='#5a7a90';ctx.font='10px JetBrains Mono';ctx.textAlign='right';\n    ctx.fillText('$'+fmtP(maxP-range*i/5),PAD.l-4,y+4);\n  }\n\n  // K 線或線形\n  if(chartType==='candle'){\n    klineData.forEach((k,i)=>{\n      const x=PAD.l+i*step+step/2;\n      const col=k.c>=k.o?'#00e5a0':'#ff4d6d';\n      const bw=Math.max(1.5,step*0.65);\n      ctx.strokeStyle=col;ctx.lineWidth=1;\n      ctx.beginPath();ctx.moveTo(x,toY(k.h));ctx.lineTo(x,toY(k.l));ctx.stroke();\n      const top=toY(Math.max(k.o,k.c)), bot=toY(Math.min(k.o,k.c));\n      ctx.fillStyle=col;ctx.fillRect(x-bw/2,top,bw,Math.max(1,bot-top));\n    });\n  } else {\n    ctx.strokeStyle='#c9a84c';ctx.lineWidth=1.5;ctx.beginPath();\n    klineData.forEach((k,i)=>{const x=PAD.l+i*step+step/2;i===0?ctx.moveTo(x,toY(k.c)):ctx.lineTo(x,toY(k.c));});\n    ctx.stroke();\n  }\n\n  // Vegas EMA 線\n  const drawEMA=(arr,color,lw=1)=>{\n    ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.beginPath();\n    let started=false;\n    klineData.forEach((k,i)=>{\n      const offset=closes.length-klineData.length;\n      const v=arr[offset+i]; if(!v) return;\n      const x=PAD.l+i*step+step/2;\n      if(!started){ctx.moveTo(x,toY(v));started=true;}else ctx.lineTo(x,toY(v));\n    });\n    ctx.stroke();\n  };\n  drawEMA(ema576,'rgba(255,77,109,.7)',1.2);   // 大通道紅\n  drawEMA(ema676,'rgba(255,77,109,.5)',1.2);\n  drawEMA(ema144,'rgba(59,158,255,.85)',1.2);  // 小通道藍\n  drawEMA(ema169,'rgba(59,158,255,.6)',1.2);\n  drawEMA(ema12,'rgba(201,168,76,.9)',1);       // 過濾線金\n\n  // Vegas 小通道填色\n  ctx.beginPath();\n  const offset=closes.length-klineData.length;\n  klineData.forEach((k,i)=>{\n    const v=ema144[offset+i]; if(!v) return;\n    const x=PAD.l+i*step+step/2;\n    i===0?ctx.moveTo(x,toY(v)):ctx.lineTo(x,toY(v));\n  });\n  for(let i=klineData.length-1;i>=0;i--){\n    const v=ema169[offset+i]; if(!v) continue;\n    const x=PAD.l+i*step+step/2;\n    ctx.lineTo(x,toY(v));\n  }\n  ctx.closePath();\n  ctx.fillStyle='rgba(59,158,255,.06)';ctx.fill();\n\n  // 標記線\n  const drawHL=(price,color,label,dash=[])=>{\n    if(!price||price<=0) return;\n    const y=toY(price);\n    ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.setLineDash(dash);\n    ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+cw,y);ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.globalAlpha=.15;ctx.fillStyle=color;ctx.fillRect(PAD.l,y-12,100,14);ctx.globalAlpha=1;\n    ctx.fillStyle=color;ctx.font='bold 10px JetBrains Mono';ctx.textAlign='left';\n    ctx.fillText(`${label} $${fmtP(price)}`,PAD.l+4,y-2);ctx.restore();\n  };\n  if(entry)  drawHL(entry,'#c9a84c','Entry');\n  if(sl)     drawHL(sl,'#ff4d6d','SL',[4,3]);\n  if(liq>0)  drawHL(liq,'rgba(255,77,109,.45)','Liq',[2,4]);\n  tpPrices.forEach((t,i)=>drawHL(t.price,'#00e5a0',`TP${i+1}`));\n\n  // 時間軸\n  ctx.fillStyle='#5a7a90';ctx.font='9px JetBrains Mono';ctx.textAlign='center';\n  const s2=Math.floor(klineData.length/6)||1;\n  for(let i=0;i<klineData.length;i+=s2){\n    const x=PAD.l+i*step+step/2;\n    const d=new Date(klineData[i].t);\n    ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`,x,MAIN_H-4);\n  }\n\n  // 圖例\n  ctx.font='10px JetBrains Mono';ctx.textAlign='left';\n  [['EMA12',  '#c9a84c'],['EMA144/169','#3b9eff'],['EMA576/676','#ff4d6d']].forEach(([l,c],i)=>{\n    ctx.fillStyle=c;ctx.fillRect(PAD.l+i*90,6,10,3);\n    ctx.fillStyle='#5a7a90';ctx.fillText(l,PAD.l+i*90+14,10);\n  });\n\n  // ── QQE 副圖 ──\n  const QY=MAIN_H+6, qh=QQE_H-12, qmid=QY+qh/2;\n  ctx.fillStyle='rgba(30,42,53,.5)';ctx.fillRect(PAD.l,QY,cw,qh);\n  ctx.strokeStyle='rgba(90,122,144,.3)';ctx.lineWidth=0.5;\n  ctx.beginPath();ctx.moveTo(PAD.l,qmid);ctx.lineTo(PAD.l+cw,qmid);ctx.stroke();\n  ctx.fillStyle='#5a7a90';ctx.font='9px JetBrains Mono';ctx.textAlign='right';\n  ctx.fillText('QQE',PAD.l-4,qmid+4);\n\n  const qmax=Math.max(20,...qqeHist.slice(-klineData.length).map(v=>Math.abs(v)))||20;\n  const bw2=Math.max(1,step*0.7);\n  klineData.forEach((k,i)=>{\n    const v=qqeHist[offset+i]||0;\n    const x=PAD.l+i*step+step/2;\n    const barH=Math.abs(v)/qmax*(qh/2-2);\n    const col=v>=0?'rgba(59,158,255,.8)':'rgba(255,77,109,.8)';\n    ctx.fillStyle=col;\n    if(v>=0) ctx.fillRect(x-bw2/2,qmid-barH,bw2,barH);\n    else ctx.fillRect(x-bw2/2,qmid,bw2,barH);\n  });\n  ctx.fillStyle='#5a7a90';ctx.font='9px JetBrains Mono';ctx.textAlign='left';\n  ctx.fillText('🔵=多動能  🔴=空動能',PAD.l+2,QY+qh-3);\n}\n\n// ============================================================\n// 價格監控 — WebSocket 即時推播\n// ============================================================\nlet wsConn = null;\nlet wsAlerts = [];      // [{id, sym, dir, entryPrice, slPrice, triggered:{entry,sl}}]\nlet alertFireLog = [];  // 觸發記錄\nlet alertSymValue = 'BTC-USDT-SWAP';\nlet wsReconnectTimer = null;\n\n// ── 幣種搜尋框 ──\nfunction showAlertDropdown(){\n  renderAlertDropdown(document.getElementById('alertSymInput').value);\n  document.getElementById('alertDropdown').style.display='block';\n}\nfunction hideAlertDropdown(){ document.getElementById('alertDropdown').style.display='none'; }\nfunction filterAlertSyms(q){\n  renderAlertDropdown(q);\n  document.getElementById('alertDropdown').style.display='block';\n}\nfunction renderAlertDropdown(q){ renderSymDD('alertDropdown',q,'selectAlertSym',13); }\nfunction selectAlertSym(sym,label){\n  alertSymValue=sym;\n  document.getElementById('alertSymInput').value=label;\n  hideAlertDropdown();\n}\n\n// ── 手動新增監控 ──\nfunction addAlertManual(){\n  const sym=alertSymValue;\n  const dir=document.getElementById('alertDir').value;\n  const entry=parseFloat(document.getElementById('alertEntry').value)||0;\n  const sl=parseFloat(document.getElementById('alertSL').value)||0;\n  if(!sym||(!entry&&!sl)){ toast('⚠️ 請填入幣種和至少一個價格'); return; }\n  const base=symBase(sym);\n  addAlert({sym, base, dir, entryPrice:entry, slPrice:sl});\n  document.getElementById('alertEntry').value='';\n  document.getElementById('alertSL').value='';\n  toast(`✅ 已新增監控：${base}`);\n}\n\n// ── 從訊號記錄同步 ──\nfunction syncAlertsFromLog(){\n  if(!signalLog.length){ toast('⚠️ 訊號記錄是空的，請先執行策略掃描'); return; }\n  let added=0;\n  const recent=signalLog.slice(-30); // 只取最近30筆\n  recent.forEach(s=>{\n    if(wsAlerts.find(a=>a.sym===s.sym&&a.dir===s.dir)) return; // 已存在跳過\n    const base=symBase(s.sym);\n    addAlert({sym:s.sym, base, dir:s.dir, entryPrice:0, slPrice:0, note:'從訊號記錄同步'});\n    added++;\n  });\n  toast(`✅ 已從訊號記錄同步 ${added} 個監控（需手動填入價格）`);\n  // 若 WS 已開啟，重新訂閱\n  if(wsConn&&wsConn.readyState===1) resubscribeWS();\n}\n\n// ── 新增一筆警報 ──\nfunction addAlert(cfg){\n  const id = 'a'+Date.now()+Math.random().toString(36).slice(2,5);\n  wsAlerts.push({\n    id, sym:cfg.sym, base:cfg.base||cfg.sym.split('-')[0],\n    dir:cfg.dir||'long',\n    entryPrice:cfg.entryPrice||0,\n    slPrice:cfg.slPrice||0,\n    currentPrice:0,\n    triggered:{entry:false, sl:false},\n    note:cfg.note||''\n  });\n  saveAlerts();\n  renderAlertList();\n  updateAlertCount();\n  if(wsConn&&wsConn.readyState===1) resubscribeWS();\n}\n\n// ── 刪除單一警報 ──\nfunction removeAlert(id){\n  wsAlerts=wsAlerts.filter(a=>a.id!==id);\n  saveAlerts();\n  renderAlertList();\n  updateAlertCount();\n  if(wsConn&&wsConn.readyState===1) resubscribeWS();\n}\n\n// ── 清除全部 ──\nfunction clearAllAlerts(){\n  if(!wsAlerts.length) return;\n  wsAlerts=[];\n  saveAlerts();\n  renderAlertList();\n  updateAlertCount();\n  if(wsConn&&wsConn.readyState===1) resubscribeWS();\n  toast('🗑️ 已清除全部監控');\n}\n\n// ── 重置觸發狀態（允許重新觸發）──\nfunction resetAlertTrigger(id){\n  const a=wsAlerts.find(x=>x.id===id);\n  if(a){ a.triggered={entry:false,sl:false}; saveAlerts(); renderAlertList(); toast('🔄 已重置觸發狀態'); }\n}\n\n// ── 儲存/載入 ──\nfunction saveAlerts(){\n  try{ localStorage.setItem('wsAlerts', JSON.stringify(wsAlerts)); }catch(e){}\n}\nfunction loadAlerts(){\n  try{\n    const s=localStorage.getItem('wsAlerts');\n    if(s) wsAlerts=JSON.parse(s);\n  }catch(e){}\n}\n\n// ── 計數 badge ──\nfunction updateAlertCount(){\n  const n=wsAlerts.length;\n  document.getElementById('alertCount').textContent=n;\n  const badge=document.getElementById('alertBadge');\n  if(wsConn&&wsConn.readyState===1&&n>0){\n    badge.style.display='block';\n  } else { badge.style.display='none'; }\n}\n\n// ── 渲染監控清單 ──\nfunction renderAlertList(){\n  const el=document.getElementById('alertList');\n  if(!wsAlerts.length){\n    el.innerHTML='<div class=\"empty\"><div class=\"empty-icon\">🔔<\/div><p>新增幣種開始監控<br>或從訊號記錄同步<\/p><\/div>';\n    return;\n  }\n  el.innerHTML=wsAlerts.map(a=>{\n    const dirBadge=a.dir==='long'?'<span class=\"badge bbull\">多 ▲<\/span>':'<span class=\"badge bbear\">空 ▼<\/span>';\n    const entryTrig=a.triggered.entry?'✅':'⏳';\n    const slTrig=a.triggered.sl?'🔴':'⏳';\n    const curP=a.currentPrice?'$'+fmtP(a.currentPrice):'—';\n    const entryPct=a.entryPrice&&a.currentPrice?((a.currentPrice-a.entryPrice)/a.entryPrice*100).toFixed(2):'';\n    const slPct=a.slPrice&&a.currentPrice?((a.currentPrice-a.slPrice)/a.slPrice*100).toFixed(2):'';\n    return `\n    <div style=\"background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:8px;${a.triggered.sl?'border-color:var(--bear)':a.triggered.entry?'border-color:var(--bull)':''}\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--bright);font-size:14px\">${a.base}<\/span>\n          ${dirBadge}\n          ${a.note?`<span style=\"font-size:10px;color:var(--dim)\">${a.note}<\/span>`:''}\n        <\/div>\n        <div style=\"display:flex;gap:6px\">\n          <button onclick=\"resetAlertTrigger('${a.id}')\" style=\"padding:3px 9px;font-size:11px;border-radius:5px;cursor:pointer;background:transparent;color:var(--dim);border:1px solid var(--border);font-family:'Noto Sans TC',sans-serif\">重置<\/button>\n          <button onclick=\"removeAlert('${a.id}')\" style=\"padding:3px 9px;font-size:11px;border-radius:5px;cursor:pointer;background:rgba(255,77,109,.1);color:var(--bear);border:1px solid rgba(255,77,109,.3);font-family:'Noto Sans TC',sans-serif\">✕<\/button>\n        <\/div>\n      <\/div>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px\">\n        <div style=\"text-align:center\">\n          <div style=\"color:var(--dim);font-size:10px;margin-bottom:2px\">現價<\/div>\n          <div style=\"font-family:'JetBrains Mono',monospace;color:var(--gold2)\">${curP}<\/div>\n        <\/div>\n        <div style=\"text-align:center;${a.triggered.entry?'background:rgba(0,229,160,.08);border-radius:6px;padding:2px':''}\">\n          <div style=\"color:var(--dim);font-size:10px;margin-bottom:2px\">${entryTrig} 進場價<\/div>\n          ${a.entryPrice?`<div style=\"font-family:'JetBrains Mono',monospace;color:var(--bull)\">$${fmtP(a.entryPrice)}<\/div><div style=\"font-size:10px;color:var(--dim)\">${entryPct?entryPct+'%':''}<\/div>`:'<div style=\"color:var(--dim)\">未設定<\/div>'}\n        <\/div>\n        <div style=\"text-align:center;${a.triggered.sl?'background:rgba(255,77,109,.08);border-radius:6px;padding:2px':''}\">\n          <div style=\"color:var(--dim);font-size:10px;margin-bottom:2px\">${slTrig} 止損價<\/div>\n          ${a.slPrice?`<div style=\"font-family:'JetBrains Mono',monospace;color:var(--bear)\">$${fmtP(a.slPrice)}<\/div><div style=\"font-size:10px;color:var(--dim)\">${slPct?slPct+'%':''}<\/div>`:'<div style=\"color:var(--dim)\">未設定<\/div>'}\n        <\/div>\n      <\/div>\n    <\/div>`;\n  }).join('');\n}\n\n// ── WebSocket 連線 ──\nfunction toggleWS(){\n  if(wsConn&&(wsConn.readyState===0||wsConn.readyState===1)){\n    stopWS();\n  } else {\n    startWS();\n  }\n}\n\nfunction startWS(){\n  if(!wsAlerts.length){ toast('⚠️ 請先新增要監控的幣種'); return; }\n  updateWSUI('connecting');\n  wsConn = new WebSocket('wss://ws.okx.com:8443/ws/v5/public');\n  wsConn.onopen = ()=>{\n    updateWSUI('connected');\n    resubscribeWS();\n    toast('🔗 WebSocket 已連線，開始即時監控');\n  };\n  wsConn.onmessage = (e)=>{\n    try{\n      const d=JSON.parse(e.data);\n      if(d.event) return; // 訂閱確認訊息\n      if(d.arg?.channel==='tickers'&&d.data?.[0]){\n        const tick=d.data[0];\n        const sym=tick.instId;\n        const price=parseFloat(tick.last||tick.lastPr||0);\n        if(!price||!sym) return;\n        // 更新所有對應幣種的現價\n        wsAlerts.forEach(a=>{\n          if(a.sym!==sym) return;\n          a.currentPrice=price;\n          checkTrigger(a, price);\n        });\n        // 更新畫面（throttle 到每秒最多一次）\n        scheduleRender();\n      }\n    }catch(e){}\n  };\n  wsConn.onclose = ()=>{\n    updateWSUI('disconnected');\n    // 自動重連（30秒後）\n    if(wsReconnectTimer) clearTimeout(wsReconnectTimer);\n    wsReconnectTimer = setTimeout(()=>{\n      if(!wsConn||wsConn.readyState>1) startWS();\n    }, 30000);\n  };\n  wsConn.onerror = ()=>{\n    updateWSUI('disconnected');\n    toast('❌ WebSocket 連線失敗');\n  };\n}\n\nfunction stopWS(){\n  if(wsReconnectTimer){ clearTimeout(wsReconnectTimer); wsReconnectTimer=null; }\n  if(wsConn){ wsConn.close(); wsConn=null; }\n  updateWSUI('disconnected');\n  toast('⏹️ 監控已停止');\n}\n\nfunction resubscribeWS(){\n  if(!wsConn||wsConn.readyState!==1) return;\n  const syms=[...new Set(wsAlerts.map(a=>a.sym))];\n  if(!syms.length) return;\n  wsConn.send(JSON.stringify({\n    op:'subscribe',\n    args: syms.map(s=>({channel:'tickers',instId:s}))\n  }));\n}\n\nfunction updateWSUI(state){\n  const dot=document.getElementById('wsStatusDot');\n  const txt=document.getElementById('wsStatusTxt');\n  const btn=document.getElementById('wsConnBtn');\n  const badge=document.getElementById('alertBadge');\n  if(state==='connected'){\n    dot.style.cssText='width:9px;height:9px;border-radius:50%;background:var(--bull);box-shadow:0 0 8px var(--bull);animation:blink 2s infinite';\n    txt.textContent='即時監控中';\n    btn.textContent='⏹ 停止監控';\n    btn.style.background='rgba(255,77,109,.2)';\n    btn.style.color='var(--bear)';\n    btn.style.border='1px solid var(--bear)';\n    if(wsAlerts.length) badge.style.display='block';\n  } else if(state==='connecting'){\n    dot.style.cssText='width:9px;height:9px;border-radius:50%;background:var(--range)';\n    txt.textContent='連線中...';\n    btn.textContent='連線中...';\n    btn.disabled=true;\n  } else {\n    dot.style.cssText='width:9px;height:9px;border-radius:50%;background:var(--border)';\n    txt.textContent='未連線';\n    btn.textContent='▶ 啟動監控';\n    btn.style.background='linear-gradient(135deg,var(--gold),#8a5f10)';\n    btn.style.color='#000';\n    btn.style.border='none';\n    btn.disabled=false;\n    badge.style.display='none';\n  }\n}\n\n// ── 價格觸發檢查 ──\nfunction checkTrigger(alert, price){\n  const dir=alert.dir;\n  let fired=false, type='';\n\n  // 進場觸發：做多→價格跌到進場價（回踩），做空→價格漲到進場價\n  if(alert.entryPrice && !alert.triggered.entry){\n    const hit = dir==='long'\n      ? price <= alert.entryPrice * 1.003  // 做多：現價觸及進場價（含0.3%容差）\n      : price >= alert.entryPrice * 0.997; // 做空：現價觸及進場價\n    if(hit){ alert.triggered.entry=true; fired=true; type='entry'; }\n  }\n\n  // 止損觸發：做多→價格跌到止損，做空→價格漲到止損\n  if(alert.slPrice && !alert.triggered.sl){\n    const hit = dir==='long'\n      ? price <= alert.slPrice * 1.001  // 做多止損：現價跌到止損\n      : price >= alert.slPrice * 0.999; // 做空止損：現價漲到止損\n    if(hit){ alert.triggered.sl=true; fired=true; type='sl'; }\n  }\n\n  if(fired){\n    saveAlerts();\n    fireNotification(alert, price, type);\n    addFireLog(alert, price, type);\n  }\n}\n\n// ── 推播通知 ──\nfunction fireNotification(alert, price, type){\n  const title = type==='entry'\n    ? `🎯 ${alert.base} 到達進場價！`\n    : `🚨 ${alert.base} 觸及止損價！`;\n  const body = type==='entry'\n    ? `現價 $${fmtP(price)} | 進場價 $${fmtP(alert.entryPrice)} | ${alert.dir==='long'?'做多 ▲':'做空 ▼'}`\n    : `現價 $${fmtP(price)} | 止損價 $${fmtP(alert.slPrice)} | 注意風險！`;\n\n  // 桌面通知\n  if(Notification.permission==='granted'){\n    const n=new Notification(title, {body, icon:'⚡'});\n    setTimeout(()=>n.close(), 8000);\n  }\n  // 頁面 toast\n  toast(title + ' — ' + body, 6000);\n}\n\n// ── 觸發記錄 ──\nfunction addFireLog(alert, price, type){\n  alertFireLog.unshift({\n    time: new Date().toLocaleTimeString('zh-TW'),\n    sym: alert.base,\n    dir: alert.dir,\n    type,\n    price,\n    entryPrice: alert.entryPrice,\n    slPrice: alert.slPrice\n  });\n  if(alertFireLog.length>50) alertFireLog.pop();\n  renderFireLog();\n}\n\nfunction renderFireLog(){\n  const el=document.getElementById('alertFireLog');\n  if(!alertFireLog.length){\n    el.innerHTML='<div style=\"text-align:center;padding:30px;color:var(--dim);font-size:13px;opacity:.5\">尚無觸發記錄<\/div>';\n    return;\n  }\n  el.innerHTML=alertFireLog.map(r=>`\n    <div style=\"background:var(--surface2);border-radius:7px;padding:9px 12px;border-left:3px solid ${r.type==='entry'?'var(--bull)':'var(--bear)'}\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:3px\">\n        <span style=\"font-weight:600;color:var(--bright);font-size:13px\">${r.sym}<\/span>\n        <span style=\"font-size:10px;color:var(--dim)\">${r.time}<\/span>\n      <\/div>\n      <div style=\"font-size:12px;color:${r.type==='entry'?'var(--bull)':'var(--bear)'}\">\n        ${r.type==='entry'?'🎯 觸及進場價':'🚨 觸及止損價'} — $${fmtP(r.price)}\n      <\/div>\n      <div style=\"font-size:11px;color:var(--dim);margin-top:2px\">\n        ${r.dir==='long'?'做多 ▲':'做空 ▼'} | \n        ${r.entryPrice?'進場: $'+fmtP(r.entryPrice):''}\n        ${r.slPrice?' | 止損: $'+fmtP(r.slPrice):''}\n      <\/div>\n    <\/div>`).join('');\n}\n\n// ── Throttle 畫面更新（避免 WS 每個 tick 都重繪） ──\nlet renderScheduled=false;\nfunction scheduleRender(){\n  if(renderScheduled) return;\n  renderScheduled=true;\n  setTimeout(()=>{ renderAlertList(); renderScheduled=false; }, 500);\n}\n\n// toast 支援自訂顯示時間\nconst _origToast = toast;\nfunction toast(msg, dur=3000){\n  const el=document.getElementById('toast');\n  el.textContent=msg; el.classList.add('show');\n  clearTimeout(el._t);\n  el._t=setTimeout(()=>el.classList.remove('show'), dur);\n}\n\n// 頁面初始化\nwindow.addEventListener('load', function(){\n  loadLog(); renderLog();\n  loadTrack(); renderTrack();\n  loadAlerts(); renderAlertList(); updateAlertCount(); renderFireLog();\n  hsUpdateSessionAdvice(); hsUpdateChecklist(); hsCalcLev();\n  docChecklistUpdate('sx',true); docCalcLev('sx');\n  docChecklistUpdate('wk',false); docCalcLev('wk');\n  docChecklistUpdate('ht',false); docCalcLev('ht');\n  const chartInput = document.getElementById('chartSymInput');\n  if(chartInput) chartInput.value = 'BTC / USDT';\n  getAllSymsList();\n});\n\n// 🎯 進場建議：按下才抓這個幣的 K 線，用波段高低點＋ATR 算「進場方式／止損／止盈」，\n/* ===== 斐波區的 SMC 確認 ===== */\nfunction smcPivots(cs,k){ const H=[],Lw=[]; for(let i=k;i<cs.length-k;i++){ let h=true,l=true; for(let j=1;j<=k;j++){ if(cs[i].h<=cs[i-j].h||cs[i].h<cs[i+j].h) h=false; if(cs[i].l>=cs[i-j].l||cs[i].l>cs[i+j].l) l=false; } if(h) H.push({i,p:cs[i].h}); if(l) Lw.push({i,p:cs[i].l}); } return {H,L:Lw}; }\nconst CONFIRM_DEF={on:true,waitBars:24,dispATR:1.0,maxWatch:5};\nconst CONFIRM_PRESET={ote:{need:['sweep','disp','mss','ob','bos','fvgR'],anyOf:[],anyMin:0},classic:{need:['sweep','disp','mss'],anyOf:['engulf','ob','fvg'],anyMin:1}};\nconst CONFIRM_NAMES={sweep:'獵取流動性',disp:'明顯位移',mss:'結構轉換',bos:'BOS',engulf:'吞沒K',ob:'訂單塊／破壞塊',fvg:'FVG',fvgR:'尊重FVG'};\nfunction smcLong(ks,zp,atr,t0,slHard,top,CF){                                         // 做多版（做空把價格鏡射成負數再呼叫）\n  const tol=0.15*atr; let ti=-1; for(let i=0;i<ks.length;i++){ if(ks[i].t>=t0&&ks[i].l<=zp+tol){ ti=i; break; } }\n  if(ti<0) return {state:'wait'};\n  for(let i=ti;i<ks.length;i++) if(ks[i].l<=slHard) return {state:'dead'};\n  const n=ks.length-1, pv=smcPivots(ks,2), W=[]; for(let i=ti;i<=n;i++) W.push(i);\n  let e=ti; for(const i of W) if(ks[i].l<ks[e].l) e=i;\n  const H={}; \n  const pl=pv.L.filter(x=>x.i<ti&&x.i>=ti-30); H.sweep=W.some(j=>pl.some(p=>ks[j].l<p.p&&ks[j].c>p.p));\n  const dj=W.find(j=>j>=e&&ks[j].c>ks[j].o&&(ks[j].c-ks[j].o)>=(CF.dispATR||1)*atr&&ks[j].c>=ks[j].l+0.7*(ks[j].h-ks[j].l)); H.disp=dj!=null;\n  const ph=pv.H.filter(x=>x.i<e-1).pop(); H.mss=!!ph&&W.some(j=>j>e&&ks[j].c>ph.p);\n  H.bos=top!=null&&W.some(j=>j>e&&ks[j].c>top);\n  H.engulf=W.some(j=>j>e&&j>0&&ks[j].c>ks[j].o&&ks[j-1].c<ks[j-1].o&&ks[j].c>=ks[j-1].o&&ks[j].o<=ks[j-1].c);\n  H.fvg=W.some(j=>j>=Math.max(e-1,0)&&j+2<=n&&ks[j+2].l>ks[j].h);\n  H.fvgR=false; for(let j=Math.max(e-1,0);j+2<=n&&!H.fvgR;j++){ if(ks[j+2].l>ks[j].h){ let ok=true; for(let q=j+3;q<=n;q++) if(ks[q].c<ks[j].h){ ok=false; break; } if(ok) H.fvgR=true; } }\n  H.ob=false; if(dj!=null){ for(let k=dj-1;k>=Math.max(e-3,0);k--){ if(ks[k].c<ks[k].o){ H.ob=ks[dj].c>ks[k].h; break; } } }\n  const need=(CF.need||[]).every(k=>H[k]), any=(CF.anyOf||[]).filter(k=>H[k]).length>=(CF.anyMin==null?1:CF.anyMin);\n  return {state:need&&any?'ok':'wait',hits:H,e,touchT:ks[ti].t,sl:ks[e].l-0.1*atr};\n}\nfunction smcConfirm(cs,d,zp,atr,t0,sl,top,CF){\n  if(d===1) return smcLong(cs,zp,atr,t0,sl,top,CF);\n  const m=cs.map(c=>({t:c.t,o:-c.o,h:-c.l,l:-c.h,c:-c.c})), r=smcLong(m,-zp,atr,t0,-sl,top==null?null:-top,CF); if(r.sl!=null) r.sl=-r.sl; return r;\n}\n\nasync function entryPlan(ix){\n  const box=document.getElementById('ep'+ix), r=(window.__scanRows||[])[ix]; if(!box||!r) return;\n  if(box.style.display==='block'){ box.style.display='none'; return; }\n  box.style.display='block'; box.innerHTML='<div style=\"padding:8px 14px;color:var(--dim);font-size:12px\">分析中…<\/div>';\n  try{\n    const tf=r.tfs[0], bar=tf==='15M'?'15m':tf==='30M'?'30m':'1H', d=r.dir==='long'?1:-1;\n    const cl=await fetchCandles(r.sym,bar,200), ks=(cl.k||[]).filter(x=>x.conf); if(ks.length<40) throw new Error('K 線不足');\n    const piv=(cs,k)=>{ const H=[],Lw=[]; for(let i=k;i<cs.length-k;i++){ let a=true,b=true; for(let j=1;j<=k;j++){ if(cs[i].h<=cs[i-j].h||cs[i].h<cs[i+j].h) a=false; if(cs[i].l>=cs[i-j].l||cs[i].l>cs[i+j].l) b=false; } if(a) H.push({i,p:cs[i].h}); if(b) Lw.push({i,p:cs[i].l}); } return {H,L:Lw}; };\n    const atr14=cs=>{ let a=null; for(let i=1;i<cs.length;i++){ const tr=Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c)); a=a==null?tr:(a*13+tr)/14; } return a; };\n    const L=ks.length-1, atr=atr14(ks)||(ks[L].h-ks[L].l), price=cl[cl.length-1], pv=piv(ks,3);\n    const leg=dir=>{ const P=dir===1?pv.L:pv.H; if(!P.length) return null; const a=P[P.length-1]; let ext=a.p, ei=a.i; for(let i=a.i;i<ks.length;i++){ if(dir===1?ks[i].h>ext:ks[i].l<ext){ ext=dir===1?ks[i].h:ks[i].l; ei=i; } } const sz=Math.abs(ext-a.p); return (sz>=1.5*atr&&ei!==a.i)?{a:a.p,ai:a.i,ext,sz,dir}:null; };\n    let fibs=[]; { const g=leg(d), go=leg(-d);\n      if(g) fibs=fibs.concat(fibSetNow().map(x=>({r:x,p:d===1?g.ext-g.sz*x:g.ext+g.sz*x,kind:'ret',top:g.ext})));\n      if(go&&!(g&&g.ai>go.ai)) fibs=fibs.concat([1.13,1.272,1.618].map(x=>({r:x,p:go.dir===-1?go.a-go.sz*x:go.a+go.sz*x,kind:'ext',top:go.a}))); }       // 假突破區間 1.13／1.272；真突破看 1.618\n    const zname=z=>'斐波'+(z.kind==='ext'?'延伸 ':'回撤 ')+z.r;\n    let entry=r.fib
